          type: boolean
          nullable: true
        motivo_rechazo:
          type: string
          nullable: true
          maxLength: 2000

    LineaNegocio:
      type: object
      required: [id, lineaNegocio, margen, metodoCalculo, isActive]
      properties:
        id:
          type: integer
        lineaNegocio:
          type: string
        margen:
          type: number
        metodoCalculo:
          type: string
          enum: [margen, markup]
        isActive:
          type: boolean
        updatedAt:
          type: string
          format: date-time
          nullable: true

    ActualizarLineaNegocio:
      type: object
      required: [margen, metodoCalculo, isActive]
      properties:
