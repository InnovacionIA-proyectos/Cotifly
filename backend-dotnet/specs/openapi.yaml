  /web/regionales:
    get:
      operationId: listarRegionales
      tags: [metricas]
      summary: Regionales que el usuario puede consultar (selector del tablero y del listado regional, HU-037.3)
      x-issue: '#211 (HU-037.3)'
      description: |
        HU-037.3 (#211). Las regionales para el selector de `GET /web/metricas/regional` y `GET /web/cotizaciones/regional`
        (parámetro `regional`). La fuente es la misma de la regional efectiva (ADR-016 §6): la de cada usuario de Cotifly en
        `DimEjecutivo` cuando está conectada y, si no aparece, su `UsuariosWeb.regional`.
        - **`director`:** las regionales efectivas de todos los usuarios de Cotifly, sin repetir (sin distinguir mayúsculas ni
          espacios sobrantes), ordenadas por nombre. Una regional de `DimEjecutivo` sin ningún usuario en Cotifly no sale.
        - **`gerente_comercial`:** solo la suya (409 `REGIONAL_NO_ASIGNADA` si no la tiene).
        - **`comercial`:** 403.
        - Fuente de la regional configurada pero caída: 503 `REGIONAL_NO_DISPONIBLE` (fail-closed: no se mezcla con la de respaldo).
      security:
        - bearer: []
      responses:
        '200':
          description: Regionales visibles para el usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Regionales'
              example:
                regionales: [ANTIOQUIA, CENTRO, OCCIDENTE]
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          description: El gerente no tiene regional asignada (`REGIONAL_NO_ASIGNADA`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '503':
          description: La fuente de la regional (`DimEjecutivo`) está configurada pero no responde (`REGIONAL_NO_DISPONIBLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/usuario/telefono:
    get:
      operationId: obtenerTelefono
      tags: [web]
      summary: Teléfono actual del comercial (para confirmarlo antes de generar el PDF)
      security:
        - bearer: []
      responses:
        '200':
          description: Teléfono registrado (null si nunca se ha capturado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelefonoComercial'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    put:
      operationId: guardarTelefono
      tags: [web]
      summary: Guarda o corrige el teléfono del comercial
      description: |
        El valor queda persistido en `UsuariosWeb.telefono` y es el que se imprime en los PDF siguientes
        (`null` o vacío lo borra y el PDF omite "Cel"). Errores, siempre con `ErrorWeb`: un teléfono fuera
        del patrón (`TELEFONO_INVALIDO` en el caso de uso) responde 400; si el comercial del token ya no
        existe en `UsuariosWeb` (`USUARIO_NO_ENCONTRADO`) responde 401.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelefonoComercialWeb'
      responses:
        '200':
          description: Teléfono guardado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelefonoComercial'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '413':
          $ref: '#/components/responses/CuerpoDemasiadoGrande'
        '415':
          $ref: '#/components/responses/TipoContenidoNoSoportado'

  /web/cotizaciones/{id}/nueva-version:
    get:
      operationId: obtenerDatosNuevaVersion
      tags: [web]
      summary: Datos de una cotización existente para prellenar una nueva versión
      description: |
        No modifica la cotización original. El frontend usa estos datos solo para prellenar la pantalla de la
        versión nueva. La versión (`version + 1`, folio base con sufijo `-vN`) se crea con
        `POST /web/cotizaciones/{folio}/costeo/re-solicitar` con `nueva_version: true` o `datos_carga` (HU-013.4); el chat
        ya no crea versiones (`cotizacion_origen_id` de `POST /web/chat` se ignora desde #105).
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Datos para prellenar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatosNuevaVersion'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/clientes:
    get:
      operationId: buscarClientes
      tags: [web]
      summary: Busca clientes y prospectos en el catálogo de Nexo
      description: |
        Mismo catálogo (clientes de `DimBPSolicitante` y prospectos) que usa el formulario
        "Nueva solicitud" de Nexo y la herramienta `buscar_cliente` del agente (HU-005.2,
        ADR-005). `exacta=true` solo cuando hay un único candidato — Nexo no distingue
        coincidencia exacta de aproximada en la respuesta; el frontend nunca debe tratar el
        texto buscado como NIT/origen/BP: esos datos salen únicamente de `candidatos`.
      security:
        - bearer: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Nombre o NIT, tal como lo escribió el comercial.
      responses:
        '200':
          description: Candidatos encontrados (vacío si ninguno)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoBusquedaClientes'
        '400':
          description: Falta `q` (`Falta el texto de búsqueda (q).`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'
        '503':
          description: |
            `CLIENTE_BUSQUEDA_NO_DISPONIBLE`: la búsqueda en Nexo no está disponible. `mensaje` dice qué falta: Nexo sin configurar en el
            ambiente (`Nexo:UrlBase` vacía), el comercial sin `idUsuarioExterno` (no vinculado a Nexo) o Nexo no respondió (caído, 5xx,
            tiempo agotado). Nunca por "no hubo candidatos" (eso es `200` con `candidatos: []`). Sin `Retry-After`. OBS-1021B-3
            (E2E 2026-10-21): antes era 400; ahora es 503, como `GET /web/municipios`, `GET /web/catalogos-flete` y los demás catálogos
            de Nexo. El frontend muestra "Buscador de clientes no disponible" con Reintentar y deja ingresar el NIT a mano.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/municipios:
    get:
      operationId: listarMunicipios
      tags: [web]
      summary: Búsqueda de ciudades (o catálogo completo) para origen/destino
      description: |
        HU-023 (#176, contrato con Nexo §3.1 y §7). Con `q` o `departamento`, es la búsqueda de Nexo
        `GET /api/captura-solicitudes/ciudades`: solo Colombia, el texto dentro del nombre y el departamento exacto (sin tildes ni
        mayúsculas), ordenada por nombre y con **máximo 50 filas**. De aquí salen los `origen_municipio_id`/`destino_municipio_id` que
        viajan a Nexo. Sin filtros, el catálogo completo de municipios (sin paginar; la misma tabla y los mismos ids). Se omiten los
        campos de costeo interno (`nombreTarifasPlaza`, `zonaTarificacion`): el frontend no los necesita.
      security:
        - bearer: []
      parameters:
        - name: q
          in: query
          required: false
          description: Texto dentro del nombre del municipio (sin tildes ni mayúsculas). Hasta 100 caracteres.
          schema:
            type: string
        - name: departamento
          in: query
          required: false
          description: Departamento exacto (sin tildes ni mayúsculas).
          schema:
            type: string
      responses:
        '200':
          description: Catálogo completo de municipios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Municipio'
        '503':
          description: |
            `MUNICIPIOS_NO_DISPONIBLE`: el catálogo de municipios de Nexo no respondió (Nexo caído, 5xx, tiempo agotado, un 429 de
            Nexo, sin configurar, o el comercial sin `idUsuarioExterno`). Sin `Retry-After`: los municipios no comparten el cupo de
            lecturas de Nexo (HU-023.4), así que un 429 aquí no bloquea nada en Cotifly; reintentar es seguro. Antes era 400; desde la deuda de
            #122 es 503, como `GET /web/catalogos-flete` y la captura. El frontend deshabilita el buscador y ofrece Reintentar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/tipos-mercancia:
    get:
      operationId: listarTiposMercancia
      tags: [web]
      summary: Catálogo de tipos de mercancía del cubicador
      description: |
        HU-021.5 (#133) y HU-023.1 (#156). Pasa el catálogo `GET /tipos-mercancia` del cubicador para el desplegable de mercancías
        del formulario: el `codigo` es lo que viaja al cubicador en `POST /recomendaciones` (y lo que guarda Cotifly, HU-023.3); el
        `nombre` es el que Cotifly guarda como `nombre_mercancia` (copia). Trae también `categoria`, `cubicable`,
        `condicionada_cubicacion` (con su `comentario_condicion`) y `activo`: el formulario solo ofrece las activas y puede avisar de
        las condicionadas. `id` (uuid) solo sirve durante la transición para traducir el `id_tipo_mercancia` anterior. Ordenado por
        nombre, incluidas las inactivas. Se reutiliza en memoria `Cubicador:MinutosCacheCatalogos` (30 por defecto; solo respuestas
        exitosas). Autenticación con el cubicador: `Authorization: Bearer {Cubicador:ApiKey}`. El navegador nunca llama al cubicador.
      security:
        - bearer: []
      responses:
        '200':
          description: Catálogo completo de tipos de mercancía
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TipoMercancia'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '503':
          description: |
            `CUBICADOR_NO_DISPONIBLE`: el cubicador no está configurado (`Cubicador:UrlBase` vacía, el valor por defecto mientras
            no exista) o no respondió. El formulario puede seguir con los tipos que ya conoce: sin catálogo, la captura conserva el
            nombre que manda el cliente. `CUBICADOR_NO_AUTORIZADO` (el cubicador rechazó la llave de Cotifly, 401/403) o
            `CUBICADOR_RESPUESTA_INVALIDA` (la respuesta no cumple el contrato): avisar a soporte, no es la sesión del comercial.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/tipos-carroceria:
    get:
      operationId: listarTiposCarroceria
      tags: [web]
      summary: Catálogo de carrocerías del cubicador
      description: |
        HU-023.1 (#156). Pasa `GET /tipos-carroceria` del cubicador (con la caché de `Cubicador:MinutosCacheCatalogos`). Los códigos
        (`FURGON`, `ESTACAS`, `CAMA_BAJA`...) son los que guarda el camión en `carroceria` y los que acepta la validación de la
        captura. El refrigerado es `FURGON` más una advertencia del cubicador, no una carrocería aparte.
      security:
        - bearer: []
      responses:
        '200':
          description: Catálogo de carrocerías
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TipoCarroceria'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '503':
          description: '`CUBICADOR_NO_DISPONIBLE`: el cubicador no está configurado o no respondió; `CUBICADOR_NO_AUTORIZADO` (rechazó la llave de Cotifly) o `CUBICADOR_RESPUESTA_INVALIDA` (respuesta fuera del contrato).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/tipos-vehiculo:
    get:
      operationId: listarTiposVehiculo
      tags: [web]
      summary: Catálogo de tipos de vehículo del cubicador
      description: |
        HU-023.1 (#156). Pasa el catálogo canónico `GET /vehiculos-catalogo` del cubicador (HU-023, #176; antes `/tipos-vehiculo`), con la caché de `Cubicador:MinutosCacheCatalogos`.
        Cotifly no guarda el nombre del vehículo (decisión 4 de HU-023): la pantalla y el PDF lo sacan de aquí por su `codigo`.
        `carrocerias` son los códigos de carrocería compatibles.
      security:
        - bearer: []
      responses:
        '200':
          description: Catálogo de tipos de vehículo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TipoVehiculo'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '503':
          description: |
            `CUBICADOR_NO_DISPONIBLE`: el cubicador no está configurado, no respondió o no publica `GET /vehiculos-catalogo`
            (petición P1). `CUBICADOR_NO_AUTORIZADO` (rechazó la llave de Cotifly) o `CUBICADOR_RESPUESTA_INVALIDA` (respuesta fuera
            del contrato).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/motivos-perdida:
    get:
      operationId: listarMotivosPerdida
      tags: [web]
      summary: Motivos de pérdida para marcar una cotización como perdida
      x-issue: '#155 (HU-018.1, parte B)'
      description: |
        HU-018.1 (#155, parte B). La lista **obligatoria** de motivos de pérdida, en su orden: la de NEXO (`Valor muy alto`,
        `Flete fuera de rango de plaza`, `Cliente desistió del servicio`, `Tiempo de respuesta vencido` y `Otro`), configurable con
        `Resultado:MotivosPerdida` (la configuración reemplaza a la lista; cada motivo, máximo 100 caracteres). `requiere_comentario` marca
        el motivo que exige `comentario` (`Otro`, configurable con `Resultado:MotivoConComentario`).

        Al marcar `perdida` (`POST .../resultado` con `motivo`, o `POST .../seguimiento` con `motivo_rechazo`) el motivo debe ser
        exactamente uno de estos (sin distinguir mayúsculas); si no, 400 `MOTIVO_NO_PERMITIDO`. No consulta NEXO ni depende de él: el
        frontend puede pedirla una vez por sesión.
      security:
        - bearer: []
      responses:
        '200':
          description: La lista de motivos de pérdida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotivosPerdida'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/catalogos-flete:
    get:
      operationId: obtenerCatalogosFlete
      tags: [web]
      summary: Catálogos de tipo de vehículo, tipo de carrocería, clase de viaje y clase de contenedor
      description: |
        Opciones del formulario de captura a partir de los **catálogos maestros de Nexo** (HU-013.10, #106, gap G1; ADR-018;
        `docs/conexion_nexo/MAPEO_CAMPOS_NEXO_COTIFLY.md`). Ya no se usa `GET /api/biblioteca-sap-historico/filtros` (el histórico de
        tarifas). HU-027.1 (#179) agrega `clases_contenedor`; el resto de la forma no cambió:
        - `tipos_vehiculo`: `GET /api/catalogos/tipos-vehiculo` (`{codigo, descripcion, esCatalogoOficial}`, códigos SAP
          cortos como `2S3`); `valor` = `codigo`, `etiqueta` = `descripcion`. Filas sin `codigo` se omiten;
        - `clases_viaje`: `GET /api/catalogos/clases-viaje` (`{id, descripcion}`); `valor` = `etiqueta` = `descripcion`
          (`Carga Suelta`, con espacio);
        - `tipos_carroceria`: en código (`ESTACAS` ... `VOLCO`) hasta que Nexo publique su catálogo;
        - tipología: enum de Nexo de 7 valores, en código (ver `SolicitudCosteoWeb.tipologia`);
        - `clases_contenedor` (HU-027.1, #179): `GET /api/catalogos/clases-contenedor` (`{id, descripcion, tamanoContenedor,
          pesoInfCnt, pesoSupCnt}`); `valor` = `etiqueta` = `descripcion`. En Nexo la `descripcion` **es el código**
          (`CNT20.IT`, `CNT20.RE`, `CNT20.ST`, `CNT40.HC`, `CNT40.RE`): no hay un campo `codigo` aparte. Es el mismo texto con
          que la captura valida `clase_contenedor`, así que todo `valor` de esta lista se acepta tal cual. Solo trae los valores
          de Nexo: la lista provisional de extradimensionado (`CNT20.FT`, `CNT20.OP`, `CNT40.FT`, `CNT40.OP`, G15) **no** se
          expone aunque la captura la siga aceptando. **Puede venir vacía** (`[]`, nunca 503 por esto): Nexo responde `[]`
          si su base de SAP no está configurada, y si ese catálogo falla queda vacío con un warning. Con la lista vacía la
          captura de una ruta `Contenedor` con una clase que no es provisional responde 503 `CATALOGOS_FLETE_NO_DISPONIBLE`
          (nunca se envía texto sin validar): el frontend deshabilita el selector y ofrece Reintentar;
        - Cotifly también lee `GET /api/catalogos/lineas-negocio` (advierte en el log si un `MargenesPolitica.mapeoLineasNexo`
          no aparece, G11).

        **Caché y Nexo caído.** Los cuatro catálogos se piden juntos (todo o nada) con el `X-Portal-clsUsuario-Id` del
        comercial y se reutilizan `Nexo:MinutosCacheCatalogos` (30 por defecto). Si Nexo no responde al renovarlos, se usa la
        última copia mientras tenga menos de `Nexo:HorasCatalogosVencidos` (24 por defecto). Sin copia utilizable responde
        503 `CATALOGOS_FLETE_NO_DISPONIBLE`: el formulario nunca ofrece texto libre.

        **Catálogos opcionales.** `tipos-vehiculo` y `clases-viaje` son obligatorios (si fallan o quedan vacíos no hay
        catálogos). Si fallan `clases-contenedor` o `lineas-negocio`, quedan vacíos con un warning (ver `clases_contenedor`
        arriba: ya no hay lista fija de respaldo). Solo se ofrecen los tipos de vehículo con `esCatalogoOficial = true`. Cada respuesta de Nexo se lee
        hasta 1 MB y 5.000 filas; pasarse es "no disponible".
        El valor que el frontend envía a `POST /web/solicitudes-costeo` es siempre `valor` (el código), nunca la etiqueta.
      security:
        - bearer: []
      responses:
        '200':
          description: Los cuatro catálogos (`clases_contenedor` puede venir vacía)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogosFlete'
        '503':
          description: |
            `CATALOGOS_FLETE_NO_DISPONIBLE`: los catálogos maestros de Nexo no están disponibles (Nexo caído o sin configurar, el
            comercial sin `idUsuarioExterno`) y no hay una copia de menos de `Nexo:HorasCatalogosVencidos`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/alias/resolver:
    get:
      operationId: resolverAlias
      tags: [web]
      summary: Resolver tipos de vehículo o clases de contenedor escritos a mano (catálogo oficial y diccionario de alias de Nexo)
      description: |
        **HU-031.1 (#194).** El frontend no puede llamar a Nexo (CORS e identidad por header): el backend resuelve por él un texto
        libre (por ejemplo, el de una fila del Excel de una licitación) con la misma regla que la captura y el envío a Nexo:
        1. el **catálogo oficial** de Nexo (`tipo=vehiculo`: `GET /api/catalogos/tipos-vehiculo`, sin distinguir mayúsculas, tildes
           ni `_`/`-`; `tipo=contenedor`: `GET /api/catalogos/clases-contenedor` exacto, más la lista provisional G15);
        2. si no está, el **diccionario de alias** de Nexo (NEXO #321, `GET /api/catalogos/alias`; "TB", "T.B", "Turbo" → `2L2`;
           "40 HC" → `CNT40.HC`), con la normalización de Nexo (espacios colapsados, sin espacio antes de `.` o `,`, `_` y `-` como
           espacio, sin tildes, mayúsculas). Un alias inactivo o del otro tipo no resuelve.

        **En lote.** `texto` se repite (`?tipo=vehiculo&texto=TB&texto=3s3`, hasta 200): una sola llamada para todas las filas, en
        el mismo orden (los repetidos también). Cotifly descarga el diccionario completo una vez (caché `Nexo:MinutosCacheCatalogos`,
        copia de respaldo hasta `Nexo:HorasCatalogosVencidos`), así que una licitación grande no hace una petición a Nexo por fila.
        Si todos los textos son códigos del catálogo, ni siquiera se consulta el diccionario.

        `reconocido: false` = ni el catálogo ni el diccionario lo conocen: en la captura, un `tipo_vehiculo` o una
        `clase_contenedor` así se rechazan (400 `CODIGO_NO_CATALOGO`); un vehículo del cubicador así viaja tal cual a Nexo y queda en
        su bandeja de normalización (`Nexo:EnviarCodigosCubicador = siempre`).
      parameters:
        - name: tipo
          in: query
          required: true
          schema:
            type: string
            enum: [vehiculo, contenedor]
          description: '`vehiculo` (o `vehículo`) o `contenedor`, sin distinguir mayúsculas.'
        - name: texto
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 200
            items:
              type: string
              maxLength: 100
          description: Uno o varios textos a resolver (se recortan; ninguno vacío).
      security:
        - bearer: []
      responses:
        '200':
          description: Un resultado por texto, en el mismo orden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AliasResueltos'
        '400':
          description: '`tipo` inválido, sin `texto`, uno vacío, más de 200 o uno de más de 100 caracteres.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'
        '503':
          description: |
            `CATALOGOS_FLETE_NO_DISPONIBLE`: hace falta el catálogo de Nexo (o, con `tipo=contenedor`, el de clases de contenedor) o
            su diccionario de alias y no hay una copia utilizable. Nunca se responde "no reconocido" por una caída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/cubicacion:
    post:
      operationId: cubicar
      tags: [web]
      summary: Calcular cubicaje - vehículos que recomienda el cubicador para un conjunto de bultos (vista previa, sin persistencia)
      description: |
        **HU-023.2 (#157, ADR-020).** "Calcular cubicaje" del formulario contra el **cubicador**: Cotifly llama a
        `POST /recomendaciones` (por el adaptador de HU-023.1) con `idLineaSolicitud = "PRUEBA-<guid>"` (una corrida de prueba nueva
        en cada llamada), `origenSistema = COTIFLY`, `claseViajeSeleccionada` = `clase_viaje` (preferencia opcional), `usuarioId` = el
        `idUsuarioExterno` del comercial y por ítem `codigoMercancia`, cantidad, medidas (cm) y peso por unidad (kg). **Cotifly no guarda
        nada** de esa llamada (ni en la base ni en Nexo). El `POST` nunca se reintenta.

        Reemplaza la cubicación rápida que reenviaba a `POST /api/cubicacion` de Nexo (retirada en el corte del cubicador). **La
        respuesta cambió de forma:** ya no es "un vehículo o N iguales" (`sugerencia`, `sugerencia_flota`) sino una **lista de
        vehículos** (`vehiculos[]`, pueden ser de tipos distintos: flota mixta), con el resultado, el motivo, la marca de condicionada,
        las advertencias y la extradimensión del cubicador. Ya no trae clase de viaje ni clase de contenedor: el cubicador no las
        sugiere.

        **Tipo de mercancía por ítem:** `codigo_mercancia` (catálogo de `GET /web/tipos-mercancia`). Mientras el frontend no tenga el
        desplegable, se acepta `descripcion` sin código: Cotifly la resuelve al tipo **activo** más parecido del catálogo, comparando
        sin tildes, sin mayúsculas y sin signos contra el nombre y el código (la misma lógica que usará la licitación, HU-023.5). El
        código usado y si fue sugerido vuelven en `mercancias[]`. Si la descripción no se parece a ninguno: 400
        `MERCANCIA_DESCONOCIDA` con el ítem en `detalle.item` (base 0). Solo se sugieren tipos cubicables.

        **Validación del código contra el catálogo** (E2E 2026-10-19, D-1019-1): antes de llamar al cubicador, cada
        `codigo_mercancia` se busca en el catálogo de tipos de mercancía del cubicador (el mismo de `GET /web/tipos-mercancia`, con
        caché), sin distinguir mayúsculas; viaja el código como está en el catálogo. Un código que no está o está inactivo es 400
        `MERCANCIA_DESCONOCIDA` y uno con `cubicable: false` es 400 `MERCANCIA_NO_CUBICABLE`, los dos con `detalle.item` (base 0) y
        `detalle.campo = codigo_mercancia`, sin llamar al cubicador. Si el catálogo no responde no se bloquea: el código viaja como
        llegó y decide el cubicador; su rechazo trae `detalle.item` y `detalle.campo` cuando se puede saber qué mercancía es (el
        cubicador cita el código en su mensaje).

        **Sin respaldo** (es solo una vista previa): sin cubicador configurado o con el cubicador caído responde 503
        `CUBICADOR_NO_DISPONIBLE`.

        **Asíncrono (opción D, E2E 2026-10-16, D3).** El motor del cubicador tarda 26-31 s con cargas grandes y bloquea su API
        mientras calcula. Cotifly valida primero (los 400 de los ítems siempre son síncronos) y lanza el cálculo en segundo plano:
        si termina dentro de `Cubicador:EsperaSincronaCubicacionSegundos` (8 s por defecto) responde **200 como siempre**; si no,
        responde **202** `CubicacionEnProceso` con `Location` y `Retry-After: 2`, y el cálculo **sigue** aunque el cliente corte la
        conexión. El front consulta `GET /web/cubicacion/{id}` cada 2-3 s hasta `completada` o `fallida`.

        **Cupo global (opción C).** Cotifly hace una sola llamada a la vez al cubicador (`Cubicador:MaximoConcurrente`, compartido con
        la captura, el recálculo y la licitación). Si el cupo no se libera en `Cubicador:EsperaMaximaCupoSegundos` (60 s), la
        cubicación termina con `CUBICADOR_OCUPADO`: 503 con `Retry-After: 10` si pasa dentro de la espera síncrona, o `fallida` con ese
        código en el `GET`.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CubicacionRequest'
            example:
              clase_viaje: Contenedor
              items:
                - codigo_mercancia: CAFE_EN_ESTIBAS
                  cantidad: 20
                  largo_cm: 120
                  ancho_cm: 100
                  alto_cm: 150
                  peso_kg: 1000
                - descripcion: Bobinas de acero
                  cantidad: 2
                  largo_cm: 180
                  ancho_cm: 180
                  alto_cm: 120
                  peso_kg: 2250.25
      responses:
        '200':
          description: La recomendación del cubicador (no se guarda), si respondió dentro de la espera síncrona
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoCubicacion'
        '202':
          description: |
            Opción D: el cubicador sigue calculando. El cálculo continúa en segundo plano (aunque el cliente corte); consultar
            `consultar_en` (`GET /web/cubicacion/{id}`) cada 2-3 s. Se guarda en memoria `Cubicador:RetencionCubicacionMinutos` (15 min).
          headers:
            Location:
              description: '`/web/cubicacion/{id}`'
              schema:
                type: string
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CubicacionEnProceso'
              example:
                id: 7d5c2c9e-1b8a-4f0e-9c3a-2f6b8e1d4a90
                estado: en_proceso
                consultar_en: /web/cubicacion/7d5c2c9e-1b8a-4f0e-9c3a-2f6b8e1d4a90
        '400':
          description: |
            `ErrorNegocio`: `ITEMS_REQUERIDOS` si `items` falta o viene vacío; `DIMENSIONES_INVALIDAS` con `detalle.item` (índice
            base 0) y `detalle.campo` si un ítem no trae `peso_kg` o lo trae ≤ 0 (HU-023, #176: el cubicador exige el peso por unidad) o
            si `largo_cm`, `ancho_cm` o `alto_cm` no están entre 0,1 y 999.999 (o traen más de 2 decimales); `POSICION_INVALIDA` con
            `detalle.item` y `detalle.campo = cantidad` si la `cantidad` no está entre 1 y 100.000. Son las reglas de la captura y se
            validan antes de llamar al cubicador, después de comprobar que está configurado (E2E 2026-10-16, D1). Un 422 del cubicador
            (su validación de esquema) también llega como 400: `DIMENSIONES_INVALIDAS` o `POSICION_INVALIDA` con `detalle.item` si
            señala una mercancía, o `CUBICADOR_PETICION_RECHAZADA` si no; `MERCANCIA_DESCONOCIDA` si un ítem no trae `codigo_mercancia` ni
            `descripcion` o si la descripción no se parece a ninguna mercancía del catálogo (con `detalle.item`); `MERCANCIA_DESCONOCIDA`
            (código desconocido o inactivo) o `MERCANCIA_NO_CUBICABLE` (`cubicable: false`) con `detalle.item` (base 0) y
            `detalle.campo = codigo_mercancia`, validados contra el catálogo del cubicador **antes** de llamarlo (D-1019-1; si el
            catálogo no responde, decide el cubicador y su rechazo trae `detalle.item` cuando se sabe qué mercancía es);
            `CUBICACION_DEMASIADO_GRANDE` si los ítems suman más de 10.000 unidades (`cantidad`; el tope del cubicador: partir la
            carga); y los demás rechazos del cubicador con su código: `MERCANCIA_NO_CUBICABLE`, `DIMENSIONES_INVALIDAS`,
            `MERCANCIAS_REQUERIDAS`. `ErrorWeb` si el cuerpo no es JSON válido (`Cuerpo inválido.`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '503':
          description: |
            `CUBICADOR_NO_DISPONIBLE`: el cubicador no está configurado (`Cubicador:UrlBase` vacía) o no respondió (caída, 5xx, tiempo
            agotado); no hay respaldo. `CUBICADOR_NO_AUTORIZADO`: el cubicador rechazó la llave de Cotifly. `CUBICADOR_RESPUESTA_INVALIDA`:
            la respuesta no cumple el contrato. `CUBICADOR_OCUPADO` (opción C, con `Retry-After: 10`): el cubicador está calculando
            otras cargas y no se liberó el cupo a tiempo, o hay demasiadas cubicaciones en curso; reintentar en unos segundos. El
            detalle técnico solo queda en el log.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '413':
          $ref: '#/components/responses/CuerpoDemasiadoGrande'
        '415':
          $ref: '#/components/responses/TipoContenidoNoSoportado'

  /web/cubicacion/{id}:
    get:
      operationId: consultarCubicacion
      tags: [web]
      summary: Estado de una cubicación que siguió en segundo plano (opción D)
      description: |
        **Opción D (E2E 2026-10-16, D3).** El `id` del 202 de `POST /web/cubicacion`. `estado`:
        - `en_proceso`: el cubicador sigue calculando (con `Retry-After: 2`). Volver a consultar en 2-3 s.
        - `completada`: `resultado` trae la misma forma del 200 de `POST /web/cubicacion` (`ResultadoCubicacion`).
        - `fallida`: `error` trae `{codigo, mensaje, detalle?}` con los mismos códigos que respondería el `POST` (por ejemplo un
          rechazo del cubicador como `MERCANCIA_NO_CUBICABLE` o `DIMENSIONES_INVALIDAS` con `detalle.item`, `CUBICADOR_NO_DISPONIBLE` o
          `CUBICADOR_OCUPADO`).

        Solo el comercial que la pidió la ve. Se guarda en la memoria de Cotifly `Cubicador:RetencionCubicacionMinutos` (15 min)
        desde su último cambio: vencida, de otro usuario, inexistente o perdida porque Cotifly se reinició, responde **404** igual
        (sin distinguir): el front vuelve a calcular. Endurecimiento A (#199): un `id` que no es un UUID también es ese 404 (antes un
        404 sin cuerpo).
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: El estado de la cubicación
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoCubicacion'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          description: '`ErrorWeb`: la cubicación no existe, venció, se perdió al reiniciar Cotifly, es de otro usuario o el `id` no es un UUID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'
              example:
                error: 'La cubicación no existe, ya venció o no es tuya: vuelve a calcular el cubicaje.'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/solicitudes-costeo:
    post:
      operationId: enviarSolicitudCosteo
      tags: [web]
      summary: Crea la cotización con el formulario ampliado y la envía a costeo en Nexo
      description: |
        **Captura por rutas (HU-021.6, #132, ADR-019).** El formulario trae `rutas` (`RutaCapturaWeb`, al menos una y hasta 100):
        cada ruta con su línea de negocio (o la de la solicitud), origen y destino con **id de municipio obligatorio y copia del
        nombre** (decisión 2), condiciones del contenedor con las ciudades de devolución y de levante también por id + nombre,
        horas, `valor_levante_contenedor` (se copia a cada camión, decisión 4), valor de la mercancía, peso, mercancías con
        `codigo_mercancia` obligatorio (catálogo del cubicador, HU-023.3) y `servicios_conexos` del catálogo de Nexo (id y cantidad; el
        precio lo pone Cotifly con el costo de Nexo, decisión 3, y nunca se muestra). Cotifly crea una ruta por cada una y sus
        camiones según el **cubicador** (HU-021.5, #133, con el contrato de HU-023.1, #156): manda la ruta a `POST /recomendaciones`
        del cubicador (`idLineaSolicitud` = id de la ruta, `origenSistema = COTIFLY`, `claseViajeSeleccionada` = la clase de viaje
        de la ruta como preferencia, `usuarioId` = el `idUsuarioExterno` del comercial y por mercancía `codigoMercancia`, medidas,
        cantidad y peso por unidad; el `id_tipo_mercancia` se traduce al código con el catálogo) y, con `ASIGNADO`, crea **un camión
        por vehículo** de la respuesta (flota mixta) con su código de vehículo y de carrocería, el peso que lleva, el volumen, los dos
        porcentajes de llenado y el id de la recomendación. `SIN_SELECCION_AUTOMATICA` (con su motivo) deja un camión sin vehículo ni
        carrocería con el peso de la ruta (lo resuelve la Mesa de Costeo de Nexo, decisión 7) y una ruta "condicionada" no parte ni
        bloquea nada: la solicitud se envía completa. Un rechazo del cubicador (`MERCANCIA_DESCONOCIDA`...) o una respuesta que no
        cumple el contrato (`CUBICADOR_RESPUESTA_INVALIDA`) impiden la captura: no se guarda ni se envía nada. **Respaldo:** sin
        cubicador configurado (hoy), sin mercancías o si el cubicador se cae (con `Cubicador:RespaldoSiFalla = true`, el valor por
        defecto), la ruta queda con **un camión sin vehículo ni carrocería con el peso total de la ruta**, como antes. A Nexo viaja
        una línea por camión.
        - **Mercancías:** con el catálogo del cubicador disponible (`GET /web/tipos-mercancia`), `nombre_mercancia` se copia del
          catálogo por `codigo_mercancia` (un nombre distinto del cliente se ignora); un código inactivo o desconocido es
          `MERCANCIA_DESCONOCIDA` y uno no cubicable `MERCANCIA_NO_CUBICABLE` (HU-023.3). Sin catálogo se guarda el nombre que manda
          el cliente y el código lo valida el cubicador: su rechazo (`MERCANCIA_DESCONOCIDA`, `MERCANCIA_NO_CUBICABLE` o un 422 que
          señala una mercancía) trae `detalle.ruta` y `detalle.item` (base 0) y `detalle.campo` cuando se sabe qué mercancía es
          (D-1019-1). **Todo o nada:** si una ruta falla en el cubicador, no se guarda ninguna ni se envía nada a Nexo. La ruta guarda
          `resultado_cubicacion`, `motivo_sin_seleccion` y `condicionada`, y cada camión su volumen y sus porcentajes de llenado; la
          respuesta trae `cubicacion` con los avisos.
        - **Municipios:** el nombre que se guarda **siempre sale del catálogo** de `GET /web/municipios` por el id (un nombre
          distinto que mande el cliente se ignora y queda en el log); un id que no existe es `MUNICIPIO_INEXISTENTE` en el campo del
          id. Sin id, el nombre se resuelve con la regla determinista de HU-005.13 y nunca se adivina (`MUNICIPIO_AMBIGUO` con los
          candidatos y su id, o `MUNICIPIO_NO_ENCONTRADO`). Por eso toda captura consulta el catálogo de municipios (con caché):
          si no responde, 503 `MUNICIPIOS_NO_DISPONIBLE`.
        - **Varias líneas de negocio:** se aceptan. Cada camión viaja a Nexo con la línea de negocio de su ruta y el margen es el
          de cada ruta.
        - **Todos los errores juntos:** 400 `SOLICITUD_COSTEO_INVALIDA` con `detalle.errores[]` (`ruta` base 0 o `null` si es del
          encabezado, `campo`, `codigo`, `mensaje`); `mensaje` es el del primero y `detalle.motivo` su código (o el del catálogo de
          Nexo que no respondió).
        - **Retirados (HU-021.11, #138):** `valor_estimado` y `referencia` (decisión 1) **ya no están en el contrato**; si un
          frontend anterior los manda, se ignoran sin error y queda un aviso `CAMPOS_RETIRADOS` en el log del servidor.
        - **Vehículo elegido o cubicador (HU-032, #197, ADR-022):** `tipo_vehiculo` y `carroceria` de cada ruta **vuelven al
          contrato** (ya no son `deprecated`): son el vehículo que elige el comercial y el **respaldo del cubicador**. Una ruta con
          TODAS sus mercancías cubicables (código, las tres medidas y peso) va al cubicador: si asigna, manda el cubicador (aviso
          `VEHICULO_AJUSTADO_POR_CUBICADOR` si el elegido era otro); si no selecciona, falla o está ocupado, va el elegido (aviso
          `VEHICULO_ELEGIDO_USADO`; si no es un código de Nexo, sin vehículo con `VEHICULO_ELEGIDO_INVALIDO`). Una ruta sin
          mercancías cubicables (solo `peso_kg`, mercancías sin medidas ni código, o mixta con `MERCANCIAS_NO_CUBICABLES`) no va al
          cubicador y usa el elegido, que entonces es **obligatorio salvo en Contenedor** (`VEHICULO_REQUERIDO` en
          `detalle.errores[]`, campo `tipo_vehiculo`). Los avisos salen en `cubicacion[].advertencias` de la respuesta.
        - **Formato plano anterior (`deprecated`, se retira cuando salga HU-021-FE):** sin `rutas`, los campos de ruta en la raíz
          (`origen`, `destino`, `posiciones`...) se leen como una sola ruta con un camión, con las mismas reglas. Enviar `rutas` y
          campos de ruta en la raíz a la vez es `SOLICITUD_COSTEO_INVALIDA`.

        HU-005.5 (ADR-015). Crea la cotización del comercial (folio del servidor, ADR-011, con el NIT) con el
        formulario ampliado y sus posiciones en `estado_costeo = pendiente_envio`, la **confirma antes de llamar a
        Nexo** y luego envía `POST {Nexo:UrlBase}/api/captura-solicitudes` con una sola línea. El BP del cliente sale
        del catálogo de Nexo (búsqueda por `nit_cliente`), nunca del cuerpo; si el cliente no tiene BP (prospecto) y el
        catálogo trae su `clienteId`, viaja `clienteId` (HU-013.10, G14). Los catálogos cerrados (`tipo_vehiculo`,
        `carroceria`, `tipologia`, `clase_viaje`, `clase_contenedor`) van con el código de Nexo tal cual y **se validan
        antes de guardar** (HU-013.10, G2): un valor que no es código de catálogo es 400 `SOLICITUD_COSTEO_INVALIDA` y no
        llega a Nexo. `tipo_vehiculo` y `clase_viaje` se validan contra los catálogos maestros de Nexo (con la misma caché de
        `GET /web/catalogos-flete`); si no hay copia utilizable, 503 `CATALOGOS_FLETE_NO_DISPONIBLE` y nada se guarda. Sin
        `Nexo:UrlBase` configurada, un formulario con `tipo_vehiculo` o `clase_viaje` siempre recibe ese 503.

        **Rechazos 400 de Nexo al alta (G16).** La cotización queda en `error_envio` con el código de Nexo en el motivo:
        `ENUM_INVALIDO`, `LINEA_INCOMPLETA`, `PESO_REQUERIDO` y `PESO_INCONSISTENTE` se tratan como
        `SOLICITUD_COSTEO_INVALIDA` (definitivo: se corrige en una versión nueva); `CLIENTE_REQUERIDO`, `CLIENTE_INVALIDO` y
        `CLIENTE_BP_INVALIDO` como `COSTEO_NEXO_RECHAZADA` con un motivo de cliente (reintentable: el reintento vuelve a
        resolver el BP en el catálogo de Nexo, así que se destraba al corregirlo en SAP/Nexo); `DWCUBOS_NO_CONFIGURADO` como `COSTEO_NEXO_NO_DISPONIBLE` (configuración de Nexo, se puede reintentar);
        cualquier otro 400 como `COSTEO_NEXO_SOLICITUD_INVALIDA` (definitivo).

        Responde **201 aunque Nexo falle**: la cotización queda en `error_envio` con `motivo_estado_costeo`
        (tiempo agotado, rechazo 4xx con el código de Nexo, 5xx, red, cliente sin BP) y el comercial puede
        reintentar con `POST /web/cotizaciones/{folio}/costeo/reintentar` sin volver a llenar el formulario. Con
        éxito queda en `pendiente_costeo` y el polling (HU-005.6) sigue su estado. `precio_final` es `null` hasta que
        el costeo pasa por el margen (HU-005.7).

        **Costeo en la misma petición (HU-013.14, ADR-018 §17).** Si Nexo costea todas las líneas en el alta
        (`fletesCalculados`), Cotifly lee el costo antes de responder y la cotización sale en `autocosteo` **con**
        `precio_final`. Si esa lectura falla, sale en `pendiente_costeo` y el polling la completa. `autocosteo` nunca
        sale sin precio, salvo que falte el margen, y entonces trae `motivo_estado_costeo`. Antes de HU-013.14 podía
        salir `autocosteo` con `precio_final: null` hasta la primera consulta del polling. El enum no cambia.

        Es el ÚNICO camino para crear una cotización (ADR-018): el chat ya no crea cotizaciones.

        **Moneda (HU-013.7, #103; mismo contrato que `POST /web/licitaciones`, ADR-014 §5):**
        `moneda` opcional, `COP` por defecto o `USD`. En USD la TRM del día se fija **antes de guardar** con
        `clsFijacionMonedaService` y queda en `trm_aplicada`; sin TRM responde 400 `TRM_NO_DISPONIBLE`, no guarda nada y
        no envía nada a Nexo. El polling calcula el precio del flete y de los conexos en pesos y lo convierte con esa TRM
        (`round(precio_cop / trm, 2)`); el costo sigue en COP. El ajuste de margen usa la misma TRM fijada (nunca la del
        día), el reintento la conserva y el PDF lleva la nota de TRM mínima con la `trm_aplicada`.

        **Respuesta e idempotencia (#173).** El 201 no depende de lecturas secundarias: si después de guardar y enviar a Nexo
        falla la lectura del nombre de la línea (timeout de la base), igual responde 201 con lo esencial, `linea_negocio: null`
        y `avisos: ["RESUMEN_INCOMPLETO"]` (el frontend recarga "Mis cotizaciones"). Con `Idempotency-Key`, una repetición del
        mismo POST (mismo usuario y mismo cuerpo, 24 h) devuelve la cotización de la primera **sin crear otro folio ni otra
        solicitud en Nexo**; toda captura exitosa consume la clave, también la que quedó en `error_envio` (se reintenta con
        `.../costeo/reintentar`). La clave es **opcional** (sin ella cada POST crea otra cotización) pero **recomendada**: el
        frontend la genera al pulsar Enviar y la reutiliza tal cual en los reintentos de esa misma captura.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCosteoWeb'
      responses:
        '201':
          description: Cotización creada; `estado_costeo` dice si Nexo recibió la solicitud
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionResumen'
        '400':
          description: |
            `SOLICITUD_COSTEO_INVALIDA` (campo obligatorio, largo o rango fuera de los límites de Nexo, más de 200
            posiciones, o la regla de peso de Nexo: `detalle.motivo` = `PESO_REQUERIDO` si la línea no trae peso > 0 ni
            posiciones con peso, `PESO_INCONSISTENTE` si el peso difiere más del 1 % de `sum(cantidad × peso_kg)`; HU-013.10:
            un catálogo que no es código de catálogo, `clase_contenedor` sin `clase_viaje = Contenedor` ni `Extradimensionado`
            (HU-021.15, #297) o sin ella con `Contenedor`, con `Extradimensionado` solo las clases provisionales G15
            (`CNT20.FT`, `CNT20.OP`, `CNT40.FT`, `CNT40.OP`; otra es `VALOR_FUERA_DE_RANGO`),
            `valor_levante_contenedor` (ex `valor_aprovisionamiento`; el error lo nombra así desde #228) sin una `ciudad_levante_contenedor` distinta del origen; el mensaje nombra
            el campo), `MARGEN_LINEA_DESCONOCIDA` (la línea no existe o está inactiva) o `FOLIO_CONSECUTIVO_AGOTADO`.
            Con `moneda = USD` (HU-013.7): `TRM_NO_DISPONIBLE` si ninguna fuente de la TRM respondió; `moneda` con otro valor
            es `SOLICITUD_COSTEO_INVALIDA` (el mensaje nombra el campo `moneda`).
            HU-021.6: `SOLICITUD_COSTEO_INVALIDA` trae TODOS los errores en `detalle.errores[]` (`ruta`, `campo`, `codigo`,
            `mensaje`). Códigos por campo: los de `ErrorFilaLicitacion` (`LINEA_INCOMPLETA`, `CAMPO_REQUERIDO`, `CAMPO_DEMASIADO_LARGO`,
            `VALOR_FUERA_DE_RANGO`, `POSICION_INVALIDA`, `PESO_REQUERIDO`, `PESO_INCONSISTENTE`, `CAMPO_NO_APLICA`,
            `CODIGO_NO_CATALOGO`, `MUNICIPIO_AMBIGUO`, `MUNICIPIO_NO_ENCONTRADO`, `LINEAS_REQUERIDAS`, `DEMASIADAS_LINEAS`) más
            `CONEXO_DUPLICADO`, `CONEXO_NO_ENCONTRADO` y `DEMASIADOS_CONEXOS`. HU-030.1 (#184): `peso_con_tara_kg` con otra clase de
            viaje que `Contenedor` es `CAMPO_NO_APLICA` y menor que el peso de carga es `PESO_CON_TARA_MENOR_QUE_CARGA`. HU-032 (#197):
            `VEHICULO_REQUERIDO` en `tipo_vehiculo` (ruta sin mercancías cubicables y sin vehículo, salvo Contenedor). `CAMPO_REQUERIDO` en
            `origen_municipio_id`/`destino_municipio_id` o `mercancias[i].id_tipo_mercancia` cuando falta el id.
            HU-021.5: `TIPO_MERCANCIA_INEXISTENTE` en `mercancias[i].id_tipo_mercancia` si el id no está en el catálogo del cubicador.
            `POSICION_INVALIDA` va en `mercancias[i].<subcampo>` (índice base 0: `cantidad`, `largo_cm`, `ancho_cm`, `alto_cm`,
            `peso_kg`, `descripcion` o `codigo_mercancia`) y su mensaje nombra la mercancía en base 1 (`Mercancía 1: ...`), sin
            índices; `DEMASIADAS_POSICIONES` va en `mercancias` (antes `posiciones[i]` y `posiciones`, E2E 2026-10-16).
            Rechazos del cubicador (HU-023.1; endurecimiento A, #199): `ErrorNegocio` con su propio código, `MERCANCIAS_REQUERIDAS`,
            `MERCANCIA_DESCONOCIDA`, `MERCANCIA_NO_CUBICABLE`, `DIMENSIONES_INVALIDAS`, `POSICION_INVALIDA`, `CUBICACION_DEMASIADO_GRANDE`
            o `CUBICADOR_PETICION_RECHAZADA`, con `detalle.ruta`, `detalle.item` (base 0) y `detalle.campo` cuando se sabe; nunca van al
            respaldo. Nada queda guardado. `ErrorWeb` si el cuerpo no es JSON válido.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
        '409':
          description: |
            #173. `ESTADO_NO_PERMITE` con `detalle.motivo = CAPTURA_EN_CURSO`: la `Idempotency-Key` ya creó un folio cuyo envío a Nexo
            no terminó de registrarse (la primera petición falló después de confirmar el folio). No se vuelve a llamar a Nexo;
            `detalle.folio` y `detalle.solicitud_nexo_id` dicen qué revisar. No reintentar: llevar al comercial a "Mis cotizaciones".
            #191: el mismo 409 (`CAPTURA_EN_CURSO`) responde si otra petición con la misma clave todavía está en curso en otra
            réplica de la API; no se ejecuta nada.
            `IDEMPOTENCY_KEY_REUTILIZADA` (D4, E2E 2026-10-16; antes 400 `ErrorWeb`): la misma `Idempotency-Key` con otro cuerpo; no se
            hace nada. Generar una clave nueva para cada intención.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '503':
          description: |
            `CATALOGOS_FLETE_NO_DISPONIBLE`: los catálogos maestros de Nexo no están disponibles (Nexo caído o sin configurar, el
            comercial sin `idUsuarioExterno`) y no hay una copia de menos de `Nexo:HorasCatalogosVencidos`. Nada queda guardado.
            HU-021.6: `MUNICIPIOS_NO_DISPONIBLE` si alguna ruta necesita el catálogo de municipios (un municipio sin id, o con id y
            sin nombre) y Nexo no responde; `NEXO_NO_DISPONIBLE` (o 403 `NEXO_SIN_PERMISO`, ver el 403) si la ruta trae servicios
            conexos y no se pudo leer su costo en el catálogo de Nexo. Nada queda guardado.
            HU-021.5: `CUBICADOR_NO_DISPONIBLE` solo con `Cubicador:RespaldoSiFalla = false`, si el cubicador configurado no pudo
            recomendar los vehículos de una ruta ("no se pudo calcular los vehículos"); nada queda guardado ni se envía a Nexo. Con el
            valor por defecto (`true`) la ruta sigue con un camión sin vehículo.
            También si se agota `Cubicador:PresupuestoCapturaSegundos` (una licitación hace un POST por fila). El 503 no trae el detalle
            interno (estado HTTP, ruta del cubicador): queda en el log con el evento `CUBICADOR_RESPALDO`.
            `CUBICADOR_NO_AUTORIZADO` (el cubicador rechazó la llave de Cotifly) y `CUBICADOR_RESPUESTA_INVALIDA` (respuesta fuera del
            contrato) son 503 SIEMPRE, también con el respaldo encendido: nunca van al respaldo y nada queda guardado.
            `SERVICIO_OCUPADO` (#125): el candado del folio siguió ocupado tras los reintentos; nada queda guardado, se puede
            reintentar.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '403':
          description: |
            `NEXO_SIN_PERMISO` (endurecimiento B de #199): Nexo respondió 403 al leer el costo de los servicios conexos de una ruta
            en su catálogo (`GET /api/servicios-conexos`: el comercial no tiene el rol `Comercial` ni `Admin` en Nexo). Nada queda
            guardado ni se captura en Nexo; `detalle.motivo` trae solo el código de Nexo. `ErrorWeb` si el rol de Cotifly no alcanza.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '413':
          $ref: '#/components/responses/CuerpoDemasiadoGrande'
        '415':
          $ref: '#/components/responses/TipoContenidoNoSoportado'

  /web/cotizaciones/{folio}/costeo/reintentar:
    post:
      operationId: reintentarCosteo
      tags: [web]
      summary: Reenvía a Nexo la solicitud guardada de una cotización que no llegó
      description: |
        HU-005.5. Nunca si la cotización ya tiene resultado (`ganada` con valor). Solo desde `estado_costeo` `error_envio` (salvo un rechazo 400 de Nexo, que es definitivo: el
        motivo empieza por "Rechazo definitivo de Nexo") o `pendiente_envio`; reenvía el formulario y las posiciones
        guardados (no hace falta volver a llenarlos). Mismo resultado que el envío: 200 con la cotización en
        `pendiente_costeo`/`autocosteo`, o de nuevo en `error_envio` con el motivo. Si el motivo anterior era
        "tiempo agotado", Nexo pudo haber creado la solicitud: el comercial debe verificar antes de reintentar
        (pendiente de confirmar con el equipo de Nexo una clave de idempotencia). Solo el dueño.
        HU-013.4: `POST .../costeo/re-solicitar` lo amplía (también costeo vencido o entregado, y con cambios de carga);
        este endpoint se conserva por compatibilidad.

        HU-013.11 (#108): lo guardado se revalida antes de reenviar. Una licitación vuelve a pasar sus filas por todas las reglas de
        captura (forma, contenedor y aprovisionamiento, códigos de catálogo y municipios; las filas sin `origen_municipio_id`/
        `destino_municipio_id` se resuelven y el id queda guardado). Si alguna fila guardada ya no pasa (por ejemplo, una
        licitación creada antes de #108 con `Tractomula` como tipo de vehículo), responde 400 `LICITACION_INVALIDA` con
        `detalle.motivo = LICITACION_REQUIERE_NUEVA_CARGA` y `detalle.errores[]` y no envía nada: ni este reintento ni una `-vN`
        la arreglan, hay que crear una licitación nueva con `POST /web/licitaciones`.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
      responses:
        '200':
          description: Reenvío intentado; `estado_costeo` dice si Nexo lo recibió
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionResumen'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '400':
          description: |
            `SOLICITUD_COSTEO_INVALIDA` (el formulario guardado ya no cumple los límites de Nexo) o, en una licitación,
            `LICITACION_INVALIDA` con `detalle.motivo = LICITACION_REQUIERE_NUEVA_CARGA` y `detalle.errores[]` (HU-013.11). Nada se envía.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '409':
          description: '`COSTEO_NO_REINTENTABLE`: la cotización no está en `error_envio` ni en `pendiente_envio`, o no nació del formulario ampliado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '503':
          description: |
            Licitación (HU-013.11): `CATALOGOS_FLETE_NO_DISPONIBLE` (sin catálogo maestro de Nexo ni copia de 24 h para revalidar las
            filas) o `MUNICIPIOS_NO_DISPONIBLE` (alguna fila guardada sin id de municipio y el catálogo no responde). Nada se envía.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/cotizaciones/{folio}/resultado:
    post:
      operationId: marcarResultado
      tags: [web]
      summary: Marca la cotización como ganada o perdida en Nexo y en Cotifly
      description: |
        HU-005.14 (ADR-015 §6); reemplaza a `/seguimiento` para las cotizaciones que pasaron por Nexo. Dos escrituras:
        primero `POST /api/cotizaciones/{id}/resultado` de Nexo (`{id}` = la cotización de Nexo de la solicitud) y,
        **solo si Nexo responde 200**, `ganada` y `motivo_rechazo` en Cotifly (perdida: `motivo`; ganada: `"No aplica"`,
        HU-021.13; a Nexo se le envía `motivo` tal como llega). `comentario` se reenvía a
        Nexo y no se guarda en Cotifly. `409` de Nexo (`RESULTADO_YA_DEFINIDO`) o Nexo caído (`503`) no cambian nada local;
        el frontend puede deshabilitar el botón cuando `ganada` ya tiene valor. `COTIZACION_NO_ENTREGADA` ya no es un error
        (HU-033, abajo).

        **Resultado diferido (HU-033, #199, ADR-023).** Si Nexo todavía no tiene la cotización Entregada (en `autocosteo`
        Nexo responde `409 COTIZACION_NO_ENTREGADA`; en `pendiente_costeo` Cotifly lo confirma leyendo el costeo), el
        resultado se guarda SOLO en Cotifly y responde 200 con `sincronizacion_resultado_nexo = pendiente` ("pendiente de
        sincronizar con NEXO"); el `comentario` se guarda para enviarlo después. El polling sigue consultando la solicitud
        y, cuando ve que la Mesa de Costeo la entregó, envía el resultado a Nexo UNA vez (idempotente) y queda `sincronizado`.
        Cotifly nunca entrega la cotización en Nexo (no llama a `/entregar`). Si Nexo descarta la solicitud, el costeo vence,
        pasan 30 días sin entrega o se agotan 10 intentos fallidos, queda `no_sincronizable` (solo en Cotifly, con
        `error_sincronizacion_resultado_nexo`). Si al sincronizar Nexo ya tenía otro resultado, manda Nexo (como en
        `RESULTADO_YA_DEFINIDO`) y queda anotado. Mientras está pendiente, otro `/resultado` con el mismo valor es 200 sin
        cambios y con otro valor es 409 `RESULTADO_YA_DEFINIDO`. Excepción: la perdida en `pendiente_costeo` sigue siendo
        la "perdida solo en Cotifly" de HU-013.17 (abajo), que nunca se sincroniza.

        Entrega implícita: si Nexo entrega la cotización al marcar el resultado, `estado_costeo` salta a `entregada`
        aunque estuviera en `autocosteo` o `pendiente_costeo`; es un estado válido. Desde su issue #171, Nexo exige que la
        cotización esté entregada y responde `COTIZACION_NO_ENTREGADA` si sigue en borrador (pendiente de confirmar con
        el equipo de Nexo). Solo el dueño.

        **Costeo no aplicado (HU-013.14, ADR-018 §17).** Si la cotización todavía no tiene `precio_final` (Nexo
        entregó y Cotifly aún no lo había leído), después del 200 de Nexo Cotifly relee el costeo y guarda resultado,
        `estado_costeo` y `precio_final` en la misma escritura: la respuesta ya trae el precio. Si esa relectura falla,
        el resultado se registra igual (Nexo ya lo tiene), `estado_costeo` conserva su valor (nunca `entregada` sin
        precio) y el polling aplica el precio en segundos: el frontend sigue consultando `GET .../costeo` mientras
        `precio_final` sea `null`. En `pendiente_costeo`, Cotifly lee primero el costeo de Nexo y reutiliza esa lectura:
        solo si Nexo ya la entregó le pide el resultado; si no, una `ganada` queda pendiente de sincronizar (HU-033, arriba)
        y una `perdida` queda solo en Cotifly (abajo).

        **Resultado ya definido en Nexo (HU-013.14).** Si Nexo responde `RESULTADO_YA_DEFINIDO` (otro resultado quedó en
        Nexo y no en Cotifly), Cotifly lee el resultado de Nexo, lo guarda y responde ese 409 con
        `detalle.motivo` = `ganada`/`perdida` (el que tiene Nexo): Cotifly y Nexo quedan iguales.

        **Perdida solo en Cotifly (HU-013.17, #127).** Si el cliente desiste antes del costeo, en `error_envio`, o en
        `pendiente_costeo` cuando Nexo **confirma** que no tiene la cotización entregada (si Nexo no responde, 503
        reintentable sin cambios), se admite **solo** `perdida`, con `motivo`
        obligatorio (400 si falta) e `If-Match` obligatorio (428 sin él, 409 `CONFLICTO_CONCURRENCIA` si no coincide).
        No se envía a Nexo, se detiene el polling y `motivo_estado_costeo` lo indica ("Perdida solo en Cotifly ...").
        Si Nexo costea después, el resultado no cambia. Cuenta en las métricas como perdida y queda en la auditoría
        (`resultado_cotizacion_sin_costeo`) y `sincronizacion_resultado_nexo` es `solo_cotifly`. Una `ganada` en `error_envio`
        es 409 `COTIZACION_NO_ENTREGADA` (Nexo no recibió la solicitud); en `pendiente_costeo` queda pendiente (HU-033).

        `If-Match` es opcional en el resto (compatibilidad); si viene y no coincide, 409 `CONFLICTO_CONCURRENCIA`. El 200
        devuelve el `ETag` nuevo.

        **Endurecimiento B (#199, E2E 2026-10-22).**
        - DEF-C-1: ante `RESULTADO_YA_DEFINIDO` Cotifly **lee** el resultado de Nexo (`GET /api/cotizaciones/{id}` con el id que ya
          conoce, o `GET /api/cotizaciones/por-solicitud/{id}`); ya no escribe en Nexo con `POST /api/cotizaciones` ("crear o
          recuperar"). Lo mismo cuando todavía no conoce el id de la cotización de Nexo: si Nexo aún no la tiene, es como una cotización
          no entregada (pendiente de sincronizar en `autocosteo`). El "crear o recuperar" queda solo para un Nexo sin la ruta de lectura.
        - OBS-C-2: repetir el **mismo** resultado que ya está `sincronizado` responde 200 sin cambios (mismo `ETag`) y sin llamar a
          Nexo. Otro valor sigue yendo a Nexo, que manda (409 `RESULTADO_YA_DEFINIDO`).
        - Una `perdida` en `pendiente_costeo` cuya solicitud Nexo ya no reconoce (404) queda como perdida `solo_cotifly` (mismas
          reglas: `motivo` e `If-Match`), igual que en `error_envio`; antes respondía `COSTEO_NEXO_SOLICITUD_NO_ENCONTRADA`.
        - Si Nexo responde 404 `COTIZACION_NO_ENCONTRADA` al marcar (no reconoce la cotización de Nexo del folio), es 409
          `COTIZACION_NEXO_NO_ENCONTRADA` con el código de Nexo en `detalle.motivo`, sin cambio local; nunca el 404 "no es tuya".
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResultadoWeb'
      responses:
        '200':
          description: Resultado registrado en Nexo y en Cotifly (o, en la perdida sin costeo, solo en Cotifly)
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionResumen'
        '400':
          description: '`resultado` que no es `ganada`/`perdida` o `motivo`/`comentario` fuera de los límites de Nexo (100 y 500) (`ErrorWeb`); HU-018.1 (#155): en una `perdida`, `MOTIVO_NO_PERMITIDO` si el `motivo` falta, no es de la lista de `GET /web/motivos-perdida` o es `Otro` sin `comentario` (`ErrorNegocio` con `detalle.motivos_permitidos` y `detalle.requiere_comentario`), sin llamar a Nexo; `COSTEO_NEXO_RECHAZADA` si Nexo responde otro 4xx (`ErrorNegocio`, código de Nexo en `detalle.motivo`); sin cambio local'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorWeb'
                  - $ref: '#/components/schemas/ErrorNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '409':
          description: |
            Sin cambio local, salvo `RESULTADO_YA_DEFINIDO` de Nexo, que deja en Cotifly el resultado de Nexo (`detalle.motivo`).
            De Nexo: `RESULTADO_YA_DEFINIDO` y `SOLICITUD_NO_TRANSICIONABLE`. `COTIZACION_NO_ENTREGADA` lo responde Cotifly sin
            pedirle el resultado a Nexo: en `pendiente_envio` (ya con solicitud en Nexo), para una `ganada` en `error_envio` y
            para una `ganada` en `pendiente_costeo` si la lectura del costeo de Nexo falla con un error que no es de
            disponibilidad (Nexo caído o lento es 503). Cuando Nexo responde `COTIZACION_NO_ENTREGADA` (`autocosteo`) o
            confirma que no hay entrega (una `ganada` en `pendiente_costeo`), ya no es 409: 200 pendiente de sincronizar
            (HU-033). De Cotifly: `COSTEO_NO_LISTO` (chat, descartada o costeo vencido, que se marcan
            con `/seguimiento`; o todavía no enviada a Nexo), `RESULTADO_YA_DEFINIDO` (ya tiene resultado sin costeo) y
            `CONFLICTO_CONCURRENCIA` (`If-Match` que no coincide). Endurecimiento B (#199): `COTIZACION_NEXO_NO_ENCONTRADA` si Nexo
            responde 404 `COTIZACION_NO_ENCONTRADA` (no reconoce su cotización del folio; `detalle.motivo` = ese código de Nexo).
            HU-036.3 (#207): `COTIZACION_NO_FINALIZADA` en `autocosteo` o `entregada` sin finalizar ni resultado ni envío (finaliza
            antes de marcar el resultado; sin llamar a Nexo); antes del costeo no aplica
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '428':
          $ref: '#/components/responses/PrecondicionRequerida'
        '503':
          description: '`COSTEO_NEXO_NO_DISPONIBLE` (también si Nexo responde 401/403: identidad o rol del comercial en Nexo, es configuración) o `COSTEO_NEXO_TIEMPO_AGOTADO`; sin cambio local'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '413':
          $ref: '#/components/responses/CuerpoDemasiadoGrande'
        '415':
          $ref: '#/components/responses/TipoContenidoNoSoportado'

  /web/cotizaciones/{folio}/finalizar:
    post:
      operationId: finalizarCotizacion
      tags: [web]
      summary: El comercial acepta el precio y finaliza la cotización
      x-issue: '#206 (HU-036.2)'
      description: |
        HU-036.2 (#206). El comercial acepta el precio de la cotización y la **finaliza**. Solo el dueño, con `If-Match` (el `ETag`
        de `GET .../costeo` o de "Mis cotizaciones"). Cuerpo **opcional** (`FinalizarWeb`, HU-046.3 #269): solo `justificacion`.

        - Solo con el costeo de Nexo listo: `estado_costeo` en `autocosteo` o `entregada` (todas las rutas que cuentan tienen precio;
          las `rechazada` no cuentan) y con `precio_final` (una `entregada` que Cotifly todavía no leyó espera la relectura del
          polling). En cualquier otro caso, 409 `COTIZACION_NO_FINALIZABLE` con `detalle.estado_costeo`.
        - Tampoco mientras Nexo tiene un servicio conexo que Cotifly todavía no leyó (`motivo_estado_costeo` de conexos pendientes):
          409 `COTIZACION_NO_FINALIZABLE` con `detalle.motivo = conexos_pendientes_de_leer`; se finaliza después de la siguiente
          lectura del costeo, que trae el conexo con su precio.
        - #228: tampoco mientras un servicio conexo de una ruta que cuenta (no `rechazada`) todavía no está en la cotización de
          Nexo, es decir con `servicios_conexos[].estado_nexo = pendiente` (el envío diferido no lo ha mandado o se reintentará):
          409 `COTIZACION_NO_FINALIZABLE` con `detalle.motivo = conexos_pendientes_en_nexo` y `detalle.conexos_pendientes` (cuántos);
          se finaliza cuando el polling lo deja `enviado`. `incierto` y `fallido_definitivo` no bloquean (ya no se reintentan; el
          costeo los muestra con `aviso_conexos_nexo` para revisarlos en Nexo). Un conexo agregado con
          `POST .../costeo/servicios-conexos` queda `enviado` en el momento (Nexo lo creó y la relectura lo confirma). Con
          alguno `pendiente`, finalizar RELEE la cotización de Nexo y deja `enviado` lo que Nexo ya muestra antes de decidir (un
          registro que quedó `pendiente` aunque Nexo tenga el conexo, p. ej. agregado antes de #228, no bloquea para siempre una
          entregada); si Nexo no responde, cuenta el registro y responde el 409. #259: si después de releer siguen pendientes, el
          409 además vuelve a encolar la cotización para el envío diferido (finalizar nunca envía conexos a Nexo): el worker los
          envía o los deja `fallido_definitivo` en segundos y el siguiente intento de finalizar pasa. Si hay
          conexos pendientes de leer, ese motivo va primero.
        - HU-046.3 (#269; contrato del 2026-11-10): tampoco mientras una ruta que cuenta (no `rechazada`) tiene una medida
          **obligatoria** de la política de seguros pendiente (`rutas[].politica_seguros.obligatorias[].estado = pendiente` en
          `GET .../costeo`; hoy, un acompañante vehicular desde 350 M): 409 `COTIZACION_NO_FINALIZABLE` con
          `detalle.motivo = medidas_obligatorias_faltantes` y `detalle.rutas` (cada ruta con `linea_orden`, `origen`, `destino` y sus
          `medidas`: `codigo` y `nombre`). Se revisa después del estado y de los conexos de Nexo. Con `justificacion` (de 10 a 500
          caracteres, sin los espacios de los extremos) se finaliza igual: la justificación salta **solo** este bloqueo (los anteriores
          bloquean con o sin ella) y queda en `EventosHerramienta` con las medidas que faltaban (códigos, sin montos). Fuera de ese largo:
          400 `JUSTIFICACION_REQUERIDA` con `detalle.minimo = 10` y `detalle.maximo = 500`, validado justo después del `If-Match`. Una ruta
          sin `valor_mercancia` (o con 0) no exige nada (el costeo trae `aviso = SIN_VALOR_MERCANCIA`). La política se lee de sus tablas en
          cada finalización: un cambio de Datos se ve sin desplegar. Solo se evalúa si no bloquea otro motivo. Un conexo
          `fallido_definitivo` o `incierto` en Nexo no cumple la medida. Si la política no se puede leer, 500.
        - Re-finalizar una ya finalizada es idempotente: 200 sin cambios (mismo `finalizada_at`, mismo `ETag`).
        - `If-Match` que no es la versión vigente: 409 `CONFLICTO_CONCURRENCIA`, sin cambios (también si ya estaba finalizada). Si
          el polling cambió el precio entre la lectura y el clic, la versión ya no coincide: el comercial recarga y nunca finaliza un
          precio que no vio.
        - La finalización va en columnas propias (`finalizadaAt`, `finalizadaPor`, script `14`), no en `estado_costeo`: el estado
          sigue avanzando con Nexo (p. ej. `autocosteo` → `entregada`).
        - La respuesta trae `finalizada_at` (también en `CosteoCotizacion` y en `GET /web/cotizaciones/{folio}`).

        Cada finalización, o su rechazo, queda en `EventosHerramienta` (`finalizar_cotizacion`, sin montos).
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
        - $ref: '#/components/parameters/IfMatchObligatorio'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizarWeb'
            example:
              justificacion: "Riesgo aprobó el viaje sin acompañante (correo del 2026-11-06)."
      responses:
        '200':
          description: Cotización finalizada (o ya lo estaba)
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionResumen'
        '400':
          description: 'Cuerpo inválido (`ErrorWeb`) o, HU-046.3 (#269), `JUSTIFICACION_REQUERIDA` con `detalle.minimo = 10` y `detalle.maximo = 500` si la justificación viene fuera de 10 a 500 caracteres.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '409':
          description: '`COTIZACION_NO_FINALIZABLE` (`estado_costeo` distinto de `autocosteo` y `entregada`, con `detalle.estado_costeo`; o `detalle.motivo` = `conexos_pendientes_de_leer`, #228 `conexos_pendientes_en_nexo` con `detalle.conexos_pendientes` o, HU-046.3 #269, `medidas_obligatorias_faltantes` con `detalle.rutas`) o `CONFLICTO_CONCURRENCIA`; sin cambios.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '428':
          $ref: '#/components/responses/PrecondicionRequerida'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/cotizaciones/{folio}/costeo:
    get:
      operationId: obtenerCosteo
      tags: [web]
      summary: Estado del costeo en Nexo, precio final y servicios conexos de la cotización
      description: |
        HU-005.7 (ADR-015 §5). `precio_final` sale del módulo de Precio con el margen de la cotización (resuelto al enviarla:
        SAP TM con el BP o la política de la línea) sobre el transporte; HU-043.2 (#251): el `precio` de cada servicio conexo
        es su venta, sin margen, y suma tal cual. `precio_final` es `null`
        mientras no haya costeo. Solo el dueño.

        HU-039.1 (#218, reversa de ADR-015 §5 confirmada por la Gerencia Comercial el 2026-10-27): cada ruta trae su costo
        bruto en `rutas[].costo_final`, **siempre en COP** aunque la cotización esté en USD, y `null` mientras la ruta no tenga
        precio. Es el total de la ruta (sin desglose ni costos por camión o conexo) y no sale en "Mis cotizaciones", el PDF,
        el correo, el Excel ni el chat. Las demás respuestas `CosteoCotizacion` del dueño (ajuste de margen, conexos,
        recálculo de vehículos) también lo traen.

        HU-013 (ADR-018): trae además `margen_sugerido` y `origen_margen` (botón de ajuste de margen, HU-013.2),
        `trm_aplicada` (HU-013.7, TRM fijada al crear; 0 en COP), `textos` (asunto e introducción del PDF, HU-013.5), `pdf_desactualizado` (ADR-018 §11)
        y `row_version` (#98), que también va en
        el encabezado `ETag`. Son opcionales en el esquema hasta que cada issue los implemente.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
      responses:
        '200':
          description: Costeo de la cotización
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CosteoCotizacion'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/cotizaciones/{folio}/rutas/{rutaId}/recalcular-vehiculos:
    post:
      operationId: recalcularVehiculosRuta
      tags: [web]
      summary: Pide de nuevo al cubicador los camiones de UNA ruta y reemplaza los anteriores
      x-issue: '#158 (HU-023.3)'
      description: |
        HU-023.3 (#158, ADR-020). Cuando cambian las mercancías o el peso de una ruta, el frontend pide los camiones de nuevo: la ruta
        viaja al cubicador con su mismo id (`idLineaSolicitud`, una corrida nueva) y sus mercancías con `codigo_mercancia`; los camiones
        de esa ruta se reemplazan por los de la respuesta (con volumen y porcentajes de llenado) y la ruta guarda el resultado
        (`resultado_cubicacion`, `motivo_sin_seleccion`, `condicionada`). Sin cubicador o si se cae (con el respaldo encendido), un camión
        sin vehículo con el peso de la ruta. La ruta recalculada trae `avisos_cubicacion`. Solo si la solicitud **nunca llegó a Nexo** y
        no hay un envío en curso ni incierto (la misma regla que el reintento): si no, 409 `ESTADO_NO_PERMITE` y se usa
        `POST .../costeo/re-solicitar` (la versión nueva también vuelve a pedir los camiones). Una ruta
        con mercancías sin código (anteriores al script `02`) responde 400 `SOLICITUD_COSTEO_INVALIDA`: el comercial las vuelve a escoger.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
        - name: rutaId
          in: path
          required: true
          description: |
            `linea_solicitud_id` de la ruta (de `rutas[]` de `CosteoCotizacion`). Endurecimiento A (#199): un valor que no es un UUID
            responde 404 `NoEsTuya`, como una ruta que no existe (antes 400 "Cuerpo inválido").
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IfMatchObligatorio'
      responses:
        '200':
          description: Costeo con los camiones nuevos de la ruta
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CosteoCotizacion'
        '400':
          description: |
            `SOLICITUD_COSTEO_INVALIDA` (mercancías sin código), `RUTA_INEXISTENTE` o un rechazo del cubicador con su código
            (`MERCANCIAS_REQUERIDAS`, `MERCANCIA_DESCONOCIDA`, `MERCANCIA_NO_CUBICABLE`, `DIMENSIONES_INVALIDAS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '409':
          description: '`ESTADO_NO_PERMITE` (la solicitud ya está en Nexo), `PDF_YA_ENVIADO` (HU-036.3, #207: enviada, con resultado o finalizada; `detalle` con la versión nueva) o `CONFLICTO_CONCURRENCIA`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '428':
          description: '`PRECONDICION_REQUERIDA`: falta `If-Match`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '503':
          description: '`CUBICADOR_NO_DISPONIBLE` (sin respaldo), `CUBICADOR_NO_AUTORIZADO` o `CUBICADOR_RESPUESTA_INVALIDA`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/cotizaciones/{folio}/costeo/margen:
    put:
      operationId: ajustarMargenCosteo
      tags: [web]
      summary: Ajusta el margen de UNA ruta de la cotización y recalcula el precio de esa ruta y el total
      x-issue: '#98 (HU-013.2; entrega el script 0006); por ruta desde #135 (HU-021.8)'
      description: |
        HU-013.2 (ADR-018 §3). Es el endpoint que ejecuta el botón de ajuste de margen y el Confirmar de la acción
        propuesta `ajustar_margen` del asistente.

        **Por ruta (HU-021.8, #135, ADR-019 decisión 6).** El margen es de cada ruta. El cuerpo dice a qué ruta aplica con
        `linea_orden` o `linea_solicitud_id` (los de `rutas[]` de `CosteoCotizacion`). Si la cotización tiene una sola ruta se
        puede omitir; con varias y sin indicarla, 400 `RUTA_REQUERIDA` con `detalle.rutas` (orden, id, origen y destino de cada
        una, sin montos) y nada cambia. Una ruta que no es de la cotización (o un orden y un id de rutas distintas): 400
        `RUTA_INEXISTENTE`. Solo se recalculan esa ruta (`rutas[].precio_final_linea`) y el total (`precio_final`); las demás
        rutas no cambian. La justificación se exige contra el sugerido DE ESA RUTA (`rutas[].margen_sugerido`: SAP TM o, si no
        hay, la política de su línea) y `MargenAjustes.lineaSolicitudId` guarda la ruta ajustada.

        - `margen` es libre entre 0 y 0,99 (fracción: 0.18 = 18 %). Fuera de rango: 400 `AJUSTE_MARGEN_INVALIDO`.
        - `justificacion` es **obligatoria** si `margen` queda por debajo del margen sugerido (`margen_sugerido` del
          costeo: SAP TM con el BP o la política de la línea). Sin ella: 400 `JUSTIFICACION_REQUERIDA`.
        - Solo con precio en la RUTA ajustada (si no, 409 `COSTEO_NO_LISTO`). Decisión del usuario (#135): el ajuste es ruta por ruta
          y las demás rutas pueden seguir en costeo; entonces `precio_final` queda en `null` hasta que todas tengan precio, y el PDF
          sigue exigiendo todas las rutas con precio.
        - **Regla del PDF (ADR-018 §11):** si la cotización ya se envió al cliente (`estado_envio` distinto de
          `sin_enviar`) o tiene resultado, 409 `PDF_YA_ENVIADO` (la `detalle` indica crear la versión `-vN`). Si no, se
          permite aunque haya PDF: el PDF actual queda invalidado (`pdf_url = null`, `pdf_desactualizado = true`, el
          anterior queda en el historial) y se regenera con `POST .../costeo/pdf`.
        - Recalcula con `IClsPrecioService` el `precio_final` y el precio de cada servicio conexo, con el método de
          cálculo de la cotización, respetando la moneda y la TRM ya fijada (`trm_aplicada`, nunca una TRM nueva).
        - Registra el ajuste en `MargenAjustes` (margen sugerido = `margenPolitica`, nuevo margen = `margenAplicado`,
          `diferencia`, usuario y justificación en `motivo`). `origen_margen` pasa a `negociado`. Las métricas de ajustes
          marcan los que quedan por debajo del sugerido.
        - Ajustar al mismo margen vigente responde 200 sin registrar un ajuste nuevo ni invalidar el PDF (idempotente).
        - `If-Match` **obligatorio** (428 `PRECONDICION_REQUERIDA` sin él; 409 `CONFLICTO_CONCURRENCIA` si no coincide).
          Solo el dueño.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
        - $ref: '#/components/parameters/IfMatchObligatorio'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AjusteMargenWeb'
            example:
              margen: 0.12
              justificacion: "Cliente estratégico; competencia cotizó 8 % por debajo."
              linea_orden: 2
      responses:
        '200':
          description: Margen de la ruta ajustado y precios recalculados (esa ruta y el total)
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
