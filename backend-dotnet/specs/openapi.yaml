                    type: string
                    enum: [ok]
                  servicio:
                    type: string
                    example: cotifly-api
                  entorno:
                    type: string
                    example: Development

  /health/ready:
    get:
      operationId: saludListo
      tags: [sistema]
      summary: Readiness (base de datos alcanzable)
      security: []
      responses:
        '200':
          description: Listo
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ready]
        '503':
          description: No disponible
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [unavailable]
                  detalle:
                    type: string

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT HS256, 60 minutos. Claims: `sub` (UUID del usuario en `UsuariosWeb`),
        `jti`, `username`, `rol` (`comercial` | `gerente_comercial`).
    googleChat:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT firmado por Google Chat (RS256).

  parameters:
    Folio:
      name: folio
      in: path
      required: true
      schema:
        type: string
        maxLength: 50
      description: |
        Folio de la cotización (ADR-011): `PCN-[{nitCliente}-]{INICIALES}-DDMMAAAA-{NNN}[-vN]`.
        Se acepta cualquier folio existente (también los heredados del Python, como
        `PCN-23072026`), por eso no se valida con un patrón.
      example: PCN-DG-25092026-001
    DesdeMetricas:
      name: desde
      in: query
      required: false
      description: |
        Primer día del periodo (AAAA-MM-DD, fecha de America/Bogota, incluido). Por defecto el 1 de enero del año en
        curso. El periodo va de `desde` 00:00 a `hasta` 24:00 en Bogotá (UTC−5) y se compara con `createdAt` de la
        versión vigente. Rango máximo de 3 años.
      schema:
        type: string
        format: date
      example: '2026-01-01'
    HastaMetricas:
      name: hasta
      in: query
      required: false
      description: Último día del periodo (AAAA-MM-DD, America/Bogota, incluido). Por defecto hoy.
      schema:
        type: string
        format: date
      example: '2026-09-29'
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        Concurrencia optimista (HU-013, ADR-018). El `ETag` (o `row_version`) que el frontend leyó en
        `GET /web/cotizaciones/{folio}/costeo`, o el `row_version` de la `accion_propuesta` que confirma. Con comillas o
        sin ellas. Si la cotización cambió entretanto responde 409 `CONFLICTO_CONCURRENCIA` sin cambiar nada (el frontend
        recarga el costeo y vuelve a pedir la confirmación). Sin el encabezado no hay control. Rige desde que el script
        `0006` (`rowVersion`, que entrega #98) esté aplicado; antes se acepta y se ignora. Opcional solo en
        `POST .../costeo/pdf`; las mutaciones de la etapa final usan `IfMatchObligatorio`.
      schema:
        type: string
        maxLength: 64
      example: '"AAAAAAAAB9E="'
    IfMatchObligatorio:
      name: If-Match
      in: header
      required: true
      description: |
        Obligatorio en las mutaciones de la etapa final (ADR-018 §8): el `ETag`/`row_version` leído en
        `GET .../costeo` o el `row_version` de la `accion_propuesta`. Sin él responde 428 `PRECONDICION_REQUERIDA`; si no
        coincide, 409 `CONFLICTO_CONCURRENCIA`, sin cambios. Rige desde el script `0006` de #98; antes de aplicarlo el
        servidor no lo exige.
      schema:
        type: string
        maxLength: 64
      example: '"AAAAAAAAB9E="'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Opcional (ADR-018 §8). Clave única por intención del usuario (UUID generado al pulsar Confirmar o el botón). Una
        repetición con la misma clave y el mismo usuario en 24 h devuelve la respuesta guardada de la primera petición sin
        volver a ejecutarla (un doble clic no duplica el conexo en Nexo ni crea `-v2` y `-v3`). La misma clave con otro
        cuerpo responde 400 `ErrorWeb`.
      schema:
        type: string
        minLength: 8
        maxLength: 64
      example: 5f0c1e2a-9b8d-4c7e-a6f5-3d2c1b0a9f8e

  headers:
    ETag:
      description: |
        Versión de la fila de la cotización (`Cotizaciones.rowVersion` en base64, entre comillas). Mismo valor que
        `row_version` del cuerpo. Ausente mientras el script `0006` no esté aplicado.
      schema:
        type: string
      example: '"AAAAAAAAB9E="'

  responses:
    PrecondicionRequerida:
      description: '`PRECONDICION_REQUERIDA`: falta `If-Match` en una mutación de la etapa final (ADR-018 §8)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorNegocio'
          example:
            error:
              codigo: PRECONDICION_REQUERIDA
              mensaje: "Recarga la cotización y vuelve a intentarlo (falta If-Match)."
    Validacion:
      description: Cuerpo inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWeb'
    CredencialesInvalidas:
      description: Identidad no válida o sin rol autorizado (mensaje genérico)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWeb'
          example:
            error: "Credenciales inválidas"
    SesionExpirada:
      description: Falta el token, expiró o fue revocado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWeb'
          example:
            error: "Inicia sesión de nuevo."
    SinPermiso:
      description: El rol del usuario no permite esta operación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWeb'
          example:
            error: "No tienes permiso para esta operación."
    NoEsTuya:
      description: La cotización no existe o pertenece a otro comercial
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWeb'
          example:
            error: "Cotización no encontrada o no es tuya."
    DemasiadasPeticiones:
      description: Límite de peticiones alcanzado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWeb'

  schemas:
    Nulo:
      description: |
        Valor `null` en OAS 3.0.3 (que no tiene `type: 'null'`): un objeto anulable sin propiedades. Se usa como
        alternativa de `oneOf` para campos que pueden no traer valor; el servidor siempre envía `null`, nunca `{}`.
      type: object
      nullable: true
      maxProperties: 0

    ErrorWeb:
      type: object
      required: [error]
      properties:
        error:
          type: string

    ErrorNegocio:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [codigo, mensaje]
          properties:
            codigo:
              type: string
              description: |
                Mismos códigos que el backend Python, más los nuevos del backend .NET:
                `CLIENTE_BUSQUEDA_NO_DISPONIBLE` (HU-005.2: Nexo sin configurar, sin
                respuesta o el comercial sin `idUsuarioExterno`; nunca por "no hubo
                candidatos", que es `200` con `candidatos: []`), `HERRAMIENTA_DESCONOCIDA` (el modelo pidió una
                herramienta inexistente, HU-003.10), `AJUSTE_MARGEN_INVALIDO` (HU-003.4:
                el margen negociado por el comercial está fuera de rango para su método de
                cálculo, es decir negativo o ≥ 1 con `margen`, o el método no es
                `margen`/`markup`), `FOLIO_DUPLICADO` (HU-003.5: ya existe una cotización
                con ese folio; el Python versionaba el folio en silencio, en .NET el folio lo
                genera HU-003.6 y la colisión se informa), `FOLIO_CONSECUTIVO_AGOTADO` (HU-003.6:
                ya se usaron los 999 folios del día de esas iniciales, ADR-011), `CORREO_DESHABILITADO` (HU-003.5:
                `Correo:Habilitado=false`, el valor por defecto; en `/web/*` se responde 503),
                `CORREO_INVALIDO` (HU-003.5: destinatarios `para`/`cc` inválidos o vacíos, asunto
                de más de 300 caracteres o cuerpo de más de 5000; lo devuelve la herramienta
                `enviar_correo`, y en `POST /web/cotizaciones/{folio}/enviar` va como `ErrorWeb` 400),
                `MUNICIPIOS_NO_DISPONIBLE` (`GET /web/municipios`: mismas causas que
                `CLIENTE_BUSQUEDA_NO_DISPONIBLE`, catálogo de Nexo), `CATALOGOS_FLETE_NO_DISPONIBLE`
                (`GET /web/catalogos-flete`: idem, catálogos de tipo de vehículo/carrocería/clase de viaje),
                `ITEMS_REQUERIDOS` (`POST /web/cubicacion`: falta `items` o viene vacío, mismo código que usa Nexo),
                `CUBICACION_NO_DISPONIBLE` (`POST /web/cubicacion`: idem `MUNICIPIOS_NO_DISPONIBLE`, cubicación
                rápida de Nexo) y `CUBICACION_DEMASIADO_GRANDE` (`POST /web/cubicacion`: Nexo/Cubicador rechazó la
                solicitud, típicamente por superar el límite de bultos por solicitud) y `TRM_NO_DISPONIBLE`
                (HU-012.1/HU-012.2, ADR-014: la fuente oficial de la TRM, datos abiertos de la Superintendencia
                Financiera, no respondió o no tiene TRM vigente para el día; no se cotiza en USD y el comercial
                puede reintentar o cotizar en COP). Solo en la herramienta
                `resolver_municipio` del agente (HU-005.13), nunca en `/web/*`: `MUNICIPIO_ARGUMENTO_INVALIDO`
                (`campo` distinto de `origen`/`destino` o `texto` vacío; no se consulta Nexo).
                Costeo en Nexo (ADR-015): `SOLICITUD_COSTEO_INVALIDA` (formulario ampliado fuera de los límites de
                Nexo), `COSTEO_NEXO_NO_DISPONIBLE` (Nexo sin configurar, 5xx, red, circuito abierto o el comercial sin
                `idUsuarioExterno`), `COSTEO_NEXO_TIEMPO_AGOTADO` (Nexo no respondió a tiempo), `COSTEO_NEXO_RECHAZADA`
                (Nexo respondió 4xx; el código de Nexo va en `detalle.motivo`), `COSTEO_NEXO_SOLICITUD_INVALIDA` (Nexo respondió 400 al alta:
                `error_envio` definitivo, no se reintenta), `COSTEO_NO_REINTENTABLE` (409: la
                cotización no está en `error_envio` ni en `pendiente_envio`), `COSTEO_NO_LISTO` (409: la cotización todavía no
                tiene el costeo con margen) y `PDF_YA_GENERADO` (409: ya tiene PDF, se cambia con una versión nueva).
                Resultado en Nexo (HU-005.14), con el mismo código de Nexo: `RESULTADO_YA_DEFINIDO` y
                `COTIZACION_NO_ENTREGADA` (409, sin cambio local) y `USAR_RESULTADO_NEXO` (409: `/seguimiento`
                sobre una cotización que pasó por Nexo).
                `PRECIO_INVALIDO` queda solo para el cálculo de precio.
                Solo en `GET /web/metricas/regional` (HU-010.1, ADR-016): `REGIONAL_NO_ASIGNADA` (409: el gerente no
                tiene regional en `DimEjecutivo` ni en `UsuariosWeb.regional`) y `REGIONAL_NO_DISPONIBLE` (503: la
                conexión a `DimEjecutivo` está configurada pero falla).
                Licitaciones (HU-011, ADR-017): `ARCHIVO_REQUERIDO`, `FORMATO_NO_SOPORTADO`, `EXCEL_INVALIDO` y `EXCEL_SIN_DATOS`
                (mismos códigos que Nexo en `analizar-excel`), `ARCHIVO_DEMASIADO_GRANDE` (más de 10 MB) y
                `LICITACION_INVALIDA` (filas inválidas; el detalle viaja en `ReporteLicitacionInvalida`) y `NEXO_SIN_PERMISO`
                (403 de Nexo al alta o al análisis: el comercial no tiene el rol de Cabina de Fletes; en `/web/*` responde 403).
                Pipeline determinista (HU-013, ADR-018): `CONFLICTO_CONCURRENCIA` (409: el `If-Match` no coincide con la
                versión actual de la cotización; nada cambió), `FOLIO_REQUERIDO` (400: `/web/chat` sin `folio`),
                `ESTADO_NO_PERMITE` (409: el estado de la cotización no admite la operación, por ejemplo con resultado
                registrado o un costeo que no está vencido, entregado ni con error de envío), `JUSTIFICACION_REQUERIDA`
                (400: margen por debajo del sugerido sin justificación; `detalle.margen_sugerido`), `CONEXO_INVALIDO`
                (400: servicio inexistente o inactivo en Nexo, o cantidad fuera de rango; el código de Nexo en
                `detalle.motivo`), `NEXO_NO_DISPONIBLE` (503: Nexo caído, sin configurar o sin respuesta al consultar o
                agregar servicios conexos) y `TEXTOS_COTIZACION_INVALIDOS` (400: asunto o introducción vacíos, largos o con
                URL o correos). `AJUSTE_MARGEN_INVALIDO` también es el margen fuera de 0 a 0,99 en
                `PUT .../costeo/margen`. `PDF_YA_ENVIADO` (409: la cotización ya se envió al cliente o tiene resultado;
                `detalle` trae `accion = nueva_version` con el método, el endpoint y el cuerpo para crear `-vN`),
                `PRECONDICION_REQUERIDA` (428: falta `If-Match`), `LINEA_SIN_COTIZACION_NEXO` (409: la línea no tiene
                todavía línea en la cotización de Nexo) y `TEXTOS_EDITADOS` (409: redactar sobre textos editados por el
                comercial sin `?sobrescribir=true`).
              enum:
                - TARIFA_FUENTE_NO_DISPONIBLE
                - TARIFA_CONFIG_INVALIDA
                - MARGEN_FUENTE_NO_DISPONIBLE
                - MARGEN_LINEA_DESCONOCIDA
                - PRECIO_INVALIDO
                - PDF_PAYLOAD_INVALIDO
                - PDF_RENDER_NO_DISPONIBLE
                - CONFIRMACION_REQUERIDA
                - COTIZACION_NO_ENCONTRADA
                - CORREO_DUPLICADO
                - CORREO_PDF_NO_ENCONTRADO
                - CORREO_ENVIO_FALLIDO
                - AJUSTE_COTIZACION_INVALIDA
                - AJUSTE_ID_INVALIDO
                - AJUSTE_MARGEN_INVALIDO
                - FOLIO_DUPLICADO
                - FOLIO_CONSECUTIVO_AGOTADO
                - CORREO_DESHABILITADO
                - CORREO_INVALIDO
                - CLIENTE_BUSQUEDA_NO_DISPONIBLE
                - HERRAMIENTA_DESCONOCIDA
                - MUNICIPIOS_NO_DISPONIBLE
                - CATALOGOS_FLETE_NO_DISPONIBLE
                - ITEMS_REQUERIDOS
                - CUBICACION_NO_DISPONIBLE
                - CUBICACION_DEMASIADO_GRANDE
                - SOLICITUD_COSTEO_INVALIDA
                - COSTEO_NEXO_NO_DISPONIBLE
                - COSTEO_NEXO_TIEMPO_AGOTADO
                - COSTEO_NEXO_RECHAZADA
                - COSTEO_NEXO_SOLICITUD_INVALIDA
                - COSTEO_NEXO_SOLICITUD_NO_ENCONTRADA
                - COSTEO_NO_REINTENTABLE
                - COSTEO_NO_LISTO
                - PDF_YA_GENERADO
                - RESULTADO_YA_DEFINIDO
                - COTIZACION_NO_ENTREGADA
                - USAR_RESULTADO_NEXO
                - SOLICITUD_NO_TRANSICIONABLE
                - TRM_NO_DISPONIBLE
                - MUNICIPIO_ARGUMENTO_INVALIDO
                - REGIONAL_NO_ASIGNADA
                - REGIONAL_NO_DISPONIBLE
                - ARCHIVO_REQUERIDO
                - FORMATO_NO_SOPORTADO
                - ARCHIVO_DEMASIADO_GRANDE
                - EXCEL_INVALIDO
                - EXCEL_SIN_DATOS
                - LICITACION_INVALIDA
                - NEXO_SIN_PERMISO
                - CONFLICTO_CONCURRENCIA
                - FOLIO_REQUERIDO
                - ESTADO_NO_PERMITE
                - JUSTIFICACION_REQUERIDA
                - CONEXO_INVALIDO
                - NEXO_NO_DISPONIBLE
                - TEXTOS_COTIZACION_INVALIDOS
                - PDF_YA_ENVIADO
                - PRECONDICION_REQUERIDA
                - LINEA_SIN_COTIZACION_NEXO
                - TEXTOS_EDITADOS
                - ERROR_INTERNO
            mensaje:
              type: string
            detalle:
              type: object
              additionalProperties: true

    LoginClienteProRequest:
      type: object
      required: [idUsuario]
      properties:
        idUsuario:
          type: string
          minLength: 1
          maxLength: 100
          description: Identidad a revalidar contra `tblSAPUsuariosApp` (como NOMBREUSUARIO o como ID).
        nombreUsuario:
          type: string
          nullable: true
          maxLength: 200
          description: Informativo (nombre para mostrar). No se usa para identificar a la persona.
        roles:
          type: array
          nullable: true
          items:
            type: string
          description: Informativo. Nunca decide el acceso; el rol se resuelve en el servidor.

    RefreshRequest:
      type: object
      required: [refresh]
      properties:
        refresh:
          type: string
          minLength: 1

    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          nullable: true

    UsuarioSesion:
      type: object
      required: [id, username, email, nombre_completo, rol]
      properties:
        id:
          type: string
          format: uuid
          description: Id interno de Cotifly (`UsuariosWeb.id`, UUID generado por Cotifly).
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        username:
          type: string
        email:
          type: string
        nombre_completo:
          type: string
        rol:
          type: string
          enum: [comercial, gerente_comercial]
        ubicacion:
          type: string
          nullable: true
          description: Regional del usuario (`UsuariosWeb.regional`), que el login llena y refresca desde DimEjecutivo cuando está conectada (#81). null si el usuario no está en esa tabla y nadie la asignó, o si no hay conexión; una falla de DimEjecutivo nunca hace fallar el login.

    LoginResponse:
      type: object
      required: [access, refresh, user, debeCambiarPassword]
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/UsuarioSesion'
        debeCambiarPassword:
          type: boolean
          description: Siempre `false` en la puerta SSO.

    MensajeWeb:
      type: object
      required: [mensaje, sesion_id, folio]
      properties:
        mensaje:
          type: string
          minLength: 1
          maxLength: 8000
        sesion_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{8,64}$'
        folio:
          type: string
          minLength: 1
          maxLength: 50
          description: |
            Obligatorio desde HU-013.6 (#102, ADR-018): la cotización (creada por el formulario) sobre la que trabaja el
            asistente. Sin él, 400 `FOLIO_REQUERIDO`; si no existe o no es del comercial, 404. Mientras HU-013.6 no esté
            implementado el servidor todavía no lo exige.
        cotizacion_origen_id:
          type: string
          format: uuid
          nullable: true
          deprecated: true
          description: |
            Obsoleto desde HU-013.6 (el chat ya no crea cotizaciones ni versiones; la versión nueva sale de
            `POST .../costeo/re-solicitar` con cambios de carga). Opcional. Inicia una nueva versión de una cotización propia (botón "Nueva versión"): el agente
            parte de su cliente, línea y números, y el PDF sale como `{folio base}-vN`. Si no es del
            comercial responde 404 (igual que si no existe); si no es un UUID, 400.
        moneda:
          type: string
          nullable: true
          enum: [COP, USD, null]
          deprecated: true
          description: |
            Obsoleto desde HU-013.6: la moneda se elige en el formulario (`SolicitudCosteoWeb.moneda`, HU-013.7).
            Opcional (HU-012.2, ADR-014). Moneda de la cotización que eligió el comercial en el selector del
            formulario (HU-012.4). Queda en el estado de la conversación y manda sobre lo que diga el modelo;
            si cambia, el precio ya calculado se descarta y se recalcula. Sin el campo, la conversación sigue
            con la moneda que ya tenía (COP por defecto). Con `USD`, el precio se convierte con la TRM oficial
            del día; si la fuente de la TRM falla, el agente responde que no puede cotizar en dólares
            (`TRM_NO_DISPONIBLE` en la herramienta) y el comercial puede reintentar o cotizar en COP.
            Se acepta sin distinguir mayúsculas ni espacios al borde (`usd`, ` Usd ` → `USD`). Otro valor, o una cadena
            vacía, responde 400 (`moneda inválida`).

    SalidaPrecio:
      type: object
      deprecated: true
      required: [precio, costo, margen, metodo, utilidad]
      description: |
        **Obsoleto (ADR-018 §2):** solo lo usa `RespuestaChat.precio`, que desde HU-013.6 siempre es `null`; ninguna
        respuesta del chat vuelve a exponer `costo` ni `utilidad`. No se usa en endpoints nuevos.
        `costo` y `utilidad` siempre en COP (el costeo es en pesos). `precio` va en `moneda`: en COP a pesos
        enteros; en USD, `precio_cop / trm_aplicada` a 2 decimales (half-to-even, HU-012.2, ADR-014).
        `moneda`, `trm_aplicada` y `precio_cop` son opcionales para compatibilidad: si faltan, la moneda es COP.
      properties:
        precio:
          type: number
        costo:
          type: number
        margen:
          type: number
        metodo:
          type: string
          enum: [margen, markup]
        utilidad:
          type: number
        moneda:
          type: string
          enum: [COP, USD]
          description: Moneda de `precio` (COP por defecto).
        trm_aplicada:
          type: number
          description: TRM oficial del día (COP por USD) con que se convirtió el precio; 0 cuando la moneda es COP.
        trm_vigencia_desde:
          type: string
          format: date
          nullable: true
          description: Primer día de vigencia de `trm_aplicada` (Superintendencia Financiera); `null` en COP.
        trm_vigencia_hasta:
          type: string
          format: date
          nullable: true
          description: |
            Último día de vigencia de `trm_aplicada`; `null` en COP. Si el comercial confirma después de esta
            fecha (America/Bogota), el servidor recalcula el precio con la TRM vigente y vuelve a previsualizar.
        precio_cop:
          type: number
          nullable: true
          description: |
            Precio en pesos antes de convertir; `null` cuando la moneda es COP (es el mismo `precio`). En USD es el
            mínimo a pagar (piso, HU-012.3): el valor cotizado originalmente en pesos que imprime el PDF.

    SalidaMargen:
      type: object
      required: [margen, origen, trq_type, anomalo, detalle]
      properties:
        margen:
          type: number
          description: Fracción decimal (0.135 = 13,5 %).
        origen:
          type: string
          enum: [sap_tm, politica_linea, negociado]
        trq_type:
          type: string
          nullable: true
        anomalo:
          type: boolean
        detalle:
          type: string

    SalidaPdf:
      type: object
      required: [cotizacion_id, folio, pdf_url, registrada_en_bd]
      properties:
        cotizacion_id:
          type: string
          format: uuid
        folio:
          type: string
        pdf_url:
          type: string
        registrada_en_bd:
          type: boolean

    RespuestaChat:
      type: object
      required: [texto, herramientas]
      description: |
        Desde HU-013.6 (ADR-018) el asistente responde `{texto, accion_propuesta?}`: `herramientas` y `errores` se
        conservan, y `precio`, `margen` y `pdf` quedan siempre en `null` (se retiran `calcular_precio`, `obtener_margen`,
        `buscar_tarifa` y `generar_pdf` del agente). Se mantienen en el esquema por compatibilidad.
      properties:
        texto:
          type: string
        herramientas:
          type: array
          items:
            type: string
          description: Nombres de las herramientas invocadas en el turno, en orden.
        precio:
          deprecated: true
          description: Obsoleto (siempre `null` desde HU-013.6). Última salida exitosa de la herramienta en el turno, o `null`.
          oneOf:
            - $ref: '#/components/schemas/SalidaPrecio'
            - $ref: '#/components/schemas/Nulo'
        margen:
          deprecated: true
          description: Obsoleto (siempre `null` desde HU-013.6). Última salida exitosa de la herramienta en el turno, o `null`.
          oneOf:
            - $ref: '#/components/schemas/SalidaMargen'
            - $ref: '#/components/schemas/Nulo'
        pdf:
          deprecated: true
          description: Obsoleto (siempre `null` desde HU-013.6). Última salida exitosa de la herramienta en el turno, o `null`.
          oneOf:
            - $ref: '#/components/schemas/SalidaPdf'
            - $ref: '#/components/schemas/Nulo'
        errores:
          type: array
          description: |
            Opcional (HU-012.4, aditivo). Errores de negocio que devolvieron las herramientas del turno, en orden,
            para que el frontend reaccione sin interpretar el texto del agente (por ejemplo `TRM_NO_DISPONIBLE`:
            no hay precio en dólares, ofrecer reintentar o cotizar en COP). Vacío si ninguna herramienta falló.
            Los códigos son los de `ErrorNegocio`.
          items:
            $ref: '#/components/schemas/ErrorHerramienta'
        accion_propuesta:
          description: |
            Opcional (HU-013.6, ADR-018). Acción que el asistente PROPONE en este turno, o `null`. El frontend la muestra
            con su `resumen` y un botón Confirmar; solo al confirmar llama a `metodo` `endpoint` con `cuerpo` tal cual y
            `If-Match: row_version`. La IA nunca la ejecuta. Una propuesta por turno como máximo.
          oneOf:
            - $ref: '#/components/schemas/AccionPropuesta'
            - $ref: '#/components/schemas/Nulo'

    AccionPropuesta:
      type: object
      required: [tipo, metodo, endpoint, cuerpo, resumen, row_version]
      description: |
        Acción final propuesta por el asistente (ADR-018). La arman herramientas deterministas (`proponer_ajuste_margen`,
        `proponer_re_solicitud`, `buscar_servicio_conexo`) con datos validados por el servidor: el LLM elige la acción y
        sus argumentos de texto, pero `endpoint`, `metodo` y `row_version` los pone el servidor, y `cuerpo` se valida
        contra el esquema del endpoint destino antes de responder. Ejecutarla es exactamente igual que usar el botón de la
        pantalla: mismas validaciones y mismos errores.
      properties:
        tipo:
          type: string
          enum: [ajustar_margen, re_solicitar_costeo, agregar_servicios_conexos]
          description: |
            `ajustar_margen` → `PUT /web/cotizaciones/{folio}/costeo/margen` (`AjusteMargenWeb`);
            `re_solicitar_costeo` → `POST /web/cotizaciones/{folio}/costeo/re-solicitar` (`ReSolicitudCosteoWeb`);
            `agregar_servicios_conexos` → `POST /web/cotizaciones/{folio}/costeo/servicios-conexos`
            (`AgregarServiciosConexosWeb`).
        metodo:
          type: string
          enum: [PUT, POST]
        endpoint:
          type: string
          maxLength: 200
          description: Ruta relativa a la URL base de la API, con el folio ya puesto (siempre el folio de la conversación).
          example: /web/cotizaciones/PCN-900555111-DG-05102026-001/costeo/margen
        cuerpo:
          description: Cuerpo JSON exacto que el frontend envía al confirmar.
          oneOf:
            - $ref: '#/components/schemas/AjusteMargenWeb'
            - $ref: '#/components/schemas/ReSolicitudCosteoWeb'
            - $ref: '#/components/schemas/AgregarServiciosConexosWeb'
        resumen:
          type: string
          maxLength: 300
          description: |
            Texto legible para el botón de confirmación ("Ajustar el margen de 15 % a 18 %: el precio pasa de 3.000.000
            a 3.109.756 COP"). Lo arma el SERVIDOR con plantilla y valores calculados por código (`IClsPrecioService`) al
            recibir la propuesta; el LLM nunca lo escribe ni ve esos montos (ADR-018 §2b).
        row_version:
          type: string
          nullable: true
          description: |
            Versión de la cotización que vio el asistente al proponer; va en `If-Match` al confirmar. Si la cotización
            cambió, el endpoint responde 409 `CONFLICTO_CONCURRENCIA` y la propuesta se descarta. `null` mientras el
            script `0006` (#98) no esté aplicado.

    ErrorHerramienta:
      type: object
      required: [herramienta, codigo]
      properties:
        herramienta:
          type: string
          description: Nombre de la herramienta (`calcular_precio`, `registrar_ajuste_margen`...).
        codigo:
          type: string
          description: Código de `ErrorNegocio` (ej. `TRM_NO_DISPONIBLE`).

    RespuestaChatError:
      type: object
      required: [texto, error]
      properties:
        texto:
          type: string
        error:
          type: boolean
          enum: [true]

    CotizacionResumen:
      type: object
      required: [id, folio, version, moneda, estado_envio]
      properties:
        id:
          type: string
          format: uuid
          description: Se usa en `GET /web/cotizaciones/{id}/nueva-version`.
        folio:
          type: string
        version:
          type: integer
          description: 1 para la original; la tabla muestra "v2", "v3", etc.
        nit_cliente:
          type: string
          nullable: true
          description: Se usa en `GET /web/clientes/{nit}/destinatarios-previos`.
        origen_cliente:
          type: string
          nullable: true
          enum: [cliente, prospecto, null]
        origen_margen:
          type: string
          nullable: true
          enum: [sap_tm, politica_linea, negociado, null]
          description: '`negociado` = ajuste manual del comercial (badge "Ajuste fuera de política").'
        cliente:
          type: string
          nullable: true
        linea_negocio:
          type: string
          nullable: true
        precio_final:
          type: number
          nullable: true
        margen_aplicado:
          type: number
          nullable: true
        moneda:
          type: string
          example: COP
        trm_aplicada:
          type: number
          description: |
            TRM con que se convirtió el precio (HU-012.2); 0 cuando la moneda es COP. En USD es la referencia del
            ajuste diario en pesos. El mínimo a pagar (piso, HU-012.3) no es `precio_final × trm_aplicada`: es el valor
            cotizado originalmente en pesos, el precio en pesos del costo y el margen aplicado (`precio_cop` de `SalidaPrecio`).
        estado_costeo:
          type: string
          nullable: true
          enum: [pendiente_envio, error_envio, pendiente_costeo, autocosteo, entregada, descartada, costeo_vencido, null]
          description: |
            Estado del costeo en Nexo (ADR-015). `null` = la cotización no pasa por Nexo (chat con costo manual).
            `pendiente_envio` y `error_envio` = Nexo todavía no la tiene (ver `motivo_estado_costeo`; se puede
            reintentar); `pendiente_costeo` = alguna línea sin flete ("en costeo"); `autocosteo` = todas las líneas con
            flete y la cotización de Nexo en borrador; `entregada` = Nexo la entregó; `descartada` = Nexo descartó la
            solicitud; `costeo_vencido` = se agotó el tiempo máximo del polling sin costeo. "Costeado" = `autocosteo`
            o `entregada` con `precio_final`.
        motivo_estado_costeo:
          type: string
          nullable: true
          description: Motivo legible del estado del costeo (error al enviar, rechazo de Nexo, costeo vencido...).
        estado_envio:
          type: string
          enum: [sin_enviar, enviada, reenviada]
        ganada:
          type: boolean
          nullable: true
        motivo_rechazo:
          type: string
          nullable: true
        pdf_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true

    MisCotizaciones:
      type: object
      required: [total, cotizaciones]
      properties:
        total:
          type: integer
        cotizaciones:
          type: array
          items:
            $ref: '#/components/schemas/CotizacionResumen'

    EnvioWeb:
      type: object
      required: [para]
      properties:
        para:
          type: array
          minItems: 1
          items:
            type: string
            format: email
            maxLength: 320
        cc:
          type: array
          items:
            type: string
            format: email
            maxLength: 320
          default: []
        asunto:
          type: string
          nullable: true
          maxLength: 300
          description: Por defecto "Cotización {folio} — Botero Soto".
        cuerpo:
          type: string
          nullable: true
          maxLength: 5000

    RespuestaEnvio:
      type: object
      required: [enviado]
      properties:
        enviado:
          type: boolean
          enum: [true]
        message_id:
          type: string
          nullable: true

    SeguimientoWeb:
      type: object
      properties:
        ganada:
          type: boolean
          nullable: true
        motivo_rechazo:
          type: string
          nullable: true
          maxLength: 2000

    LineaNegocio:
      type: object
      required: [id, linea_negocio, margen, metodo_calculo, is_active]
      properties:
        id:
          type: integer
        linea_negocio:
          type: string
        margen:
          type: number
        metodo_calculo:
          type: string
          enum: [margen, markup]
        is_active:
          type: boolean
        updated_at:
          type: string
          format: date-time
          nullable: true

    ActualizarLineaNegocio:
      type: object
      required: [margen, metodo_calculo, is_active]
      properties:
        margen:
          type: number
          minimum: 0
          maximum: 0.99
        metodo_calculo:
          type: string
          enum: [margen, markup]
        is_active:
          type: boolean

    PeriodoMetricas:
      type: object
      description: Periodo efectivamente aplicado (con los valores por defecto ya resueltos).
      required: [desde, hasta, zona_horaria]
      properties:
        desde:
          type: string
          format: date
        hasta:
          type: string
          format: date
        zona_horaria:
          type: string
          example: America/Bogota

    IndicadoresMetricas:
      type: object
      description: |
        KPIs de un conjunto de cotizaciones (una por cadena de versiones, periodo por su primera creación). Definición
        exacta de cada campo en el tag `metricas` y en ADR-016. Montos en COP con 2 decimales; fracciones de 0 a 1.
        Siempre se cumple `cantidad = ganadas + perdidas + sin_resultado + pendientes_por_cotizar`.
      required: [cantidad, versiones, ganadas, perdidas, sin_resultado, pendientes_por_cotizar, conversion,
                 conversion_sobre_cerradas, margen_promedio, costeo_total, costeo_ganadas, valor_cotizado_cop,
                 valor_ganado_cop, ganancias, cotizaciones_usd, tiempo_promedio_cotizacion_horas,
                 desviacion_promedio_margen, desviacion_promedio_margen_abs, ajustes_margen, deadline_vencidas]
      properties:
        cantidad:
          type: integer
          description: Cadenas de versiones cuya primera creación cae en el periodo, en cualquier estado.
        versiones:
          type: integer
          description: Filas (todas las versiones) de esas cadenas (referencia; no entra en ningún cociente).
        ganadas:
          type: integer
          description: Resultado ganada (el más reciente de la cadena).
        perdidas:
          type: integer
          description: Resultado perdida (el más reciente de la cadena).
        sin_resultado:
          type: integer
          description: Con precio y sin resultado (pendientes por marcar ganada o perdida).
        pendientes_por_cotizar:
          type: integer
          description: Sin precio y sin resultado (esperando el costeo o el precio).
        conversion:
          type: number
          nullable: true
          description: ganadas / cantidad (backlog HU-010). `null` si cantidad es 0.
        conversion_sobre_cerradas:
          type: number
          nullable: true
          description: ganadas / (ganadas + perdidas). `null` si no hay ninguna cerrada.
        margen_promedio:
          type: number
          nullable: true
          description: Promedio simple de `margenAplicado` (fracción). `null` si ninguna lo tiene.
        costeo_total:
          type: number
          description: SUM(`costo`) en COP de todas (el costo nunca se convierte).
        costeo_ganadas:
          type: number
          description: SUM(`costo`) en COP de las ganadas.
        valor_cotizado_cop:
          type: number
          description: SUM(`valor_cop`), con `valor_cop = round(precioFinal × trmAplicada, 2)` en USD (no es el `precio_cop` de ADR-014).
        valor_ganado_cop:
          type: number
          description: SUM(`valor_cop`) de las ganadas. Valor cotizado, no recaudado; en la UI "Valor ganado (COP)".
        ganancias:
          type: number
          description: SUM(`valor_cop` − `costo`) de las ganadas con precio y costo (= `valor_ganado_cop − costeo_ganadas` si todas tienen precio y costo y ninguna en USD tiene TRM 0).
        cotizaciones_usd:
          type: integer
          description: Cotizaciones del universo en una moneda distinta de COP.
        tiempo_promedio_cotizacion_horas:
          type: number
          nullable: true
          description: Promedio de (`costeoListoAt` − `createdAt` de la versión vigente) en horas (2 decimales), sin las filas con `costeoListoAt` anterior a `createdAt`. `null` si no queda ninguna.
        desviacion_promedio_margen:
          type: number
          nullable: true
          description: Promedio de `MargenAjustes.diferencia` (con signo) de la versión vigente de cada cotización (4 decimales). `null` sin ajustes.
        desviacion_promedio_margen_abs:
          type: number
          nullable: true
          description: Promedio del valor absoluto de esas diferencias (4 decimales). `null` sin ajustes.
        ajustes_margen:
          type: integer
          description: Ajustes de margen (`MargenAjustes`) de la versión vigente de cada cotización.
        deadline_vencidas:
          type: integer
          nullable: true
          description: Sin resultado y con `deadline` anterior al momento de la consulta. `null` si el esquema no tiene la columna `deadline` (script 0004).

    PuntoSerieMensual:
      type: object
      description: |
        Un mes (America/Bogota, por la primera creación de la cadena) del periodo, para la línea de tiempo. La serie trae todos los meses del periodo en orden,
        también los que no tienen cotizaciones (en 0). Mismo universo y mismas definiciones que `IndicadoresMetricas`.
      required: [mes, cantidad, ganadas, perdidas, valor_cotizado_cop, valor_ganado_cop]
      properties:
        mes:
          type: string
          pattern: '^\d{4}-\d{2}$'
          example: '2026-09'
        cantidad:
          type: integer
        ganadas:
          type: integer
        perdidas:
          type: integer
        valor_cotizado_cop:
          type: number
        valor_ganado_cop:
          type: number

    MetricaCiudad:
      type: object
      description: |
        Cotizaciones con ese municipio (texto del catálogo de Nexo, tal como se guardó en la cabecera de la cotización; una
        solicitud de varias líneas cuenta solo la ciudad de la cabecera).
      required: [ciudad, cantidad, ganadas, valor_cotizado_cop, valor_ganado_cop]
      properties:
        ciudad:
          type: string
        cantidad:
          type: integer
        ganadas:
          type: integer
        valor_cotizado_cop:
          type: number
        valor_ganado_cop:
          type: number
          description: Valor cotizado de las ganadas en COP (no dinero recaudado; en la UI "Valor ganado (COP)").

    ConcentracionCiudades:
      type: object
      description: |
        Concentración por municipio para el mapa (HU-010.3). `por_destino` es la vista principal (dónde se entrega);
        `por_origen` se da como complemento. Ordenadas por `cantidad` descendente y luego por nombre. Las cotizaciones del
        chat no guardan ciudades y cuentan en `sin_destino`/`sin_origen`.
      required: [disponible, por_destino, por_origen, sin_destino, sin_origen]
      properties:
        disponible:
          type: boolean
          description: '`false` mientras el esquema no tenga las columnas `origen`/`destino` (script 0004 sin aplicar).'
        por_destino:
          type: array
          items:
            $ref: '#/components/schemas/MetricaCiudad'
        por_origen:
          type: array
          items:
            $ref: '#/components/schemas/MetricaCiudad'
        sin_destino:
          type: integer
        sin_origen:
          type: integer

    MetricasComercial:
      type: object
      required: [periodo, usuario_id, indicadores, serie_mensual]
      properties:
        periodo:
          $ref: '#/components/schemas/PeriodoMetricas'
        usuario_id:
          type: string
          format: uuid
        indicadores:
          $ref: '#/components/schemas/IndicadoresMetricas'
        serie_mensual:
          type: array
          items:
            $ref: '#/components/schemas/PuntoSerieMensual'

    ComercialRegional:
      type: object
      description: |
        Un usuario de la regional con su rol y sus indicadores del periodo (para el selector del tablero). El gerente
        aparece también en la lista.
      required: [usuario_id, nombre_usuario, nombre_completo, rol, indicadores]
      properties:
        usuario_id:
          type: string
          format: uuid
        nombre_usuario:
          type: string
          nullable: true
        nombre_completo:
          type: string
          nullable: true
        rol:
          type: string
          nullable: true
          description: "`comercial`, `gerente_comercial` o `null`: rol interno asignado en `UsuariosRoles` (se fija en el login SSO, ADR-009); `null` si no tiene asignación activa."
        indicadores:
          $ref: '#/components/schemas/IndicadoresMetricas'

    MetricasRegional:
      type: object
      required: [periodo, regional, fuente_regional, usuario_id, indicadores, lineas_negocio_activas, comerciales,
                 serie_mensual, concentracion_ciudades]
      properties:
        periodo:
          $ref: '#/components/schemas/PeriodoMetricas'
        regional:
          type: string
          description: Regional del gerente autenticado.
        fuente_regional:
          type: string
          enum: [dim_ejecutivo, usuarios_web]
          description: De dónde salió la regional (`DWCubosEBSSAP.DimEjecutivo` o `UsuariosWeb.regional`).
        usuario_id:
          type: string
          format: uuid
          nullable: true
          description: Comercial filtrado, o `null` si los indicadores son de toda la regional.
        indicadores:
          $ref: '#/components/schemas/IndicadoresMetricas'
        lineas_negocio_activas:
          type: integer
          description: Líneas de `MargenesPolitica` con `isActive = 1` (no depende del periodo ni de la regional).
        comerciales:
          type: array
          description: Todos los usuarios de la regional (también el gerente), ordenados por nombre, aunque se filtre por `usuario_id`.
          items:
            $ref: '#/components/schemas/ComercialRegional'
        serie_mensual:
          type: array
          items:
            $ref: '#/components/schemas/PuntoSerieMensual'
        concentracion_ciudades:
          $ref: '#/components/schemas/ConcentracionCiudades'

    ActividadComercial:
      type: object
      description: |
        Fila de la vista `vActividadPorComercial` más `nombre_completo` (JOIN con
        `UsuariosWeb`). `num_cotizaciones_enviadas` debe contar `enviada` y `reenviada`.
      required: [usuario_id, num_cotizaciones, num_cotizaciones_enviadas, num_ajustes]
      properties:
        usuario_id:
          type: string
          format: uuid
        nombre_completo:
          type: string
          nullable: true
        num_cotizaciones:
          type: integer
        num_cotizaciones_enviadas:
          type: integer
        num_ajustes:
          type: integer
        ultima_cotizacion:
          type: string
          format: date-time
          nullable: true

    AjustesMargenComercial:
      type: object
      description: Fila de la vista `vAjustesMargenPorComercial` más `nombre_completo` (JOIN con `UsuariosWeb`).
      required: [usuario_id, num_ajustes]
      properties:
        usuario_id:
          type: string
          format: uuid
          nullable: true
        nombre_completo:
          type: string
          nullable: true
        linea_negocio:
          type: string
          nullable: true
        num_ajustes:
          type: integer
        diferencia_promedio:
          type: number
          nullable: true
        diferencia_min:
          type: number
          nullable: true
        diferencia_max:
          type: number
          nullable: true
        ultimo_ajuste:
          type: string
          format: date-time
          nullable: true
        num_ajustes_bajo_sugerido:
          type: integer
          description: |
            HU-013.2 (script 0006). Ajustes que quedaron por debajo del margen sugerido (`diferencia` negativa: margen
            aplicado menor que el sugerido, que es `MargenAjustes.margenPolitica`). Esos ajustes exigen justificación.

    TelefonoComercial:
      type: object
      required: [telefono]
      properties:
        telefono:
          type: string
          nullable: true
          pattern: '^\+?[0-9 ]{7,20}$'

    Destinatarios:
      type: object
      required: [para, cc]
      properties:
        para:
          type: array
          items:
            type: string
            format: email
        cc:
          type: array
          items:
            type: string
            format: email

    ResultadoBusquedaClientes:
      type: object
      required: [exacta, candidatos]
      properties:
        exacta:
          type: boolean
          description: Único candidato encontrado (ver descripción del endpoint sobre el criterio provisional).
        candidatos:
          type: array
          items:
            $ref: '#/components/schemas/ClienteEncontrado'

    ClienteEncontrado:
      type: object
      required: [nit_cliente, nombre, origen_cliente]
      properties:
        nit_cliente:
          type: string
        nombre:
          type: string
        origen_cliente:
          type: string
          enum: [cliente, prospecto]
        bp:
          type: string
          nullable: true
          description: BP de Nexo; nunca se muestra al comercial (solo se usa internamente para consultar SAP TM).

    Municipio:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          description: Id del municipio en el catálogo de Nexo.
        codigo_dane:
          type: string
          nullable: true
        municipio:
          type: string
          nullable: true
        departamento:
          type: string
          nullable: true
        pais:
          type: string
          nullable: true

    OpcionCatalogo:
      type: object
      required: [valor, etiqueta]
      properties:
        valor:
          type: string
          description: Valor interno de la opción (el que viaja en la cotización).
        etiqueta:
          type: string
          description: Texto legible para mostrar en el formulario.

    CatalogosFlete:
      type: object
      required: [tipos_vehiculo, tipos_carroceria, clases_viaje]
      properties:
        tipos_vehiculo:
          type: array
          items:
            $ref: '#/components/schemas/OpcionCatalogo'
        tipos_carroceria:
          type: array
          items:
            $ref: '#/components/schemas/OpcionCatalogo'
        clases_viaje:
          type: array
          items:
            $ref: '#/components/schemas/OpcionCatalogo'

    ResultadoWeb:
      type: object
      required: [resultado]
      properties:
        resultado:
          type: string
          enum: [ganada, perdida]
        motivo:
          type: string
          nullable: true
          maxLength: 100
          description: Se guarda en `motivo_rechazo` y se envía a Nexo.
        comentario:
          type: string
          nullable: true
          maxLength: 500
          description: Solo se reenvía a Nexo; no se guarda en Cotifly.

    ServicioConexoCosteo:
      type: object
      required: [id, nombre, categoria, cantidad, precio, incluido]
      description: Servicio conexo del costeo de Nexo con su precio (margen de la cotización). Nunca trae el costo.
      properties:
        id:
          type: string
        nombre:
          type: string
          nullable: true
        categoria:
          type: string
          example: logistico
        cantidad:
          type: number
        precio:
          type: number
        incluido:
          type: boolean
          description: Si va en el precio y en el PDF (por defecto sí).

    CosteoCotizacion:
      type: object
      required: [folio, estado_costeo, motivo_estado_costeo, costeo_listo_at, precio_final, margen_aplicado, moneda, servicios_conexos, pdf_url]
      properties:
        folio:
          type: string
        estado_costeo:
          type: string
          nullable: true
          enum: [pendiente_envio, error_envio, pendiente_costeo, autocosteo, entregada, descartada, costeo_vencido, null]
        motivo_estado_costeo:
          type: string
          nullable: true
        costeo_listo_at:
          type: string
          format: date-time
          nullable: true
        precio_final:
          type: number
          nullable: true
          description: Precio al cliente (costeo de Nexo con margen). `null` mientras no haya costeo.
        margen_aplicado:
          type: number
          nullable: true
        moneda:
          type: string
          example: COP
        servicios_conexos:
          type: array
          items:
            $ref: '#/components/schemas/ServicioConexoCosteo'
        pdf_url:
          type: string
          nullable: true
        margen_sugerido:
          type: number
          nullable: true
          description: |
            HU-013.2. Margen sugerido de la cotización (fracción): SAP TM con el BP o la política de la línea, resuelto al
            enviarla. Tras el primer ajuste del comercial queda guardado en `margenPolitica` (y en cada fila de
            `MargenAjustes`). Por debajo de él, el ajuste exige justificación.
        origen_margen:
          type: string
          nullable: true
          enum: [sap_tm, politica_linea, negociado, null]
          description: HU-013.2. `negociado` cuando el comercial ajustó el margen.
        trm_aplicada:
          type: number
          description: HU-013.7. TRM fijada al crear la cotización (COP por USD); 0 en COP.
        textos:
          description: HU-013.5. Asunto e introducción guardados para el PDF, o `null` si todavía no hay (el PDF usa los estándar).
          oneOf:
            - $ref: '#/components/schemas/TextosCotizacion'
            - $ref: '#/components/schemas/Nulo'
        pdf_desactualizado:
          type: boolean
          description: |
            ADR-018 §11. `true` si una acción posterior (margen, conexos, textos, re-solicitud) invalidó el PDF: `pdf_url`
            queda en `null` y el comercial lo regenera con `POST .../costeo/pdf`. El PDF anterior queda en el historial.
        row_version:
          type: string
          nullable: true
          description: '#98 (script 0006). Mismo valor que el encabezado `ETag`; va en `If-Match`. `null` sin el `0006`.'

    SeleccionServiciosConexos:
