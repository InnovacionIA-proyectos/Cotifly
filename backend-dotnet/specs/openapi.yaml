            mensaje:
              type: string
            detalle:
              type: object
              additionalProperties: true

    LoginClienteProRequest:
      type: object
      required: [idUsuario]
      properties:
        idUsuario:
          type: string
          minLength: 1
          maxLength: 100
          description: Identidad a revalidar contra `tblSAPUsuariosApp` (como NOMBREUSUARIO o como ID).
        nombreUsuario:
          type: string
          nullable: true
          maxLength: 200
          description: Informativo (nombre para mostrar). No se usa para identificar a la persona.
        roles:
          type: array
          nullable: true
          items:
            type: string
          description: Informativo. Nunca decide el acceso; el rol se resuelve en el servidor.

    RefreshRequest:
      type: object
      required: [refresh]
      properties:
        refresh:
          type: string
          minLength: 1

    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          nullable: true

    UsuarioSesion:
      type: object
      required: [id, username, email, nombre_completo, rol]
      properties:
        id:
          type: string
          format: uuid
          description: Id interno de Cotifly (`UsuariosWeb.id`, UUID generado por Cotifly).
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        username:
          type: string
        email:
          type: string
        nombre_completo:
          type: string
        rol:
          type: string
          enum: [comercial, gerente_comercial, director]
        ubicacion:
          type: string
          nullable: true
          description: Regional del usuario (`UsuariosWeb.regional`), que el login llena y refresca desde DimEjecutivo cuando está conectada (#81). null si el usuario no está en esa tabla y nadie la asignó, o si no hay conexión; una falla de DimEjecutivo nunca hace fallar el login.

    ElegirRolRequest:
      type: object
      required: [ticket, rol]
      description: HU-040.2 (#230). El ticket de `EleccionRolRequerida` y el código del rol elegido.
      properties:
        ticket:
          type: string
          minLength: 1
          maxLength: 4096
          description: '`ticketEleccion` del login. Opaco para el frontend; de un solo uso; vence en 5 minutos.'
        rol:
          type: string
          enum: [comercial, gerente_comercial, director]
          description: Uno de los `roles[].codigo` que ofreció el login.

    EleccionRolRequerida:
      type: object
      required: [requiereEleccionRol, ticketEleccion, ticketExpiraAt, roles, user]
      description: |
        HU-040.2 (#230, ADR-025): respuesta 200 del login cuando la persona tiene varios roles. Sin tokens: el
        frontend muestra `roles` y llama a `POST /api/auth/elegir-rol` antes de `ticketExpiraAt`.
      properties:
        requiereEleccionRol:
          type: boolean
          description: Siempre `true`. Es lo que distingue esta respuesta de `LoginResponse`.
        ticketEleccion:
          type: string
          description: Ticket de un solo uso para `POST /api/auth/elegir-rol`. No es un access token (no abre ningún endpoint).
        ticketExpiraAt:
          type: string
          format: date-time
          description: Vencimiento del ticket (5 minutos después del login).
        roles:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/RolDisponible'
          description: Roles entre los que elige, en el orden comercial, gerente_comercial, director.
        user:
          $ref: '#/components/schemas/UsuarioEleccion'

    RolDisponible:
      type: object
      required: [codigo, descripcion]
      properties:
        codigo:
          type: string
          enum: [comercial, gerente_comercial, director]
        descripcion:
          type: string
          description: Nombre para mostrar (catálogo de roles de Cotifly).

    UsuarioEleccion:
      type: object
      required: [id, username, nombre_completo]
      description: Quién está eligiendo (todavía sin rol).
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        nombre_completo:
          type: string

    LoginResponse:
      type: object
      required: [access, refresh, user, debeCambiarPassword]
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/UsuarioSesion'
        debeCambiarPassword:
          type: boolean
          description: Siempre `false` en la puerta SSO.

    MensajeWeb:
      type: object
      required: [mensaje, sesion_id, folio]
      properties:
        mensaje:
          type: string
          minLength: 1
          maxLength: 8000
        sesion_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{8,64}$'
        folio:
          type: string
          minLength: 1
          maxLength: 50
          description: |
            Obligatorio desde HU-013.6 (#102, ADR-018): la cotización (creada por el formulario) sobre la que trabaja el
            asistente. Sin él, 400 `FOLIO_REQUERIDO`; si no existe o no es del comercial, 404.
        cotizacion_origen_id:
          type: string
          format: uuid
          nullable: true
          deprecated: true
          description: |
            Obsoleto desde HU-013.6 y sin efecto desde HU-013.9 (#105): se acepta y se ignora (el chat ya no crea
            cotizaciones ni versiones; la versión nueva sale de `POST .../costeo/re-solicitar` con cambios de carga).
            Comportamiento histórico del agente legado: inicia una nueva versión de una cotización propia (botón "Nueva versión"): el agente
            parte de su cliente, línea y números, y el PDF sale como `{folio base}-vN`. Si no es del
            comercial responde 404 (igual que si no existe); si no es un UUID, 400.
        moneda:
          type: string
          nullable: true
          enum: [COP, USD, null]
          deprecated: true
          description: |
            Obsoleto desde HU-013.6 y sin efecto desde HU-013.9 (#105): se acepta y se ignora; la moneda se elige en el
            formulario (`SolicitudCosteoWeb.moneda`, HU-013.7). Comportamiento histórico del agente legado (HU-012.2, ADR-014): moneda de la cotización que eligió el comercial en el selector del
            formulario (HU-012.4). Queda en el estado de la conversación y manda sobre lo que diga el modelo;
            si cambia, el precio ya calculado se descarta y se recalcula. Sin el campo, la conversación sigue
            con la moneda que ya tenía (COP por defecto). Con `USD`, el precio se convierte con la TRM del día
            (DolarApi con respaldo en la Superintendencia Financiera, ADR-014); si ninguna fuente responde, el agente
            responde que no puede cotizar en dólares
            (`TRM_NO_DISPONIBLE` en la herramienta) y el comercial puede reintentar o cotizar en COP.
            Se acepta sin distinguir mayúsculas ni espacios al borde (`usd`, ` Usd ` → `USD`). Otro valor, o una cadena
            vacía, responde 400 (`moneda inválida`).

    SalidaPrecio:
      type: object
      deprecated: true
      required: [precio, costo, margen, metodo, utilidad]
      description: |
        **Obsoleto (ADR-018 §2):** solo lo usa `RespuestaChat.precio`, que desde HU-013.6 siempre es `null`; ninguna
        respuesta del chat vuelve a exponer `costo` ni `utilidad`. No se usa en endpoints nuevos.
        `costo` y `utilidad` siempre en COP (el costeo es en pesos). `precio` va en `moneda`: en COP a pesos
        enteros; en USD, `precio_cop / trm_aplicada` a 2 decimales (half-to-even, HU-012.2, ADR-014).
        `moneda`, `trm_aplicada`, `precio_cop` y `trm_fuente` son opcionales para compatibilidad: si faltan, la moneda es COP.
      properties:
        precio:
          type: number
        costo:
          type: number
        margen:
          type: number
        metodo:
          type: string
          enum: [margen, markup]
        utilidad:
          type: number
        moneda:
          type: string
          enum: [COP, USD]
          description: Moneda de `precio` (COP por defecto).
        trm_aplicada:
          type: number
          description: TRM del día (COP por USD) con que se convirtió el precio; 0 cuando la moneda es COP.
        trm_vigencia_desde:
          type: string
          format: date
          nullable: true
          description: |
            Primer día de vigencia de `trm_aplicada`; `null` en COP. Con la Superintendencia Financiera es el inicio
            de su rango de vigencia; con DolarApi (no publica rangos) es el día de la cotización.
        trm_vigencia_hasta:
          type: string
          format: date
          nullable: true
          description: |
            Último día de vigencia de `trm_aplicada`; `null` en COP. Si el comercial confirma después de esta
            fecha (America/Bogota), el servidor recalcula el precio con la TRM vigente y vuelve a previsualizar.
        precio_cop:
          type: number
          nullable: true
          description: |
            Precio en pesos antes de convertir; `null` cuando la moneda es COP (es el mismo `precio`). Desde el
            2026-10-05 el PDF en USD ya no imprime este valor (nota de TRM mínima, HU-012.3).
        trm_fuente:
          type: string
          nullable: true
          enum: [dolarapi, superfinanciera, null]
          description: |
            Fuente de `trm_aplicada` (ADR-014, auditoría): `dolarapi` (principal) o `superfinanciera` (respaldo o
            proveedor configurado); `null` en COP.

    SalidaMargen:
      type: object
      required: [margen, origen, trq_type, anomalo, detalle]
      properties:
        margen:
          type: number
          description: Fracción decimal (0.135 = 13,5 %).
        origen:
          type: string
          enum: [sap_tm, politica_linea, negociado]
        trq_type:
          type: string
          nullable: true
        anomalo:
          type: boolean
        detalle:
          type: string

    SalidaPdf:
      type: object
      required: [cotizacion_id, folio, pdf_url, registrada_en_bd]
      properties:
        cotizacion_id:
          type: string
          format: uuid
        folio:
          type: string
        pdf_url:
          type: string
        registrada_en_bd:
          type: boolean
        aviso_seguro:
          description: |
            HU-045.3 (#265). Solo en `POST .../costeo/pdf`: las rutas con el seguro de la mercancía marcado sin valor de la mercancía (el
            PDF salió sin su fila; no bloquea). `null` si no hay ninguna (y siempre en el PDF del chat).
          oneOf:
            - $ref: '#/components/schemas/AvisoSeguro'
            - $ref: '#/components/schemas/Nulo'

    AvisoSeguro:
      type: object
      required: [codigo, mensaje, rutas]
      description: |
        HU-045.3 (#265, decisión del usuario del 2026-11-09). Aviso, no error: rutas que cotizan con el seguro de la mercancía marcado
        (`incluye_seguro = true`) y SIN valor de la mercancía (una edición quitó el valor). Su seguro no suma al precio ni sale en el PDF.
        Mostrar `mensaje` y resaltar las rutas: el comercial edita el valor de la mercancía (en una versión nueva si ya está finalizada) o
        quita el seguro.
      properties:
        codigo:
          type: string
          description: Siempre `SEGURO_SIN_VALOR_MERCANCIA` (el código del catálogo de errores; aquí es un aviso).
        mensaje:
          type: string
        rutas:
          type: array
          items:
            $ref: '#/components/schemas/RutaAvisoSeguro'

    RutaAvisoSeguro:
      type: object
      required: [linea_orden, linea_solicitud_id]
      properties:
        linea_orden:
          type: integer
        linea_solicitud_id:
          type: string
          format: uuid

    RespuestaChat:
      type: object
      required: [texto, herramientas]
      description: |
        Desde HU-013.6 (ADR-018) el asistente responde `{texto, accion_propuesta?}`: `herramientas` y `errores` se
        conservan, y `precio`, `margen` y `pdf` quedan siempre en `null` (se retiran `calcular_precio`, `obtener_margen`,
        `buscar_tarifa` y `generar_pdf` del agente; el agente legado se borró en HU-013.9, #105). Se mantienen en el esquema,
        deprecated, por compatibilidad con el frontend que todavía los lee; se podrán quitar cuando el frontend deje de leerlos.
      properties:
        texto:
          type: string
        herramientas:
          type: array
          items:
            type: string
          description: Nombres de las herramientas invocadas en el turno, en orden.
        precio:
          deprecated: true
          description: Obsoleto (siempre `null` desde HU-013.6). Última salida exitosa de la herramienta en el turno, o `null`.
          oneOf:
            - $ref: '#/components/schemas/SalidaPrecio'
            - $ref: '#/components/schemas/Nulo'
        margen:
          deprecated: true
          description: Obsoleto (siempre `null` desde HU-013.6). Última salida exitosa de la herramienta en el turno, o `null`.
          oneOf:
            - $ref: '#/components/schemas/SalidaMargen'
            - $ref: '#/components/schemas/Nulo'
        pdf:
          deprecated: true
          description: Obsoleto (siempre `null` desde HU-013.6). Última salida exitosa de la herramienta en el turno, o `null`.
          oneOf:
            - $ref: '#/components/schemas/SalidaPdf'
            - $ref: '#/components/schemas/Nulo'
        errores:
          type: array
          description: |
            Opcional (HU-012.4, aditivo). Errores de negocio que devolvieron las herramientas del turno, en orden,
            para que el frontend reaccione sin interpretar el texto del agente (por ejemplo `TRM_NO_DISPONIBLE`:
            no hay precio en dólares, ofrecer reintentar o cotizar en COP). Vacío si ninguna herramienta falló.
            Los códigos son los de `ErrorNegocio`.
          items:
            $ref: '#/components/schemas/ErrorHerramienta'
        accion_propuesta:
          description: |
            Opcional (HU-013.6, ADR-018). Acción que el asistente PROPONE en este turno, o `null`. El frontend la muestra
            con su `resumen` y un botón Confirmar; solo al confirmar llama a `metodo` `endpoint` con `cuerpo` tal cual y
            `If-Match: row_version`. La IA nunca la ejecuta. Una propuesta por turno como máximo.
          oneOf:
            - $ref: '#/components/schemas/AccionPropuesta'
            - $ref: '#/components/schemas/Nulo'

    AccionPropuesta:
      type: object
      required: [tipo, metodo, endpoint, cuerpo, resumen, row_version]
      description: |
        Acción final propuesta por el asistente (ADR-018). La arman herramientas deterministas (`proponer_ajuste_margen`,
        `proponer_re_solicitud`, `buscar_servicio_conexo`) con datos validados por el servidor: el LLM elige la acción y
        sus argumentos de texto, pero `endpoint`, `metodo` y `row_version` los pone el servidor, y `cuerpo` se valida
        contra el esquema del endpoint destino antes de responder. Ejecutarla es exactamente igual que usar el botón de la
        pantalla: mismas validaciones y mismos errores.
      properties:
        tipo:
          type: string
          enum: [ajustar_margen, re_solicitar_costeo, agregar_servicios_conexos]
          description: |
            `ajustar_margen` → `PUT /web/cotizaciones/{folio}/costeo/margen` (`AjusteMargenWeb`);
            `re_solicitar_costeo` → `POST /web/cotizaciones/{folio}/costeo/re-solicitar` (`ReSolicitudCosteoWeb`);
            `agregar_servicios_conexos` → `POST /web/cotizaciones/{folio}/costeo/servicios-conexos`
            (`AgregarServiciosConexosWeb`).
        metodo:
          type: string
          enum: [PUT, POST]
        endpoint:
          type: string
          maxLength: 200
          description: Ruta relativa a la URL base de la API, con el folio ya puesto (siempre el folio de la conversación).
          example: /web/cotizaciones/PCN-900555111-DG-05102026-001/costeo/margen
        cuerpo:
          description: Cuerpo JSON exacto que el frontend envía al confirmar.
          oneOf:
            - $ref: '#/components/schemas/AjusteMargenWeb'
            - $ref: '#/components/schemas/ReSolicitudCosteoWeb'
            - $ref: '#/components/schemas/AgregarServiciosConexosWeb'
        resumen:
          type: string
          maxLength: 300
          description: |
            Texto legible para el botón de confirmación ("Ajustar el margen de 15 % a 18 %: el precio pasa de 3.000.000
            a 3.109.756 COP"). Lo arma el SERVIDOR con plantilla y valores calculados por código (`IClsPrecioService`) al
            recibir la propuesta; el LLM nunca lo escribe ni ve esos montos (ADR-018 §2b).
        row_version:
          type: string
          nullable: true
          description: |
            Versión de la cotización que vio el asistente al proponer; va en `If-Match` al confirmar. Si la cotización
            cambió, el endpoint responde 409 `CONFLICTO_CONCURRENCIA` y la propuesta se descarta. `null` mientras el
            script `0006` (#98) no esté aplicado.

    ErrorHerramienta:
      type: object
      required: [herramienta, codigo]
      properties:
        herramienta:
          type: string
          description: Nombre de la herramienta (`calcular_precio`, `registrar_ajuste_margen`...).
        codigo:
          type: string
          description: Código de `ErrorNegocio` (ej. `TRM_NO_DISPONIBLE`).

    RespuestaChatError:
      type: object
      required: [texto, error]
      properties:
        texto:
          type: string
        error:
          type: boolean
          enum: [true]
        codigo:
          type: string
          enum: [IA_NO_DISPONIBLE, LIMITE_MODELO, TURNO_EN_CURSO, MAX_ITERACIONES, RESPUESTA_NO_ESTRUCTURADA, ERROR_INTERNO]
          description: >-
            Motivo estable del error (HU-013.16, #126). `IA_NO_DISPONIBLE`: fallaron todos los modelos de IA (el principal y los
            respaldos); `LIMITE_MODELO`: límite de peticiones del proveedor o del limitador local; `TURNO_EN_CURSO`: otro mensaje de la
            misma conversación sigue en curso; `MAX_ITERACIONES`: el turno se cortó por el tope de pasos; `RESPUESTA_NO_ESTRUCTURADA`:
            la respuesta del modelo no pasó la validación ni con el reintento; `ERROR_INTERNO`: cualquier otro fallo.

    CotizacionResumen:
      type: object
      required: [id, folio, version, moneda, estado_envio, origen, destino, numero_rutas, peso_total_kg, valor_mercancia]
      properties:
        id:
          type: string
          format: uuid
          description: Se usa en `GET /web/cotizaciones/{id}/nueva-version`.
        folio:
          type: string
        version:
          type: integer
          description: 1 para la original; la tabla muestra "v2", "v3", etc.
        nit_cliente:
          type: string
          nullable: true
          description: Se usa en `GET /web/clientes/{nit}/destinatarios-previos`.
        origen_cliente:
          type: string
          nullable: true
          enum: [cliente, prospecto, null]
        origen_margen:
          type: string
          nullable: true
          enum: [sap_tm, politica_linea, negociado, null]
          description: '`negociado` = ajuste manual del comercial (badge "Ajuste fuera de política"). HU-021.9 (#136): el de la ruta 1.'
        cliente:
          type: string
          nullable: true
        linea_negocio:
          type: string
          nullable: true
          description: |
            HU-021.9 (#136). La línea de negocio es de cada ruta: aquí la de la ruta 1, o `Varias` si las rutas de la solicitud
            tienen líneas distintas (la de cada ruta está en `CosteoCotizacion.rutas[]`).
        precio_final:
          type: number
          nullable: true
          description: HU-021. La suma del precio de las rutas (con sus conexos); `null` mientras alguna ruta no tenga precio.
        margen_aplicado:
          type: number
          nullable: true
          description: HU-021.9 (#136). El margen es de cada ruta; aquí el de la ruta 1 (el de cada ruta está en el costeo).
        moneda:
          type: string
          example: COP
        trm_aplicada:
          type: number
          description: |
            TRM con que se convirtió el precio (HU-012.2); 0 cuando la moneda es COP. Es la TRM del día en que se
            cotizó, la que imprime la nota del PDF en USD ("Esta cotización está bajo una TRM mínima de $X ...",
            HU-012.3) aunque el PDF se genere otro día.
        estado_costeo:
          type: string
          nullable: true
          enum: [pendiente_envio, error_envio, pendiente_costeo, autocosteo, entregada, descartada, costeo_vencido, null]
          description: |
            Estado del costeo en Nexo (ADR-015). `null` = la cotización no pasa por Nexo (chat con costo manual).
            `pendiente_envio` y `error_envio` = Nexo todavía no la tiene (ver `motivo_estado_costeo`; se puede
            reintentar); `pendiente_costeo` = alguna línea sin flete ("en costeo"); `autocosteo` = todas las líneas con
            flete y la cotización de Nexo en borrador; `entregada` = Nexo la entregó; `descartada` = Nexo descartó la
            solicitud; `costeo_vencido` = se agotó el tiempo máximo del polling sin costeo. "Costeado" = `autocosteo`
            o `entregada` con `precio_final`. Desde HU-013.14 (ADR-018 §17) `autocosteo` y `entregada` solo se exponen
            cuando Cotifly ya leyó el costo de Nexo: sin `precio_final` significa que falta el margen (con
            `motivo_estado_costeo`), no que el precio "va a llegar" (salvo filas de antes de HU-013.14 que el polling
            repara al arrancar).
        motivo_estado_costeo:
          type: string
          nullable: true
          description: Motivo legible del estado del costeo (error al enviar, rechazo de Nexo, costeo vencido...).
        estado_envio:
          type: string
          enum: [sin_enviar, enviada, reenviada]
        ganada:
          type: boolean
          nullable: true
        motivo_rechazo:
          type: string
          nullable: true
          description: |
            HU-021.13 (propuesta de refactor de BD §2.1): `"No aplica"` si está ganada, el motivo del comercial si está perdida
            y `null` solo mientras no tiene resultado (`ganada = null`).
        pdf_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        deadline:
          type: string
          format: date-time
          nullable: true
          description: |
            HU-018.1 (#155). Fecha límite de la solicitud (cabecera, la del formulario de costeo), ISO 8601 en UTC. `null` si no se
            dio. Siempre presente.
        score_prioridad:
          type: number
          nullable: true
          description: |
            HU-018.1 (#155). `scorePrioridad` que Nexo devolvió al crear la solicitud (`201 CapturaResultDto` de
            `POST /api/captura-solicitudes`), con hasta 4 decimales. Nexo no fija la escala (su ejemplo trae 62.5): mostrarlo tal
            cual. `null` si Nexo no lo mandó, si la solicitud no se ha enviado o si se envió antes del script 09. Siempre presente.
            Es el de la creación: no se actualiza después (`scoreUrgencia` por solicitud sigue bloqueado, ADR-016).
        sincronizacion_resultado_nexo:
          type: string
          nullable: true
          enum: [pendiente, sincronizado, no_sincronizable, solo_cotifly, null]
          description: |
            HU-033 (#199, ADR-023). Estado del resultado ganada/perdida frente a Nexo: `null` sin resultado; `pendiente`
            ("pendiente de sincronizar con NEXO": guardado solo en Cotifly hasta que la Mesa entregue la cotización);
            `sincronizado` (Nexo lo tiene); `no_sincronizable` (ya no se podrá enviar: ver `error_sincronizacion_resultado_nexo`);
            `solo_cotifly` (nunca va a Nexo: perdida antes del costeo de HU-013.17, cotización sin Nexo, descartada o vencida).
            Siempre presente.
        error_sincronizacion_resultado_nexo:
          type: string
          nullable: true
          description: HU-033. Último error al enviar el resultado pendiente, o por qué ya no se puede enviar. Siempre presente.
        finalizada_at:
          type: string
          format: date-time
          nullable: true
          description: |
            HU-036.2 (#206). Cuándo el comercial finalizó la cotización (`POST .../finalizar`: aceptó el precio), ISO 8601 en UTC.
            `null` sin finalizar (las anteriores al script `14` no tienen backfill). Siempre presente.
        origen:
          type: string
          nullable: true
          description: |
            HU-018.2 (#294). Municipio de origen de la RUTA 1 (la de menor orden); `null` sin rutas o si esa ruta no tiene nombre. Siempre
            presente. Lo consumen `GET /web/mis-cotizaciones` y `GET /web/cotizaciones/regional`.
        destino:
          type: string
          nullable: true
          description: HU-018.2 (#294). Municipio de destino de la RUTA 1 (la de menor orden); `null` sin rutas o sin nombre. Siempre presente.
        numero_rutas:
          type: integer
          description: HU-018.2 (#294). Cuántas rutas tiene la cotización, también las rechazadas (`0` sin rutas). Siempre presente.
        peso_total_kg:
          type: number
          nullable: true
          description: |
            HU-018.2 (#294). Suma del `peso_kg` declarado (sin tara) de todas las rutas; `null` si ninguna lo trae. Siempre presente.
        valor_mercancia:
          type: number
          nullable: true
          description: |
            HU-018.2 (#294). Suma del valor de la mercancía de todas las rutas, en COP aunque la cotización esté en USD; `null` si ninguna
            lo trae. Siempre presente.
        conexos_descartados:
          type: array
          deprecated: true
          items:
            type: string
          description: |
            HU-013.15 (#124). Solo en la respuesta de `POST .../costeo/re-solicitar` (siempre presente ahí). **Desde HU-021.9 (#136,
            decisión 3) siempre `[]`**: la re-solicitud ya no descarta conexos (ver `conexos_conservados`). Se conserva por
            compatibilidad (frontend actual) y se retira cuando salga HU-021-FE (#138); el frontend nuevo no lo lee.
        aviso_rechazos:
          type: string
          nullable: true
          description: |
            HU-028.1 (#183, decisión del 2026-10-20). Solo en la respuesta de `POST .../costeo/re-solicitar` y de `PUT .../solicitud`, y
            solo si se **omitieron** del envío camiones rechazados por la Mesa de Costeo de Nexo: por ruta, cuántos camiones no viajaron y
            su motivo, y las rutas que no viajaron completas (quedan `rechazada`, sin precio). En la `-vN` dice que se copiaron como
            rechazados. Para que la Mesa los reconsidere: `PUT .../solicitud` con `reincluir_rechazados`. Si no se omitió nada, no viene.
        conexos_conservados:
          type: array
          items:
            type: string
          description: |
            HU-021.9 (#136; rehace el aviso de #124). Solo en la respuesta de `POST .../costeo/re-solicitar` (siempre presente ahí,
            `[]` si no había): nombres de los servicios conexos que la cotización resultante conserva (mismo folio) o copió de la
            original (`-vN`), sin montos. Siguen en el precio de su ruta con la misma cantidad (Cotifly es la fuente de los
            conexos; la `-vN` toma el costo unitario del catálogo de Nexo de hoy). A la cotización nueva de Nexo los manda una
            sola vez el envío diferido (decisión 10) cuando Nexo costea la línea del primer camión vigente de la ruta. El
            frontend los muestra como aviso informativo.
        cubicacion:
          type: array
          items:
            $ref: '#/components/schemas/CubicacionRuta'
          description: |
            HU-023.3 (#158). Solo en la respuesta de `POST /web/solicitudes-costeo` (y, HU-032, en la de la edición) y solo si alguna
            ruta pasó por el cubicador **o tiene avisos del vehículo** (HU-032, #197: `VEHICULO_AJUSTADO_POR_CUBICADOR`,
            `VEHICULO_ELEGIDO_USADO`, `MERCANCIAS_NO_CUBICABLES`, `VEHICULO_ELEGIDO_INVALIDO` en `advertencias`, también en una ruta que no
            llamó al cubicador: entonces `resultado` es `null`): por
            ruta, el resultado y los avisos (mercancías condicionadas, advertencias y extradimensión). El resultado, el motivo y,
            desde HU-023.5 (#160), también los avisos se guardan en la ruta: `GET .../costeo` los devuelve en
            `rutas[].avisos_cubicacion`.
        avisos:
          type: array
          items:
            type: string
            enum: [RESUMEN_INCOMPLETO]
          description: |
            #173. Solo si la respuesta salió incompleta DESPUÉS de guardar (la cotización existe y, si aplica, ya está en Nexo):
            `RESUMEN_INCOMPLETO` = falló una lectura secundaria y `linea_negocio` sale `null`. No reintentar el POST: recargar.
        comercial:
          $ref: '#/components/schemas/ComercialCotizacion'

    CubicacionRuta:
      type: object
      required: [linea_orden, linea_solicitud_id, resultado, motivo_sin_seleccion, condicionada, mercancias_condicionadas, advertencias, extradimension]
      description: |
        HU-023.3 (#158). Lo que respondió el cubicador para una ruta de la captura. HU-032 (#197): también una ruta que no llamó al
        cubicador pero tiene avisos del vehículo (`resultado` y `motivo_sin_seleccion` en `null`).
      properties:
        linea_orden:
          type: integer
          minimum: 1
        linea_solicitud_id:
          type: string
          format: uuid
        resultado:
          type: string
          nullable: true
          enum: [ASIGNADO, SIN_SELECCION_AUTOMATICA, null]
        motivo_sin_seleccion:
          type: string
          nullable: true
          enum: [EXTRADIMENSIONADO, SIN_CANDIDATOS_DIMENSIONALES, SUPERA_K_MAX, SIN_CARROCERIA_COMPATIBLE, BUSQUEDA_AGOTADA, null]
        condicionada:
          type: boolean
          description: La ruta va a la Mesa de Costeo por una mercancía condicionada.
        mercancias_condicionadas:
          type: array
          items:
            $ref: '#/components/schemas/MercanciaCondicionada'
        advertencias:
          type: array
          items:
            $ref: '#/components/schemas/AdvertenciaCubicador'
        extradimension:
          description: HU-023 (#176). `ExtradimensionCubicador` con la estructura vigente, o `null` si el cubicador no la informó.
          oneOf:
            - $ref: '#/components/schemas/ExtradimensionCubicador'
            - $ref: '#/components/schemas/Nulo'

    AvisosCubicacion:
      type: object
      required: [mercancias_condicionadas, advertencias, extradimension]
      description: |
        HU-023.3 (#158). Los avisos del cubicador de la última cubicación de la ruta. HU-023.5 (#160): se guardan en la ruta
        (columna `avisosCubicacion`), así que vienen en la ruta recalculada de `POST .../rutas/{rutaId}/recalcular-vehiculos` y
        también en cualquier `CosteoCotizacion` (`GET .../costeo`, margen, conexos) cuya ruta los tenga. El campo se **omite** si la
        ruta no los tiene (sin cubicador, o una ruta anterior a la columna): tratarlo siempre como opcional.
      properties:
        mercancias_condicionadas:
          type: array
          items:
            $ref: '#/components/schemas/MercanciaCondicionada'
        advertencias:
          type: array
          items:
            $ref: '#/components/schemas/AdvertenciaCubicador'
        extradimension:
          description: HU-023 (#176). `ExtradimensionCubicador` con la estructura vigente, o `null` si el cubicador no la informó.
          oneOf:
            - $ref: '#/components/schemas/ExtradimensionCubicador'
            - $ref: '#/components/schemas/Nulo'

    MercanciaCondicionada:
      type: object
      required: [codigo_mercancia, comentario]
      properties:
        codigo_mercancia:
          type: string
        comentario:
          type: string
          nullable: true

    AdvertenciaCubicador:
      type: object
      required: [codigo, mensaje]
      description: |
        Una advertencia de la ruta. Del cubicador (por ejemplo, refrigerado) o, HU-032 (#197, ADR-022), un **aviso del vehículo**:
        - `VEHICULO_AJUSTADO_POR_CUBICADOR`: el cubicador asignó otro vehículo que el elegido; manda el cubicador.
        - `VEHICULO_ELEGIDO_USADO`: el cubicador no seleccionó vehículo, falló o estaba ocupado; la ruta va con el elegido.
        - `MERCANCIAS_NO_CUBICABLES`: la ruta mezcla mercancías cubicables y sin medidas; no se cubica y va con el elegido.
        - `VEHICULO_ELEGIDO_INVALIDO`: el cubicador no seleccionó y el elegido no es un código de Nexo; la ruta va sin vehículo (o
          sin la carrocería).
        Los avisos del vehículo traen `vehiculo_elegido` y `vehiculos_finales` (el de cada camión que quedó); las demás advertencias
        los traen en `null`. Son informativos: la pantalla los muestra junto al vehículo final de la ruta.
      properties:
        codigo:
          type: string
          nullable: true
        mensaje:
          type: string
        vehiculo_elegido:
          description: HU-032 (#197). El vehículo que eligió el comercial (solo en los avisos del vehículo).
          oneOf:
            - $ref: '#/components/schemas/VehiculoAviso'
            - $ref: '#/components/schemas/Nulo'
        vehiculos_finales:
          type: array
          nullable: true
          description: HU-032 (#197). El vehículo de cada camión que quedó en la ruta (solo en los avisos del vehículo).
          items:
            $ref: '#/components/schemas/VehiculoAviso'

    VehiculoAviso:
      type: object
      required: [tipo_vehiculo, carroceria]
      description: 'HU-032 (#197). Un vehículo de un aviso de la ruta (los dos pueden ser `null`, sin vehículo).'
      properties:
        tipo_vehiculo:
          type: string
          nullable: true
        carroceria:
          type: string
          nullable: true

    ExtradimensionCubicador:
      type: object
      required: [hay_extradimension, medidas_estandar, piezas]
      description: |
        HU-023 (#176). Estructura vigente del cubicador (guía §5.3): si alguna pieza excede las medidas estándar, las medidas con las
        que se comparó y cada pieza que las excede, con su posición en las mercancías de la ruta (`indice_posicion`, base 0).
      properties:
        hay_extradimension:
          type: boolean
        medidas_estandar:
          oneOf:
            - $ref: '#/components/schemas/MedidasEstandarCubicador'
            - $ref: '#/components/schemas/Nulo'
        piezas:
          type: array
          items:
            $ref: '#/components/schemas/PiezaExtradimension'

    MedidasEstandarCubicador:
      type: object
      required: [largo_max_cm, ancho_max_cm, alto_max_cm, peso_max_kg]
      description: HU-023 (#176). Medidas estándar con las que el cubicador decide la extradimensión (cm y kg).
      properties:
        largo_max_cm:
          type: number
          nullable: true
        ancho_max_cm:
          type: number
          nullable: true
        alto_max_cm:
          type: number
          nullable: true
        peso_max_kg:
          type: number
          nullable: true

    PiezaExtradimension:
      type: object
      required: [indice_posicion, id_tipo_mercancia, codigo_mercancia, excesos]
      description: |
        HU-023 (#176). Una pieza que excede las medidas estándar. `indice_posicion` es la posición (base 0) en las mercancías de la
        ruta; puede ser `null` en corridas guardadas antes de S5-HU-17.8.
      properties:
        indice_posicion:
          type: integer
          nullable: true
          minimum: 0
        id_tipo_mercancia:
          type: string
          nullable: true
        codigo_mercancia:
          type: string
          nullable: true
        excesos:
          type: array
          items:
            type: string
          example: ['largo 1400.0 cm > 1220.0 cm']

    MercanciaVehiculo:
      type: object
      required: [indice_posicion, id_tipo_mercancia, codigo_mercancia, cantidad, peso_kg, volumen_m3]
      description: |
        HU-023 (#176). Lo que lleva un camión de la recomendación, una fila por posición de la petición. Dos filas del mismo camión pueden
        compartir `codigo_mercancia` (posiciones con medidas distintas): quien agrupe por código **debe sumar**. `indice_posicion` (base 0)
        puede ser `null` en corridas viejas.
      properties:
        indice_posicion:
          type: integer
          nullable: true
          minimum: 0
        id_tipo_mercancia:
          type: string
          nullable: true
        codigo_mercancia:
          type: string
        cantidad:
          type: integer
        peso_kg:
          type: number
          description: Peso total de esa fila en el camión (kg).
        volumen_m3:
          type: number

    MisCotizaciones:
      type: object
      required: [total, cotizaciones]
      properties:
        total:
          type: integer
        cotizaciones:
          type: array
          items:
            $ref: '#/components/schemas/CotizacionResumen'

    ComercialCotizacion:
      type: object
      required: [usuario_id, nombre_usuario, nombre_completo]
      description: |
        HU-016.1 (#154). Comercial dueño de la cotización (`UsuariosWeb`). Solo en `GET /web/cotizaciones/regional` y en
        `DetalleCotizacion.cotizacion` (`GET /web/cotizaciones/{folio}`, #179), siempre presente ahí; en el resto de respuestas
        `CotizacionResumen` no trae `comercial`.
      properties:
        usuario_id:
          type: string
          format: uuid
        nombre_usuario:
          type: string
          nullable: true
        nombre_completo:
          type: string
          nullable: true

    CotizacionesRegional:
      type: object
      required: [regional, fuente_regional, total, cotizaciones]
      description: HU-016.1 (#154). Respuesta de `GET /web/cotizaciones/regional`.
      properties:
        regional:
          type: string
          nullable: true
          description: |
            Regional del gerente, resuelta en el servidor. HU-037.3 (#211): para el `director`, la regional que pidió con
            `?regional=` o `null` si ve todas.
        fuente_regional:
          type: string
          nullable: true
          enum: [dim_ejecutivo, usuarios_web, null]
          description: De dónde salió la regional del gerente. `null` para el `director` (la regional no se resuelve de su usuario).
        total:
          type: integer
          description: Cuántas filas trae `cotizaciones` (máximo 100).
        cotizaciones:
          type: array
          maxItems: 100
          items:
            allOf:
              - $ref: '#/components/schemas/CotizacionResumen'
              - type: object
                required: [comercial]

    DetalleCotizacion:
      type: object
      required: [folio, row_version, solo_lectura, tipo, notas, fechas, cotizacion, costeo, captura, totales]
      description: |
        HU-027.1 (#179). Respuesta de `GET /web/cotizaciones/{folio}`: la cabecera (`cotizacion`), el costeo por ruta (`costeo`), las rutas
        capturadas (`captura`) y los totales, en una llamada. HU-039.1 (#218): el único costo es `costeo.rutas[].costo_final` (costo
        bruto de la ruta en COP), y solo para el dueño; a un gerente comercial en solo consulta le sale siempre `null`.
      properties:
        folio:
          type: string
        row_version:
          type: string
          nullable: true
          description: Versión de negocio de la cotización (la misma del `ETag` y de `costeo.row_version`) para el `If-Match`.
        solo_lectura:
          type: boolean
          description: |
            `true` si quien consulta es un gerente comercial de la regional del dueño: solo consulta (ocultar o deshabilitar las acciones).
            `false` para el dueño.
        tipo:
          type: string
          nullable: true
          enum: [spot, licitacion, null]
          description: Tipo de la solicitud; `null` en las cotizaciones del chat.
        notas:
          type: string
          nullable: true
          description: Notas de la solicitud (formulario de costeo).
        fechas:
          $ref: '#/components/schemas/FechasCotizacion'
        cotizacion:
          description: La cabecera (`CotizacionResumen`), con el comercial dueño en `comercial` (siempre presente aquí).
          allOf:
            - $ref: '#/components/schemas/CotizacionResumen'
            - type: object
              required: [comercial]
        costeo:
          $ref: '#/components/schemas/CosteoCotizacion'
        captura:
          type: array
          description: Las rutas capturadas en orden (`RutaEditable`); se cruzan con `costeo.rutas[]` por `linea_solicitud_id`.
          items:
            $ref: '#/components/schemas/RutaEditable'
        totales:
          $ref: '#/components/schemas/TotalesCotizacion'

    FechasCotizacion:
      type: object
      required: [created_at, updated_at, costeo_enviado_at, costeo_listo_at, marcado_at, finalizada_at]
      description: HU-027.1 (#179). Fechas de la cabecera, ISO 8601 en UTC.
      properties:
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Último cambio de la cotización.
        costeo_enviado_at:
          type: string
          format: date-time
          nullable: true
          description: Último envío de la solicitud a Nexo; `null` si nunca llegó.
        costeo_listo_at:
          type: string
          format: date-time
          nullable: true
          description: Cuándo quedó con precio; `null` sin costeo.
        marcado_at:
          type: string
          format: date-time
          nullable: true
          description: Cuándo se marcó el resultado (ganada o perdida); `null` sin resultado.
        finalizada_at:
          type: string
          format: date-time
          nullable: true
          description: HU-036.2 (#206). Cuándo el comercial finalizó la cotización; `null` sin finalizar.

    TotalesCotizacion:
      type: object
      required: [rutas, camiones, peso_kg, precio_transporte, precio_conexos, precio_seguro, precio_final]
      description: |
        HU-027.1 (#179). Totales de la solicitud con las reglas del costeo y del PDF, en la moneda de la cotización. Los precios son `null`
        mientras alguna ruta no tenga precio; `precio_transporte + precio_conexos + precio_seguro = precio_final` (HU-045.3, #265). HU-043.2
        (#251): el margen se aplica solo al transporte; los conexos van a su precio de venta, sin margen, y el seguro (HU-045.2) tampoco lo lleva.
      properties:
        rutas:
          type: integer
        camiones:
          type: integer
          description: |
            Camiones que cuentan en el precio (los descartados en Nexo no, salvo que lo estén todos los de la ruta; HU-028.1, #183: los
            rechazados por la Mesa de Costeo nunca).
        peso_kg:
          type: number
          nullable: true
          description: Suma del peso declarado de las rutas; `null` si ninguna lo trae.
        precio_transporte:
          type: number
          nullable: true
          description: |
            Suma de la tarifa de transporte de las rutas: fletes + retorno + levante con el margen de cada ruta (HU-043.2, #251).
        precio_conexos:
          type: number
          nullable: true
          description: |
            Suma del precio de los servicios conexos de todas las rutas. HU-043.2 (#251): su precio de VENTA (el `valorVenta` de Nexo o el
            `precioVenta` del catálogo; sin él, el costo), sin margen.
        precio_seguro:
          type: number
          nullable: true
          description: |
            HU-045.3 (#265, B4 de la auditoría de #264). Suma del `valor_seguro` de las rutas que cotizan (0 si ninguna incluye el seguro de
            la mercancía), sin margen. Nunca la tasa.
        precio_final:
          type: number
          nullable: true
          description: Igual a `costeo.precio_final`.
        rutas_rechazadas:
          type: integer
          description: HU-028.1 (#183). Rutas rechazadas por la Mesa de Costeo de Nexo (todos sus camiones); no cuentan en los precios.
        camiones_rechazados:
          type: integer
          description: HU-028.1 (#183). Camiones rechazados por la Mesa de Costeo de Nexo, de cualquier ruta.

    EnvioWeb:
      type: object
      required: [para]
      description: |
        #228: hasta 10 destinatarios por defecto entre `para` y `cc` juntos, configurable con `Correo__MaximoDestinatarios`
        (`CORREO_DEMASIADOS_DESTINATARIOS`, `detalle.maximo` trae el tope vigente); cada dirección es UNA
        dirección simple sin caracteres de control (ver `POST /web/cotizaciones/{folio}/enviar`).
      properties:
        para:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            format: email
            maxLength: 320
        cc:
          type: array
          maxItems: 20
          items:
            type: string
            format: email
            maxLength: 320
          default: []
        asunto:
          type: string
          nullable: true
          maxLength: 300
          description: |
            Por defecto "Cotización {folio} — Botero Soto". DEF-1027B-2 (#228): una sola línea, sin caracteres de control
            (CR, LF, NUL, tabulador, U+0085, U+2028, U+2029...): si no, 400 `CORREO_INVALIDO`.
        cuerpo:
          type: string
          nullable: true
          maxLength: 5000

    BorradorCorreoWeb:
      type: object
      description: |
        Endurecimiento A (#199): cuerpo opcional de `POST .../correo/vista-previa` (antes `EnvioWeb`, que exige `para`). Todo es
        opcional: sin `para` (o vacío) se usan los destinatarios del último envío del comercial a ese cliente; sin `asunto` ni
        `cuerpo`, los de la plantilla. No se valida ni se envía nada.
      properties:
        para:
          type: array
          nullable: true
          items:
            type: string
            maxLength: 320
        cc:
          type: array
          nullable: true
          items:
            type: string
            maxLength: 320
        asunto:
          type: string
          nullable: true
          maxLength: 300
        cuerpo:
          type: string
          nullable: true
          maxLength: 5000

    RespuestaEnvio:
      type: object
      required: [enviado]
      properties:
        enviado:
          type: boolean
          enum: [true]
          description: HU-033. MailSender aceptó el correo (202); la entrega se sigue en el historial.
        message_id:
          type: string
          nullable: true
          description: HU-033. Id del correo en MailSender.
        correo_id:
          type: string
          format: uuid
          nullable: true
          description: HU-033. Id del envío en Cotifly (historial y reintento).
        estado:
          type: string
          nullable: true
          enum: [encolado, enviando, enviado, fallido, null]
          description: HU-033. Estado del envío al responder (`encolado`).
        redirigido_a:
          type: string
          nullable: true
          description: HU-033. Buzón de pruebas al que se redirigió (por defecto en todos los ambientes); `null` si va a los destinatarios reales (solo producción con `Modo=ninguno` y `PermitirEnvioReal=true`).

    EnvioCorreo:
      type: object
      description: HU-033 (#199). Un envío del historial de la cotización con el estado de MailSender.
      required: [id, created_at, estado, para, cc, reintentable]
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        estado:
          type: string
          enum: [encolado, enviando, enviado, fallido]
        para:
          type: array
          items:
            type: string
          description: Destinatarios originales.
        cc:
          type: array
          items:
            type: string
        asunto:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
          description: Último error de MailSender (`lastError`) o por qué quedó `fallido`.
        intentos:
          type: integer
          nullable: true
          description: Intentos de entrega al relay que lleva MailSender.
        enviado_at:
          type: string
          format: date-time
          nullable: true
        estado_actualizado_at:
          type: string
          format: date-time
          nullable: true
          description: Última consulta del estado en MailSender.
        redirigido_a:
          type: string
          nullable: true
        id_mail_sender:
          type: string
          nullable: true
          description: Id del correo en MailSender (`null` si se rechazó al encolarlo).
        reintentable:
          type: boolean
          description: '`fallido` y conocido por MailSender: admite `POST .../correos/{correoId}/reintentar`.'

    HistorialCorreos:
      type: object
      required: [folio, correos]
      properties:
        folio:
          type: string
        correos:
          type: array
          items:
            $ref: '#/components/schemas/EnvioCorreo'

    ResumenCorreo:
      type: object
      description: |
        HU-033 (#199, decisión 5). Bloque fijo del correo para el cliente: el precio final de cada ruta (transporte, conexos y, HU-045.3,
        #265, el seguro de la mercancía incluidos) y el total general, sin desglose (nunca costo, margen, flete, conexos ni seguro con precio).
      required: [moneda, total, total_texto, rutas, leyenda]
      properties:
        moneda:
          type: string
          enum: [COP, USD]
        total:
          type: number
        total_texto:
          type: string
          description: Con el formato del PDF (`$3.294.798`, `US$996,35`).
        rutas:
          type: array
          items:
            $ref: '#/components/schemas/RutaResumenCorreo'
        leyenda:
          type: string
          description: Leyenda de impuestos (la misma del PDF).
        nota_moneda:
          type: string
          nullable: true
          description: En USD, la nota de TRM mínima del PDF.

    RutaResumenCorreo:
      type: object
      required: [orden, ruta, precio_texto, incluye_seguro]
      properties:
        orden:
          type: integer
        ruta:
          type: string
          description: '"Origen → Destino".'
        precio:
          type: number
          nullable: true
          description: Precio final de la ruta; `null` si la Mesa de Costeo la rechazó (`precio_texto` = "Sin costeo").
        precio_texto:
          type: string
        incluye_seguro:
          type: boolean
          description: |
            HU-045.3 (#265). El precio de la ruta incluye el seguro de la mercancía (el correo dice "Incluye el seguro de la mercancía",
            sin el monto ni la tasa).

    SeguimientoWeb:
      type: object
      properties:
        ganada:
          type: boolean
          nullable: true
        motivo_rechazo:
          type: string
          nullable: true
          maxLength: 2000
          description: |
            Solo se guarda con `ganada = false`. Con `ganada = true` queda `"No aplica"` y con `ganada = null`, vacío (HU-021.13).
            HU-018.1 (#155): con `ganada = false` es **obligatorio** y debe ser uno de `GET /web/motivos-perdida` (sin distinguir
            mayúsculas; se guarda con la escritura de la lista); si no, 400 `MOTIVO_NO_PERMITIDO`. Con `Otro` se guarda
            `"Otro: {comentario}"`. Las cotizaciones marcadas antes con un motivo libre o sin motivo no se revalidan.
        comentario:
          type: string
          nullable: true
          maxLength: 500
          description: |
            HU-018.1 (#155): explicación del motivo. **Obligatorio con el motivo `Otro`** (`requiere_comentario = true` en
            `GET /web/motivos-perdida`; si falta, 400 `MOTIVO_NO_PERMITIDO` con `detalle.requiere_comentario = true`). Con otro motivo
            no se guarda.

    LineaNegocio:
      type: object
      required: [id, linea_negocio, margen, metodo_calculo, is_active]
      properties:
        id:
          type: integer
        linea_negocio:
          type: string
        margen:
          type: number
        metodo_calculo:
          type: string
          enum: [margen, markup]
        is_active:
          type: boolean
        updated_at:
          type: string
          format: date-time
          nullable: true

    CorridaSincronizacionMargenSap:
      type: object
      description: |
        HU-042.2 (#243). Una corrida de `SapMargenSyncLog`. Las filas solo vienen en las corridas `ok`; `mensaje_error` en las
        `error` y `omitido` (sin URL ni credenciales).
      required: [estado, iniciado_at, finalizado_at, filas_insertadas, filas_actualizadas, filas_desactivadas, mensaje_error]
      properties:
        estado:
          type: string
          enum: [ok, error, omitido]
        iniciado_at:
          type: string
          format: date-time
        finalizado_at:
          type: string
          format: date-time
          nullable: true
        filas_insertadas:
          type: integer
          nullable: true
        filas_actualizadas:
          type: integer
          nullable: true
          description: Con valor o NIT nuevo, o reactivadas.
        filas_desactivadas:
          type: integer
          nullable: true
          description: Combinaciones que SAP dejó de traer (`activo = 0`).
        mensaje_error:
          type: string
          nullable: true

    EstadoSincronizacionMargenSap:
      type: object
      description: HU-042.2 (#243). `GET /web/admin/sap-margen/estado`.
      required: [ultima_corrida, ultima_corrida_ok, filas_activas, proxima_corrida_estimada, intervalo_minutos, chequeo_minutos, en_curso, nit_configurado, habilitada]
      properties:
        ultima_corrida:
          description: La corrida más reciente, cualquiera sea su estado; `null` si nunca hubo una.
          oneOf:
            - $ref: '#/components/schemas/CorridaSincronizacionMargenSap'
            - $ref: '#/components/schemas/Nulo'
        ultima_corrida_ok:
          description: La corrida `ok` más reciente (de ella depende la próxima); `null` si nunca la hubo.
          oneOf:
            - $ref: '#/components/schemas/CorridaSincronizacionMargenSap'
            - $ref: '#/components/schemas/Nulo'
        filas_activas:
          type: integer
          description: Combinaciones activas en `SapMargenCliente` (las que usa la cotización).
        proxima_corrida_estimada:
          type: string
          format: date-time
          nullable: true
          description: |
            `null` con la sincronización deshabilitada o sin configuración válida (no habrá corrida).
            Primer chequeo del worker de esta réplica en o después de que la última corrida `ok` cumpla `intervalo_minutos` (sin
            corrida `ok`, el próximo chequeo).
        intervalo_minutos:
          type: integer
          description: '`SapTm:SincronizacionMinutos`: edad máxima de la última corrida `ok` (1440 por defecto).'
        chequeo_minutos:
          type: integer
          description: '`SapTm:ChequeoMinutos`: cada cuánto revisa el worker (60 por defecto).'
        en_curso:
          type: boolean
          description: Esta réplica está sincronizando ahora.
        nit_configurado:
          type: boolean
          description: Hay `ConnectionStrings:DwOperaciones`; sin ella cada fila conserva el NIT que ya tenía (o `null`).
        habilitada:
          type: boolean
          description: |
            `SapTm:SincronizacionHabilitada` (decisión del 2026-11-04, `false` por defecto). Deshabilitada, ni el worker ni la corrida
            forzada sincronizan; la cotización sigue leyendo la copia local.

    ResultadoSincronizacionMargenSap:
      type: object
      description: HU-042.2 (#243). Respuesta de `POST /web/admin/sap-margen/sincronizar`.
      required: [estado, filas_recibidas, duracion_ms, corrida]
      properties:
        estado:
          type: string
          enum: [ok, error, omitido]
        filas_recibidas:
          type: integer
          description: Filas que entregó SAP TM y pasaron la validación (0 si falló antes).
        duracion_ms:
          type: integer
        corrida:
          description: La fila de `SapMargenSyncLog` de esta corrida; `null` solo si no se pudo registrar.
          oneOf:
            - $ref: '#/components/schemas/CorridaSincronizacionMargenSap'
            - $ref: '#/components/schemas/Nulo'

    LineaNegocioOpcion:
      type: object
      description: |
        HU-016.1 (#154). Una línea de negocio activa para el desplegable de la captura (`GET /web/lineas-negocio`). Sin margen ni
        método: la política de margen no sale de la administración.
      required: [linea_negocio, etiqueta]
      properties:
        linea_negocio:
          type: string
          description: Nombre de la línea en Cotifly (`MargenesPolitica.lineaNegocio`); el valor de `RutaCapturaWeb.linea_negocio`.
        etiqueta:
          type: string
          description: Texto para mostrar (con tildes y espacios, ej. `Devolución Contenedor`); si no hay uno conocido, el mismo `linea_negocio`.

    ActualizarLineaNegocio:
      type: object
      required: [margen, metodo_calculo, is_active]
      properties:
        margen:
          type: number
          minimum: 0
          maximum: 0.99
        metodo_calculo:
          type: string
          enum: [margen, markup]
        is_active:
          type: boolean

    PeriodoMetricas:
      type: object
      description: Periodo efectivamente aplicado (con los valores por defecto ya resueltos).
      required: [desde, hasta, zona_horaria]
      properties:
        desde:
          type: string
          format: date
        hasta:
          type: string
          format: date
        zona_horaria:
          type: string
          example: America/Bogota

    IndicadoresMetricas:
      type: object
      description: |
        KPIs de un conjunto de cotizaciones (una por cadena de versiones, periodo por su primera creación). Definición
        exacta de cada campo en el tag `metricas` y en ADR-016. Montos en COP con 2 decimales; fracciones de 0 a 1.
        Siempre se cumple `cantidad = ganadas + perdidas + sin_resultado + pendientes_por_cotizar`.
      required: [cantidad, versiones, ganadas, perdidas, sin_resultado, pendientes_por_cotizar, conversion,
                 conversion_sobre_cerradas, margen_promedio, margen_ponderado, costeo_total, costeo_ganadas, valor_cotizado_cop,
                 valor_ganado_cop, ganancias, cotizaciones_usd, tiempo_promedio_cotizacion_horas,
                 desviacion_promedio_margen, desviacion_promedio_margen_abs, ajustes_margen, deadline_vencidas,
                 margen_politica_promedio, margen_aplicado_promedio, margen_politica_ponderado, desviacion_margen_politica, rutas_sin_margen_politica]
      properties:
        cantidad:
          type: integer
          description: Cadenas de versiones cuya primera creación cae en el periodo, en cualquier estado.
        versiones:
          type: integer
          description: Filas (todas las versiones) de esas cadenas (referencia; no entra en ningún cociente).
        ganadas:
          type: integer
          description: Resultado ganada (el más reciente de la cadena).
        perdidas:
          type: integer
          description: Resultado perdida (el más reciente de la cadena).
        sin_resultado:
          type: integer
          description: Con precio y sin resultado (pendientes por marcar ganada o perdida).
        pendientes_por_cotizar:
          type: integer
          description: Sin precio y sin resultado (esperando el costeo o el precio).
        conversion:
          type: number
          nullable: true
          description: ganadas / cantidad (backlog HU-010). `null` si cantidad es 0.
        conversion_sobre_cerradas:
          type: number
          nullable: true
          description: ganadas / (ganadas + perdidas). `null` si no hay ninguna cerrada.
        margen_promedio:
          type: number
          nullable: true
          description: |
            Promedio simple del margen de cada cotización (fracción); el de una cotización es el promedio de sus rutas
            ponderado por `costoFinal` (HU-021). `null` si ninguna lo tiene.
        margen_ponderado:
          type: number
          nullable: true
          description: |
            Por ruta (HU-021, decisión 8), margen sobre el precio: SUM(precio de la ruta en COP − `costoFinal`) /
            SUM(precio de la ruta en COP) de todas las rutas del universo con costo > 0 y precio > 0 (4 decimales).
            `null` si no hay ninguna.
        costeo_total:
          type: number
          description: SUM(`costo`) en COP de todas (el costo nunca se convierte). El costo de una cotización es la suma del `costoFinal` de sus rutas.
        costeo_ganadas:
          type: number
          description: SUM(`costo`) en COP de las ganadas.
        valor_cotizado_cop:
          type: number
          description: SUM(`valor_cop`), con `valor_cop = round(precioFinal × trmAplicada, 2)` en USD (no es el `precio_cop` de ADR-014).
        valor_ganado_cop:
          type: number
          description: SUM(`valor_cop`) de las ganadas. Valor cotizado, no recaudado; en la UI "Valor ganado (COP)".
        ganancias:
          type: number
          description: SUM(`valor_cop` − `costo`) de las ganadas con precio y costo (= `valor_ganado_cop − costeo_ganadas` si todas tienen precio y costo y ninguna en USD tiene TRM 0).
        cotizaciones_usd:
          type: integer
          description: Cotizaciones del universo en una moneda distinta de COP.
        tiempo_promedio_cotizacion_horas:
          type: number
          nullable: true
          description: Promedio de (`costeoListoAt` − `createdAt` de la versión vigente) en horas (2 decimales), sin las filas con `costeoListoAt` anterior a `createdAt`. `null` si no queda ninguna.
        desviacion_promedio_margen:
          type: number
          nullable: true
          description: Promedio de `MargenAjustes.diferencia` (con signo) de la versión vigente de cada cotización (4 decimales). `null` sin ajustes.
        desviacion_promedio_margen_abs:
          type: number
          nullable: true
          description: Promedio del valor absoluto de esas diferencias (4 decimales). `null` sin ajustes.
        ajustes_margen:
          type: integer
          description: Ajustes de margen (`MargenAjustes`) de la versión vigente de cada cotización.
        deadline_vencidas:
          type: integer
          nullable: true
          description: Sin resultado y con `deadline` anterior al momento de la consulta. `null` si el esquema no tiene la columna `deadline` (script 0004).
        margen_politica_promedio:
          type: number
          nullable: true
          description: |
            HU-016.1 (#154, decisiones P3 y P4 del 2026-10-27). Promedio simple del margen de política
            (`margenPoliticaSugerido`, el de la línea de negocio guardado en la ruta al cotizar) de las **mismas rutas** que se
            cotizaron: rutas de la versión vigente, sin las rechazadas por la Mesa, con margen aplicado y con margen de política
            (4 decimales). **HU-016.2 (#295): solo de las cotizaciones finalizadas** (`finalizadaAt`); una sin finalizar aún puede
            cambiar de margen y no entra. `null` si no hay ninguna (incluido cuando no hay ninguna finalizada). Es la referencia de "Margen promedio" en "Mis cotizaciones" y en el tablero;
            no expone la tabla de políticas. `margen_promedio` NO es su par sobre las mismas rutas (es por cotización e incluye
            las rutas sin política): no restarlos; su par es `margen_aplicado_promedio`. El semáforo es `desviacion_margen_politica`.
        margen_aplicado_promedio:
          type: number
          nullable: true
          description: |
            HU-016.1 (#154, decisión del 2026-10-27). Promedio simple del margen aplicado (`margenAplicado`) de exactamente las
            mismas rutas comparables de `margen_politica_promedio` (versión vigente, sin las rechazadas por la Mesa, con margen
            aplicado y con margen de política; 4 decimales, half-to-even). **HU-016.2 (#295): solo de las cotizaciones finalizadas.**
            `null` si no hay ninguna. Es el par directo de
            `margen_politica_promedio`: aplicado simple contra política simple sobre las mismas rutas. No reemplaza a
            `margen_promedio` (por cotización, incluye las rutas sin política) ni al semáforo (`desviacion_margen_politica`,
            ponderado por costo).
        margen_politica_ponderado:
          type: number
          nullable: true
          description: |
            HU-016.1 (#154). Margen de política de esas mismas rutas ponderado por su costo: SUM(`margenPoliticaSugerido` ×
            `costoFinal`) / SUM(`costoFinal`) de las que tienen costo > 0 (el costo siempre en COP; 4 decimales). **HU-016.2 (#295):
            solo de las cotizaciones finalizadas.** `null` si ninguna tiene costo. Base del semáforo (`desviacion_margen_politica`).
        desviacion_margen_politica:
          type: number
          nullable: true
          description: |
            HU-016.1 (#154). Margen aplicado menos margen de política, los dos ponderados por costo sobre las mismas rutas de
            `margen_politica_ponderado`: SUM((`margenAplicado` − `margenPoliticaSugerido`) × `costoFinal`) / SUM(`costoFinal`)
            (4 decimales). **HU-016.2 (#295): solo de las cotizaciones finalizadas.** Semáforo: verde si es ≥ 0 (el comercial cotiza
            por encima de la política), rojo si es < 0. `null` si ninguna ruta tiene costo. No reemplaza a `desviacion_promedio_margen`,
            que solo promedia los ajustes negociados (ADR-016).
        rutas_sin_margen_politica:
          type: integer
          description: |
            HU-016.1 (#154). Rutas del universo (versión vigente, no rechazadas) con margen aplicado pero sin margen de política
            guardado (datos anteriores a HU-021): no entran en los tres campos anteriores. **HU-016.2 (#295): solo cuenta las de
            cotizaciones finalizadas** (0 si no hay ninguna finalizada). Sirve para avisar que la comparación está incompleta.

    PuntoSerieMensual:
      type: object
      description: |
        Un mes (America/Bogota, por la primera creación de la cadena) del periodo, para la línea de tiempo. La serie trae todos los meses del periodo en orden,
        también los que no tienen cotizaciones (en 0). Mismo universo y mismas definiciones que `IndicadoresMetricas`.
        HU-034.1 (#201): cada mes trae también `costeo_total`, `costeo_ganadas` y `ganancias`, con la definición exacta de
        `IndicadoresMetricas` (COP, USD × TRM, sin rutas rechazadas, lo ganado de la versión ganada). Como todos los montos de
        origen tienen 2 decimales, la suma de los meses de la serie es exactamente el valor de `indicadores` del mismo periodo
        (para `cantidad`, `ganadas`, `perdidas`, `valor_cotizado_cop`, `valor_ganado_cop`, `costeo_total`, `costeo_ganadas` y
        `ganancias`).
      required: [mes, cantidad, ganadas, perdidas, valor_cotizado_cop, valor_ganado_cop, costeo_total, costeo_ganadas, ganancias]
      properties:
        mes:
          type: string
          pattern: '^\d{4}-\d{2}$'
          example: '2026-09'
        cantidad:
          type: integer
        ganadas:
          type: integer
        perdidas:
          type: integer
        valor_cotizado_cop:
          type: number
        valor_ganado_cop:
          type: number
        costeo_total:
          type: number
          description: HU-034.1 (#201). SUM(`costo`) en COP de las cotizaciones del mes (como `IndicadoresMetricas.costeo_total`).
        costeo_ganadas:
          type: number
          description: HU-034.1 (#201). SUM(`costo`) en COP de las ganadas del mes, de la versión ganada (como `IndicadoresMetricas.costeo_ganadas`).
        ganancias:
          type: number
          description: |
            HU-034.1 (#201). SUM(`valor_cop` − `costo`) de las ganadas del mes con precio y costo (como
            `IndicadoresMetricas.ganancias`). Base de "Ganancias por mes" y "mes actual vs. mes anterior" del tablero.

    MetricaCiudad:
      type: object
      description: |
        Cotizaciones con ese municipio (nombre del catálogo de Nexo guardado en la ruta 1 de la cotización; una
        solicitud de varias rutas cuenta solo la ciudad de su ruta 1, una vez).
      required: [ciudad, cantidad, ganadas, valor_cotizado_cop, valor_ganado_cop]
      properties:
        ciudad:
          type: string
        cantidad:
          type: integer
        ganadas:
          type: integer
        valor_cotizado_cop:
          type: number
        valor_ganado_cop:
          type: number
          description: Valor cotizado de las ganadas en COP (no dinero recaudado; en la UI "Valor ganado (COP)").

    ConcentracionCiudades:
      type: object
      description: |
        Concentración por municipio para el mapa (HU-010.3). `por_destino` es la vista principal (dónde se entrega);
        `por_origen` se da como complemento. Ordenadas por `cantidad` descendente y luego por nombre. Las cotizaciones del
        chat no guardan ciudades y cuentan en `sin_destino`/`sin_origen`.
      required: [disponible, por_destino, por_origen, sin_destino, sin_origen]
      properties:
        disponible:
          type: boolean
          description: '`false` mientras el esquema no tenga las columnas `origen`/`destino` (script 0004 sin aplicar).'
        por_destino:
          type: array
          items:
            $ref: '#/components/schemas/MetricaCiudad'
        por_origen:
          type: array
          items:
            $ref: '#/components/schemas/MetricaCiudad'
        sin_destino:
          type: integer
        sin_origen:
          type: integer

    MetricaLineaNegocio:
      type: object
      description: |
        Apertura por línea de negocio, POR RUTA (HU-021, decisión 8). Una fila por línea de negocio de las rutas de las
        cotizaciones del universo; `linea_negocio_id`/`linea_negocio` en `null` agrupa las rutas sin línea. Los conteos
        son de cotizaciones distintas con al menos una ruta de la línea: una cotización con rutas de 3 líneas aparece en
        las 3 filas, así que la suma de `cotizaciones` de la apertura puede superar `indicadores.cantidad`. Los valores
        son solo de las rutas de esa línea. Ordenada por `valor_cotizado_cop` descendente y luego por nombre (las rutas
        sin línea al final).
      required: [linea_negocio_id, linea_negocio, cotizaciones, ganadas, perdidas, rutas, costeo_total, costeo_ganadas,
                 valor_cotizado_cop, valor_ganado_cop, ganancias, margen_ponderado, ajustes_margen, desviacion_promedio_margen]
      properties:
        linea_negocio_id:
          type: integer
          nullable: true
          description: '`MargenesPolitica.id` de la ruta (`CotizacionLineasSolicitud.lineaNegocioId`).'
        linea_negocio:
          type: string
          nullable: true
          description: '`MargenesPolitica.lineaNegocio`.'
        cotizaciones:
          type: integer
          description: Cotizaciones (cadenas) distintas con al menos una ruta de esta línea.
        ganadas:
          type: integer
          description: De esas, con resultado ganada.
        perdidas:
          type: integer
          description: De esas, con resultado perdida.
        rutas:
          type: integer
          description: Rutas de esta línea (de la versión vigente de cada cotización).
        costeo_total:
          type: number
          description: SUM(`costoFinal`) en COP de las rutas de la línea.
        costeo_ganadas:
          type: number
          description: SUM(`costoFinal`) de las rutas de la línea en cotizaciones ganadas.
        valor_cotizado_cop:
          type: number
          description: SUM(`valor_cop` de cada ruta) = `precioFinalLinea` en COP, o `round(precioFinalLinea × trmAplicada, 2)` en USD.
        valor_ganado_cop:
          type: number
          description: Lo mismo, solo de las rutas de cotizaciones ganadas (valor cotizado, no recaudado).
        ganancias:
          type: number
          description: SUM(`valor_cop` − `costoFinal`) de las rutas de cotizaciones ganadas con precio y costo.
        margen_ponderado:
          type: number
          nullable: true
          description: SUM(precio de la ruta en COP − `costoFinal`) / SUM(precio de la ruta en COP) de las rutas de la línea con costo > 0 y precio > 0. `null` si ninguna.
        ajustes_margen:
          type: integer
          description: '`MargenAjustes` de esas rutas (`lineaSolicitudId`; un ajuste sin ruta cuenta en la ruta 1 de su cotización).'
        desviacion_promedio_margen:
          type: number
          nullable: true
          description: Promedio de `MargenAjustes.diferencia` (con signo) de esos ajustes (4 decimales). `null` sin ajustes con diferencia.

    MetricasComercial:
      type: object
      required: [periodo, usuario_id, indicadores, serie_mensual, por_linea_negocio]
      properties:
        periodo:
          $ref: '#/components/schemas/PeriodoMetricas'
        usuario_id:
          type: string
          format: uuid
        indicadores:
          $ref: '#/components/schemas/IndicadoresMetricas'
        serie_mensual:
          type: array
          items:
            $ref: '#/components/schemas/PuntoSerieMensual'
        por_linea_negocio:
          type: array
          description: Apertura por línea de negocio, por ruta (HU-021). Vacía si no hay cotizaciones con rutas.
          items:
            $ref: '#/components/schemas/MetricaLineaNegocio'

    ComercialRegional:
      type: object
      description: |
        Un usuario de la regional con su rol y sus indicadores del periodo (para el selector del tablero). El gerente
        aparece también en la lista.
      required: [usuario_id, nombre_usuario, nombre_completo, rol, indicadores]
      properties:
        usuario_id:
          type: string
          format: uuid
        nombre_usuario:
          type: string
          nullable: true
        nombre_completo:
          type: string
          nullable: true
        rol:
          type: string
          nullable: true
          description: "`comercial`, `gerente_comercial`, `director` (HU-037) o `null`: rol interno asignado en `UsuariosRoles` (se fija en el login SSO, ADR-009); `null` si no tiene asignación activa."
        indicadores:
          $ref: '#/components/schemas/IndicadoresMetricas'

    MetricasRegional:
      type: object
      required: [periodo, regional, fuente_regional, usuario_id, indicadores, lineas_negocio_activas, comerciales,
                 serie_mensual, concentracion_ciudades, por_linea_negocio]
      properties:
        periodo:
          $ref: '#/components/schemas/PeriodoMetricas'
        regional:
          type: string
          nullable: true
          description: |
            Regional del gerente autenticado. HU-037.3 (#211): para el `director`, la regional que pidió con `?regional=` o `null`
            si ve todas.
        fuente_regional:
          type: string
          nullable: true
          enum: [dim_ejecutivo, usuarios_web, null]
          description: |
            De dónde salió la regional del gerente (`DWCubosEBSSAP.DimEjecutivo` o `UsuariosWeb.regional`). `null` para el
            `director` (la regional no se resuelve de su usuario).
        usuario_id:
          type: string
          format: uuid
          nullable: true
          description: Comercial filtrado, o `null` si los indicadores son de toda la regional.
        indicadores:
          $ref: '#/components/schemas/IndicadoresMetricas'
        lineas_negocio_activas:
          type: integer
          description: Líneas de `MargenesPolitica` con `isActive = 1` (no depende del periodo ni de la regional).
        comerciales:
          type: array
          description: |
            Todos los usuarios del alcance (la regional, también el gerente; para el director sin `regional`, todos los usuarios),
            ordenados por nombre, aunque se filtre por `usuario_id`.
          items:
            $ref: '#/components/schemas/ComercialRegional'
        serie_mensual:
          type: array
          items:
            $ref: '#/components/schemas/PuntoSerieMensual'
        concentracion_ciudades:
          $ref: '#/components/schemas/ConcentracionCiudades'
        por_linea_negocio:
          type: array
          description: Apertura por línea de negocio, por ruta, de la regional o del comercial filtrado (como `indicadores`).
          items:
            $ref: '#/components/schemas/MetricaLineaNegocio'

    Regionales:
      type: object
      required: [regionales]
      description: HU-037.3 (#211). Respuesta de `GET /web/regionales`.
      properties:
        regionales:
          type: array
          description: Regionales visibles para el usuario, sin repetir y ordenadas por nombre (el gerente, solo la suya).
          items:
            type: string

    TelefonoComercial:
      type: object
      required: [telefono]
      description: Respuesta de `GET` y `PUT /web/usuario/telefono`. El teléfono guardado (recortado) o `null` si no hay.
      properties:
        telefono:
          type: string
          nullable: true
          pattern: '^\+?[0-9 ]{7,20}$'

    TelefonoComercialWeb:
      type: object
      description: |
        Endurecimiento A (#199): cuerpo de `PUT /web/usuario/telefono` (antes compartía `TelefonoComercial`). `telefono` es opcional:
        ausente, `null`, vacío o solo espacios BORRAN el teléfono. Con valor, se recorta y debe cumplir `^\+?[0-9 ]{7,20}$`; si no,
        400 `ErrorWeb` (`TELEFONO_INVALIDO`).
      properties:
        telefono:
          type: string
          nullable: true
          pattern: '^\s*(\+?[0-9 ]{7,20})?\s*$'

    Destinatarios:
      type: object
      required: [para, cc]
      properties:
        para:
          type: array
          items:
            type: string
            format: email
        cc:
          type: array
          items:
            type: string
            format: email

    ResultadoBusquedaClientes:
      type: object
      required: [exacta, candidatos]
      properties:
        exacta:
          type: boolean
          description: Único candidato encontrado (ver descripción del endpoint sobre el criterio provisional).
        candidatos:
          type: array
          items:
            $ref: '#/components/schemas/ClienteEncontrado'

    ClienteEncontrado:
      type: object
      required: [nit_cliente, nombre, origen_cliente]
      properties:
        nit_cliente:
          type: string
        nombre:
          type: string
        origen_cliente:
          type: string
          enum: [cliente, prospecto]
        bp:
          type: string
          nullable: true
          description: BP de Nexo; nunca se muestra al comercial (solo se usa internamente para consultar SAP TM).

    TipoMercancia:
      type: object
      required: [codigo, nombre, cubicable, condicionada_cubicacion, activo]
      description: HU-021.5 (#133) y HU-023.1 (#156). Un tipo de mercancía del catálogo del cubicador (`GET /web/tipos-mercancia`).
      properties:
        codigo:
          type: string
          maxLength: 64
          description: Código estable del cubicador (por ejemplo `BEBIDAS`); es el `codigo_mercancia` de cada mercancía de la captura.
        nombre:
          type: string
          description: Nombre que Cotifly guarda como `nombre_mercancia` (copia).
        categoria:
          type: string
          nullable: true
        cubicable:
          type: boolean
          description: Si es `false`, el cubicador responde `MERCANCIA_NO_CUBICABLE`.
        condicionada_cubicacion:
          type: boolean
          description: Si es `true`, la ruta queda condicionada (va a la Mesa de Costeo).
        comentario_condicion:
          type: string
          nullable: true
        activo:
          type: boolean
        id:
          type: string
          format: uuid
          nullable: true
          deprecated: true
          description: Uuid del catálogo; solo traduce el `id_tipo_mercancia` anterior durante la transición.

    TipoCarroceria:
      type: object
      required: [codigo, nombre, activo]
      description: HU-023.1 (#156). Una carrocería del catálogo del cubicador (`GET /web/tipos-carroceria`).
      properties:
        codigo:
          type: string
        nombre:
          type: string
        activo:
          type: boolean

    TipoVehiculo:
      type: object
      required: [codigo, nombre, carrocerias, activo]
      description: HU-023.1 (#156). Un tipo de vehículo del catálogo del cubicador (`GET /web/tipos-vehiculo`, petición P1).
      properties:
        codigo:
          type: string
          description: Código que guarda el camión en `tipo_vehiculo` (`2S2`, `C2`, `3S3`...).
        nombre:
          type: string
          description: Nombre que se muestra en pantalla y en el PDF.
        carrocerias:
          type: array
          items:
            type: string
          description: Códigos de carrocería compatibles.
        activo:
          type: boolean

    Municipio:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          description: Id del municipio en el catálogo de Nexo.
        codigo_dane:
          type: string
          nullable: true
        municipio:
          type: string
          nullable: true
        departamento:
          type: string
          nullable: true
        pais:
          type: string
          nullable: true

    MotivosPerdida:
      type: object
      required: [motivos]
      description: HU-018.1 (#155). Respuesta de `GET /web/motivos-perdida`.
      properties:
        motivos:
          type: array
          items:
            $ref: '#/components/schemas/MotivoPerdida'

    MotivoPerdida:
      type: object
      required: [motivo, requiere_comentario]
      properties:
        motivo:
          type: string
          maxLength: 100
          description: El texto exacto que se envía en `motivo` (`/resultado`) o en `motivo_rechazo` (`/seguimiento`).
          example: Valor muy alto
        requiere_comentario:
          type: boolean
          description: '`true` en el motivo que exige `comentario` (`Otro`).'

    OpcionCatalogo:
      type: object
      required: [valor, etiqueta]
      properties:
        valor:
          type: string
          description: Valor interno de la opción (el que viaja en la cotización).
        etiqueta:
          type: string
          description: Texto legible para mostrar en el formulario.

    AliasResueltos:
      type: object
      description: HU-031.1 (#194). Respuesta de `GET /web/alias/resolver`.
      required: [tipo, resultados]
      properties:
        tipo:
          type: string
          enum: [vehiculo, contenedor]
        resultados:
          type: array
          items:
            $ref: '#/components/schemas/AliasResuelto'

    AliasResuelto:
      type: object
      required: [texto, reconocido, codigo, fuente]
      properties:
        texto:
          type: string
          description: El texto pedido, recortado.
        reconocido:
          type: boolean
          description: '`false` si ni el catálogo oficial ni el diccionario de alias de Nexo lo conocen.'
        codigo:
          type: string
          nullable: true
          description: El código oficial de Nexo (`2L2`, `CNT40.HC`), el que hay que guardar y enviar; `null` si no se reconoce.
        fuente:
          type: string
          nullable: true
          enum: [catalogo, alias, null]
          description: '`catalogo` (ya era un código oficial), `alias` (lo tradujo el diccionario) o `null`.'

    NormalizarValoresWeb:
      type: object
      description: HU-044.4 (#255). Cuerpo de `POST /web/licitaciones/normalizar-valores`.
      required: [valores]
      properties:
        nit_cliente:
          type: string
          nullable: true
          maxLength: 30
          description: NIT del cliente de la licitación (con o sin puntos y dígito de verificación). Opcional.
        valores:
          type: array
          minItems: 1
          maxItems: 1000
          description: Solo los textos distintos del Excel.
          items:
            type: object
            required: [campo, valor]
            properties:
              campo:
                type: string
                enum: [tipo_vehiculo, carroceria, ciudad, linea_negocio]
              valor:
                type: string
                maxLength: 150
                description: |
                  El texto tal como viene en la celda (no vacío). Los 150 se miden después de recortar los espacios de los extremos y en
                  unidades UTF-16 (`string.length`): un emoji o una tilde descompuesta cuentan 2. Más largo: `VALOR_DEMASIADO_LARGO`.

    NormalizacionValores:
      type: object
      description: HU-044.4 (#255). Respuesta de `POST /web/licitaciones/normalizar-valores`.
      required: [ia_usada, motivo_sin_ia, valores]
      properties:
        ia_usada:
          type: boolean
          description: '`true` si NEXO usó IA en esta petición.'
        motivo_sin_ia:
          type: string
          nullable: true
          description: |
            Por qué no se usó IA: `SIN_PENDIENTES` (las reglas resolvieron todo, o Cotifly no tuvo que llamar a NEXO),
            `IA_NO_DISPONIBLE` o un `IA_*` del proveedor de NEXO; `null` si la IA participó. No es un error.
        valores:
          type: array
          items:
            $ref: '#/components/schemas/ValorNormalizado'

    ValorNormalizado:
      type: object
      required: [campo, valor, estado, codigo, descripcion, municipio_id, origen, confianza, nota, candidatos, linea_nexo, lineas_candidatas]
      properties:
        campo:
          type: string
          enum: [tipo_vehiculo, carroceria, ciudad, linea_negocio]
        valor:
          type: string
          description: El valor pedido, sin los espacios de los extremos.
        estado:
          type: string
          enum: [resuelto, ambiguo, sin_resolver]
        codigo:
          type: string
          nullable: true
          description: |
            El valor oficial: código de vehículo (`2L2`) o de carrocería (`FURGON`), código de la ciudad según NEXO o, en
            `linea_negocio`, el **nombre de la línea de negocio de Cotifly**. `null` si no se resolvió.
        descripcion:
          type: string
          nullable: true
        municipio_id:
          type: integer
          nullable: true
          description: Solo en una ciudad resuelta, el id de municipio de NEXO (el de `GET /web/municipios`).
        origen:
          type: string
          description: |
            Quién lo resolvió: el texto de NEXO tal cual, sin lista cerrada (`diccionario`, `alias`, `catalogo`, `ia`, `ninguno`...), o `linea_cotifly` si
            Cotifly reconoció una línea de negocio propia sin NEXO. Con `ia` es una propuesta para confirmar.
        confianza:
          type: number
          minimum: 0
          maximum: 1
        nota:
          type: string
          nullable: true
          description: Explicación de NEXO o de Cotifly (por ejemplo, por qué una línea de negocio quedó sin resolver).
        candidatos:
          type: array
          nullable: true
          description: Solo en una ciudad `ambigua` (máx. 8).
          items:
            type: object
            required: [municipio_id, codigo_dane, municipio, departamento]
            properties:
              municipio_id:
                type: integer
              codigo_dane:
                type: string
              municipio:
                type: string
              departamento:
                type: string
        linea_nexo:
          type: string
          nullable: true
          description: Solo en `linea_negocio`, la línea de NEXO (una de las seis, escrita como en el contrato) de la que sale `codigo`.
        lineas_candidatas:
          type: array
          nullable: true
          description: Solo en `linea_negocio` ambigua, las líneas de Cotifly que comparten `linea_nexo`.
          items:
            type: string

    AplicarMapeoWeb:
      type: object
      description: HU-044.3 (#254, provisional). Cuerpo de `POST /web/licitaciones/aplicar-mapeo`.
      required: [columnas, filas]
      properties:
        nit_cliente:
          type: string
          nullable: true
          maxLength: 30
          description: NIT del cliente de la licitación (con o sin puntos y dígito de verificación). Opcional.
        columnas:
          type: array
          minItems: 1
          maxItems: 100
          description: El mapeo confirmado (al menos una columna con su campo).
          items:
            type: object
            required: [indice, campo]
            properties:
              indice:
                type: integer
                minimum: 0
                maximum: 99
              campo:
                type: string
                maxLength: 50
                description: Campo de NEXO (camelCase) o `ignorar`.
              transformacion:
                type: string
                nullable: true
                maxLength: 50
                description: Transformación de NEXO (`peso_toneladas_a_kg`, `dividir_origen_destino`...); vacía o ausente = ninguna.
        filas:
          type: array
          maxItems: 5000
          description: Todas las filas de la hoja, sin el encabezado (máx. 5000, el tope de NEXO). Cada celda es texto.
          items:
            type: array
            items:
              type: string
              nullable: true
        primera_fila:
          type: integer
          nullable: true
          minimum: 2
          maximum: 1048576
          description: Número de Excel de la primera fila enviada (la del encabezado + 1). Por defecto 2, como NEXO.

    MapeoAplicado:
      type: object
      description: HU-044.3 (#254, provisional). Respuesta de `POST /web/licitaciones/aplicar-mapeo`.
      required: [total_filas, filas_vacias, filas_con_errores, total_errores, lineas, errores]
      properties:
        total_filas:
          type: integer
          description: Total de filas que procesó NEXO.
        filas_vacias:
          type: integer
          description: Filas sin datos que NEXO descartó.
        filas_con_errores:
          type: integer
          description: Filas con error (las que rechazó NEXO más las que Cotifly marcó por su línea de negocio).
        total_errores:
          type: integer
          description: Total de errores por fila (NEXO devuelve hasta 100 en `errores[]`; este número los cuenta todos).
        lineas:
          type: array
          description: Las líneas traducidas, en el orden del archivo. Una fila sin equivalencia de línea de negocio también vuelve aquí.
          items:
            $ref: '#/components/schemas/LineaLicitacionImportada'
        errores:
          type: array
          description: Errores por fila, ordenados por `fila_excel`.
          items:
            $ref: '#/components/schemas/ErrorFilaImportada'

    ErrorFilaImportada:
      type: object
      description: HU-044.3 (#254). Un error de una fila de `aplicar-mapeo` (los mismos nombres que `ErrorFilaLicitacion`, sin `indice`).
      required: [fila, fila_excel, campo, codigo, mensaje]
      properties:
        fila:
          type: integer
          nullable: true
          minimum: 0
          description: Índice base 0 de la fila en las `filas` enviadas; `null` si NEXO la numeró fuera de ellas.
        fila_excel:
          type: integer
          description: Número de fila de Excel que dio NEXO (`primera_fila` + posición).
        campo:
          type: string
          description: El campo (los de NEXO tal como los manda NEXO; `linea_negocio` en el de Cotifly; `fila` si es de toda la fila).
        codigo:
          type: string
          description: Código del error (de NEXO, o `LINEA_NEGOCIO_SIN_EQUIVALENCIA` de Cotifly).
        mensaje:
          type: string

    MercanciaImportada:
      type: object
      description: |
        HU-044.3 (#254). Una posición de NEXO como mercancía de Cotifly: un subconjunto de `PosicionCargaWeb` con los mismos nombres. La
        descripción de NEXO va en `descripcion` y en `nombre_mercancia` (los dos nombres del campo).
      required: [codigo_mercancia, descripcion, nombre_mercancia, cantidad, largo_cm, ancho_cm, alto_cm, peso_kg]
      properties:
        codigo_mercancia:
          type: string
          nullable: true
          maxLength: 64
          description: Código del catálogo del cubicador (el del Excel o el sugerido por la descripción); `null` si no se encontró uno.
        descripcion:
          type: string
          nullable: true
          maxLength: 200
        nombre_mercancia:
          type: string
          nullable: true
          maxLength: 200
        cantidad:
          type: integer
          minimum: 1
          maximum: 100000
        largo_cm:
          type: number
          nullable: true
          minimum: 0
          maximum: 999999
          description: '`null` las tres medidas si NEXO no trae ninguna.'
        ancho_cm:
          type: number
          nullable: true
          minimum: 0
          maximum: 999999
        alto_cm:
          type: number
          nullable: true
          minimum: 0
          maximum: 999999
        peso_kg:
          type: number
          nullable: true
          minimum: 0
          maximum: 999999.99
          description: Peso por unidad en kg.

    LineaLicitacionImportada:
      type: object
      description: |
        HU-044.3 (#254). Una fila traducida a la línea de licitación de Cotifly: un subconjunto de `LineaLicitacionWeb` con los mismos
        nombres y significado, MÁS `fila_excel` (el número de Excel) y `linea_nexo` (la línea de negocio de NEXO). Va tal cual en
        `lineas[]` de `POST /web/licitaciones`. Los ids de municipio van siempre en `null`.
      required:
        - fila
        - fila_excel
        - linea_negocio
        - linea_nexo
        - origen
        - destino
        - origen_municipio_id
        - destino_municipio_id
        - horas_cargue
        - horas_descargue
        - tipo_vehiculo
        - carroceria
        - tipologia
        - clase_viaje
        - clase_contenedor
        - exclusivo
        - consolidado
        - retorna_contenedor
        - ciudad_devolucion_contenedor
        - ciudad_devolucion_municipio_id
        - levante_contenedor_diferente
        - ciudad_levante_contenedor
        - ciudad_levante_municipio_id
        - peso_kg
        - valor_mercancia
        - mercancias
      properties:
        fila:
          type: integer
          nullable: true
          minimum: 0
          description: Índice base 0 en las `filas` enviadas (`fila = fila_excel - primera_fila`); `null` si NEXO la numeró fuera.
        fila_excel:
          type: integer
          description: Número de fila de Excel que dio NEXO. No está en `LineaLicitacionWeb` (es solo para pintar la revisión).
        linea_negocio:
          type: string
          nullable: true
          description: Línea de negocio de **Cotifly** (ADR-029); `null` sin texto o sin equivalencia (entonces va también a `errores[]`).
        linea_nexo:
          type: string
          nullable: true
          description: Línea de negocio de NEXO de la que sale. No está en `LineaLicitacionWeb`.
        origen:
          type: string
          maxLength: 150
        destino:
          type: string
          maxLength: 150
        origen_municipio_id:
          type: integer
          nullable: true
          description: Siempre `null` (lo resuelve el alta por el texto de `origen`).
        destino_municipio_id:
          type: integer
          nullable: true
          description: Siempre `null`.
        horas_cargue:
          type: number
          nullable: true
          minimum: 0
          maximum: 240
        horas_descargue:
          type: number
          nullable: true
          minimum: 0
          maximum: 240
        tipo_vehiculo:
          type: string
          nullable: true
          maxLength: 100
        carroceria:
          type: string
          nullable: true
          maxLength: 100
        tipologia:
          type: string
          nullable: true
          maxLength: 50
        clase_viaje:
          type: string
          nullable: true
          maxLength: 50
        clase_contenedor:
          type: string
          nullable: true
          maxLength: 20
        exclusivo:
          type: boolean
          nullable: true
        consolidado:
          type: boolean
          nullable: true
        retorna_contenedor:
          type: boolean
          nullable: true
        ciudad_devolucion_contenedor:
          type: string
          nullable: true
          maxLength: 150
        ciudad_devolucion_municipio_id:
          type: integer
          nullable: true
          description: Siempre `null`.
        levante_contenedor_diferente:
          type: boolean
          nullable: true
        ciudad_levante_contenedor:
          type: string
          nullable: true
          maxLength: 150
        ciudad_levante_municipio_id:
          type: integer
          nullable: true
          description: Siempre `null`.
        peso_kg:
          type: number
          nullable: true
          minimum: 0
          maximum: 999999.99
          description: La carga, sin tara (la tara solo aplica a Contenedor y la pone el comercial).
        valor_mercancia:
          type: number
          nullable: true
          minimum: 0
          maximum: 9999999999999.99
        mercancias:
          type: array
          nullable: true
          maxItems: 200
          items:
            $ref: '#/components/schemas/MercanciaImportada'

    CatalogosFlete:
      type: object
      required: [tipos_vehiculo, tipos_carroceria, clases_viaje, clases_contenedor]
      properties:
        tipos_vehiculo:
          type: array
          items:
            $ref: '#/components/schemas/OpcionCatalogo'
        tipos_carroceria:
          type: array
          items:
            $ref: '#/components/schemas/OpcionCatalogo'
        clases_viaje:
          type: array
          items:
            $ref: '#/components/schemas/OpcionCatalogo'
        clases_contenedor:
          type: array
          description: |
            HU-027.1 (#179). Clases de contenedor de Nexo (`GET /api/catalogos/clases-contenedor`), sin la lista provisional
            G15. `valor` = `etiqueta` = la `descripcion` de Nexo, que es el código (`CNT40.HC`) y el valor que se envía en
            `clase_contenedor`. Puede venir vacía (`[]`) si Nexo no tiene la base de SAP configurada o el catálogo falla.
          items:
            $ref: '#/components/schemas/OpcionCatalogo'

    ResultadoWeb:
      type: object
      required: [resultado]
      properties:
        resultado:
          type: string
          enum: [ganada, perdida]
        motivo:
          type: string
          nullable: true
          description: |
            Perdida: máximo 100 caracteres (límite de Nexo, si no 400); se guarda en `motivo_rechazo` y se envía a Nexo. Ganada
            (HU-021.13): no se valida el largo ni se guarda (`motivo_rechazo` queda `"No aplica"`); a Nexo se envía solo si tiene 100
            caracteres o menos. HU-018.1 (#155): en una perdida (también la perdida solo en Cotifly de HU-013.17 y la pendiente de
            sincronizar de HU-033) es **obligatorio** y debe ser uno de `GET /web/motivos-perdida` (sin distinguir mayúsculas); si no,
            400 `MOTIVO_NO_PERMITIDO`. A Nexo va con la escritura de la lista (su contrato no cambia). Con `Otro`, Cotifly guarda
            `"Otro: {comentario}"` en `motivo_rechazo` y a Nexo van `motivo = "Otro"` y el `comentario` aparte. Las cotizaciones
            marcadas antes con un motivo libre o sin motivo no se revalidan.
        comentario:
          type: string
          nullable: true
          maxLength: 500
          description: |
            Se reenvía a Nexo; no se guarda en Cotifly salvo con el motivo `Otro` (HU-018.1, #155), donde es **obligatorio** (400
            `MOTIVO_NO_PERMITIDO` con `detalle.requiere_comentario = true`) y queda en `motivo_rechazo` como `"Otro: {comentario}"`.

    ServicioConexoCosteo:
      type: object
      required: [id, nombre, categoria, cantidad, precio, incluido]
      description: |
        Servicio conexo del costeo de Nexo con su precio. Nunca trae el costo. HU-043.2 (#251): `precio` es el precio de VENTA del conexo
        (venta unitaria × cantidad, en la moneda de la cotización), SIN margen: no cambia al ajustar el margen de la ruta.
      properties:
        id:
          type: string
        nombre:
          type: string
          nullable: true
        categoria:
          type: string
          example: adicional
          description: |
            #173. Categoría del servicio en el catálogo de Nexo (`logistico`, `adicional`...), por el id del catálogo o, si el conexo
            se guardó con el id de la fila de Nexo, por su nombre. `logistico` solo si el catálogo de Nexo no responde o no lo tiene.
        cantidad:
          type: number
        precio:
          type: number
          description: |
            HU-043.2 (#251): venta del conexo sin margen (en COP a pesos enteros; en USD convertida con `trm_aplicada`). Una cotización
            finalizada o con PDF antes de HU-043.2 conserva su precio y muestra sus conexos como se cotizaron (con el margen de la ruta).
        incluido:
          type: boolean
          description: "Si va en el precio y en el PDF (HU-021, siempre `true`: un conexo de la ruta va en el precio y en el PDF)."
        linea_orden:
          type: integer
          nullable: true
          description: HU-021.8. Ruta a la que pertenece el conexo (`rutas[].linea_orden`).
        estado_nexo:
          type: string
          nullable: true
          enum: [pendiente, enviado, incierto, fallido_definitivo, null]
          description: |
            Decisión 10 (HU-021.9, #136). Estado del envío diferido del conexo a la cotización de Nexo: `pendiente` (se envía cuando
            Nexo costea la línea del primer camión vigente de la ruta, o se reintentará), `enviado`, `incierto` (Nexo no respondió y
            su cotización no lo muestra: revisar en Nexo; Cotifly no lo reenvía solo) o `fallido_definitivo` (se agotaron los
            reintentos, el conexo no tiene servicio en el catálogo de Nexo ni por id ni por nombre o, #259, la cotización ya no se
            costea y ningún camión vigente de la ruta tiene línea en Nexo: revisar en Nexo). #259 (ADR-031): si el primer camión no
            tiene línea cuando la cotización ya no se costea, el conexo va a la línea del primer camión vigente que sí la tiene. En
            `GET .../costeo` y, desde #173, también en las respuestas de `PUT .../costeo/margen` y `PUT .../costeo/servicios-conexos`
            (igual que el GET). `null` antes de enviar la solicitud a Nexo y en las demás mutaciones.
        servicio_id:
          type: string
          nullable: true
          description: |
            HU-041.1 (#231). Id del servicio en el CATÁLOGO de Nexo (el `id` de `GET /web/servicios-conexos`): identifica el mismo conexo
            en varias rutas sin comparar por nombre y es el que piden `POST .../costeo/servicios-conexos/lineas` y `.../lineas/quitar`.
            `id` puede ser el de la fila de la cotización de Nexo (conexo agregado o importado); `servicio_id` es siempre el del
            catálogo. `null` en conexos guardados antes de #188 o si Nexo no lo informó.

    RutaCosteo:
      type: object
      required: [linea_orden, linea_solicitud_id, origen, destino, estado_costeo, precio_final_linea, costo_final, costo_transporte, valor_mercancia, margen_aplicado, margen_sugerido, origen_margen, servicios_conexos, camiones, mercancias]
      description: |
        HU-021.8 (#135). Una ruta del costeo. Desde HU-039.1 (#218) trae su costo bruto (`costo_final`, en COP) para el dueño; nunca
        el desglose (fletes, retorno, levante, conexos) ni el costo de cada camión o de cada conexo. El ajuste de margen (`PUT .../costeo/margen`) y los cambios de
        conexos (`PUT`/`POST .../costeo/servicios-conexos`) dicen a qué ruta aplican con `linea_orden` o `linea_solicitud_id`.
        HU-021.9 (#136): trae también su línea de negocio, su peso, sus camiones y sus mercancías.
      properties:
        linea_negocio_id:
          type: integer
          nullable: true
          description: HU-021.9. Línea de negocio de la ruta (id de `MargenesPolitica`); define su margen.
        incluye_seguro:
          type: boolean
          description: HU-045.2 (#264). ¿La ruta incluye el seguro de la mercancía? (el check de `PUT .../costeo/seguro`).
        tasa_seguro:
          type: number
          nullable: true
          description: |
            HU-045.2 (#264). La tasa con que se calculó el seguro de la ruta (fracción: 0.003450 = 0,345 %), copiada de la vigente al
            marcarlo (y otra vez si cambia `valor_mercancia`); un cambio de la tasa vigente no la toca. `null` sin seguro o sin valor de
            la mercancía.
        valor_seguro:
          type: number
          nullable: true
          description: |
            HU-045.2 (#264). El seguro de la mercancía de la ruta (`valor_mercancia × tasa_seguro` en pesos, sin redondear a pesos: en centavos) en la moneda de
            la cotización (en USD, convertido con `trm_aplicada`). Es venta, sin margen, y ya está sumado en `precio_final_linea`.
            `null` sin seguro o sin valor de la mercancía (la ruta lo tiene marcado pero no suma).
        peso_kg:
          type: number
          nullable: true
          description: HU-021.9. Peso total que declaró el comercial para la ruta.
        peso_con_tara_kg:
          type: number
          nullable: true
          description: |
            HU-030.1 (#184). Peso total de la ruta con la tara de los contenedores (solo una ruta `Contenedor` que la trae); `null` =
            a Nexo va el peso de carga. Cada camión trae su parte en `camiones[].peso_con_tara_kg`.
        camiones:
          type: array
          description: |
            HU-021.9. Los camiones de la ruta en su orden estable (el primero vigente lleva los conexos en Nexo). Sin costos ni ids
            de Nexo. Los `descartada` vienen con su estado y no cuentan en el precio.
          items:
            $ref: '#/components/schemas/CamionCosteo'
        vehiculos:
          type: string
          nullable: true
          description: HU-021.9. Los camiones agrupados como los imprime el PDF ("2 × 3S3 - FURGON (20000 KG)"); `null` sin datos.
        mercancias:
          type: array
          description: HU-021.9. Las mercancías de la ruta, en su orden.
          items:
            $ref: '#/components/schemas/MercanciaCosteo'
        resultado_cubicacion:
          type: string
          nullable: true
          enum: [ASIGNADO, SIN_SELECCION_AUTOMATICA, null]
          description: HU-023.3 (#158). Qué respondió el cubicador para la ruta; `null` si no pasó por el cubicador.
        motivo_sin_seleccion:
          type: string
          nullable: true
          enum: [EXTRADIMENSIONADO, SIN_CANDIDATOS_DIMENSIONALES, SUPERA_K_MAX, SIN_CARROCERIA_COMPATIBLE, BUSQUEDA_AGOTADA, null]
          description: |
            HU-023.3. Por qué el cubicador no pudo escoger (solo con `SIN_SELECCION_AUTOMATICA`). HU-023 (#176): si la base no tiene el
            script 07, `BUSQUEDA_AGOTADA` se guarda en `null` y el motivo real queda en la advertencia `MOTIVO_SIN_SELECCION` de
            `avisos_cubicacion` (solo si la ruta guarda sus avisos, HU-023.5). El texto para el comercial está siempre en
            `mensaje_sin_seleccion`.
        mensaje_sin_seleccion:
          type: string
          nullable: true
          description: |
            HU-023 (#176). Con `SIN_SELECCION_AUTOMATICA`, el texto para el comercial según el motivo (con `BUSQUEDA_AGOTADA` no dice que
            la carga no cabe: es un límite del algoritmo del cubicador); `null` en los demás casos.
        condicionada:
          type: boolean
          description: HU-023.3. La ruta va a la Mesa de Costeo por una mercancía condicionada.
        avisos_cubicacion:
          $ref: '#/components/schemas/AvisosCubicacion'
        aviso_conexos_nexo:
          type: string
          nullable: true
          description: |
            Decisión 10 (HU-021.9). Aviso cuando algún conexo de la ruta quedó `incierto` o `fallido_definitivo` en su envío a Nexo
            (el comercial o la Mesa deben revisarlo en Nexo); `null` si no hay nada que revisar. Solo en `GET .../costeo`.
        margen_sap_anomalo:
          type: boolean
          description: |
            HU-009 (#139). SAP TM propuso para la ruta un margen fuera de [0, 60 %] ("anómalo"): no se aplicó, la ruta usa el margen de
            la política de su línea (`origen_margen = politica_linea`) y `margen_sugerido` es el de la política.
        aviso_margen:
          type: string
          nullable: true
          description: |
            HU-009 (#139). Aviso al comercial cuando `margen_sap_anomalo` es `true` (con el margen que propuso SAP TM). HU-042.2 (#243,
            2026-11-04): también cuando el margen sugerido de la ruta salió de SAP TM (aplicado o anómalo) y la copia local lleva más de
            `SapTm:AvisoSincronizacionHoras` (48 h) sin sincronizarse ("La copia del margen de SAP TM lleva más de 48 h sin sincronizarse
            (última: …): el margen sugerido de SAP puede estar desactualizado."); con los dos, el del anómalo primero y luego el de la
            sincronización, separados por un espacio. `null` si no hay ninguno.
        linea_orden:
          type: integer
          minimum: 1
        linea_solicitud_id:
          type: string
          format: uuid
        origen:
          type: string
          nullable: true
        destino:
          type: string
          nullable: true
        estado_costeo:
          type: string
          nullable: true
          enum: [pendiente_envio, error_envio, pendiente_costeo, autocosteo, entregada, descartada, costeo_vencido, rechazada, null]
          description: |
            HU-028.1 (#183): `rechazada` = la Mesa de Costeo de Nexo rechazó TODOS los camiones de la ruta: sin precio
            (`precio_final_linea = null`), no suma en `precio_final`, sus conexos no salen (ni suman) y el ajuste de margen o de
            conexos en ella responde 409 `RUTA_RECHAZADA`. Con algunos camiones rechazados la ruta sigue con el estado de los demás
            y su precio es el de ellos. **Valor nuevo del enum: el frontend debe mostrarlo.**
        motivo_rechazo:
          type: string
          nullable: true
          description: |
            HU-028.1 (#183, Nexo #320). Por qué la Mesa de Costeo rechazó camiones de la ruta (los motivos distintos de sus camiones
            `rechazada`, unidos con " | "); `null` si ninguno está rechazado. Solo para el comercial: el PDF y el Excel no lo llevan.
        precio_final_linea:
          type: number
          nullable: true
          description: |
            Precio de la ruta: (fletes + retorno + levante) con el margen de la ruta + la venta de sus conexos SIN margen (HU-043.2, #251;
            antes el margen se aplicaba también a los conexos); `null` sin costeo o rechazada (HU-028.1).
        costo_final:
          type: number
          nullable: true
          description: |
            HU-039.1 (#218). Costo bruto de la ruta que costeó Nexo: fletes + retorno + levante + servicios conexos de los camiones que
            cuentan (sin los `descartada` ni los `rechazada`), **sin margen**. **Siempre en COP (pesos), aunque la cotización esté en
            USD**: el costeo de Nexo es en pesos y nunca se convierte (en USD `precio_final_linea` va en dólares con `trm_aplicada`, el
            costo no). `null` en los mismos casos que `precio_final_linea` (sin costeo listo o ruta `rechazada`). Solo lo ve el dueño:
            en `GET /web/cotizaciones/{folio}` consultado por un gerente comercial o por el director (`solo_lectura = true`) siempre es `null`. Con la
            cotización finalizada (HU-036.4) es el costo con que se finalizó, como el precio congelado. No sale
            en el PDF, el correo, el Excel, el chat ni "Mis cotizaciones". Reversa de la regla de ADR-015 §5 ("el costo bruto nunca
            llega al comercial"), confirmada por la Gerencia Comercial el 2026-10-27.
        costo_transporte:
          type: number
          nullable: true
          description: |
            HU-018.2 (#294). Costo del transporte de la ruta: fletes + retorno + levante, **sin** servicios conexos ni margen. **Siempre en
            COP (pesos), aunque la cotización esté en USD** (el costeo de Nexo es en pesos y nunca se convierte; en USD `precio_final_linea`
            va en dólares, el costo no). Sale junto con el precio, igual que `costo_final`: `null` en los mismos casos
            (`precio_final_linea = null`: sin costeo listo o ruta `rechazada`). Solo lo ve el dueño: en `GET /web/cotizaciones/{folio}`
            consultado por un gerente comercial o por el director (`solo_lectura = true`) siempre es `null`. Dato de HU-039 que se expone,
            sin desglose por camión ni por conexo; no sale en el PDF, el correo, el Excel ni "Mis cotizaciones".
        valor_mercancia:
          type: number
          nullable: true
          description: |
            HU-018.2 (#294). Valor de la mercancía de la ruta (el mismo `valor_mercancia` de `GET .../solicitud`), en pesos (COP) aunque la
            cotización esté en USD. `null` si no se declaró. No es un costo: es de solo lectura, lo ve también el gerente o el director
            (`solo_lectura = true`) y está en todas las respuestas con la vista del costeo. Siempre presente.
        margen_aplicado:
          type: number
          nullable: true
          description: Margen de la ruta (fracción); `null` mientras la ruta no tenga precio.
        margen_sugerido:
          type: number
          nullable: true
          description: |
            Sugerido de la ruta (`margenSAPSugerido` o, si no hay, `margenPoliticaSugerido`). Por debajo, el ajuste exige justificación.
            Si SAP TM propuso un margen anómalo (fuera de [0, 60 %] tras redondearlo a 4 decimales; `margen_sap_anomalo = true`), el
            sugerido es el de la política de la línea, no el de SAP.
        origen_margen:
          type: string
          nullable: true
          enum: [sap_tm, politica_linea, negociado, null]
        servicios_conexos:
          type: array
          items:
            $ref: '#/components/schemas/ServicioConexoCosteo'
        politica_seguros:
          oneOf:
            - $ref: '#/components/schemas/PoliticaSegurosRuta'
            - $ref: '#/components/schemas/Nulo'
          description: |
            HU-046.3 (#269). Lo que exige la política de seguros a la ruta (tablas `PoliticaSeguro*` del script 21, leídas en cada
            petición: un cambio de Datos se ve sin desplegar). En `GET .../costeo`, en el detalle por folio y en las respuestas de los
            conexos, del margen y del seguro. `null` en una ruta `rechazada`, en una cotización finalizada (no se recalcula), si la política no se pudo leer y en
            las demás respuestas (no lo reemplaces con `null`: vuelve a leer el costeo).

    PoliticaSegurosRuta:
      type: object
      required: [tramo, aviso, recomendadas, obligatorias]
      description: |
        HU-046.3 (#269; contrato del 2026-11-10). El tramo se calcula con el `valor_mercancia` TOTAL de la ruta (no por camión):
        `valor_desde` exclusivo y `valor_hasta` incluido (250.000.000 exacto cae en "> 150 – 250 M"). `valor_mercancia` y los límites están
        SIEMPRE en pesos (COP), también en una cotización en USD. Sin `valor_mercancia` o con 0 no hay tramo: `tramo = null`, listas vacías
        y `aviso = SIN_VALOR_MERCANCIA`. `recomendadas` y `obligatorias` traen la misma forma de medida (`MedidaPolitica`), partida por su
        nivel. Las medidas van ordenadas por `nombre` y luego por `codigo`; los `conexos`, ordenados.
      properties:
        tramo:
          oneOf:
            - $ref: '#/components/schemas/TramoPoliticaSeguros'
            - $ref: '#/components/schemas/Nulo'
        aviso:
          type: string
          nullable: true
          enum: [SIN_VALOR_MERCANCIA, null]
          description: |
            `SIN_VALOR_MERCANCIA` cuando la ruta no tiene `valor_mercancia` o lo tiene en 0 (no bloquea "Finalizar"); `null` en cualquier
            otro caso.
        recomendadas:
          type: array
          items:
            $ref: '#/components/schemas/MedidaPolitica'
        obligatorias:
          type: array
          items:
            $ref: '#/components/schemas/MedidaPolitica'

    TramoPoliticaSeguros:
      type: object
      required: [id, nombre, valor_desde, valor_hasta]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          example: "> 350 – 500 M"
        valor_desde:
          type: number
          description: Límite inferior en pesos, exclusivo.
        valor_hasta:
          type: number
          nullable: true
          description: Límite superior en pesos, incluido; `null` = sin tope.

    MedidaPolitica:
      type: object
      required: [codigo, nombre, es_cobrable, estado, conexos]
      description: |
        HU-046.3 (#269; contrato del 2026-11-10). Una medida de la política, igual en `recomendadas` y en `obligatorias`.
        `estado`: `incluir_seguro` se evalúa por su código (`cumplida` si la ruta tiene `incluye_seguro`, si no `pendiente`); una medida con
        `conexos` es `cumplida` si la ruta tiene alguno (por `codigoServicio`, sin distinguir mayúsculas), si no `pendiente`; una medida sin
        `conexos` es `sin_verificar`, que nunca bloquea. Un conexo cuyo `estado_nexo` es `fallido_definitivo` o `incierto` NO cumple ninguna
        medida (decisión del 2026-11-09). Solo una **obligatoria** `pendiente` bloquea "Finalizar".
      properties:
        codigo:
          type: string
          example: acompanante_vehicular
        nombre:
          type: string
          description: Lo que se muestra al comercial.
        es_cobrable:
          type: boolean
        estado:
          type: string
          enum: [cumplida, pendiente, sin_verificar]
        conexos:
          type: array
          description: Los `codigoServicio` de Nexo que la cumplen (para el botón "agregar"); basta uno. Vacío si la medida no tiene conexos.
          items:
            type: string
          example: [AVP_MOTO, AVP_MOTO_ARMADA, AVT_AUTO, AVT_MOTO, AVT_MOTO_ARMADA]

    FinalizarWeb:
      type: object
      description: |
        HU-046.3 (#269; contrato del 2026-11-10). Cuerpo opcional de `POST .../finalizar`. `justificacion` (de 10 a 500 caracteres sin los
        espacios de los extremos; ausente, null, vacía o solo espacios es como no mandarla) permite finalizar aunque falte una medida
        obligatoria de la política de seguros; no salta ningún otro bloqueo. Fuera de ese largo: 400 `JUSTIFICACION_REQUERIDA` con
        `detalle.minimo = 10` y `detalle.maximo = 500`.
      properties:
        justificacion:
          type: string
          nullable: true
          minLength: 10
          maxLength: 500

    CamionCosteo:
      type: object
      required: [tipo_vehiculo, carroceria, peso_kg, estado_costeo]
      description: |
        HU-021.9 (#136). Un camión de la ruta como lo ve el comercial, sin costos ni ids de Nexo. `tipo_vehiculo` y `carroceria`
        en `null` = sin selección automática: los resuelve la Mesa de Costeo de Nexo (decisión 7).
      properties:
        tipo_vehiculo:
          type: string
          nullable: true
        carroceria:
          type: string
          nullable: true
        peso_kg:
          type: number
          nullable: true
        peso_con_tara_kg:
          type: number
          nullable: true
          description: |
            HU-030.1 (#184). El peso con tara que viaja a Nexo en la línea del camión: con un solo camión, el de la ruta; con varios, el
            peso de carga del camión más una parte igual de la tara (el último camión se queda con el resto del redondeo, así la suma
            es exactamente el de la ruta). `null` si la ruta no lleva tara. Integración 1021 (con #183): también `null` en un camión
            rechazado fuera del envío (no viaja ni lleva tara); la tara de cada contenedor es la tara total entre TODOS los camiones de
            la ruta y el resto del redondeo va en el último que viaja.
        estado_costeo:
          type: string
          nullable: true
          enum: [pendiente_envio, error_envio, pendiente_costeo, autocosteo, entregada, descartada, costeo_vencido, rechazada, null]
          description: |
            HU-028.1 (#183): `rechazada` = la Mesa de Costeo de Nexo rechazó la línea de este camión (Nexo #320): no cuenta en el precio
            ni en los totales y no lleva conexos. Distinto de `descartada` (la Mesa borró la línea, #134). Mientras la cotización de
            Nexo no esté entregada la Mesa puede deshacerlo: el camión vuelve a `pendiente_costeo` y `motivo_rechazo` a `null`.
        motivo_rechazo:
          type: string
          nullable: true
          maxLength: 500
          description: |
            HU-028.1 (#183, Nexo #320). Por qué la Mesa de Costeo rechazó la línea del camión, con el texto de Nexo (texto libre, sin
            catálogo). Se guarda en la base (script 10): sale aunque el servicio se reinicie. `null` si no está rechazado.
        rechazada_at:
          type: string
          format: date-time
          nullable: true
          description: |
            HU-028.1 (#183). Cuándo vio Cotifly el rechazo por primera vez (UTC). Nexo no expone en `GET /api/solicitudes/{id}` su fecha
            ni quién rechazó. `null` si el camión no está rechazado.
        volumen_total_m3:
          type: number
          nullable: true
          description: HU-023.3 (#158). Volumen que lleva el camión según el cubicador (m³); `null` sin recomendación.
        porcentaje_llenado_volumen:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          description: HU-023.3. Qué tan lleno va el camión en volumen; `null` sin recomendación.
        porcentaje_llenado_peso:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          description: HU-023.3. Qué tan lleno va el camión en peso; `null` sin recomendación.
        estado_linea_nexo:
          type: string
          nullable: true
          description: |
            #181 (Nexo #309). Estado de la línea del camión en Nexo, en `snake_case`: `por_costear`, `auto_resuelta` o `revisada`
            (un valor nuevo de Nexo llega con la misma conversión). Solo se muestra, no se guarda en la base: lo lee el polling y
            sale en `null` si Nexo no lo manda (versión anterior), si el camión aún no se asoció a su línea o si el servicio se
            reinició y el polling no ha vuelto a consultar.
        motivo_pendiente:
          type: string
          nullable: true
          description: |
            #181 (Nexo #309). Por qué la línea del camión sigue pendiente en Nexo, con el texto de Nexo (p. ej. "Línea sin vehículo:
            requiere consulta completa" o "SICE-TAC no se usa: el período más reciente cargado es AAAAMM..."). Solo con
            `estado_costeo = pendiente_costeo`; `null` en los demás casos o si Nexo no lo manda. Mostrarlo en lugar de un
            "pendiente de costeo" mudo.

    MercanciaCosteo:
      type: object
      required: [orden, codigo_mercancia, nombre_mercancia, cantidad, largo_cm, ancho_cm, alto_cm, peso_kg]
      description: HU-021.9 (#136). Una mercancía de la ruta (código del catálogo del cubicador, nombre, medidas y peso).
      properties:
        orden:
          type: integer
          minimum: 1
        codigo_mercancia:
          type: string
          nullable: true
          maxLength: 64
          description: HU-023.3 (#158). Código del catálogo del cubicador; `null` en las mercancías anteriores al script `02`.
        nombre_mercancia:
          type: string
          nullable: true
        cantidad:
          type: integer
        largo_cm:
          type: number
          nullable: true
          description: HU-032 (#197). `null` (las tres medidas) en una mercancía no cubicable, sin medidas.
        ancho_cm:
          type: number
          nullable: true
        alto_cm:
          type: number
          nullable: true
        peso_kg:
          type: number
          nullable: true

    CosteoCotizacion:
      type: object
      required: [folio, estado_costeo, motivo_estado_costeo, costeo_listo_at, precio_final, margen_aplicado, moneda, servicios_conexos, pdf_url, rutas, deadline, score_prioridad]
      properties:
        folio:
          type: string
        estado_costeo:
          type: string
          nullable: true
          enum: [pendiente_envio, error_envio, pendiente_costeo, autocosteo, entregada, descartada, costeo_vencido, null]
        motivo_estado_costeo:
          type: string
          nullable: true
        costeo_listo_at:
          type: string
          format: date-time
          nullable: true
        precio_final:
          type: number
          nullable: true
          description: |
            Precio al cliente (costeo de Nexo con margen). `null` mientras no haya costeo. **HU-021 (ADR-019): incluye los
            servicios conexos** (es la suma de las rutas; cada ruta = (fletes + retorno + levante) con su margen + la venta de
            sus conexos sin margen, HU-043.2). No sumarle el `precio` de `servicios_conexos`, que es el desglose.
        margen_aplicado:
          type: number
          nullable: true
          description: |
            Margen de la RUTA 1 (compatibilidad, HU-021.8 #135). El margen es por ruta: usar `rutas[].margen_aplicado`. Con varias
            rutas, ajustar sin indicar la ruta responde 400 `RUTA_REQUERIDA`.
        moneda:
          type: string
          example: COP
        servicios_conexos:
          type: array
          items:
            $ref: '#/components/schemas/ServicioConexoCosteo'
        pdf_url:
          type: string
          nullable: true
        margen_sugerido:
          type: number
          nullable: true
          description: |
            Sugerido de la RUTA 1 (compatibilidad, HU-021.8 #135; el de cada ruta está en `rutas[].margen_sugerido`).
            HU-013.2. Margen sugerido de la cotización (fracción): SAP TM con el BP o la política de la línea, resuelto al
            enviarla, y guardado en `Cotizaciones.margenSugerido` con su origen (script 0006); el ajuste del comercial no lo
            cambia (cada fila de `MargenAjustes` lo copia en `margenPolitica`). Por debajo de él, el ajuste exige
            justificación.
        origen_margen:
          type: string
          nullable: true
          enum: [sap_tm, politica_linea, negociado, null]
          description: HU-013.2. `negociado` cuando el comercial ajustó el margen.
        trm_aplicada:
          type: number
          description: HU-013.7. TRM fijada al crear la cotización (COP por USD); 0 en COP.
        deadline:
          type: string
          format: date-time
          nullable: true
          description: |
            HU-018.1 (#155). Fecha límite de la solicitud, ISO 8601 en UTC; `null` si no se dio. Es de la cabecera (toda la
            solicitud), no de cada ruta: no está en `rutas[]`. Siempre presente.
        score_prioridad:
          type: number
          nullable: true
          description: |
            HU-018.1 (#155). `scorePrioridad` que Nexo devolvió al crear la solicitud (hasta 4 decimales; escala de Nexo, mostrarlo
            tal cual). `null` si Nexo no lo mandó, si no se ha enviado o si se envió antes del script 09. Siempre presente.
        resultado:
          type: string
          nullable: true
          enum: [ganada, perdida, null]
          description: HU-033 (#199). Resultado registrado (`null` si no tiene).
        sincronizacion_resultado_nexo:
          type: string
          nullable: true
          enum: [pendiente, sincronizado, no_sincronizable, solo_cotifly, null]
          description: HU-033 (#199). Igual que en `CotizacionResumen`.
        error_sincronizacion_resultado_nexo:
          type: string
          nullable: true
          description: HU-033. Igual que en `CotizacionResumen`.
        finalizada_at:
          type: string
          format: date-time
          nullable: true
          description: HU-036.2 (#206). Cuándo se finalizó la cotización; `null` sin finalizar. Igual que en `CotizacionResumen`.
        tasa_seguro_vigente:
          type: number
          nullable: true
          description: |
            HU-045.2 (#264). La tasa VIGENTE del seguro de la mercancía (fracción: 0.003450 = 0,345 %), para mostrarla antes de marcar el
            seguro en una ruta (la de cada ruta que ya lo tiene es `rutas[].tasa_seguro`). Viene en `GET .../costeo`, en
            `PUT .../costeo/seguro`, en las respuestas del margen y de los conexos y en `costeo` del detalle por folio; `null` en las
            demás (PDF, textos, recálculo de vehículos) o si no se pudo leer: conservar la del último `GET`.
        aviso_seguro:
          description: |
            HU-045.3 (#265). Las rutas con el seguro de la mercancía marcado sin valor de la mercancía (no suma ni sale en el PDF; no
            bloquea); `null` si no hay ninguna. Viene en toda respuesta `CosteoCotizacion` y en `costeo` del detalle por folio.
          oneOf:
            - $ref: '#/components/schemas/AvisoSeguro'
            - $ref: '#/components/schemas/Nulo'
        textos:
          description: HU-013.5. Asunto e introducción guardados para el PDF, o `null` si todavía no hay (el PDF usa los estándar).
          oneOf:
            - $ref: '#/components/schemas/TextosCotizacion'
            - $ref: '#/components/schemas/Nulo'
        pdf_desactualizado:
          type: boolean
          description: |
            ADR-018 §11. `true` si una acción posterior (margen, conexos, textos, re-solicitud) invalidó el PDF: `pdf_url`
            queda en `null` y el comercial lo regenera con `POST .../costeo/pdf`. El PDF anterior queda en el historial.
        row_version:
          type: string
          nullable: true
          description: '#98 (script 0006). Versión de negocio (opaca), mismo valor que el encabezado `ETag`; va en `If-Match`.'
        rutas:
          type: array
          description: |
            HU-021.8 (#135). Las rutas en orden, cada una con su margen (aplicado, sugerido y origen), su precio y sus conexos;
            desde HU-021.9 (#136) también su línea de negocio, sus camiones y sus mercancías; desde HU-039.1 (#218) su costo bruto en
            COP (`costo_final`, solo para el dueño; sin desglose ni costos por camión o conexo).
            `margen_aplicado`, `margen_sugerido` y `origen_margen` de primer nivel son los de la ruta 1 (compatibilidad).
          items:
            $ref: '#/components/schemas/RutaCosteo'

    SeleccionServiciosConexos:
      type: object
      description: |
        HU-005.7; por ruta desde HU-021.8 (#135). `conexos` (los que quedan en la ruta, con su cantidad) o `incluidos` (los
        ids que se conservan): exactamente uno de los dos (ninguno o los dos: 400 `ErrorWeb`; `incluidos: []` quita todos). La
        ruta con `linea_orden` o `linea_solicitud_id`. Los ids se comparan sin distinguir mayúsculas.
      properties:
        linea_orden:
          type: integer
          minimum: 1
          nullable: true
        linea_solicitud_id:
          type: string
          format: uuid
          nullable: true
        conexos:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/CantidadConexoWeb'
        incluidos:
          type: array
          nullable: true
          items:
            type: string

    CantidadConexoWeb:
      type: object
      required: [id, cantidad]
      description: HU-021.8. Un conexo que queda en la ruta, con su cantidad nueva.
      properties:
        id:
          type: string
          description: '`servicios_conexos[].id` del costeo.'
        cantidad:
          type: number
          minimum: 0.01
          maximum: 999999.99
          multipleOf: 0.01
          description: Hasta 2 decimales (más decimales es 400).

    AjusteMargenWeb:
      type: object
      required: [margen]
      description: HU-013.2; por ruta desde HU-021.8 (#135). Cuerpo de `PUT /web/cotizaciones/{folio}/costeo/margen`.
      properties:
        linea_orden:
          type: integer
          minimum: 1
          nullable: true
          description: HU-021.8. Ruta a la que aplica (`rutas[].linea_orden`); opcional si la cotización tiene una sola.
        linea_solicitud_id:
          type: string
          format: uuid
          nullable: true
          description: HU-021.8. Ruta a la que aplica por su id (`rutas[].linea_solicitud_id`); alternativa a `linea_orden`.
        margen:
          type: number
          minimum: 0
          maximum: 0.99
          description: Nuevo margen (fracción decimal, 0.18 = 18 %).
        justificacion:
          type: string
          nullable: true
          maxLength: 500
          description: |
            Obligatoria (no vacía) si `margen` es menor que el `margen_sugerido` de la ruta; se guarda en
            `MargenAjustes.motivo`. Por encima del sugerido es opcional.

    SeguroRutaWeb:
      type: object
      required: [incluye_seguro]
      description: HU-045.2 (#264). Cuerpo de `PUT /web/cotizaciones/{folio}/costeo/seguro`.
      properties:
        incluye_seguro:
          type: boolean
          description: '`true` incluye el seguro de la mercancía en la ruta (con la tasa vigente); `false` lo quita.'
        linea_orden:
          type: integer
          minimum: 1
          nullable: true
          description: Ruta a la que aplica (`rutas[].linea_orden`); opcional si la cotización tiene una sola.
        linea_solicitud_id:
          type: string
          format: uuid
          nullable: true
          description: Ruta a la que aplica por su id (`rutas[].linea_solicitud_id`); alternativa a `linea_orden`.

    MargenLineasWeb:
      type: object
      description: |
        HU-041.1 (#231). Cuerpo de `PUT /web/cotizaciones/{folio}/costeo/margen/lineas`. Exactamente una de `lineas` y `todas`, y
        exactamente una de `margen` y `revertir_sugerido`.
      properties:
        lineas:
          type: array
          nullable: true
          minItems: 1
          maxItems: 1000
          items:
            type: integer
            minimum: 1
          description: Los `rutas[].linea_orden` a los que aplica, sin repetir. Alternativa a `todas`.
        todas:
          type: boolean
          nullable: true
          description: '`true`: todas las rutas cotizables (las rechazadas por la Mesa de Costeo no cuentan).'
        margen:
          type: number
          nullable: true
          minimum: 0
          maximum: 0.99
          description: El margen para todas las rutas elegidas (fracción decimal, 0.18 = 18 %).
        revertir_sugerido:
          type: boolean
          nullable: true
          description: '`true`: cada ruta vuelve a su `margen_sugerido` (y `origen_margen` deja de ser `negociado`).'
        justificacion:
          type: string
          nullable: true
          maxLength: 500
          description: Obligatoria (no vacía) si `margen` queda por debajo del `margen_sugerido` de alguna ruta elegida.

    ConexoLineasWeb:
      type: object
      required: [servicio_id, cantidad]
      description: |
        HU-041.1 (#231). Cuerpo de `POST /web/cotizaciones/{folio}/costeo/servicios-conexos/lineas`. Exactamente una de `lineas` y
        `todas`. Nunca lleva costos ni valores.
      properties:
        lineas:
          type: array
          nullable: true
          minItems: 1
          maxItems: 1000
          items:
            type: integer
            minimum: 1
          description: Los `rutas[].linea_orden` a los que aplica, sin repetir. Alternativa a `todas`.
        todas:
          type: boolean
          nullable: true
          description: '`true`: todas las rutas cotizables.'
        servicio_id:
          type: string
          format: uuid
          description: '`id` del servicio en `GET /web/servicios-conexos`.'
        cantidad:
          type: number
          minimum: 0.01
          maximum: 999999.99
          description: Cantidad en cada ruta, hasta 2 decimales.

    QuitarConexoLineasWeb:
      type: object
      required: [servicio_id]
      description: |
        HU-041.1 (#231). Cuerpo de `POST /web/cotizaciones/{folio}/costeo/servicios-conexos/lineas/quitar`. Exactamente una de `lineas`
        y `todas`.
      properties:
        lineas:
          type: array
          nullable: true
          minItems: 1
          maxItems: 1000
          items:
            type: integer
            minimum: 1
          description: Los `rutas[].linea_orden` a los que aplica, sin repetir. Alternativa a `todas`.
        todas:
          type: boolean
          nullable: true
          description: '`true`: todas las rutas cotizables.'
        servicio_id:
          type: string
          format: uuid
          description: '`servicios_conexos[].servicio_id` (id del catálogo de Nexo) del conexo que se quita.'

    DatosCargaWeb:
      type: object
      minProperties: 1
      deprecated: true
      description: |
        HU-013.4. Cambios de carga de una re-solicitud: solo los campos que cambian, con los límites de
        `SolicitudCosteoWeb`. Origen, destino, cliente y línea de negocio no se cambian aquí (eso es otra cotización).
        HU-032 (#197): `tipo_vehiculo` y `carroceria` cambian el **vehículo elegido** de la ruta (antes se ignoraban). Si la ruta no
        se puede cubicar el vehículo se valida contra Nexo y es obligatorio salvo en Contenedor (`SOLICITUD_COSTEO_INVALIDA` con
        `detalle.motivo = VEHICULO_REQUERIDO` y `detalle.ruta = 0`); cambiarlo vuelve a planificar la ruta si sus camiones dependían
        del elegido.
        Si trae `posiciones`, reemplaza todas las anteriores. La combinación resultante (lo guardado más los cambios) se
        valida igual que en la captura, con las condiciones de G3 (`docs/conexion_nexo/HU-013-preguntas-nexo.md`): `clase_contenedor`
        obligatoria con `clase_viaje = Contenedor`, opcional y solo de la lista provisional G15 (`CNT20.FT`, `CNT20.OP`, `CNT40.FT`,
        `CNT40.OP`) con `Extradimensionado` (HU-021.15, #297) y no aplica con las demás, `ciudad_devolucion_contenedor` con `retorna_contenedor`,
        `ciudad_levante_contenedor` con `levante_contenedor_diferente` y `valor_aprovisionamiento` solo con un levante
        distinto del origen, y la regla de peso.
      properties:
        tipo_vehiculo:
