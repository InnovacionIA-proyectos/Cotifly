                        linea_orden: 1
                        linea_solicitud_id: "5b1f6a1e-2c3d-4e5f-8a9b-0c1d2e3f4a5b"
                ruta_requerida:
                  value:
                    error:
                      codigo: RUTA_REQUERIDA
                      mensaje: "La cotización PCN-L1 tiene 2 rutas: indica a cuál aplica (linea_orden o linea_solicitud_id)."
                      detalle:
                        rutas:
                          - linea_orden: 1
                            linea_solicitud_id: "5b1f6a1e-2c3d-4e5f-8a9b-0c1d2e3f4a5b"
                            origen: Buenaventura
                            destino: Bogotá
                          - linea_orden: 2
                            linea_solicitud_id: "7c2e6b2f-3d4e-4f60-9b0c-1d2e3f4a5b6c"
