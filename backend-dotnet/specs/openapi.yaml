          nullable: true
          maxLength: 150
        valor_aprovisionamiento:
          type: number
          nullable: true
          minimum: 0
        peso_kg:
          type: number
          nullable: true
          minimum: 0
          maximum: 999999.99
        valor_mercancia:
          type: number
          nullable: true
          minimum: 0
        posiciones:
          type: array
          nullable: true
          maxItems: 200
          items:
            $ref: '#/components/schemas/PosicionCargaWeb'

    LicitacionWeb:
      type: object
      required: [nit_cliente, linea_negocio, lineas]
      description: Encabezado de la licitación (el `tipo` es siempre `licitacion`) y sus líneas ya mapeadas, hasta 1000.
      properties:
        nit_cliente:
          type: string
          maxLength: 20
        cliente_nombre:
          type: string
          nullable: true
          maxLength: 300
        linea_negocio:
          type: string
          description: Línea de Cotifly; da el margen de toda la licitación y su `mapeoLineasNexo` viaja en cada línea.
        deadline:
          type: string
          format: date-time
          nullable: true
        valor_estimado:
          type: number
          nullable: true
          minimum: 0
        referencia:
          type: string
          nullable: true
          maxLength: 200
        horas_cargue:
          type: number
          nullable: true
          minimum: 0
          maximum: 240
        horas_descargue:
          type: number
          nullable: true
          minimum: 0
          maximum: 240
        hoja:
          type: string
          nullable: true
          maxLength: 31
          description: Hoja mapeada (`hojas[h].nombre`). Obligatoria con el archivo.
        lineas:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/LineaLicitacionWeb'

    ErrorFilaLicitacion:
      type: object
      required: [indice, fila, campo, codigo, mensaje]
      properties:
        indice:
          type: integer
          nullable: true
          description: Posición en `lineas[]` (base 0); `null` si el error es del encabezado.
        fila:
          type: integer
          nullable: true
          description: La `fila` que mandó el frontend para esa línea.
        campo:
          type: string
        codigo:
          type: string
          enum: [LINEAS_REQUERIDAS, DEMASIADAS_LINEAS, LINEA_INCOMPLETA, CAMPO_REQUERIDO, CAMPO_DEMASIADO_LARGO, VALOR_FUERA_DE_RANGO,
                 DEMASIADAS_POSICIONES, POSICION_INVALIDA, PESO_REQUERIDO, PESO_INCONSISTENTE, FILA_INVALIDA]
        mensaje:
          type: string

    ReporteLicitacionInvalida:
      type: object
      required: [error, errores]
      description: 400 de `POST /web/licitaciones` con todas las filas que fallaron (`error.codigo = LICITACION_INVALIDA`).
      properties:
        error:
          type: object
          required: [codigo, mensaje]
          properties:
            codigo:
              type: string
              enum: [LICITACION_INVALIDA]
            mensaje:
              type: string
            detalle:
              type: object
              additionalProperties: true
        errores:
          type: array
          items:
            $ref: '#/components/schemas/ErrorFilaLicitacion'

    LineaLicitacion:
      type: object
      required: [orden, fila, origen, destino, tipo_vehiculo, peso_kg, estado_costeo, precio_final]
      properties:
        orden:
          type: integer
          description: 1 para la primera línea (el orden en que viajó a Nexo).
        fila:
          type: integer
          nullable: true
        origen:
          type: string
        destino:
          type: string
        tipo_vehiculo:
          type: string
          nullable: true
        peso_kg:
          type: number
          nullable: true
        estado_costeo:
          type: string
          nullable: true
          enum: [pendiente_envio, error_envio, pendiente_costeo, autocosteo, entregada, descartada, costeo_vencido, null]
        precio_final:
          type: number
          nullable: true
          description: Precio con margen de la línea; `null` mientras no tiene flete. Nunca el costo de Nexo.

    Licitacion:
      type: object
      required: [folio, cliente_nombre, nit_cliente, referencia, deadline, estado_costeo, motivo_estado_costeo, moneda, precio_final,
                 lineas_costeadas, lineas_pendientes, archivo_nombre, hoja, lineas]
      description: Licitación vista por el comercial (HU-011.2). Solo precios.
      properties:
        folio:
          type: string
        cliente_nombre:
          type: string
          nullable: true
        nit_cliente:
          type: string
          nullable: true
        referencia:
          type: string
          nullable: true
        deadline:
          type: string
          format: date-time
          nullable: true
        estado_costeo:
          type: string
          nullable: true
          enum: [pendiente_envio, error_envio, pendiente_costeo, autocosteo, entregada, descartada, costeo_vencido, null]
        motivo_estado_costeo:
          type: string
          nullable: true
        moneda:
          type: string
        precio_final:
          type: number
          nullable: true
          description: Suma de los precios de las líneas; solo cuando todas tienen flete (`autocosteo` o `entregada`).
        lineas_costeadas:
          type: integer
        lineas_pendientes:
          type: integer
        archivo_nombre:
          type: string
          nullable: true
          description: Nombre del Excel original guardado (`null` si se armó sin archivo).
        hoja:
          type: string
          nullable: true
        lineas:
          type: array
          items:
            $ref: '#/components/schemas/LineaLicitacion'

    ItemCubicacion:
      type: object
      required: [cantidad, largo_cm, ancho_cm, alto_cm]
      properties:
        descripcion:
          type: string
          nullable: true
        cantidad:
          type: integer
          description: Cuántos bultos idénticos con estas medidas.
        largo_cm:
          type: number
          description: Largo en centímetros.
        ancho_cm:
          type: number
          description: Ancho en centímetros.
        alto_cm:
          type: number
          description: Alto en centímetros.
        peso_kg:
          type: number
          nullable: true
          description: Peso en kilogramos de cada bulto.

    CubicacionRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Obligatorio; 400 `ITEMS_REQUERIDOS` si falta o viene vacío.
          items:
            $ref: '#/components/schemas/ItemCubicacion'
        clase_viaje:
          type: string
          nullable: true

    SugerenciaVehiculo:
      type: object
      required: [unidad_id, unidad_nombre, banda, factor_utilizacion]
      properties:
        unidad_id:
          type: string
        unidad_nombre:
          type: string
        banda:
          type: string
        factor_utilizacion:
          type: number
        config_vehiculo:
          type: string
          nullable: true
        carroceria:
          type: string
          nullable: true
        clase_viaje:
          type: string
          nullable: true
        clase_contenedor:
          type: string
          nullable: true

    SugerenciaFlota:
      type: object
      required: [unidad_id, unidad_nombre, cantidad_vehiculos, utilizacion_promedio]
      description: Igual que Nexo salvo que omite `disposiciones` (colocaciones 3D detalladas por vehículo de la flota).
      properties:
        unidad_id:
          type: string
        unidad_nombre:
          type: string
        cantidad_vehiculos:
          type: integer
        utilizacion_promedio:
          type: number
        config_vehiculo:
          type: string
          nullable: true
        carroceria:
          type: string
          nullable: true
        clase_viaje:
          type: string
          nullable: true
        clase_contenedor:
          type: string
          nullable: true

    MedidasEstandar:
      type: object
      required: [largo_max_cm, ancho_max_cm, alto_max_cm, peso_max_kg]
      properties:
        largo_max_cm:
          type: number
        ancho_max_cm:
          type: number
        alto_max_cm:
          type: number
        peso_max_kg:
          type: number

    PiezaExcedida:
      type: object
      required: [descripcion, excesos, largo_cm, ancho_cm, alto_cm]
      properties:
        descripcion:
          type: string
        excesos:
          type: array
          items:
            type: string
        largo_cm:
          type: number
        ancho_cm:
          type: number
        alto_cm:
          type: number
        peso_kg:
          type: number
          nullable: true

    DeteccionExtradimension:
      type: object
      required: [hay_extradimension, medidas_estandar, piezas]
      properties:
        hay_extradimension:
          type: boolean
        medidas_estandar:
          $ref: '#/components/schemas/MedidasEstandar'
        piezas:
          type: array
          items:
            $ref: '#/components/schemas/PiezaExcedida'
        sugerencia:
          type: string
          nullable: true

    ResultadoCubicacion:
      type: object
      required: [advertencias]
      properties:
        sugerencia:
          description: Mejor vehículo único, o `null` si ninguno de la flota estándar sirve.
          oneOf:
            - $ref: '#/components/schemas/SugerenciaVehiculo'
            - $ref: '#/components/schemas/Nulo'
        sugerencia_flota:
          description: Flota sugerida cuando hace falta más de un vehículo, o `null`.
          oneOf:
            - $ref: '#/components/schemas/SugerenciaFlota'
            - $ref: '#/components/schemas/Nulo'
        advertencias:
          type: array
          items:
            type: string
        extradimension:
          description: Detección de piezas que exceden las medidas estándar, o `null`.
          oneOf:
            - $ref: '#/components/schemas/DeteccionExtradimension'
            - $ref: '#/components/schemas/Nulo'

    VistaPreviaCorreo:
      type: object
      required: [asunto, cuerpo, para, cc]
      properties:
        asunto:
          type: string
        cuerpo:
          type: string
          description: Cuerpo renderizado con la plantilla real (texto plano).
        para:
          type: array
          items:
            type: string
        cc:
          type: array
          items:
            type: string
        adjunto:
          type: string
          description: Nombre del PDF que se adjuntará.

    DatosNuevaVersion:
      type: object
      description: |
        Datos de lectura para prellenar el formulario. `cotizacion_origen_id` es solo el
        id consultado; no se persiste como FK en la versión nueva.
      required: [cotizacion_origen_id, folio_base, version_siguiente]
      properties:
        cotizacion_origen_id:
          type: string
          format: uuid
        folio_base:
          type: string
        version_siguiente:
          type: integer
        cliente_nombre:
          type: string
          nullable: true
        nit_cliente:
          type: string
          nullable: true
        origen_cliente:
          type: string
          nullable: true
          enum: [cliente, prospecto, null]
        linea_negocio:
          type: string
          nullable: true
        costo:
          type: number
          nullable: true
        margen_politica:
          type: number
          nullable: true
        margen_aplicado:
          type: number
          nullable: true
        origen_margen:
          type: string
          nullable: true
          enum: [sap_tm, politica_linea, negociado, null]
        metodo_calculo:
          type: string
          nullable: true
          enum: [margen, markup, null]
        moneda:
          type: string
          nullable: true
