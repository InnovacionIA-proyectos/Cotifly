  /web/admin/sap-margen/estado:
    get:
      operationId: obtenerEstadoSincronizacionMargenSap
      tags: [admin]
      summary: Estado de la sincronización del margen de SAP TM (HU-042.2)
      description: |
        Solo `gerente_comercial` y `director`. La copia local `SapMargenCliente` la sincroniza el backend con SAP TM (ADR-027):
        última corrida (cualquier estado), última corrida `ok`, filas activas y la próxima corrida estimada por el worker de la
        réplica que responde. Con la sincronización deshabilitada (`SapTm:SincronizacionHabilitada = false`, el valor por defecto)
        responde 200 con `habilitada = false`. Habilitada sin `SapTm:Url`, `SapTm:User` o `SapTm:Pass`, o con la URL o el mandante mal
        escritos, responde 503 `SAP_MARGEN_NO_CONFIGURADO` con el motivo en `detalle.motivo` (nunca el valor); con la base de Cotifly sin
        responder, 503 `SAP_MARGEN_NO_DISPONIBLE` (en el E2E, entre 20 y 45 s: lo suman la autenticación y la auditoría). Con la
        sincronización deshabilitada o sin configuración válida, `proxima_corrida_estimada` es `null`.
      security:
        - bearer: []
      responses:
        '200':
          description: Estado de la copia local y de sus corridas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoSincronizacionMargenSap'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '503':
          description: '`SAP_MARGEN_NO_CONFIGURADO` o `SAP_MARGEN_NO_DISPONIBLE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'

  /web/admin/sap-margen/sincronizar:
    post:
      operationId: sincronizarMargenSap
      tags: [admin]
      summary: Fuerza una sincronización del margen de SAP TM (HU-042.2)
      description: |
        Solo `gerente_comercial` y `director`. Deshabilitada (`SapTm:SincronizacionHabilitada = false`, el valor por defecto) responde 503
        `SAP_MARGEN_NO_CONFIGURADO` con un mensaje que lo dice. Comprueba la base de Cotifly antes de llamar a SAP (con la base caída, 503
        `SAP_MARGEN_NO_DISPONIBLE` sin descargar nada). Corre ya, sin esperar el intervalo (`SapTm:SincronizacionMinutos`), y **espera** el
        resultado: responde 200 también cuando la corrida quedó en `error` (SAP caído, credenciales rechazadas, respuesta inválida,
        menos filas que el mínimo, DW caído; la tabla no cambió) u `omitido` (otra réplica tenía el candado del stored procedure).
        Suele tardar segundos; el máximo con los límites actuales es de unos 10 min (120 s de SAP, 60 s por lote de 500 BP en el DW, 120 s
        de la lectura de los NIT existentes, 120 s de la carga y 120 s del stored procedure). Si el cliente corta antes, la corrida sigue y su resultado se ve en `GET .../estado`.
        Sin cuerpo. Queda en la auditoría
        (`admin_sincronizar_margen_sap`). 409 `SAP_MARGEN_SINCRONIZACION_EN_CURSO` si esta réplica ya está sincronizando.
      security:
        - bearer: []
      responses:
        '200':
          description: La corrida terminó (ver `estado`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoSincronizacionMargenSap'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          description: '`SAP_MARGEN_SINCRONIZACION_EN_CURSO`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '503':
          description: '`SAP_MARGEN_NO_CONFIGURADO` o `SAP_MARGEN_NO_DISPONIBLE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'

  /web/metricas/comercial:
    get:
