    ReSolicitudCosteoWeb:
      type: object
      required: [motivo]
      description: HU-013.4. Cuerpo de `POST /web/cotizaciones/{folio}/costeo/re-solicitar`.
      properties:
        motivo:
          type: string
          minLength: 1
          maxLength: 300
          description: Por qué se vuelve a pedir el costeo; queda en la auditoría.
        datos_carga:
          deprecated: true
          description: |
            Cambios de carga. Ausente o `null` = sin cambios; con datos = siempre versión nueva. **Obsoleto (HU-028, #186):** usar
            `PUT /web/cotizaciones/{folio}/solicitud` (varias rutas, todos los campos y el modo según el estado). Se sigue aceptando
            mientras el frontend migra, con los defectos corregidos: las mercancías conservan `codigo_mercancia` y `nombre_mercancia`,
            las ciudades de devolución y levante llevan su id de municipio, y un cambio de `clase_viaje` vuelve a cubicar.
          oneOf:
            - $ref: '#/components/schemas/DatosCargaWeb'
            - $ref: '#/components/schemas/Nulo'
        nueva_version:
          type: boolean
          default: false
          description: |
            `true` crea la versión `-vN` aunque no haya cambios de carga (la salida de `PDF_YA_ENVIADO`: cotización ya
            enviada o con resultado). Con `datos_carga` siempre se crea versión nueva, con o sin este campo.

    ConexoAgregarWeb:
      type: object
      required: [servicio_id, cantidad]
      description: |
        Un conexo para una LÍNEA de la cotización. En Nexo el conexo se asocia a una línea de una cotización ya costeada
        (`clsConexoItemRequest.lineaId`, obligatorio): el backend traduce `linea_orden` a la línea de solicitud de Cotifly
        (`CotizacionLineasSolicitud`, ADR-017), de ahí a la línea de solicitud de Nexo y a la línea de su cotización
        (`clsCotizacionLineaDto.id` con ese `lineaSolicitudId`). El frontend nunca maneja ids de Nexo.
      properties:
        linea_orden:
          type: integer
          minimum: 1
          description: |
            `orden` de la ruta (`rutas[].linea_orden`). Opcional si la cotización tiene una sola ruta (HU-021.8); con varias,
            obligatoria (o `linea_solicitud_id`).
        linea_solicitud_id:
          type: string
          format: uuid
          description: HU-021.8. La ruta por su id (`rutas[].linea_solicitud_id`); alternativa a `linea_orden`.
        servicio_id:
          type: string
          description: '`id` de `ServicioConexoCatalogo` (`servicioConexoId` de Nexo), tal como lo entrega Nexo.'
        cantidad:
          type: number
          minimum: 0.01
          maximum: 999999.99
          multipleOf: 0.01
          description: Hasta 2 decimales (más decimales es 400 `ErrorWeb`).

    AgregarServiciosConexosWeb:
      type: object
      required: [items]
      description: |
        HU-013.3. Cuerpo de `POST /web/cotizaciones/{folio}/costeo/servicios-conexos`. Nunca lleva costos ni valores: Nexo
        calcula el valor del conexo y Cotifly le aplica el margen.
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/ConexoAgregarWeb'

    ServicioConexoCatalogo:
      type: object
      required: [id, codigo, nombre, categoria, unidad]
      description: |
        HU-013.3. Servicio del catálogo de Nexo (`clsServicioConexoDto`) **sin `costoUnitario`**: Cotifly nunca expone
        el costo de Nexo.
      properties:
        id:
          type: string
          description: |
            Id del servicio en el catálogo de NEXO tal como lo entrega NEXO (Cotifly no lo interpreta ni garantiza su formato).
            Endurecimiento A (#199): sin `format: uuid`.
        codigo:
          type: string
          nullable: true
          description: '`codigoServicio` de Nexo.'
        nombre:
          type: string
          nullable: true
          description: '`tipoServicio` de Nexo (ej. "Almacenamiento", "Precinto").'
        categoria:
          type: string
          nullable: true
          example: logistico
        unidad:
          type: string
          nullable: true
          example: Viaje
        origen:
          type: string
          nullable: true
        destino:
          type: string
          nullable: true
        puerto:
          type: string
          nullable: true
        ruta:
          type: string
          nullable: true
        tipo_maquina:
          type: string
          nullable: true
        vigencia:
          type: string
          format: date
          nullable: true

    PaginaServiciosConexos:
      type: object
      required: [total, page, page_size, items]
      properties:
        total:
          type: integer
          description: Total de servicios que cumplen el filtro (todas las páginas).
        page:
          type: integer
        page_size:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServicioConexoCatalogo'

    TextosCotizacion:
      type: object
      required: [asunto, introduccion, fuente, editado, actualizado_at]
      description: HU-013.5. Asunto e introducción del PDF guardados en `Cotizaciones.textosCotizacion`.
      properties:
        asunto:
          type: string
          maxLength: 120
        introduccion:
          type: string
          maxLength: 1100
          description: |
            Uno o más párrafos separados por una línea en blanco. La IA redacta hasta 900 caracteres y el comercial escribe
            hasta 1100 (`TextosCotizacionWeb`); con `fuente = estandar` en un pliego llega la introducción estándar del PDF de
            pliego (1026 caracteres, con viñetas `·`), la misma que imprime el PDF, y el comercial la puede guardar sin recortarla.
        fuente:
          type: string
          enum: [ia, estandar]
          description: |
            `ia` = los redactó la IA y pasaron la validación; `estandar` = textos de `clsTextosEstandar` (la IA tardó más
            de 15 s, falló o su salida no pasó la validación, o no se ha redactado).
        editado:
          type: boolean
          description: '`true` si el comercial los editó después (`PUT .../costeo/textos`).'
        actualizado_at:
          type: string
          format: date-time

    TextosCotizacionWeb:
      type: object
      required: [asunto, introduccion]
      description: HU-013.5. Cuerpo de `PUT /web/cotizaciones/{folio}/costeo/textos`.
      properties:
        asunto:
          type: string
          minLength: 1
          maxLength: 120
        introduccion:
          type: string
          minLength: 1
          maxLength: 1100
          description: Hasta 1100 caracteres, como la respuesta (la introducción estándar del pliego mide 1026); la IA redacta hasta 900.

    RedactarTextosWeb:
      type: object
      description: |
        HU-013.18 (#296). Cuerpo **opcional** de `POST /web/cotizaciones/{folio}/costeo/textos/redactar`. Sin cuerpo, la redacción
        es igual que hoy.
      properties:
        indicaciones_redaccion:
          type: string
          nullable: true
          maxLength: 500
          description: |
            Indicaciones del comercial para orientar al redactor con IA (una **preferencia** de enfoque o tono, p. ej.
            "destacar la experiencia en carga refrigerada, tono cercano"). **No** es `notas` (la de la Mesa de Costeo). Es una
            preferencia que **nunca** pasa por encima de las reglas estrictas del prompt (si pide montos, condiciones, otros
            nombres o cambiar el formato, esa parte se ignora) y la salida se valida igual. Hasta 500 caracteres (recortada);
            vacía, solo espacios o `null` equivale a sin indicaciones. Más de 500 caracteres: 400 `SOLICITUD_INVALIDA` sin
            llamar a la IA. No se guarda en la cotización.

    PosicionCargaWeb:
      type: object
      description: |
        Posición de cubicaje (`clsCapturaPosicionRequest` de Nexo: `descripcion`, `cantidad`, `largoCm`, `anchoCm`,
        `altoCm`, `pesoKg`), en centímetros y kilogramos. `largo_cm`, `ancho_cm` y `alto_cm` son opcionales: ausentes, `null` o `0`
        es "sin medida"; con valor van de 0,1 a 999.999 y vienen las tres juntas. `peso_kg` es **por unidad**: el peso de la
        posición es `cantidad × peso_kg`. #278 (contrato único de Nexo): es **obligatorio y mayor que 0 en una mercancía con medidas**
        (viaja a Nexo como posición y Nexo lo exige; si no, `POSICION_INVALIDA` en `mercancias[i].peso_kg`); sin medidas es opcional. Las
        mercancías con medidas de una ruta suman como máximo 10.000 unidades (`CUBICACION_DEMASIADO_GRANDE` en `mercancias`).

        **HU-032 (#197): las medidas son opcionales.** Una mercancía **sin ninguna medida y sin código** (solo `nombre_mercancia`,
        `cantidad` o `peso_kg`) es "no cubicable": se acepta y se guarda, **no viaja a Nexo como posición** (si una mercancía de la
        ruta no tiene medidas, la línea va a Nexo sin posiciones, solo con el peso de la ruta) y la ruta no se cubica (usa el
        vehículo elegido). **Medidas parciales** (por ejemplo, `largo_cm` sin `ancho_cm`) son `POSICION_INVALIDA` en la primera que
        falta ("faltan medidas"); **código sin medidas** es `POSICION_INVALIDA` en `largo_cm` (el cubicador las necesita: si no se
        conocen, quitar el código). La regla de peso de la ruta (`PESO_REQUERIDO`/`PESO_INCONSISTENTE`) cuenta todas las mercancías.

        HU-021.6 (#132): es también la **mercancía** de una ruta (`RutaCapturaWeb.mercancias`, `LineaLicitacionWeb.mercancias`).
        **HU-023.3 (#158):** en una captura nueva con el cubicador configurado, `codigo_mercancia` (código de `GET /web/tipos-mercancia`)
        es **obligatorio en una mercancía con medidas** (`CAMPO_REQUERIDO` en `mercancias[i].codigo_mercancia`; sin cubicador se acepta
        sin código y la ruta va al respaldo; HU-032: una mercancía sin medidas no lo exige); con el catálogo disponible debe estar activo
        (`MERCANCIA_DESCONOCIDA`) y ser cubicable (`MERCANCIA_NO_CUBICABLE`). `id_tipo_mercancia` queda **obsoleto**: durante la
        transición se acepta y se traduce al código con el catálogo (sin catálogo, `CAMPO_REQUERIDO` en `codigo_mercancia`).
        `nombre_mercancia` es la copia del nombre del catálogo (`descripcion` es el nombre anterior del mismo campo).
      properties:
        codigo_mercancia:
          type: string
          nullable: true
          maxLength: 64
          description: HU-023.3 (#158). Código del tipo de mercancía en el catálogo del cubicador; obligatorio en una captura nueva.
        id_tipo_mercancia:
          type: string
          format: uuid
          nullable: true
          deprecated: true
          description: Obsoleto (HU-023.3). Uuid del catálogo; se traduce a `codigo_mercancia`.
        nombre_mercancia:
          type: string
          nullable: true
          maxLength: 200
          description: HU-021.6. Copia del nombre del tipo de mercancía (se guarda en `CotizacionMercancias.nombreMercancia`).
        descripcion:
          type: string
          nullable: true
          maxLength: 200
          description: Nombre anterior de `nombre_mercancia` (se acepta igual).
        cantidad:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
        largo_cm:
          type: number
          nullable: true
          minimum: 0
          maximum: 999999
          description: |
            HU-032 (#197, B5). Opcional. Ausente, `null` o `0` = **sin medida**. Si viene con valor, es mayor que 0 (de 0,1 a 999.999;
            menos es `POSICION_INVALIDA`) y vienen las tres medidas juntas (`largo_cm`, `ancho_cm`, `alto_cm`): una parcial es
            `POSICION_INVALIDA` en la primera que falta.
        ancho_cm:
          type: number
          nullable: true
          minimum: 0
          maximum: 999999
          description: HU-032 (#197, B5). Como `largo_cm`. Ausente, `null` o `0` = sin medida; con valor, de 0,1 a 999.999 y las tres juntas.
        alto_cm:
          type: number
          nullable: true
          minimum: 0
          maximum: 999999
          description: HU-032 (#197, B5). Como `largo_cm`. Ausente, `null` o `0` = sin medida; con valor, de 0,1 a 999.999 y las tres juntas.
        peso_kg:
          type: number
          nullable: true
          minimum: 0
          maximum: 999999.99

    ConexoCapturaWeb:
      type: object
      required: [id_servicio_conexo, cantidad]
      description: |
        HU-021.6 (#132, decisión 3): un servicio conexo del catálogo de Nexo (`GET /web/servicios-conexos`) pedido con la ruta. Cotifly
        lo guarda con el **costo unitario de Nexo como precio** (`CotizacionServiciosConexos`) y lo suma al costo de la ruta; el costo
        nunca se muestra. El precio guardado es el costo de Nexo **al momento de capturar** (el catálogo se lee con una caché de 5
        minutos); el reintento y el polling no vuelven a cotizar los conexos. `CONEXO_NO_ENCONTRADO` llega junto con los demás errores. Un id que no está activo en el catálogo es `CONEXO_NO_ENCONTRADO`; el mismo servicio dos veces en la ruta,
        `CONEXO_DUPLICADO`; más de 20 por ruta, `DEMASIADOS_CONEXOS`.
      properties:
        id_servicio_conexo:
          type: string
          maxLength: 64
          description: Id del servicio en el catálogo de Nexo.
        cantidad:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 99999.99
          multipleOf: 0.01
          description: Unidades del servicio (hasta 2 decimales; más es `VALOR_FUERA_DE_RANGO`).

    RutaCapturaWeb:
      type: object
      description: |
        HU-021.6 (#132, ADR-019): una ruta del formulario por rutas. Lo que es igual para todos sus camiones: línea de negocio,
        origen y destino (id de municipio obligatorio + copia del nombre, decisión 2), condiciones del contenedor (ciudades por id +
        nombre), horas, levante, valor de la mercancía, peso, mercancías, conexos y, desde HU-032 (#197, ADR-022), el **vehículo
        elegido** (`tipo_vehiculo`, `carroceria`): el respaldo del cubicador y obligatorio cuando la ruta no se puede cubicar (salvo
        Contenedor). Mismos límites y reglas condicionales que `SolicitudCosteoWeb` (G3) y los mismos códigos de catálogo (G2).
        `peso_kg` puede faltar si las mercancías traen peso (`PESO_REQUERIDO` si ninguno).
      properties:
        linea_negocio:
          type: string
          nullable: true
          description: Línea de negocio de Cotifly de la ruta (da su margen). Sin ella, la `linea_negocio` de la solicitud.
        origen_municipio_id:
          type: integer
          nullable: true
          minimum: 1
          description: |
            Id de `GET /web/municipios`. **Obligatorio**: si no viene, Cotifly lo resuelve por `origen` y si es ambiguo responde
            `MUNICIPIO_AMBIGUO` con los candidatos (nunca adivina). Con el id y sin `origen`, el nombre se copia del catálogo.
        origen:
          type: string
          nullable: true
          maxLength: 150
          description: Copia del nombre del municipio de origen (la columna `municipio` de `GET /web/municipios`).
        destino_municipio_id:
          type: integer
          nullable: true
          minimum: 1
          description: Igual que `origen_municipio_id`, para el destino.
        destino:
          type: string
          nullable: true
          maxLength: 150
          description: Copia del nombre del municipio de destino.
        tipologia:
          type: string
          nullable: true
          maxLength: 50
          description: Igual que `SolicitudCosteoWeb.tipologia`.
        clase_viaje:
          type: string
          nullable: true
          maxLength: 50
          description: Igual que `SolicitudCosteoWeb.clase_viaje` (catálogo maestro de Nexo).
        clase_contenedor:
          type: string
          nullable: true
          maxLength: 20
          description: Igual que `SolicitudCosteoWeb.clase_contenedor` (G3).
        exclusivo:
          type: boolean
          nullable: true
        consolidado:
          type: boolean
          nullable: true
        retorna_contenedor:
          type: boolean
          nullable: true
        ciudad_devolucion_municipio_id:
          type: integer
          nullable: true
          minimum: 1
          description: Id del municipio donde se devuelve el contenedor; con solo el nombre se resuelve igual que el origen.
        ciudad_devolucion_contenedor:
          type: string
          nullable: true
          maxLength: 150
          description: Copia del nombre de la ciudad de devolución.
        levante_contenedor_diferente:
          type: boolean
          nullable: true
        ciudad_levante_municipio_id:
          type: integer
          nullable: true
          minimum: 1
          description: Id del municipio donde se levanta el contenedor; con solo el nombre se resuelve igual que el origen.
        ciudad_levante_contenedor:
          type: string
          nullable: true
          maxLength: 150
          description: Copia del nombre de la ciudad de levante.
        horas_cargue:
          type: number
          nullable: true
          minimum: 0
          maximum: 240
          description: Horas de cargue de la ruta; sin valor, las de la solicitud. (#278) `horas_cargue` y `horas_descargue` van las dos o ninguna (Nexo no acepta una sola); si viene una, `CAMPO_REQUERIDO` en la que falta.
        horas_descargue:
          type: number
          nullable: true
          minimum: 0
          maximum: 240
        valor_levante_contenedor:
          type: number
          nullable: true
          minimum: 0
          maximum: 9999999999999.99
          description: |
            Valor de UN levante del contenedor en la ruta (ex `valor_aprovisionamiento`); se copia a cada camión (decisión 4). Solo
            con una ciudad de levante distinta del origen (G3): sin ella es `CAMPO_NO_APLICA` en `valor_levante_contenedor` (DEF-1027B-3, #228; antes nombraba `valor_aprovisionamiento`).
        valor_mercancia:
          type: number
          nullable: true
          minimum: 0
          maximum: 9999999999999.99
        peso_kg:
          type: number
          nullable: true
          minimum: 0
          maximum: 999999.99
          description: Peso total de la ruta (es el del camión que se crea mientras no haya cubicador).
        peso_con_tara_kg:
          type: number
          nullable: true
          minimum: 0
          maximum: 999999.99
          description: |
            HU-030.1 (#184). **Solo con `clase_viaje = Contenedor`** y opcional: peso total de la ruta CON la tara de los contenedores
            (kg, 2 decimales), lo escribe el comercial. Valor inicial sugerido: el peso de carga (`peso_kg`). No puede ser menor que
            el peso de carga (`peso_kg` o, sin él, la suma de las mercancías): `PESO_CON_TARA_MENOR_QUE_CARGA`. Con otra clase de
            viaje es `CAMPO_NO_APLICA` (#250: Carga Suelta y Extradimensionado mandan el peso de la carga). No va al
            cubicador (recibe el peso por mercancía, sin tara): va a Nexo como `peso` de las líneas de la ruta, repartido por camión
            (la tara, por partes iguales). #250 (contrato único de Nexo, DU §8): `peso` es el total con tara y Nexo solo responde
            `PESO_INCONSISTENTE` si la suma de las posiciones lo SUPERA en más de 1 %, así que con **un solo camión** la línea viaja
            con el peso con tara **y sus posiciones** (la carga sin tara); con varios camiones, sin posiciones, como cualquier ruta
            partida. Sin él, a Nexo va el peso de carga, como antes.
        mercancias:
          type: array
          nullable: true
          maxItems: 200
          items:
            $ref: '#/components/schemas/PosicionCargaWeb'
        servicios_conexos:
          type: array
          nullable: true
          maxItems: 20
          items:
            $ref: '#/components/schemas/ConexoCapturaWeb'
        tipo_vehiculo:
          type: string
          nullable: true
          maxLength: 100
          description: |
            **HU-032 (#197, ADR-022): el vehículo elegido de la ruta**, un código de Nexo (el `valor` de `tipos_vehiculo` de
            `GET /web/catalogos-flete`; se admiten otras mayúsculas, sin tildes o con `_`/`-` por espacio, y un alias de Nexo, #194) y
            se guarda escrito como en Nexo. Regla:
            - **Ruta sin mercancías cubicables** (solo `peso_kg`, mercancías sin medidas ni código, o mixta): no se llama al cubicador
              y la ruta va con este vehículo. Es **obligatorio salvo en Contenedor** (`VEHICULO_REQUERIDO`) y se valida antes de
              guardar (`CODIGO_NO_CATALOGO`).
            - **Ruta con todas sus mercancías cubicables:** va al cubicador y este vehículo es el respaldo; NO se valida antes. Si el
              cubicador asigna, manda el cubicador (aviso `VEHICULO_AJUSTADO_POR_CUBICADOR` si era otro). Si no selecciona, falla o
              está ocupado, va este vehículo validado en ese momento (`VEHICULO_ELEGIDO_USADO`; si no es de Nexo, la ruta va sin
              vehículo con `VEHICULO_ELEGIDO_INVALIDO` y la captura no se pierde).
            Con `Captura:AceptarVehiculoCliente = false` (interruptor de reversa) se ignora con un aviso en el log.
        carroceria:
          type: string
          nullable: true
          maxLength: 100
          description: |
            HU-032 (#197): la carrocería elegida, **opcional** (Nexo autocostea Cupo con el tipo de vehículo). Misma regla que
            `tipo_vehiculo`; debe ser una carrocería de Nexo (`ESTACAS`, `ESTIBAS`, `FURGON`, `FURGON REFRIGERADO`, `PLATAFORMA`,
            `PORTACONTENEDORES`, `TANQUE`, `TRAYLER`, `VOLCO`; con la misma equivalencia: `FURGON_REFRIGERADO` sirve) o es
            `CODIGO_NO_CATALOGO` (si se valida antes) o el camión va sin carrocería con `VEHICULO_ELEGIDO_INVALIDO` (si se valida tarde).

    EdicionSolicitudWeb:
      type: object
      required: [rutas]
      description: |
        HU-028 (#186). Cuerpo de `PUT /web/cotizaciones/{folio}/solicitud`: el contenido editable completo con la forma de
        `SolicitudCosteoWeb` por rutas, más `linea_solicitud_id` en cada ruta que se conserva. Los campos bloqueados son opcionales y,
        si vienen, deben traer el valor guardado (si no, `CAMPO_NO_EDITABLE`).
      properties:
        tipo:
          type: string
          nullable: true
          description: Bloqueado. Si viene, debe ser el guardado (`spot`).
        nit_cliente:
          type: string
          nullable: true
          description: Bloqueado. Si viene, debe ser el guardado (se comparan los dígitos).
        cliente_nombre:
          type: string
          nullable: true
          description: Bloqueado. Si viene, debe ser el guardado (sin distinguir mayúsculas).
        origen_cliente:
          type: string
          nullable: true
          description: Bloqueado (`cliente` o `prospecto`). Si viene, debe ser el guardado.
        linea_negocio:
          type: string
          nullable: true
          description: Línea de negocio por defecto de una ruta nueva; debe ser una de la solicitud (`lineas_negocio_disponibles`).
        deadline:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601; sin zona se interpreta en hora de Bogotá. Ausente = sin deadline.
        notas:
          type: string
          nullable: true
          maxLength: 2000
        horas_cargue:
          type: number
          nullable: true
          minimum: 0
          maximum: 240
          description: Horas por defecto de las rutas que no traen las suyas. (#278) `horas_cargue` y `horas_descargue` van las dos o ninguna (Nexo no acepta una sola); si viene una, `CAMPO_REQUERIDO` en la que falta.
        horas_descargue:
          type: number
          nullable: true
          minimum: 0
          maximum: 240
        moneda:
          type: string
          nullable: true
          enum: [COP, USD, null]
          description: Ausente conserva la moneda guardada; si cambia, se fija la TRM del día.
        motivo:
          type: string
          nullable: true
          maxLength: 300
          description: Por qué se edita (opcional). Queda en la auditoría y viaja a Nexo como comentario del rechazo.
        modo_esperado:
          type: string
          nullable: true
          enum: [en_sitio, reemplazo, nueva_version, null]
          description: El `edicion.modo` que mostró el GET; si el estado cambió entretanto, 409 `ESTADO_NO_PERMITE` (`MODO_CAMBIO`).
        rutas:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/RutaEdicionWeb'

    EdicionSolicitudResultado:
      type: object
      required: [modo, folio, folio_origen, sin_cambios, cotizacion, avisos, rutas_replanificadas, rutas_agregadas, rutas_quitadas]
      description: HU-028 (#186). Respuesta de `PUT /web/cotizaciones/{folio}/solicitud`.
      properties:
        modo:
          type: string
          enum: [en_sitio, reemplazo, nueva_version]
          description: El modo que se aplicó.
        folio:
          type: string
          description: Folio de la cotización resultante (el mismo, o el de la `-vN`).
        folio_origen:
          type: string
          description: Folio que se editó.
        sin_cambios:
          type: boolean
          description: '`true` si el cuerpo equivale a lo guardado: no se tocó nada (ni Nexo, ni el PDF, ni la versión).'
        cotizacion:
          $ref: '#/components/schemas/CotizacionResumen'
        avisos:
          type: array
          items:
            $ref: '#/components/schemas/AvisoEdicion'
        rutas_replanificadas:
          type: array
          description: Orden (base 1) de las rutas cuyos camiones se volvieron a pedir al cubicador (nuevas o con la carga o la clase de viaje cambiada).
          items:
            type: integer
        rutas_agregadas:
          type: array
          description: Orden (base 1) de las rutas nuevas.
          items:
            type: integer
        rutas_quitadas:
          type: array
          description: '`linea_solicitud_id` de las rutas que se quitaron.'
          items:
            type: string
            format: uuid
        solicitud_nexo_reemplazada:
          type: string
          nullable: true
          enum: [descartada, ya_descartada, no_encontrada, null]
          description: En el `reemplazo`, cómo quedó la solicitud anterior en Nexo; `null` en los demás modos.
        aviso_rechazos:
          type: string
          nullable: true
          description: |
            HU-028.1 (#183, hallazgo B3): qué camiones y rutas rechazados por la Mesa de Costeo quedaron fuera del envío, con sus motivos
            (el mismo texto de `cotizacion.aviso_rechazos` y del aviso `RECHAZADOS_OMITIDOS`). No viene si no se omitió nada ni con
            `sin_cambios`.

    AvisoEdicion:
      type: object
      required: [codigo, mensaje]
      description: |
        HU-028. Aviso para el comercial: `REEMPLAZA_SOLICITUD_NEXO`, `PIERDE_TRABAJO_MESA` (estaba en `pendiente_costeo`),
        `PIERDE_COSTEO_ACTUAL`, `INVALIDA_PDF`, `CREA_VERSION_NUEVA`, `MARGEN_RUTA_QUITADA` (se quitó una ruta con margen ajustado),
        `RECHAZADOS_OMITIDOS` (HU-028.1, #183: camiones o rutas rechazados por la Mesa de Costeo que no viajaron; el mensaje es
        `aviso_rechazos`) o `SIN_CAMBIOS`.
      properties:
        codigo:
          type: string
        mensaje:
          type: string

    SolicitudEditable:
      type: object
      required: [folio, version, version_negocio, bloqueados, campos_bloqueados, edicion, moneda, lineas_negocio_disponibles, rutas]
      description: HU-028 (#186). Respuesta de `GET /web/cotizaciones/{folio}/solicitud`. Sin costos de Nexo ni precios.
      properties:
        folio:
          type: string
        version:
          type: integer
          description: Versión del folio (`-vN`).
        version_negocio:
          type: integer
          description: La misma versión que el `ETag` (para el `If-Match` del `PUT`).
        bloqueados:
          $ref: '#/components/schemas/BloqueadosSolicitud'
        campos_bloqueados:
          type: array
          description: Nombres de los campos que no se editan (`rutas[].linea_negocio` = la línea de cada ruta guardada).
          items:
            type: string
        edicion:
          $ref: '#/components/schemas/EstadoEdicion'
        deadline:
          type: string
          format: date-time
          nullable: true
        notas:
          type: string
          nullable: true
        moneda:
          type: string
          enum: [COP, USD]
        linea_negocio:
          type: string
          nullable: true
          description: Línea de negocio de la ruta 1.
        lineas_negocio_disponibles:
          type: array
          description: Las líneas de negocio de la solicitud; las únicas que puede usar una ruta nueva.
          items:
            type: string
        rutas:
          type: array
          items:
            $ref: '#/components/schemas/RutaEditable'

    BloqueadosSolicitud:
      type: object
      description: HU-028. Los campos que no se editan, con su valor guardado.
      properties:
        tipo:
          type: string
          nullable: true
          enum: [spot, licitacion, null]
        nit_cliente:
          type: string
          nullable: true
        cliente_nombre:
          type: string
          nullable: true
        origen_cliente:
          type: string
          nullable: true
          enum: [cliente, prospecto, null]

    EstadoEdicion:
      type: object
      required: [permitida, avisos]
      description: HU-028. Cómo se aplicaría una edición en el estado actual.
      properties:
        modo:
          type: string
          nullable: true
          enum: [en_sitio, reemplazo, nueva_version, null]
          description: '`null` si la edición no se permite.'
        permitida:
          type: boolean
        motivo_no_permitida:
          type: string
          nullable: true
          description: '`LICITACION` (fase 2), `SIN_FORMULARIO`, `ENVIO_EN_CURSO` o `CUBICACION_EN_CURSO`.'
        mensaje:
          type: string
          nullable: true
        avisos:
          type: array
          items:
            $ref: '#/components/schemas/AvisoEdicion'

    RutaEditable:
      type: object
      required: [linea_solicitud_id, linea_orden, linea_negocio_bloqueada, retorna_contenedor, levante_contenedor_diferente, mercancias, servicios_conexos, margen_negociado]
      description: |
        HU-028. Una ruta de la solicitud con todo lo que se captura (los mismos nombres que `RutaCapturaWeb`, más `linea_solicitud_id`
        para devolverla en el `PUT`), los municipios por id y nombre, y su margen. Sin costos.
      properties:
        linea_solicitud_id:
          type: string
          format: uuid
        linea_orden:
          type: integer
        linea_negocio:
          type: string
          nullable: true
        linea_negocio_bloqueada:
          type: boolean
          description: Siempre `true`; la línea de negocio de una ruta no se edita.
        origen_municipio_id:
          type: integer
          nullable: true
        origen:
          type: string
          nullable: true
        destino_municipio_id:
          type: integer
          nullable: true
        destino:
          type: string
          nullable: true
        tipologia:
          type: string
          nullable: true
        clase_viaje:
          type: string
          nullable: true
        clase_contenedor:
          type: string
          nullable: true
        exclusivo:
          type: boolean
          nullable: true
        consolidado:
          type: boolean
          nullable: true
        retorna_contenedor:
          type: boolean
        ciudad_devolucion_municipio_id:
          type: integer
          nullable: true
        ciudad_devolucion_contenedor:
          type: string
          nullable: true
        levante_contenedor_diferente:
          type: boolean
        ciudad_levante_municipio_id:
          type: integer
          nullable: true
        ciudad_levante_contenedor:
          type: string
          nullable: true
        horas_cargue:
          type: number
          nullable: true
        horas_descargue:
          type: number
          nullable: true
        valor_levante_contenedor:
          type: number
          nullable: true
        valor_mercancia:
          type: number
          nullable: true
        peso_kg:
          type: number
          nullable: true
        peso_con_tara_kg:
          type: number
          nullable: true
          description: |
            HU-030.1 (#184). Peso total con tara de la ruta de contenedor tal como lo escribió el comercial (`RutaCapturaWeb.peso_con_tara_kg`);
            `null` = sin tara. Cambiarlo en el `PUT` no vuelve a cubicar (el cubicador no usa la tara).
        mercancias:
          type: array
          items:
            $ref: '#/components/schemas/MercanciaEditable'
        servicios_conexos:
          type: array
          items:
            $ref: '#/components/schemas/ConexoEditable'
        margen_aplicado:
          type: number
          nullable: true
          description: Margen de la ruta (fracción). Se conserva si la ruta se edita sin quitarla.
        origen_margen:
          type: string
          nullable: true
          enum: [sap_tm, politica_linea, negociado, null]
        margen_negociado:
          type: boolean
        camiones_rechazados:
          type: integer
          minimum: 0
          description: |
            HU-028.1 (#183). Camiones de la ruta rechazados por la Mesa de Costeo de Nexo (solo lectura). Con más de 0 la pantalla ofrece
            `reincluir_rechazados`: si no se marca, esos camiones no viajan en la edición.
        motivo_rechazo:
          type: string
          nullable: true
          description: HU-028.1 (#183). Los motivos del rechazo de sus camiones (distintos, unidos con " | "); `null` sin rechazados.
        tipo_vehiculo:
          type: string
          nullable: true
          description: |
            HU-032 (#197). El vehículo **elegido** de la ruta (el respaldo del cubicador), para reenviarlo tal cual en el `PUT`; `null`
            si no eligió. No es el vehículo de los camiones (el del cubicador o el que puso la Mesa de Costeo): esos salen en
            `GET .../costeo`. En una ruta anterior a HU-032 es el del único camión del respaldo.
        carroceria:
          type: string
          nullable: true
          description: HU-032 (#197). La carrocería elegida; `null` si no eligió.

    MercanciaEditable:
      type: object
      required: [cantidad]
      description: HU-028. Una mercancía de la ruta, con su código del catálogo del cubicador (se devuelve tal cual como `PosicionCargaWeb`).
      properties:
        codigo_mercancia:
          type: string
          nullable: true
          description: '`null` solo en filas anteriores al cubicador: para recubicar hay que escogerla de nuevo.'
        nombre_mercancia:
          type: string
          nullable: true
        cantidad:
          type: integer
        largo_cm:
          type: number
          nullable: true
          description: HU-032 (#197). `null` (las tres medidas) en una mercancía no cubicable, sin medidas.
        ancho_cm:
          type: number
          nullable: true
        alto_cm:
          type: number
          nullable: true
        peso_kg:
          type: number
          nullable: true

    ConexoEditable:
      type: object
      required: [id_servicio_conexo, cantidad]
      description: |
        HU-028. Un servicio conexo de la ruta con el id del catálogo de Nexo de hoy (se devuelve como `ConexoCapturaWeb`), sin precio. Una
        fila por servicio: si el mismo servicio está capturado y además se agregó en Nexo, sale una vez con las cantidades sumadas.
      properties:
        id_servicio_conexo:
          type: string
        nombre:
          type: string
          nullable: true
        cantidad:
          type: number

    RutaEdicionWeb:
      type: object
      description: |
        HU-028 (#186). Una ruta de la edición: los mismos campos y reglas que `RutaCapturaWeb`, más `linea_solicitud_id` (el id de
        la ruta guardada que se edita, de `GET .../solicitud`; sin él, es una ruta nueva). La `linea_negocio` de una ruta guardada no
        cambia (`CAMPO_NO_EDITABLE`); una ruta nueva usa una línea de la solicitud.
      properties:
        linea_solicitud_id:
          type: string
          format: uuid
          nullable: true
          description: Id de la ruta guardada (`RutaEditable.linea_solicitud_id`); ausente = ruta nueva.
        reincluir_rechazados:
          type: boolean
          nullable: true
          description: |
            HU-028.1 (#183). `true` = los camiones de esta ruta que rechazó la Mesa de Costeo vuelven a viajar a Nexo sin el rechazo (con su
            vehículo, carrocería y peso tal como están; no se vuelve a cubicar) para que la Mesa los reconsidere. Ausente o `false` (por
            defecto): siguen rechazados y no viajan. En una ruta nueva, sin rechazados o que se vuelve a cubicar no hace nada.
        linea_negocio:
          type: string
          nullable: true
          description: Línea de negocio de Cotifly de la ruta (da su margen). Sin ella, la `linea_negocio` de la solicitud.
        origen_municipio_id:
          type: integer
          nullable: true
          minimum: 1
          description: |
            Id de `GET /web/municipios`. **Obligatorio**: si no viene, Cotifly lo resuelve por `origen` y si es ambiguo responde
            `MUNICIPIO_AMBIGUO` con los candidatos (nunca adivina). Con el id y sin `origen`, el nombre se copia del catálogo.
        origen:
          type: string
          nullable: true
          maxLength: 150
          description: Copia del nombre del municipio de origen (la columna `municipio` de `GET /web/municipios`).
        destino_municipio_id:
          type: integer
          nullable: true
          minimum: 1
          description: Igual que `origen_municipio_id`, para el destino.
        destino:
          type: string
          nullable: true
          maxLength: 150
          description: Copia del nombre del municipio de destino.
        tipologia:
          type: string
          nullable: true
          maxLength: 50
          description: Igual que `SolicitudCosteoWeb.tipologia`.
        clase_viaje:
          type: string
          nullable: true
          maxLength: 50
          description: Igual que `SolicitudCosteoWeb.clase_viaje` (catálogo maestro de Nexo).
        clase_contenedor:
          type: string
          nullable: true
          maxLength: 20
          description: Igual que `SolicitudCosteoWeb.clase_contenedor` (G3).
        exclusivo:
          type: boolean
          nullable: true
        consolidado:
          type: boolean
          nullable: true
        retorna_contenedor:
          type: boolean
          nullable: true
        ciudad_devolucion_municipio_id:
          type: integer
          nullable: true
          minimum: 1
          description: Id del municipio donde se devuelve el contenedor; con solo el nombre se resuelve igual que el origen.
        ciudad_devolucion_contenedor:
          type: string
          nullable: true
          maxLength: 150
          description: Copia del nombre de la ciudad de devolución.
        levante_contenedor_diferente:
          type: boolean
          nullable: true
        ciudad_levante_municipio_id:
          type: integer
          nullable: true
          minimum: 1
          description: Id del municipio donde se levanta el contenedor; con solo el nombre se resuelve igual que el origen.
        ciudad_levante_contenedor:
          type: string
          nullable: true
          maxLength: 150
          description: Copia del nombre de la ciudad de levante.
        horas_cargue:
          type: number
          nullable: true
          minimum: 0
          maximum: 240
          description: Horas de cargue de la ruta; sin valor, las de la solicitud. (#278) `horas_cargue` y `horas_descargue` van las dos o ninguna (Nexo no acepta una sola); si viene una, `CAMPO_REQUERIDO` en la que falta.
        horas_descargue:
          type: number
          nullable: true
          minimum: 0
          maximum: 240
        valor_levante_contenedor:
          type: number
          nullable: true
          minimum: 0
          maximum: 9999999999999.99
          description: |
            Valor de UN levante del contenedor en la ruta (ex `valor_aprovisionamiento`); se copia a cada camión (decisión 4). Solo
            con una ciudad de levante distinta del origen (G3): sin ella es `CAMPO_NO_APLICA` en `valor_levante_contenedor` (DEF-1027B-3, #228; antes nombraba `valor_aprovisionamiento`).
        valor_mercancia:
          type: number
          nullable: true
          minimum: 0
          maximum: 9999999999999.99
        peso_kg:
          type: number
          nullable: true
          minimum: 0
          maximum: 999999.99
          description: Peso total de la ruta (es el del camión que se crea mientras no haya cubicador).
        peso_con_tara_kg:
          type: number
          nullable: true
          minimum: 0
          maximum: 999999.99
          description: |
            HU-030.1 (#184). **Solo con `clase_viaje = Contenedor`** y opcional: peso total de la ruta CON la tara de los contenedores
            (kg, 2 decimales), lo escribe el comercial. Valor inicial sugerido: el peso de carga (`peso_kg`). No puede ser menor que
            el peso de carga (`peso_kg` o, sin él, la suma de las mercancías): `PESO_CON_TARA_MENOR_QUE_CARGA`. Con otra clase de
            viaje es `CAMPO_NO_APLICA` (#250: Carga Suelta y Extradimensionado mandan el peso de la carga). No va al
            cubicador (recibe el peso por mercancía, sin tara): va a Nexo como `peso` de las líneas de la ruta, repartido por camión
            (la tara, por partes iguales). #250 (contrato único de Nexo, DU §8): `peso` es el total con tara y Nexo solo responde
            `PESO_INCONSISTENTE` si la suma de las posiciones lo SUPERA en más de 1 %, así que con **un solo camión** la línea viaja
            con el peso con tara **y sus posiciones** (la carga sin tara); con varios camiones, sin posiciones, como cualquier ruta
            partida. Sin él, a Nexo va el peso de carga, como antes.
        mercancias:
          type: array
          nullable: true
          maxItems: 200
          items:
            $ref: '#/components/schemas/PosicionCargaWeb'
        servicios_conexos:
          type: array
          nullable: true
          maxItems: 20
          items:
            $ref: '#/components/schemas/ConexoCapturaWeb'
        tipo_vehiculo:
          type: string
          nullable: true
          maxLength: 100
          description: |
            HU-032 (#197): el vehículo elegido de la ruta, con la misma regla que `RutaCapturaWeb.tipo_vehiculo`. La edición lo
            **conserva** (el `GET` lo devuelve en `RutaEditable.tipo_vehiculo`; reenviarlo tal cual). En una ruta cuyos camiones
            dependen del elegido (no los asignó el cubicador), **cambiar solo el vehículo es un cambio**: la ruta se vuelve a
            planificar y viaja a Nexo (reemplazo o `-vN`, según el modo). En una ruta `ASIGNADO` es solo el respaldo y cambiarlo no
            dispara nada. Se compara con el elegido guardado, no con el vehículo que la Mesa de Costeo puso en Nexo.
        carroceria:
          type: string
          nullable: true
          maxLength: 100
          description: HU-032 (#197). La carrocería elegida (opcional); misma regla que `tipo_vehiculo`.

    SolicitudCosteoWeb:
      type: object
      required: [tipo, nit_cliente]
      x-retiro: 'Formato plano (campos de ruta en la raíz): se retira cuando salga HU-021-FE (#138).'
      description: |
        **HU-021.6 (#132):** la solicitud se captura por `rutas` (`RutaCapturaWeb`). Los campos de ruta de la raíz (desde `origen`
        hasta `posiciones`, marcados `deprecated`) son el **formato plano anterior** (una sola ruta con un camión), **obsoleto: se
        mantiene mientras el frontend nuevo no esté listo y se retira cuando salga HU-021-FE** (`x-retiro`).
        Se aceptan solo sin `rutas` (con `rutas`, cada campo plano que llegue es 400 `SOLICITUD_COSTEO_INVALIDA` con
        `CAMPO_NO_APLICA` en `detalle.errores`) y con las mismas reglas
        (id de municipio obligatorio o resoluble por nombre, mercancías con `id_tipo_mercancia`). `linea_negocio` es la de las
        rutas que no traen la suya (en el formato plano, obligatoria). `valor_estimado` y `referencia` ya no están en el contrato
        (decisión 1, #138): si llegan, se ignoran sin error y quedan en el log. `tipo_vehiculo` y `carroceria` están `deprecated`
        (decisión 7; ver `RutaCapturaWeb.tipo_vehiculo`).


        Formulario ampliado (HU-005.3, mapeo aprobado en `docs/conexion_nexo/MAPEO_CAMPOS_NEXO_COTIFLY.md` y verificado contra el código
        el 2026-10-05 en `docs/conexion_nexo/MAPEO_CAMPOS_NEXO_COTIFLY.md`): encabezado y la única línea de `clsCapturaSolicitudRequest`
        / `clsCapturaLineaRequest` de Nexo, con sus mismos límites. Cotifly lo reenvía a `POST /api/captura-solicitudes` en
        camelCase (nombre de Nexo entre paréntesis en cada campo).

        Catálogos (HU-013, ADR-018): `POST /api/captura-solicitudes` de Nexo NO valida contra sus catálogos: resuelve el
        texto por coincidencia aproximada y, si no encuentra el tipo de vehículo, **crea una fila nueva de catálogo**
        (duplicados). Por eso el frontend envía SOLO códigos de catálogo (los de `GET /web/catalogos-flete`) en
        `tipo_vehiculo`, `carroceria`, `clase_viaje`, `clase_contenedor` y `tipologia`, nunca texto libre. Cotifly lo valida
        antes de guardar (HU-013.10, G2): comparación exacta, distinguiendo mayúsculas (`3s3` no es `3S3`).

        HU-013.10 (#106): `notas` viaja a Nexo (G7), `origen_municipio_id`/`destino_municipio_id` viajan por línea (G6), las
        horas de cargue y descargue del encabezado se repiten en la línea (G5) y `deadline` sin zona es hora de Bogotá (G4).
        No se envía `modalidad` (la cubre la línea de negocio). `clienteId` solo viaja para un cliente sin BP (G14).
      properties:
        tipo:
          type: string
          enum: [spot, licitacion]
          description: Encabezado (`tipo`), en minúscula como lo valida Nexo.
        nit_cliente:
          type: string
          maxLength: 20
          description: |
            Encabezado. NIT elegido en el buscador (`GET /web/clientes`). Nexo no acepta el NIT: Cotifly resuelve el BP en
            el catálogo de Nexo y envía `clienteBp`.
        cliente_nombre:
          type: string
          nullable: true
          maxLength: 300
          description: Referencia visible mientras se resuelve; se reemplaza por el nombre del catálogo de Nexo. No viaja a Nexo.
        linea_negocio:
          type: string
          description: |
            Línea (`lineaNegocio`, máx. 100 en Nexo). Línea de negocio de Cotifly (`MargenesPolitica`, da el margen); a
            Nexo va su `mapeoLineasNexo` (enum de Nexo `PuertoAInterior`, `InteriorAPuerto`, `Nacional`,
            `DevolucionContenedor`, `Andino`, `Licitaciones`; catálogo `GET /api/catalogos/lineas-negocio`).
        deadline:
          type: string
          format: date-time
          nullable: true
          description: |
            Encabezado (`deadline`, `date-time` en Nexo). ISO 8601; Cotifly lo reenvía a Nexo con desplazamiento
            (`2026-10-10T17:00:00-05:00`). Con zona (`Z` o `-05:00`) se respeta; una fecha sola o sin zona (`2026-10-10`,
            `2026-10-10T17:00:00`) se interpreta en hora de Bogotá (America/Bogota, UTC-05:00): `2026-10-10` es
            `2026-10-10T00:00:00-05:00`, es decir, el **inicio del día en hora de Bogotá** (HU-013.10, G4; pendiente de
            confirmar con negocio si debería ser el fin del día, 23:59:59). Un texto que no es ISO 8601 es un cuerpo inválido (`ErrorWeb`).
        rutas:
          type: array
          nullable: true
          minItems: 1
          maxItems: 100
          description: |
            HU-021.6. Las rutas de la solicitud (una por fila del formulario). Sin `rutas` se lee el formato plano anterior (una
            ruta con los campos de la raíz).
          items:
            $ref: '#/components/schemas/RutaCapturaWeb'
        notas:
          type: string
          nullable: true
          maxLength: 2000
          description: |
            Encabezado (`notas`, máx. 2000 en Nexo; HU-013.10, G7): nota u observación para la Mesa de Nexo. Distinta de la
            personalización del PDF (que no viaja a Nexo). Se guarda y se reenvía en el reintento.
        horas_cargue:
          type: number
          nullable: true
          minimum: 0
          maximum: 240
          description: |
            Encabezado (`horasCargue`). Cotifly lo envía en el encabezado y también en la línea (HU-013.10, G5): sin el valor
            de línea Nexo aplica el suyo por defecto (4 h + 4 h, o 1 h + 1 h si la línea es una devolución de contenedor; DU §5). (#278) `horas_cargue` y `horas_descargue` van las dos o ninguna (Nexo no acepta una sola); si viene una, `CAMPO_REQUERIDO` en la que falta.
        horas_descargue:
          type: number
          nullable: true
          minimum: 0
          maximum: 240
          description: Encabezado (`horasDescargue`). Igual que `horas_cargue`.
        origen:
          deprecated: true
          type: string
          nullable: true
          maxLength: 150
          description: Formato plano (una ruta). Línea (`origen`). Municipio de `GET /web/municipios` (columna `municipio`).
        destino:
          deprecated: true
          type: string
          nullable: true
          maxLength: 150
          description: Formato plano. Línea (`destino`). Municipio de `GET /web/municipios`.
        origen_municipio_id:
          deprecated: true
          type: integer
          nullable: true
          minimum: 1
          description: |
            Línea (`origenMunicipioId`; HU-013.10, G6). `id` del municipio de origen en `GET /web/municipios` (id de
            `tbl_municipios` de Nexo): evita que Nexo resuelva la ruta por texto aproximado. HU-021.6 (decisión 2): obligatorio;
            si no viene, Cotifly lo resuelve por `origen` (sin adivinar). Se guarda y se reenvía.
        destino_municipio_id:
          deprecated: true
          type: integer
          nullable: true
          minimum: 1
          description: Línea (`destinoMunicipioId`). Igual que `origen_municipio_id`, para el destino.
        tipo_vehiculo:
          type: string
          nullable: true
          description: |
            Formato plano (el formato es el que está obsoleto; el campo no). HU-032 (#197): el vehículo elegido de la única ruta, con
            la misma regla que `RutaCapturaWeb.tipo_vehiculo`.
        carroceria:
          type: string
          nullable: true
          description: Formato plano. HU-032 (#197). Igual que `RutaCapturaWeb.carroceria`.
        tipologia:
          deprecated: true
          type: string
          nullable: true
          maxLength: 50
          description: |
            Línea (`tipologia`; en Nexo solo existe a nivel de LÍNEA, no por posición). Enum de Nexo de 7 valores:
            `Contenedor`, `CargaSuelta`, `GranelSolido`, `GranelLiquido`, `Alimentos`, `Refrigerados`, `CargaSeca`.
        clase_viaje:
          deprecated: true
          type: string
          nullable: true
          maxLength: 50
          description: |
            Línea (`claseViaje`). `descripcion` del catálogo maestro de Nexo (`GET /api/catalogos/clases-viaje`: `Contenedor`,
            `Cupo`, `Carga Suelta`, `Extradimensionado`). Otro texto es 400 `SOLICITUD_COSTEO_INVALIDA`.
        clase_contenedor:
          deprecated: true
          type: string
          nullable: true
          maxLength: 20
          description: |
            Línea (`claseContenedor`). Obligatoria con `clase_viaje = Contenedor` y solo admitida con ella (G3). Códigos de
            Nexo: un `valor` de `clases_contenedor` de `GET /web/catalogos-flete` (la `descripcion` de
            `GET /api/catalogos/clases-contenedor`, que es el código: `CNT20.IT`, `CNT20.RE`, `CNT20.ST`, `CNT40.HC`,
            `CNT40.RE`) o la lista provisional de extradimensionado nacional (`CNT20.FT`, `CNT20.OP`, `CNT40.FT`,
            `CNT40.OP`, G15). Otro texto es 400 `SOLICITUD_COSTEO_INVALIDA`.
        exclusivo:
          deprecated: true
          type: boolean
          nullable: true
          description: Línea (`exclusivo`).
        consolidado:
          deprecated: true
          type: boolean
          nullable: true
          description: Línea (`consolidado`).
        retorna_contenedor:
          deprecated: true
          type: boolean
          nullable: true
          description: Línea (`retornaContenedor`). Nexo lo fuerza a `true` si viene `ciudad_devolucion_contenedor`.
        ciudad_devolucion_contenedor:
          deprecated: true
          type: string
          nullable: true
          maxLength: 150
          description: Línea (`ciudadDevolucionContenedor`), condicional a `retorna_contenedor`.
        ciudad_devolucion_municipio_id:
          deprecated: true
          type: integer
          nullable: true
          minimum: 1
          description: HU-021.6 (decisión 2). Id de municipio de la ciudad de devolución (con solo el nombre, se resuelve).
        levante_contenedor_diferente:
          deprecated: true
          type: boolean
          nullable: true
          description: Línea (`levanteContenedorDiferente`). Nexo lo fuerza a `true` si la ciudad de levante difiere del origen.
        ciudad_levante_contenedor:
          deprecated: true
          type: string
          nullable: true
          maxLength: 150
          description: Línea (`ciudadLevanteContenedor`), condicional a `levante_contenedor_diferente`.
        ciudad_levante_municipio_id:
          deprecated: true
          type: integer
          nullable: true
          minimum: 1
          description: HU-021.6 (decisión 2). Id de municipio de la ciudad de levante (con solo el nombre, se resuelve).
        valor_aprovisionamiento:
          deprecated: true
          type: number
          nullable: true
          minimum: 0
          maximum: 9999999999999.99
          description: |
            Línea (`valorAprovisionamiento`). Solo con una `ciudad_levante_contenedor` distinta del origen (G3; Nexo lo
            descarta en otro caso): sin ella es 400 `SOLICITUD_COSTEO_INVALIDA`.
        peso_kg:
          deprecated: true
          type: number
          nullable: true
          minimum: 0
          maximum: 999999.99
          description: |
            Línea (`peso`). Obligatorio (> 0) si las posiciones no aportan peso; si ambos vienen, deben coincidir con
            `sum(cantidad × posiciones[].peso_kg)` dentro del 1 % (`PESO_REQUERIDO` / `PESO_INCONSISTENTE`).
        valor_mercancia:
          deprecated: true
          type: number
          nullable: true
          minimum: 0
          maximum: 9999999999999.99
          description: Línea (`valorMercancia`).
        posiciones:
          deprecated: true
          type: array
          maxItems: 200
          default: []
          items:
            $ref: '#/components/schemas/PosicionCargaWeb'
        moneda:
          type: string
          nullable: true
          enum: [COP, USD, null]
          description: |
            Opcional (HU-013.7, #103; mismo contrato que `LicitacionWeb.moneda`, ADR-014 §5). Moneda de la cotización: `COP`
            por defecto. Con `USD` la TRM del día se fija al crear (`trm_aplicada`), los precios del flete y de los
            conexos se convierten con ella y el PDF lleva la nota de TRM mínima. Sin TRM, 400 `TRM_NO_DISPONIBLE` y nada
            se guarda ni se envía a Nexo. Se acepta sin distinguir mayúsculas ni espacios al borde; una cadena vacía u otro
            valor es 400 `SOLICITUD_COSTEO_INVALIDA` (el mensaje nombra el campo `moneda`).

    HojaExcel:
      type: object
      required: [nombre, fila_encabezado, encabezados, filas, total_filas]
      description: Hoja del Excel analizada por Nexo (`HojaExcelDto`).
      properties:
        nombre:
          type: string
        fila_encabezado:
          type: integer
          description: Fila (base 1) del encabezado detectado.
        encabezados:
          type: array
          items:
            type: string
        filas:
          type: array
          description: Hasta 1000 filas con datos, como texto; el índice de cada una es la `fila` de `LineaLicitacionWeb`.
          items:
            type: array
            items:
              type: string
        total_filas:
          type: integer
        filas_excel:
          type: array
          nullable: true
          items:
            type: integer
          description: |
            HU-013.15 (#124). Número de fila de la hoja de Excel (base 1, encabezado incluido) de cada elemento de `filas`, en el
            mismo orden: es la numeración que ve el comercial en su archivo y la que el frontend debe mostrar (`filas_excel[i]`
            para `filas[i]`). La calcula Cotifly con la misma regla de detección de Nexo; `null` si la hoja no cuadra con el
            análisis de Nexo (en ese caso, mostrar la posición base 1).
        columna_mercancia:
          type: string
          nullable: true
          description: HU-023.5 (#160). Encabezado que Cotifly reconoció como la descripción de la mercancía; `null` si no hay.
        columna_codigo_mercancia:
          type: string
          nullable: true
          description: HU-023.5. Encabezado que Cotifly reconoció como el código de la mercancía; `null` si no hay.
        mercancias:
          type: array
          nullable: true
          description: HU-023.5. Código de mercancía de cada fila con mercancía; `null` si la hoja no tiene columna de mercancía ni de código.
          items:
            $ref: '#/components/schemas/CodigoMercanciaFila'

    CodigoMercanciaFila:
      type: object
      required: [fila, texto, codigo_mercancia, nombre_mercancia, sugerido, origen, similitud]
      description: |
        HU-023.5 (#160). El `codigo_mercancia` de una fila del análisis: el de la columna de código del Excel tal cual
        (`origen = excel`) o el más parecido del catálogo del cubicador (`origen = parecido`, `sugerido = true`: el comercial lo
        confirma o lo cambia). `null` si nada se parece.
      properties:
        fila:
          type: integer
          minimum: 0
          description: Índice en `hojas[h].filas` (base 0), el mismo `fila` de `LineaLicitacionWeb`.
        texto:
          type: string
          nullable: true
          description: Lo que dice la columna de la mercancía.
        codigo_mercancia:
          type: string
          nullable: true
        nombre_mercancia:
          type: string
          nullable: true
          description: Nombre del tipo en el catálogo del cubicador (`null` si el código no está en él).
        sugerido:
          type: boolean
        origen:
          type: string
          nullable: true
          enum: [excel, parecido, null]
        similitud:
          type: number
          nullable: true
          minimum: 0
          maximum: 1

    AnalisisExcel:
      type: object
      required: [archivo, hojas, catalogo_mercancias_disponible]
      description: '`AnalisisExcelDto` de Nexo (HU-011.2).'
      properties:
        archivo:
          type: string
        hojas:
          type: array
          items:
            $ref: '#/components/schemas/HojaExcel'
        catalogo_mercancias_disponible:
          type: boolean
          description: HU-023.5. `false` sin cubicador o con su catálogo caído (no hay sugerencias por parecido).

    SugerirMapeoWeb:
      type: object
      required: [encabezados]
      description: HU-044.2 (#253). Los encabezados de UNA hoja, en el orden del archivo, y una muestra de sus filas.
      properties:
        nit_cliente:
          type: string
          nullable: true
          description: NIT de la licitación (con o sin puntos y dígito de verificación). Opcional; sin él NEXO usa solo el diccionario general.
        encabezados:
          type: array
          description: De 1 a 100 (con más, la hoja se responde sin propuesta). `null` viaja como texto vacío.
          items:
            type: string
            nullable: true
        filas:
          type: array
          nullable: true
          description: Muestra de filas sin el encabezado (el frontend manda hasta 200; se reenvían las 200 primeras).
          items:
            type: array
            nullable: true
            items:
              type: string
              nullable: true

    SugerenciaMapeo:
      type: object
      required: [ia_usada, motivo_sin_ia, columnas, dudas, plantilla_id]
      description: HU-044.2 (#253). La propuesta de mapeo de NEXO para una hoja, una entrada por encabezado.
      properties:
        ia_usada:
          type: boolean
          description: Si la IA de NEXO participó.
        motivo_sin_ia:
          type: string
          nullable: true
          description: |
            Por qué no participó la IA (`null` si participó). De NEXO: `PLANTILLA_RECONOCIDA`, `DICCIONARIO_COMPLETO`,
            `IA_NO_DISPONIBLE` o un `IA_*` del proveedor. De Cotifly, con todas las columnas sin propuesta: `DEMASIADAS_COLUMNAS`
            (más de 100, sin llamar a NEXO) y `NEXO_NO_DISPONIBLE` (importación apagada, NEXO caído o sin respuesta a tiempo).
        columnas:
          type: array
          items:
            $ref: '#/components/schemas/ColumnaMapeada'
        dudas:
          type: array
          description: Preguntas de la IA al comercial, para mostrarlas junto al mapeo.
          items:
            type: string
        plantilla_id:
          type: string
          format: uuid
          nullable: true
          description: La plantilla del cliente que NEXO reconoció (`motivo_sin_ia = PLANTILLA_RECONOCIDA`).

    ColumnaMapeada:
      type: object
      required: [indice, columna, campo, transformacion, confianza, origen, nota]
      description: HU-044.2 (#253). La propuesta para una columna.
      properties:
        indice:
          type: integer
          description: Posición del encabezado (base 0).
        columna:
          type: string
          description: El encabezado tal como vino.
        campo:
          type: string
          description: Campo de NEXO (`origen`, `destino`, `tipoVehiculo`, `peso`, `pesoKg`...) o `ignorar` (sin propuesta).
        transformacion:
          type: string
          description: Transformación de NEXO (`ninguna`, `peso_toneladas_a_kg`...).
        confianza:
          type: number
          description: De 0 a 1.
        origen:
          type: string
          description: '`plantilla`, `diccionario`, `ia` o `ninguno`.'
        nota:
          type: string
          nullable: true

    LecturaEstructura:
      type: object
      required: [archivo, origen_receta, similitud, receta_guardada_id, ia_usada, motivo_sin_ia, receta, resumen, dudas, hojas_del_archivo, tablas, avisos, cambios]
      description: |
        HU-044.2 (#253). La lectura de `leer-estructura` de NEXO, sin alterar `receta` ni `tablas` (solo los nombres de los campos de
        primer nivel pasan a snake_case).
      properties:
        archivo:
          type: string
        origen_receta:
          type: string
          description: '`guardada` (formato confirmado del cliente, sin IA), `ia` (la propuso el modelo), `manual` (la receta enviada, sin IA) o `automatica` (lectura simple sin IA).'
        similitud:
          type: number
          nullable: true
          description: De 0 a 1, cuánto se parece al formato guardado que se usó o se tomó de base (desde 0,85 se reutiliza sin IA).
        receta_guardada_id:
          type: string
          format: uuid
          nullable: true
        ia_usada:
          type: boolean
        motivo_sin_ia:
          type: string
          nullable: true
          description: '`IA_NO_DISPONIBLE`, `IA_RESPUESTA_INVALIDA`, un código del proveedor u otro motivo de NEXO; `null` si la IA participó.'
        receta:
          type: object
          nullable: true
          description: |
            La receta que NEXO ejecutó, **opaca**: Cotifly no la interpreta ni la cambia, y sus claves NO pasan a snake_case. Se
            devuelve como texto JSON en la parte `receta` de la siguiente corrección (y al guardar el formato del cliente, #256).
        resumen:
          type: string
          nullable: true
          description: Lo que entendió la IA, para el chat.
        dudas:
          type: array
          items:
            type: string
        hojas_del_archivo:
          type: array
          items:
            $ref: '#/components/schemas/HojaDelArchivo'
        tablas:
          type: array
          description: |
            Una por hoja, o una sola si la receta las une. Misma forma que las hojas de `analizar-excel`; cada una va a `sugerir-mapeo` sin
            transformarla. HU-044.7 (#290): cada tabla pasa por la misma detección de mercancías de `analizar-excel`, así que trae
            `columna_mercancia`, `columna_codigo_mercancia` y `mercancias` (o `null` si la tabla no tiene columna de mercancía ni de código);
            `mercancias[].fila` es el índice dentro de `tablas[t].filas` (la misma convención que la `fila` de `LineaLicitacionWeb`) y
            `filas_excel` siempre es `null` en las tablas. La `receta` y el resto de la respuesta de NEXO no se tocan.
          items:
            $ref: '#/components/schemas/HojaExcel'
        avisos:
          type: array
          items:
            type: string
        cambios:
          description: Si el formato cambió respecto al guardado, los títulos que faltan y los nuevos; `null` si no.
          oneOf:
            - $ref: '#/components/schemas/CambiosDeFormato'
            - $ref: '#/components/schemas/Nulo'

    HojaDelArchivo:
      type: object
      required: [nombre, oculta, filas, columnas, usada]
      description: HU-044.2 (#253). Una hoja del libro, con su tamaño y si la receta la usó.
      properties:
        nombre:
          type: string
        oculta:
          type: boolean
        filas:
          type: integer
        columnas:
          type: integer
        usada:
          type: boolean

    CambiosDeFormato:
      type: object
      required: [faltan, nuevos]
      description: HU-044.2 (#253). Títulos que ya no aparecen y títulos nuevos respecto al formato guardado del cliente.
      properties:
        faltan:
          type: array
          items:
            type: string
        nuevos:
          type: array
          items:
            type: string

    AnalisisExcelMercancias:
      type: object
      required: [archivo, hojas, total_hojas, hojas_truncadas, catalogo_mercancias_disponible]
      description: |
        HU-035.1 (#202, ADR-024). Grilla cruda del Excel de mercancías de una ruta, leída por Cotifly (sin Nexo). Es la misma forma de
        `AnalisisExcel` (mismos `archivo`, `hojas[].nombre`, `fila_encabezado`, `encabezados`, `filas`, `total_filas`, `filas_excel`,
        `columna_mercancia`, `columna_codigo_mercancia`, `mercancias` y `catalogo_mercancias_disponible`) más los indicadores de
        truncado, para que el frontend reutilice su pantalla de mapeo.
      properties:
        archivo:
          type: string
          description: Nombre del archivo subido (sin rutas del cliente).
        hojas:
          type: array
          description: Las hojas con datos, en el orden del libro (hasta 20).
          items:
            $ref: '#/components/schemas/HojaExcelMercancias'
        total_hojas:
          type: integer
          minimum: 0
          description: Hojas del libro (con y sin datos).
        hojas_truncadas:
          type: boolean
          description: '`true` si el libro tiene más de 20 hojas: solo se leyeron las 20 primeras.'
        catalogo_mercancias_disponible:
          type: boolean
          description: '`false` sin cubicador, con su catálogo caído o sin columna de mercancía (no hay sugerencias por parecido).'

    HojaExcelMercancias:
      type: object
      required: [nombre, fila_encabezado, encabezados, filas, filas_excel, total_filas, filas_truncadas, total_columnas,
        columnas_truncadas, celdas_recortadas, oculta, columna_mercancia, columna_codigo_mercancia, mercancias]
      description: HU-035.1 (#202). Una hoja leída por Cotifly, con los mismos campos de `HojaExcel` y los indicadores de truncado.
      properties:
        nombre:
          type: string
        fila_encabezado:
          type: integer
          minimum: 1
          description: Fila de Excel (base 1) del encabezado detectado.
        encabezados:
          type: array
          maxItems: 50
          description: Texto de cada columna del encabezado, desde la primera columna usada; `""` si la celda está vacía.
          items:
            type: string
        filas:
          type: array
          maxItems: 1000
          description: Filas con datos debajo del encabezado, cada una del ancho de `encabezados`, como texto con formato estable.
          items:
            type: array
            items:
              type: string
        filas_excel:
          type: array
          maxItems: 1000
          description: Número de fila de Excel (base 1) de cada elemento de `filas`, en el mismo orden (`filas_excel[i]` para `filas[i]`).
          items:
            type: integer
        total_filas:
          type: integer
          minimum: 0
          description: Filas con datos de la hoja debajo del encabezado (el total real, aunque `filas` traiga menos).
        filas_truncadas:
          type: boolean
          description: '`true` si `filas` trae menos que `total_filas` (más de 1000 filas o el tope de 100.000 celdas de la respuesta).'
        total_columnas:
          type: integer
          minimum: 0
          description: Ancho real usado de la hoja (desde la primera hasta la última columna con datos).
        columnas_truncadas:
          type: boolean
          description: '`true` si la hoja tiene más de 50 columnas: solo vienen las 50 primeras.'
        celdas_recortadas:
          type: boolean
          description: '`true` si alguna celda de esta hoja pasaba de 500 caracteres y se recortó.'
        oculta:
          type: boolean
          description: |
            `true` si la hoja está oculta en Excel (`hidden` o `veryHidden`, como las listas de validación); `false` si es visible.
            Las ocultas se leen igual que las visibles (no se omiten): el frontend decide si las ofrece.
        columna_mercancia:
          type: string
          nullable: true
          description: Encabezado que Cotifly reconoció como la descripción de la mercancía; `null` si no hay.
        columna_codigo_mercancia:
          type: string
          nullable: true
          description: Encabezado que Cotifly reconoció como el código de la mercancía; `null` si no hay.
        mercancias:
          type: array
          nullable: true
          description: Código de mercancía de cada fila con mercancía; `null` si la hoja no tiene columna de mercancía ni de código.
          items:
            $ref: '#/components/schemas/CodigoMercanciaFila'

    LineaLicitacionWeb:
      type: object
      description: |
        Una línea mapeada por el frontend: los campos destino de `docs/conexion_nexo/HU-011-formato-excel-licitacion.md` §3 (los de
        `CapturaLineaRequest` de Nexo, con los límites de `SolicitudCosteoWeb`) y la `fila` del análisis.

        HU-013.11 (#108): cada fila cumple las mismas reglas de captura que el formulario de una línea:
        - **Códigos de catálogo (G2).** `tipo_vehiculo`, `carroceria`, `clase_viaje`, `clase_contenedor` y `tipologia` se validan
          por código, igual que en `SolicitudCosteoWeb` (comparación exacta, distinguiendo mayúsculas; se acepta la lista
          provisional `CNT20.FT`, `CNT20.OP`, `CNT40.FT` y `CNT40.OP`). Un texto libre del pliego (`Tractomula`, `3s3`) es
          `CODIGO_NO_CATALOGO` en esa fila: el frontend mapea los valores del pliego a los códigos de `GET /web/catalogos-flete`.
        - **Condicionales (G3).** `clase_contenedor` es obligatoria con `clase_viaje = Contenedor` (`CAMPO_REQUERIDO`); con
          `Extradimensionado` (HU-021.15, #297) es opcional y solo admite las clases provisionales G15 (`CNT20.FT`, `CNT20.OP`,
          `CNT40.FT`, `CNT40.OP`; otra es `VALOR_FUERA_DE_RANGO`); con las demás clases de viaje no aplica (`CAMPO_NO_APLICA`);
          `valor_levante_contenedor` (ex `valor_aprovisionamiento`; el error lo nombra así desde #228) solo con una `ciudad_levante_contenedor` distinta del
          origen (`CAMPO_NO_APLICA`).
        - **Municipios (G6).** Si la fila no trae `origen_municipio_id`/`destino_municipio_id`, Cotifly resuelve el texto de
          `origen`/`destino` en el catálogo de `GET /web/municipios` con la regla determinista de HU-005.13 (sin tildes ni
          mayúsculas; acepta `Municipio, Departamento`). Una sola coincidencia: se usa su id. Varias, o solo una coincidencia
          aproximada: `MUNICIPIO_AMBIGUO` (el mensaje trae los candidatos con su id). Ninguna: `MUNICIPIO_NO_ENCONTRADO`.
          Cotifly nunca elige entre candidatos. El texto se guarda y viaja tal como vino, junto al id.
        - **Horas (G5).** `horas_cargue`/`horas_descargue` de la fila, si vienen, viajan en esa línea; si no, las del encabezado.

        HU-021.6 (#132, ADR-019): cada fila es una **ruta**. Puede traer su `linea_negocio` (sin ella, la de la licitación), las
        ciudades de devolución y de levante por id + nombre (con solo el nombre se resuelven como el origen), `mercancias` con
        `codigo_mercancia` (HU-023) y `servicios_conexos` del catálogo de Nexo (`ConexoCapturaWeb`). Una fila con solo el id de
        municipio copia el nombre del catálogo. HU-032 (#197, endurecimiento A #199 corrige este texto): `tipo_vehiculo` y
        `carroceria` YA NO se ignoran: son el vehículo elegido de la fila, con las mismas reglas que `RutaCapturaWeb` (respaldo del
        cubicador y obligatorio en una fila sin mercancías cubicables, salvo Contenedor; `Captura:AceptarVehiculoCliente = false`
        los vuelve a ignorar). Los montos (`valor_*`) van de 0 a 9.999.999.999.999,99 y los pesos hasta 999.999,99, con 2 decimales.

        Los valores se guardan recortados y el primer envío, el reintento y la re-solicitud mandan exactamente lo guardado.
      properties:
        linea_negocio:
          type: string
          nullable: true
          description: HU-021.6. Línea de negocio de la ruta; sin ella, la `linea_negocio` de la licitación.
        fila:
          type: integer
          nullable: true
          minimum: 0
          description: |
            Con `origen_lectura = analizar_excel` (por defecto): índice (base 0) en `hojas[h].filas` de `analizar-excel`; único por
            licitación. Es un dato técnico: al comercial se le muestra `hojas[h].filas_excel[fila]` (fila del Excel) y los mensajes de error
            nunca usan este índice (HU-013.15, #124). Con `origen_lectura = leer_estructura` (HU-044.7, #290): índice (base 0) dentro de
            `tablas[t].filas`, único; no hay `filas_excel` (no se relee la hoja) y los mensajes de error nombran «línea N de la tabla X».
            HU-044.10 (#293, parte 2): **`null` es una línea agregada a mano** (válida con o sin archivo, con cualquier `origen_lectura`): la
            unicidad ignora los `null`, sus errores dicen «La línea N» (con `fila` y `fila_excel` en `null`) y en la exportación va a la hoja
            «Agregadas en Cotifly» (analizar_excel con original) o al final de la hoja «Licitación» (leer_estructura o sin original). Una
            licitación hecha solo de líneas a mano es válida (con archivo sigue exigiendo `hoja`).
        origen:
          type: string
          maxLength: 150
          description: Texto del pliego (municipio, opcionalmente con su departamento). Sin `origen_municipio_id`, se resuelve.
        destino:
          type: string
          maxLength: 150
          description: Igual que `origen`, para el destino.
        origen_municipio_id:
          type: integer
          nullable: true
          minimum: 1
          description: |
            Opcional (`origenMunicipioId`; HU-013.11, G6). `id` de `GET /web/municipios` si el frontend ya lo resolvió (por
            ejemplo, al elegir entre los candidatos de un `MUNICIPIO_AMBIGUO`). Si viene, se respeta y no se resuelve el texto.
        destino_municipio_id:
          type: integer
          nullable: true
          minimum: 1
          description: Opcional (`destinoMunicipioId`). Igual que `origen_municipio_id`, para el destino.
        horas_cargue:
          type: number
          nullable: true
          minimum: 0
          maximum: 240
          description: Opcional (`horasCargue` de la línea; HU-013.11, G5). Sin valor, viajan las del encabezado. (#278) `horas_cargue` y `horas_descargue` van las dos o ninguna (Nexo no acepta una sola); si viene una, `CAMPO_REQUERIDO` en la que falta.
        horas_descargue:
          type: number
          nullable: true
          minimum: 0
          maximum: 240
          description: Opcional (`horasDescargue` de la línea). Sin valor, viajan las del encabezado.
        tipo_vehiculo:
          type: string
          nullable: true
          maxLength: 100
          description: |
            HU-032 (#197): el vehículo elegido de la fila, con la misma regla que `RutaCapturaWeb.tipo_vehiculo`. Una fila con todas sus
            mercancías cubicables se cubica en segundo plano (camión provisional sin vehículo; el elegido es el respaldo); una fila
            sin mercancías cubicables no espera al cubicador y lleva el elegido (obligatorio salvo Contenedor). Los avisos de cada
            fila salen en `Licitacion.cubicacion[]` (por `linea_orden`).
        carroceria:
          type: string
          nullable: true
          maxLength: 100
          description: HU-032 (#197). La carrocería elegida (opcional). Igual que `RutaCapturaWeb.carroceria`.
        tipologia:
          type: string
          nullable: true
          maxLength: 50
        clase_viaje:
          type: string
          nullable: true
          maxLength: 50
        clase_contenedor:
          type: string
          nullable: true
          maxLength: 20
        exclusivo:
          type: boolean
          nullable: true
        consolidado:
          type: boolean
          nullable: true
        retorna_contenedor:
          type: boolean
          nullable: true
        ciudad_devolucion_contenedor:
          type: string
          nullable: true
          maxLength: 150
        ciudad_devolucion_municipio_id:
          type: integer
          nullable: true
          minimum: 1
          description: HU-021.6. Id de municipio de la ciudad de devolución; sin él se resuelve por el nombre.
        levante_contenedor_diferente:
          type: boolean
          nullable: true
        ciudad_levante_contenedor:
          type: string
          nullable: true
          maxLength: 150
        ciudad_levante_municipio_id:
          type: integer
          nullable: true
          minimum: 1
          description: HU-021.6. Id de municipio de la ciudad de levante; sin él se resuelve por el nombre.
        valor_levante_contenedor:
          type: number
          nullable: true
          minimum: 0
          maximum: 9999999999999.99
          description: HU-021.6. Valor de un levante (nombre nuevo de `valor_aprovisionamiento`; si llegan los dos, vale este).
        valor_aprovisionamiento:
          type: number
          nullable: true
          minimum: 0
          maximum: 9999999999999.99
        peso_kg:
          type: number
          nullable: true
          minimum: 0
          maximum: 999999.99
        peso_con_tara_kg:
          type: number
          nullable: true
          minimum: 0
          maximum: 999999.99
          description: |
            HU-030.1 (#184). **Solo con `clase_viaje = Contenedor`** y opcional: peso total de la ruta CON la tara de los contenedores
            (kg, 2 decimales), lo escribe el comercial. Valor inicial sugerido: el peso de carga (`peso_kg`). No puede ser menor que
            el peso de carga (`peso_kg` o, sin él, la suma de las mercancías): `PESO_CON_TARA_MENOR_QUE_CARGA`. Con otra clase de
            viaje es `CAMPO_NO_APLICA` (#250: Carga Suelta y Extradimensionado mandan el peso de la carga). No va al
            cubicador (recibe el peso por mercancía, sin tara): va a Nexo como `peso` de las líneas de la ruta, repartido por camión
            (la tara, por partes iguales). #250 (contrato único de Nexo, DU §8): `peso` es el total con tara y Nexo solo responde
            `PESO_INCONSISTENTE` si la suma de las posiciones lo SUPERA en más de 1 %, así que con **un solo camión** la línea viaja
            con el peso con tara **y sus posiciones** (la carga sin tara); con varios camiones, sin posiciones, como cualquier ruta
            partida. Sin él, a Nexo va el peso de carga, como antes.
        valor_mercancia:
          type: number
          nullable: true
          minimum: 0
          maximum: 9999999999999.99
        mercancias:
          type: array
          nullable: true
          maxItems: 200
          description: HU-021.6. Mercancías de la ruta (nombre nuevo de `posiciones`; si llegan las dos, valen estas).
          items:
            $ref: '#/components/schemas/PosicionCargaWeb'
        posiciones:
          type: array
          nullable: true
          maxItems: 200
          items:
            $ref: '#/components/schemas/PosicionCargaWeb'
        servicios_conexos:
          type: array
          nullable: true
          maxItems: 20
          items:
            $ref: '#/components/schemas/ConexoCapturaWeb'

    LicitacionWeb:
      type: object
      required: [nit_cliente, linea_negocio, lineas]
      description: |
        Encabezado de la licitación (el `tipo` es siempre `licitacion`) y sus líneas ya mapeadas, hasta 1000. `valor_estimado` y
        `referencia` ya no están en el contrato (decisión 1 de HU-021, #138): si llegan, se ignoran sin error y quedan en el log.
      properties:
        nit_cliente:
          type: string
          maxLength: 20
        cliente_nombre:
          type: string
          nullable: true
          maxLength: 300
        linea_negocio:
          type: string
          description: |
            Línea de Cotifly; da el margen de toda la licitación y su `mapeoLineasNexo` viaja en cada línea. "Licitaciones" no es
            una línea de Cotifly (es del catálogo de Nexo): responde 400 `MARGEN_LINEA_DESCONOCIDA` con `detalle.motivo =
            LINEA_DE_NEXO` y `detalle.lineas_validas` (HU-013.15, #124; pregunta 16 de `docs/conexion_nexo/HU-013-preguntas-nexo.md`).
        deadline:
          type: string
          format: date-time
          nullable: true
          description: |
            Endurecimiento A (#199). Opcional. ISO 8601: con zona se respeta; sin zona (o solo la fecha, `2026-10-31`) se interpreta en
            hora de Bogotá (-05:00). No se valida que sea futura. En la respuesta (`Licitacion.deadline`) vuelve en UTC (D5). Un
            valor que no es ISO es 400 `ErrorWeb` ("Cuerpo inválido").
        notas:
          type: string
          nullable: true
          maxLength: 2000
          description: Opcional (`notas`, HU-013.11). Nota para la Mesa de Nexo, igual que en `SolicitudCosteoWeb` (G7).
        horas_cargue:
          type: number
          nullable: true
          minimum: 0
          maximum: 240
          description: Encabezado. Viajan en cada línea que no trae sus propias `horas_cargue` (G5). (#278) `horas_cargue` y `horas_descargue` van las dos o ninguna (Nexo no acepta una sola); si viene una, `CAMPO_REQUERIDO` en la que falta.
        horas_descargue:
          type: number
          nullable: true
          minimum: 0
          maximum: 240
          description: Encabezado. Igual que `horas_cargue`.
        hoja:
          type: string
          nullable: true
          maxLength: 31
          description: |
            Con `origen_lectura = analizar_excel` (por defecto): la hoja mapeada (`hojas[h].nombre`), obligatoria con el archivo; Cotifly la
            relee para calcular `filas_excel`. Con `origen_lectura = leer_estructura`: el **nombre de la tabla** (`tablas[t].nombre`), solo de
            referencia (no se relee ninguna hoja original).
        origen_lectura:
          type: string
          nullable: true
          enum: [analizar_excel, leer_estructura, null]
          description: |
            HU-044.7 (#290). Cómo se leyó el Excel. `analizar_excel` (por defecto; ausente o vacío cae aquí y el flujo de hoy NO cambia): la
            `fila` de cada línea es el índice en `hojas[h].filas` de `analizar-excel` y la exportación escribe los precios sobre el Excel
            original. `leer_estructura`: lo leyó la IA de NEXO (`leer-estructura`), la `hoja` es el nombre de la tabla, la `fila` es el índice
            dentro de la tabla y la exportación arma un Excel **nuevo** (hoja «Licitación») sin tocar el original. Cualquier otro valor es 400
            `VALIDATION_ERROR` (con `detalle.campos = ["origen_lectura"]`).
        moneda:
          type: string
          nullable: true
          enum: [COP, USD, null]
          description: |
            Opcional (ADR-014 §5). Moneda de la licitación: `COP` por defecto. Con `USD` los precios se convierten con la TRM
            del día de creación (`trm_aplicada` de `Licitacion`) y el PDF de pliego lleva la nota de TRM mínima. Se acepta
            sin distinguir mayúsculas ni espacios al borde. Endurecimiento A (#199): `null` o ausente es `COP`; un texto vacío o
            cualquier otro valor es un error de la licitación (`ReporteLicitacionInvalida`, `VALOR_FUERA_DE_RANGO` en `moneda`).
        lineas:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/LineaLicitacionWeb'

    ErrorFilaLicitacion:
      type: object
      required: [indice, fila, campo, codigo, mensaje]
      properties:
        indice:
          type: integer
          nullable: true
          description: Posición en `lineas[]` (base 0); `null` si el error es del encabezado.
        fila:
          type: integer
          nullable: true
          description: La `fila` que mandó el frontend para esa línea (índice base 0 en `hojas[h].filas`, técnico).
        fila_excel:
          type: integer
          nullable: true
          description: |
            HU-013.15 (#124). Número de fila de la hoja de Excel (base 1, encabezado incluido) de esa línea, el que ve el comercial:
            solo con el archivo adjunto y una `fila` que existe en la hoja; si no, `null` (mostrar "línea `indice + 1`"). Los
            `mensaje` usan la misma numeración: la fila del Excel o la línea en base 1, nunca el índice `fila`.
        campo:
          type: string
        codigo:
          type: string
          enum: [LINEAS_REQUERIDAS, DEMASIADAS_LINEAS, LINEA_INCOMPLETA, CAMPO_REQUERIDO, CAMPO_DEMASIADO_LARGO, VALOR_FUERA_DE_RANGO,
                 DEMASIADAS_POSICIONES, POSICION_INVALIDA, PESO_REQUERIDO, PESO_INCONSISTENTE, FILA_INVALIDA, CAMPO_NO_APLICA,
                 CODIGO_NO_CATALOGO, MUNICIPIO_AMBIGUO, MUNICIPIO_NO_ENCONTRADO, MUNICIPIO_INEXISTENTE, CONEXO_DUPLICADO,
                 CONEXO_NO_ENCONTRADO, DEMASIADOS_CONEXOS, TIPO_MERCANCIA_INEXISTENTE, MERCANCIA_DESCONOCIDA, MERCANCIA_NO_CUBICABLE,
                 PESO_CON_TARA_MENOR_QUE_CARGA, VEHICULO_REQUERIDO, MARGEN_LINEA_DESCONOCIDA]
          description: |
            HU-013.11: `CODIGO_NO_CATALOGO` (el valor no es un código de catálogo, G2), `CAMPO_NO_APLICA` y `CAMPO_REQUERIDO` de las
            reglas condicionales (G3), `MUNICIPIO_AMBIGUO` y `MUNICIPIO_NO_ENCONTRADO` (G6, campo `origen` o `destino`).
            HU-021.6: `MUNICIPIO_*` también en `ciudad_devolucion_contenedor`/`ciudad_levante_contenedor` (y
            `MUNICIPIO_INEXISTENTE` en `*_municipio_id` si el id no está en el catálogo); `CAMPO_REQUERIDO` en
            `origen_municipio_id`/`destino_municipio_id` y `mercancias[i].id_tipo_mercancia`; `CONEXO_DUPLICADO`,
            `CONEXO_NO_ENCONTRADO` y `DEMASIADOS_CONEXOS` en `servicios_conexos`. HU-021.5: `TIPO_MERCANCIA_INEXISTENTE` en
            `mercancias[i].id_tipo_mercancia` (el id obsoleto no está en el catálogo del cubicador). HU-023.3:
            `MERCANCIA_DESCONOCIDA` y `MERCANCIA_NO_CUBICABLE` en `mercancias[i].codigo_mercancia`; `CAMPO_REQUERIDO` en
            `mercancias[i].codigo_mercancia` si falta el código. HU-030.1 (#184): `PESO_CON_TARA_MENOR_QUE_CARGA` en
            `peso_con_tara_kg` (menor que el peso de carga) y `CAMPO_NO_APLICA` en `peso_con_tara_kg` sin `clase_viaje = Contenedor`.
            HU-032 (#197): `VEHICULO_REQUERIDO` en `tipo_vehiculo` cuando la ruta no se puede cubicar (solo peso, mercancías sin
            medidas ni código, o mixta), no es de Contenedor y no trae vehículo.
            OBS-1027-4 (#226): `MARGEN_LINEA_DESCONOCIDA` en `linea_negocio` cuando, además de otros errores de fila, la línea de
            negocio no da margen ("Licitaciones" del catálogo de Nexo, una que no existe o una inactiva): la del encabezado con
            `indice = null` y la de una fila que trae la suya con su `indice`. El `mensaje` dice qué líneas usar y
            `error.detalle.lineas_validas` las lista. Sin otros errores de fila sigue siendo el 400 `MARGEN_LINEA_DESCONOCIDA` de
            `ErrorNegocio` (con `detalle.motivo = LINEA_DE_NEXO` para "Licitaciones").
        mensaje:
          type: string

    ReporteLicitacionInvalida:
      type: object
      required: [error, errores]
      description: 400 de `POST /web/licitaciones` con todas las filas que fallaron (`error.codigo = LICITACION_INVALIDA`).
      properties:
        error:
          type: object
          required: [codigo, mensaje]
          properties:
            codigo:
              type: string
              enum: [LICITACION_INVALIDA]
            mensaje:
              type: string
            detalle:
              type: object
              additionalProperties: true
        errores:
          type: array
          items:
            $ref: '#/components/schemas/ErrorFilaLicitacion'

    LineaLicitacion:
      type: object
      required: [orden, fila, origen, destino, tipo_vehiculo, peso_kg, estado_costeo, precio_final]
      properties:
        orden:
          type: integer
          description: 1 para la primera línea (el orden en que viajó a Nexo).
        fila:
          type: integer
          nullable: true
        origen:
          type: string
        destino:
          type: string
        tipo_vehiculo:
          type: string
          nullable: true
        peso_kg:
          type: number
          nullable: true
        estado_costeo:
          type: string
          nullable: true
          enum: [pendiente_envio, error_envio, pendiente_costeo, autocosteo, entregada, descartada, costeo_vencido, rechazada, null]
          description: 'HU-028.1 (#183). `rechazada` = "Rechazada en NEXO" (todos sus camiones): sin precio y no es pendiente.'
        motivo_rechazo:
          type: string
          nullable: true
          description: |
            HU-028.1 (#183, Nexo #320). Por qué la Mesa de Costeo rechazó camiones de la línea (los motivos distintos, unidos con
            " | "); `null` si ninguno. Solo en pantalla: el Excel de la licitación no lo lleva.
        precio_final:
          type: number
          nullable: true
          description: |
            Tarifa del transporte de la línea con su margen, SIN servicios conexos (la misma del Excel; HU-021; el PDF del
            pliego, desde HU-033, imprime el valor final de la ruta con conexos); `null` mientras no tiene flete o si está `rechazada` (HU-028.1). Nunca el costo de Nexo.
        estado_cubicacion:
          type: string
          nullable: true
          enum: [pendiente, cubicada, fallida, null]
          description: HU-023.5 (#160). Cubicación en segundo plano de la ruta; `null` si se cubicó al guardarla.
        error_cubicacion:
          type: string
          nullable: true
          description: "HU-023.5. Último error de la cubicación (`CODIGO: mensaje`), si falló."
        resultado_cubicacion:
          type: string
          nullable: true
          enum: [ASIGNADO, SIN_SELECCION_AUTOMATICA, null]
        motivo_sin_seleccion:
          type: string
          nullable: true
          enum: [EXTRADIMENSIONADO, SIN_CANDIDATOS_DIMENSIONALES, SUPERA_K_MAX, SIN_CARROCERIA_COMPATIBLE, BUSQUEDA_AGOTADA, null]
        condicionada:
          type: boolean
        camiones:
          type: array
          nullable: true
          description: HU-023.5. Los camiones de la ruta, en su orden (uno provisional sin vehículo mientras está `pendiente`).
          items:
            $ref: '#/components/schemas/CamionLicitacion'

    PlantillaMapeoWeb:
      type: object
      required: [nit_cliente, encabezados, columnas]
      description: |
        HU-044.5 (#256). La plantilla de mapeo que el comercial confirmó para el cliente: los `encabezados` de la hoja en el orden del
        archivo (1 a 100) y el mapeo de sus `columnas`. Las reglas las valida NEXO.
      properties:
        nit_cliente:
          type: string
          description: NIT de la licitación, con o sin puntos y dígito de verificación.
        nombre:
          type: string
          nullable: true
          maxLength: 100
        encabezados:
          type: array
          items:
            type: string
            nullable: true
        columnas:
          type: array
          items:
            $ref: '#/components/schemas/ColumnaPlantilla'

    ColumnaPlantilla:
      type: object
      required: [indice, campo]
      description: HU-044.5 (#256). Una columna confirmada de la plantilla.
      properties:
        indice:
          type: integer
          minimum: 0
          description: Posición en `encabezados` (base 0).
        campo:
          type: string
          description: Campo de NEXO (`origen`, `destino`, `peso`, `tipoVehiculo`...) o `ignorar`.
        transformacion:
          type: string
          nullable: true
          description: Transformación de NEXO (`peso_toneladas_a_kg`...); vacía o ausente = `ninguna`.

    PlantillaMapeo:
      type: object
      required: [id, cliente_nombre, nombre, encabezados, columnas, created_at, updated_at]
      description: HU-044.5 (#256). Una plantilla de mapeo del cliente guardada en NEXO (Cotifly no guarda copia).
      properties:
        id:
          type: string
          format: uuid
        cliente_nombre:
          type: string
          nullable: true
        nombre:
          type: string
          nullable: true
        encabezados:
          type: array
          items:
            type: string
        columnas:
          type: array
          items:
            $ref: '#/components/schemas/ColumnaPlantilla'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true

    RecetaLectura:
      type: object
      required: [id, cliente_nombre, nombre, receta, instrucciones, usos, ultimo_uso_at, created_at, updated_at]
      description: |
        HU-044.5 (#256). Un formato de lectura de Excel del cliente guardado en NEXO. `receta` es el JSON de NEXO **sin tocar** (sus
        claves no pasan a snake_case): se reenvía tal cual, como texto, en `leer-estructura` o al guardarlo otra vez.
      properties:
        id:
          type: string
          format: uuid
        cliente_nombre:
          type: string
          nullable: true
        nombre:
          type: string
          nullable: true
        receta:
          type: object
          nullable: true
          additionalProperties: true
          description: JSON opaco de NEXO.
        instrucciones:
          type: string
          nullable: true
        usos:
          type: integer
          minimum: 0
        ultimo_uso_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true

    DiccionarioCliente:
      type: object
      required: [terminos, aviso]
      description: |
        HU-044.5 (#256). La consulta del diccionario de NEXO. Hoy solo trae los términos generales; `aviso` viene cuando se pidió con
        `nit_cliente` (`TERMINOS_CLIENTE_NO_DISPONIBLES`) y es `null` sin NIT.
      properties:
        terminos:
          type: array
          items:
            $ref: '#/components/schemas/TerminoDiccionario'
        aviso:
          description: '`null` sin `nit_cliente`.'
          oneOf:
            - $ref: '#/components/schemas/AvisoDiccionario'
            - $ref: '#/components/schemas/Nulo'

    TerminoDiccionario:
      type: object
      required: [id, termino, tipo, concepto, contexto, ejemplo, activo, general]
      description: HU-044.5 (#256). Un término del diccionario de NEXO.
      properties:
        id:
          type: string
          format: uuid
        termino:
          type: string
          description: Lo que escribe el cliente ("Tractomula", "TON").
        tipo:
          type: string
          enum: [columna, unidad, valor]
        concepto:
          type: string
          description: Lo que significa para NEXO (un campo, una unidad o un código).
        contexto:
          type: string
          nullable: true
          description: El campo de NEXO al que aplica un término de tipo `valor` (`tipoVehiculo`, `carroceria`...).
        ejemplo:
          type: string
          nullable: true
        activo:
          type: boolean
        general:
          type: boolean
          description: Aplica a todos los clientes. Hoy siempre `true` (ver la operación).

    AvisoDiccionario:
      type: object
      required: [codigo, mensaje]
      description: HU-044.5 (#256). Aviso de la consulta del diccionario (no es un error).
      properties:
        codigo:
          type: string
          enum: [TERMINOS_CLIENTE_NO_DISPONIBLES]
        mensaje:
          type: string

    OpcionesDiccionarioCliente:
      type: object
      required: [tipos, campos_destino, unidades, contextos]
      description: HU-044.5 (#256). Los valores que acepta el diccionario de NEXO.
      properties:
        tipos:
          type: array
          items:
            type: string
        campos_destino:
          type: array
          items:
            type: string
        unidades:
          type: array
          items:
            type: string
        contextos:
          type: array
          items:
            type: string

    CamionLicitacion:
      type: object
      required: [orden, tipo_vehiculo, carroceria, peso_kg, volumen_total_m3, porcentaje_llenado_volumen, porcentaje_llenado_peso]
      description: HU-023.5 (#160). Un camión de una ruta de la licitación (códigos del cubicador; vacíos = sin vehículo).
      properties:
        orden:
          type: integer
          minimum: 1
        tipo_vehiculo:
          type: string
          nullable: true
        carroceria:
          type: string
          nullable: true
        peso_kg:
          type: number
          nullable: true
        volumen_total_m3:
          type: number
          nullable: true
        porcentaje_llenado_volumen:
          type: number
          nullable: true
        porcentaje_llenado_peso:
          type: number
          nullable: true
        estado_costeo:
          type: string
          nullable: true
          enum: [pendiente_envio, error_envio, pendiente_costeo, autocosteo, entregada, descartada, costeo_vencido, rechazada, null]
          description: HU-028.1 (#183). Estado del costeo del camión (`rechazada` si la Mesa de Costeo rechazó su línea).
        motivo_rechazo:
          type: string
          nullable: true
          description: HU-028.1 (#183). Por qué la Mesa de Costeo rechazó la línea del camión; `null` si no está rechazado.

    Licitacion:
      type: object
      required: [folio, cliente_nombre, nit_cliente, deadline, estado_costeo, motivo_estado_costeo, moneda, trm_aplicada,
                 precio_final, lineas_costeadas, lineas_pendientes, archivo_nombre, hoja, origen_lectura, lineas, finalizada_at, solo_lectura]
      description: |
        Licitación vista por el comercial (HU-011.2). Solo precios. Sin `referencia` desde HU-021.11 (#138, decisión 1: siempre
        era `null`).
      properties:
        folio:
          type: string
        cliente_nombre:
          type: string
          nullable: true
        nit_cliente:
          type: string
          nullable: true
        deadline:
          type: string
          format: date-time
          nullable: true
        estado_costeo:
          type: string
          nullable: true
          enum: [pendiente_envio, error_envio, pendiente_costeo, autocosteo, entregada, descartada, costeo_vencido, null]
        motivo_estado_costeo:
          type: string
          nullable: true
        moneda:
          type: string
          enum: [COP, USD]
        trm_aplicada:
          type: number
          description: TRM del día de creación con que se convierten los precios en USD (ADR-014 §5); 0 en COP.
        precio_final:
          type: number
          nullable: true
          description: |
            Suma de los precios de las líneas, en `moneda`; solo cuando todas tienen flete (`autocosteo` o `entregada`). HU-028.1
            (#183): sin las líneas rechazadas por la Mesa de Costeo; con todas rechazadas, `null`.
        lineas_costeadas:
          type: integer
        lineas_pendientes:
          type: integer
          description: 'Líneas sin precio que todavía esperan a Nexo (HU-028.1, #183: sin las rechazadas).'
        lineas_rechazadas:
          type: integer
          description: |
            HU-028.1 (#183). Líneas rechazadas por la Mesa de Costeo de Nexo (todos sus camiones): no tienen precio, no son pendientes y
            no suman en `precio_final`.
        archivo_nombre:
          type: string
          nullable: true
          description: Nombre del Excel original guardado (`null` si se armó sin archivo).
        hoja:
          type: string
          nullable: true
        origen_lectura:
          type: string
          nullable: true
          enum: [analizar_excel, leer_estructura, null]
          description: |
            HU-044.10 (#293). Cómo se leyó el Excel de esta licitación: `analizar_excel` o `leer_estructura` (`LicitacionWeb.origen_lectura`).
            `null` si la licitación no tiene archivo. Una licitación con archivo anterior al script 22 (sin `origenLectura` guardado) llega
            como `analizar_excel`. Siempre presente (también en el 201 de `POST /web/licitaciones` y en la respuesta de reintentar la cubicación).
        lineas:
          type: array
          items:
            $ref: '#/components/schemas/LineaLicitacion'
        finalizada_at:
          type: string
          format: date-time
          nullable: true
          description: |
            HU-036.2 (#206, DEF-1027-2 de #226). Cuándo el comercial finalizó la licitación (`POST .../finalizar`), ISO 8601 en UTC;
            `null` sin finalizar. Siempre presente, igual que en `CotizacionResumen` y `CosteoCotizacion`: la vista del polling
            habilita "Finalizar" y aplica los candados de la finalizada sin pedir el costeo.
        solo_lectura:
          type: boolean
          description: |
            HU-034.1 (#201, parte A). `true` si quien consulta es un gerente comercial de la regional del dueño o un director: solo
            consulta (ocultar o deshabilitar reintentar la cubicación, reintentar el envío, finalizar y demás acciones). `false` para el
            dueño (también en la respuesta de `POST /web/licitaciones` y de reintentar). Igual que `DetalleCotizacion.solo_lectura`.
        progreso_cubicacion:
          type: object
          nullable: true
          description: |
            HU-023.5 (#160). Progreso de la cubicación en segundo plano (`null` si ninguna ruta pasó por ella): `en_curso` (quedan
            rutas pendientes), `con_fallas` (no quedan pendientes pero alguna falló: no sale a Nexo hasta reintentarla) o `completa`.
          required: [estado, total, cubicadas, pendientes, fallidas]
          properties:
            estado:
              type: string
              enum: [en_curso, con_fallas, completa]
            total:
              type: integer
            cubicadas:
              type: integer
            pendientes:
              type: integer
            fallidas:
              type: integer
        cubicacion:
          type: array
          nullable: true
          description: |
            HU-023.5 (#160). Por cada ruta ya cubicada, el resultado y los avisos del cubicador (advertencias, extradimensión y
            mercancías condicionadas; la misma forma de `POST /web/solicitudes-costeo`). `null` si ninguna.
          items:
            $ref: '#/components/schemas/CubicacionRuta'

    ItemCubicacion:
      type: object
      required: [cantidad, largo_cm, ancho_cm, alto_cm, peso_kg]
      description: |
        HU-023.2 (#157). Un bulto o grupo de bultos idénticos. Debe traer `codigo_mercancia` o, mientras el frontend no tenga el
        desplegable, `descripcion` (se resuelve al tipo más parecido del catálogo); sin ninguno de los dos, 400 `MERCANCIA_DESCONOCIDA`.
        Un `codigo_mercancia` desconocido o inactivo (`MERCANCIA_DESCONOCIDA`) o no cubicable (`MERCANCIA_NO_CUBICABLE`) se rechaza
        antes de llamar al cubicador, con `detalle.item` y `detalle.campo = codigo_mercancia` (D-1019-1).
      properties:
        codigo_mercancia:
          type: string
          nullable: true
          description: Código del catálogo del cubicador (`GET /web/tipos-mercancia`). Gana sobre `descripcion`.
        descripcion:
          type: string
          nullable: true
          description: Texto libre de la mercancía; solo se usa si no viene `codigo_mercancia`.
        cantidad:
          type: integer
          minimum: 1
          maximum: 100000
          description: |
            Cuántos bultos idénticos con estas medidas (1 a 100.000; fuera de rango, 400 `POSICION_INVALIDA` con `detalle.item` y
            `detalle.campo`). La suma de las cantidades de todos los ítems no puede pasar de 10.000 (`CUBICACION_DEMASIADO_GRANDE`).
        largo_cm:
          type: number
          minimum: 0.1
          maximum: 999999
          multipleOf: 0.01
          description: Largo en centímetros (0,1 a 999.999, hasta 2 decimales; fuera de rango, 400 `DIMENSIONES_INVALIDAS`).
        ancho_cm:
          type: number
          minimum: 0.1
          maximum: 999999
          multipleOf: 0.01
          description: Ancho en centímetros (0,1 a 999.999, hasta 2 decimales).
        alto_cm:
          type: number
          minimum: 0.1
          maximum: 999999
          multipleOf: 0.01
          description: Alto en centímetros (0,1 a 999.999, hasta 2 decimales).
        peso_kg:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 999999.99
          multipleOf: 0.01
          description: |
            Peso en kilogramos de cada bulto: obligatorio, mayor que 0 y hasta 999.999,99 con 2 decimales (sin él, o en 0, 400
            `DIMENSIONES_INVALIDAS` con `detalle.campo = peso_kg`; endurecimiento A, #199: antes el contrato lo declaraba anulable).

    CubicacionRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Obligatorio; 400 `ITEMS_REQUERIDOS` si falta o viene vacío.
          items:
            $ref: '#/components/schemas/ItemCubicacion'
        clase_viaje:
          type: string
          nullable: true
          description: Preferencia opcional; viaja al cubicador como `claseViajeSeleccionada`.

    VehiculoCubicacion:
      type: object
      required: [codigo_vehiculo, nombre_vehiculo, codigo_carroceria, nombre_carroceria, peso_total_kg, volumen_total_m3,
        porcentaje_llenado_volumen, porcentaje_llenado_peso, numero_vehiculo, alerta_bajo_llenado, heterogenea, mercancias]
      description: |
        HU-023.2 (#157). Un vehículo recomendado por el cubicador. Los nombres salen de `GET /web/tipos-vehiculo` (catálogo canónico
        `GET /vehiculos-catalogo` del cubicador, HU-023 #176) y `GET /web/tipos-carroceria`; si el catálogo no responde o no trae el
        código, el nombre es el código (o, para el vehículo, el nombre que mandó el cubicador). HU-023 (#176): `numero_vehiculo`,
        `alerta_bajo_llenado`, `heterogenea` y lo que lleva el camión por posición (`mercancias`).
      properties:
        numero_vehiculo:
          type: integer
          nullable: true
          minimum: 1
        alerta_bajo_llenado:
          type: boolean
        heterogenea:
          type: boolean
        mercancias:
          type: array
          items:
            $ref: '#/components/schemas/MercanciaVehiculo'
        codigo_vehiculo:
          type: string
        nombre_vehiculo:
          type: string
        codigo_carroceria:
          type: string
        nombre_carroceria:
          type: string
        peso_total_kg:
          type: number
          description: Peso que lleva este vehículo.
        volumen_total_m3:
          type: number
        porcentaje_llenado_volumen:
          type: number
          minimum: 0
          maximum: 100
        porcentaje_llenado_peso:
          type: number
          minimum: 0
          maximum: 100

    MercanciaCubicada:
      type: object
      required: [codigo_mercancia, nombre, descripcion, sugerida]
      description: |
        HU-023.2 (#157). El tipo de mercancía con el que viajó cada ítem al cubicador, en el orden de `items`. `sugerida = true` si se
        resolvió por parecido desde `descripcion` (conviene que el comercial lo confirme); `nombre` es el del catálogo, o `null` si el
        ítem ya traía el código.
      properties:
        codigo_mercancia:
          type: string
        nombre:
          type: string
          nullable: true
        descripcion:
          type: string
          nullable: true
        sugerida:
          type: boolean

    CubicacionEnProceso:
      type: object
      required: [id, estado, consultar_en]
      description: Opción D (E2E 2026-10-16, D3). 202 de `POST /web/cubicacion`; el cálculo sigue en segundo plano.
      properties:
        id:
          type: string
          format: uuid
        estado:
          type: string
          enum: [en_proceso]
        consultar_en:
          type: string
          description: '`/web/cubicacion/{id}` (igual que `Location`)'
    EstadoCubicacion:
      type: object
      required: [id, estado]
      description: |
        Opción D. `GET /web/cubicacion/{id}`: `resultado` solo con `completada`, `error` solo con `fallida` (cuando no aplican, no
        vienen).
      properties:
        id:
          type: string
          format: uuid
        estado:
          type: string
          enum: [en_proceso, completada, fallida]
        resultado:
          $ref: '#/components/schemas/ResultadoCubicacion'
        error:
          $ref: '#/components/schemas/ErrorCubicacion'
      example:
        id: 7d5c2c9e-1b8a-4f0e-9c3a-2f6b8e1d4a90
        estado: fallida
        error:
          codigo: MERCANCIA_NO_CUBICABLE
          mensaje: 'Una de las mercancías no se puede cubicar: revisa el tipo de mercancía.'
    ErrorCubicacion:
      type: object
      required: [codigo, mensaje]
      description: Opción D. Error de una cubicación `fallida`, con los mismos códigos que respondería `POST /web/cubicacion`.
      properties:
        codigo:
          type: string
        mensaje:
          type: string
        detalle:
          type: object
          description: '`item` (base 0), `campo` y `descripcion` cuando el error señala un ítem'
          additionalProperties: true
    ResultadoCubicacion:
      type: object
      required: [resultado, motivo_sin_seleccion, mensaje_sin_seleccion, condicionada, vehiculos, mercancias_condicionadas, advertencias,
        extradimension, mercancias]
      description: |
        HU-023.2 (#157). Respuesta de "Calcular cubicaje": la recomendación del cubicador para una corrida de prueba que no se guarda.
        **Cambió de forma** respecto a la cubicación de Nexo: ya no trae `sugerencia`, `sugerencia_flota` ni las clases de viaje y de
        contenedor.
      example:
        resultado: ASIGNADO
        motivo_sin_seleccion: null
        mensaje_sin_seleccion: null
        condicionada: false
        vehiculos:
          - codigo_vehiculo: 3S3
            nombre_vehiculo: Tractocamión 3S3
            codigo_carroceria: FURGON
            nombre_carroceria: Furgón
            peso_total_kg: 16000
            volumen_total_m3: 62.5
            porcentaje_llenado_volumen: 81.25
            porcentaje_llenado_peso: 47.06
            numero_vehiculo: 1
            alerta_bajo_llenado: false
            heterogenea: false
            mercancias:
              - indice_posicion: 0
                id_tipo_mercancia: 2B21A9C4-7E55-4D7B-9A10-3C1F0E2D4B6A
                codigo_mercancia: CAFE_EN_ESTIBAS
                cantidad: 500
                peso_kg: 10000
                volumen_m3: 18
              - indice_posicion: 2
                id_tipo_mercancia: 2B21A9C4-7E55-4D7B-9A10-3C1F0E2D4B6A
                codigo_mercancia: CAFE_EN_ESTIBAS
                cantidad: 300
                peso_kg: 6000
                volumen_m3: 44.5
          - codigo_vehiculo: C2
            nombre_vehiculo: Sencillo C2
            codigo_carroceria: ESTACAS
            nombre_carroceria: Estacas
            peso_total_kg: 4500.5
            volumen_total_m3: 18.25
            porcentaje_llenado_volumen: 60
            porcentaje_llenado_peso: 75.01
            numero_vehiculo: 2
            alerta_bajo_llenado: false
            heterogenea: false
            mercancias:
              - indice_posicion: 1
                id_tipo_mercancia: null
                codigo_mercancia: BOBINAS_ACERO
                cantidad: 3
                peso_kg: 4500.5
                volumen_m3: 18.25
        mercancias_condicionadas: []
        advertencias:
          - codigo: REFRIGERADO
            mensaje: 'La mercancía refrigerada va en FURGON: confirmar el equipo de frío.'
        extradimension: null
        mercancias:
          - codigo_mercancia: CAFE_EN_ESTIBAS
            nombre: null
            descripcion: null
            sugerida: false
          - codigo_mercancia: BOBINAS_ACERO
            nombre: Bobinas de acero
            descripcion: Bobinas de acero
            sugerida: true
      properties:
        resultado:
          type: string
          enum: [ASIGNADO, SIN_SELECCION_AUTOMATICA]
        motivo_sin_seleccion:
          type: string
          nullable: true
          enum: [EXTRADIMENSIONADO, SIN_CANDIDATOS_DIMENSIONALES, SUPERA_K_MAX, SIN_CARROCERIA_COMPATIBLE, BUSQUEDA_AGOTADA, null]
          description: |
            Solo con `SIN_SELECCION_AUTOMATICA`. `BUSQUEDA_AGOTADA` (HU-023, #176) es un límite del algoritmo del cubicador, no de la
            carga: no se le dice al comercial que su carga no cabe.
        mensaje_sin_seleccion:
          type: string
          nullable: true
          description: |
            HU-023 (#176). Con `SIN_SELECCION_AUTOMATICA`, el texto para el comercial según el motivo (con `BUSQUEDA_AGOTADA` no dice que
            la carga no cabe); `null` con `ASIGNADO`.
        condicionada:
          type: boolean
          description: Alguna mercancía requiere aprobación (en una solicitud real la ruta iría a la Mesa de Costeo).
        vehiculos:
          type: array
          description: Los vehículos recomendados, en el orden del cubicador (flota mixta); vacía sin selección.
          items:
            $ref: '#/components/schemas/VehiculoCubicacion'
        mercancias_condicionadas:
          type: array
          items:
            $ref: '#/components/schemas/MercanciaCondicionada'
        advertencias:
          type: array
          items:
            $ref: '#/components/schemas/AdvertenciaCubicador'
        extradimension:
          description: Extradimensión informada por el cubicador, o `null`.
          oneOf:
            - $ref: '#/components/schemas/ExtradimensionCubicador'
            - $ref: '#/components/schemas/Nulo'
        mercancias:
          type: array
          items:
            $ref: '#/components/schemas/MercanciaCubicada'
        sugerencia:
          deprecated: true
          description: |
            **Plan B del corte, apagado por defecto** (`Cubicacion:IncluirSugerenciaLegada = true` en el servidor): la forma anterior
            (`SugerenciaVehiculoLegada`) derivada del **primer** vehículo, para un frontend que todavía no pinte `vehiculos[]`. Sin la
            bandera, o sin vehículos, el campo no viene. Se retira cuando el frontend use `vehiculos[]`.
          allOf:
            - $ref: '#/components/schemas/SugerenciaVehiculoLegada'

    SugerenciaVehiculoLegada:
      type: object
      deprecated: true
      required: [unidad_id, unidad_nombre, banda, factor_utilizacion, config_vehiculo, carroceria, clase_viaje, clase_contenedor]
      description: |
        HU-023.2 (#157), plan B. Forma de la antigua `sugerencia` de la cubicación de Nexo, derivada del primer vehículo del cubicador:
        `unidad_id` y `config_vehiculo` = código del vehículo, `unidad_nombre` = su nombre, `banda` = `cubicador`,
        `factor_utilizacion` = el mayor de los dos porcentajes de llenado sobre 100, `carroceria` = código de la carrocería;
        `clase_viaje` y `clase_contenedor` siempre `null`.
      properties:
        unidad_id:
          type: string
        unidad_nombre:
          type: string
        banda:
          type: string
          enum: [cubicador]
        factor_utilizacion:
          type: number
        config_vehiculo:
          type: string
          nullable: true
        carroceria:
          type: string
          nullable: true
        clase_viaje:
          type: string
          nullable: true
        clase_contenedor:
          type: string
          nullable: true

    VistaPreviaCorreo:
      type: object
      required: [asunto, cuerpo, para, cc]
      properties:
        asunto:
          type: string
        cuerpo:
          type: string
          description: Cuerpo renderizado con la plantilla real (texto plano).
        para:
          type: array
          items:
            type: string
        cc:
          type: array
          items:
            type: string
        adjunto:
          type: string
          description: Nombre del PDF que se adjuntará.
        cuerpo_html:
          type: string
          nullable: true
          description: HU-033. El cuerpo en HTML tal como lo recibe el cliente (texto, resumen con el total y firma).
        resumen:
          description: |
            HU-033. Precio por ruta y total, sin desglose; `null` si la cotización todavía no tiene total. Endurecimiento A (#199):
            `oneOf` con `Nulo` (en OAS 3.0.3 `nullable: true` sin `type` no admite `null`).
          oneOf:
            - $ref: '#/components/schemas/ResumenCorreo'
            - $ref: '#/components/schemas/Nulo'
        copia_oculta:
          type: string
          nullable: true
          description: |
            HU-033. Copia oculta que se agrega al enviar (el comercial), o `null` si no tiene correo o ya va en para/cc. OBS-1027-5
            (#226, ADR-023): con `entorno_pruebas = true` siempre es `null`, porque el correo redirigido sale sin CC ni CCO.
        entorno_pruebas:
          type: boolean
          description: HU-033. El ambiente redirige los correos al buzón de pruebas (mostrar el aviso).
        redirigido_a:
          type: string
          nullable: true
          description: HU-033. Buzón de pruebas; `null` en producción.
        aviso:
          type: string
          nullable: true
          description: HU-033. Texto del aviso de pruebas para mostrar tal cual; `null` en producción.
        aviso_seguro:
          description: |
            HU-045.3 (#265). Las rutas con el seguro de la mercancía marcado sin valor de la mercancía (no suma ni sale en el PDF; no
            bloquea el envío); `null` si no hay ninguna. El mismo aviso de `CosteoCotizacion`.
          oneOf:
            - $ref: '#/components/schemas/AvisoSeguro'
            - $ref: '#/components/schemas/Nulo'

    DatosNuevaVersion:
      type: object
      description: |
        Datos de lectura para prellenar el formulario. `cotizacion_origen_id` es solo el
        id consultado; no se persiste como FK en la versión nueva. HU-021.9 (#136): la línea de negocio y el margen son de
        cada ruta (`rutas`); los de primer nivel son los de la ruta 1 (`linea_negocio` = `Varias` si las rutas tienen líneas
        distintas) y `costo` es el total.
      required: [cotizacion_origen_id, folio_base, version_siguiente, rutas]
      properties:
        rutas:
          type: array
          items:
            $ref: '#/components/schemas/RutaNuevaVersion'
        cotizacion_origen_id:
          type: string
          format: uuid
        folio_base:
          type: string
        version_siguiente:
          type: integer
        cliente_nombre:
          type: string
          nullable: true
        nit_cliente:
          type: string
          nullable: true
        origen_cliente:
          type: string
          nullable: true
          enum: [cliente, prospecto, null]
        linea_negocio:
          type: string
          nullable: true
        costo:
          type: number
          nullable: true
        margen_politica:
          type: number
          nullable: true
        margen_aplicado:
          type: number
          nullable: true
        origen_margen:
          type: string
          nullable: true
          enum: [sap_tm, politica_linea, negociado, null]
        metodo_calculo:
          type: string
          nullable: true
          enum: [margen, markup, null]
        moneda:
          type: string
          nullable: true

    RutaNuevaVersion:
      type: object
      description: HU-021.9 (#136). Una ruta de la cotización que la versión nueva copia, con su línea de negocio y su margen (sin costos).
      required: [linea_orden, linea_negocio_id, linea_negocio, origen, destino, margen_politica, margen_aplicado, origen_margen, metodo_calculo]
      properties:
        linea_orden:
          type: integer
          minimum: 1
        linea_negocio_id:
          type: integer
          nullable: true
        linea_negocio:
          type: string
          nullable: true
        origen:
          type: string
          nullable: true
        destino:
          type: string
          nullable: true
        margen_politica:
          type: number
          nullable: true
        margen_aplicado:
          type: number
          nullable: true
        origen_margen:
          type: string
          nullable: true
          enum: [sap_tm, politica_linea, negociado, null]
        metodo_calculo:
          type: string
          nullable: true
          enum: [margen, markup, null]
