openapi: 3.0.3
info:
  title: Cotifly API
  version: 1.0.0
  license:
    name: Propietario — Botero Soto Soluciones Logísticas
  description: |
    Contrato congelado de la API de Cotifly (HU-004.1, issue #17) que consume el módulo
    Angular de ClientePro (HU-004) y que implementa el backend .NET 10 (HU-003).

    Convenciones:
    - Todo `/web/*` usa nombres de campo snake_case (los heredados del backend Python
      y los nuevos), para que el frontend no mezcle convenciones.
    - `/api/auth/*` usa los nombres que define el patrón "Login SSO — Cliente Pro"
      (`idUsuario`, `debeCambiarPassword`), que ya produce el frontend de ClientePro.
    - Las operaciones marcadas con `x-estado: borrador` no están congeladas.
    - Los errores de `/web/*` y `/api/auth/*` usan `ErrorWeb` (`{"error": "texto"}`).
    - Los errores de negocio que vienen de una herramienta usan `ErrorNegocio`
      (`{"error": {"codigo", "mensaje", "detalle?"}}`).
    - Autenticación: `Authorization: Bearer <access>` emitido por
      `POST /api/auth/login-clientepro` (patrón "Login SSO — Cliente Pro").
servers:
  - url: http://localhost:8080
    description: Desarrollo local (contenedor)

tags:
  - name: auth
    description: Login SSO desde ClientePro, refresh y logout
  - name: web
    description: Consola de cotización del comercial
  - name: admin
    description: Administración de políticas de margen (rol gerente_comercial)
  - name: metricas
    description: |
      Tablero de efectividad. BORRADOR: exponen las vistas actuales; HU-010.1 definirá
      los KPIs definitivos y el filtro por regional.
  - name: chat
    description: Webhook de Google Chat
  - name: sistema
    description: Salud del servicio y archivos PDF

paths:
  /api/auth/login-clientepro:
    post:
      operationId: loginClientePro
      tags: [auth]
      summary: Login SSO desde ClientePro (sin credenciales propias)
      description: |
        ClientePro ya autenticó a la persona. El backend revalida la identidad contra
        el almacén corporativo de solo lectura (`tblSAPUsuariosApp`, base
        `dbsolucionesti`): busca `idUsuario` como `NOMBREUSUARIO` y, si no resuelve,
        como `ID` numérico. El `NOMBREUSUARIO` de la fila encontrada (nunca el que
        envía el cliente) es la clave para ubicar o crear al usuario en `UsuariosWeb`
        (aprovisionamiento just-in-time). Luego traduce sus roles externos a roles
        internos y exige `comercial` o `gerente_comercial`.
        Cualquier falla (usuario inexistente, rol no autorizado, almacén caído) responde
        el mismo 401 genérico.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginClienteProRequest'
            example:
              idUsuario: "USR12345"
              nombreUsuario: "Nombre Apellido"
              roles: ["34"]
      responses:
        '200':
          description: Sesión emitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/CredencialesInvalidas'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'

  /api/auth/refresh:
    post:
      operationId: refrescarSesion
      tags: [auth]
      summary: Rota el refresh token y emite un par nuevo
      description: |
        El refresh token se invalida al usarse (rotación). Reutilizar un refresh ya
        rotado se trata como posible robo de sesión: responde 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Par nuevo emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'

  /api/auth/logout:
    post:
      operationId: cerrarSesion
      tags: [auth]
      summary: Cierra la sesión (revoca refresh y access)
      description: Responde siempre 204, exista o no el token (anti-enumeración).
      security:
        - bearer: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Sesión cerrada
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'

  /web/chat:
    post:
      operationId: enviarMensajeChat
      tags: [web]
      summary: Corre un turno del agente cotizador
      description: |
        `sesion_id` lo genera el cliente (UUID sin guiones) y agrupa la conversación.
        La sesión queda ligada al usuario del token: otro usuario no puede continuarla.
        Un fallo interno del agente (incluido el límite de peticiones del proveedor de
        IA) responde **200** con `error: true` y un texto legible (paridad con el
        backend Python; el frontend lo muestra tal cual). El 429 de este endpoint es
        el límite de peticiones de la propia API, no el del proveedor de IA.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MensajeWeb'
            example:
              mensaje: "Cotiza Nacional Bogotá a Medellín tractomula 10000 kg para cliente 15927"
              sesion_id: "3f2a9c1b7e4d4a6f9b0c2d1e5f6a7b8c"
      responses:
        '200':
          description: Respuesta del agente (o error controlado con `error = true`)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RespuestaChat'
                  - $ref: '#/components/schemas/RespuestaChatError'
        '400':
          description: '`sesion_id` o `cotizacion_origen_id` inválido, o cuerpo inválido'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'
              example:
                error: "sesion_id inválido"
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          description: |
            El `sesion_id` pertenece a otro usuario (`Sesión no encontrada.`), o `cotizacion_origen_id`
            no existe o no es del comercial (`Cotización no encontrada o no es tuya.`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'
              example:
                error: "Sesión no encontrada."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'

  /web/mis-cotizaciones:
    get:
      operationId: listarMisCotizaciones
      tags: [web]
      summary: Lista las cotizaciones del comercial autenticado
      description: Nunca devuelve cotizaciones de otro comercial. Máximo 100, más recientes primero.
      security:
        - bearer: []
      responses:
        '200':
          description: Cotizaciones del comercial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MisCotizaciones'
        '401':
          $ref: '#/components/responses/SesionExpirada'

  /web/cotizaciones/{folio}/enviar:
    post:
      operationId: enviarCotizacion
      tags: [web]
      summary: Envía la cotización al cliente por correo con el PDF adjunto
      description: |
        El remitente es el comercial autenticado. Solo puede enviar cotizaciones propias
        (si no es suya responde 404, igual que si no existe). Un envío idéntico a los
        mismos destinatarios en los últimos 5 minutos se rechaza como duplicado.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvioWeb'
      responses:
        '200':
          description: Correo enviado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaEnvio'
        '400':
          description: Error de negocio del envío (duplicado, sin PDF, fallo SMTP, validación)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '503':
          description: El envío de correo está deshabilitado (`Correo:Habilitado=false`, valor por defecto)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
              example:
                error:
                  codigo: CORREO_DESHABILITADO
                  mensaje: "El envío de correo está deshabilitado."

  /web/cotizaciones/{folio}/seguimiento:
    post:
      operationId: marcarSeguimiento
      tags: [web]
      summary: Marca la cotización como ganada o perdida
      description: |
        Interino hasta HU-005.14, que lo reemplaza por `POST /web/cotizaciones/{folio}/resultado`
        (registra también en Nexo, agrega `comentario` y no permite cambiar el
        resultado una vez definido).
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeguimientoWeb'
      responses:
        '200':
          description: Cotización actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionResumen'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'

  /web/admin/lineas-negocio:
    get:
      operationId: listarLineasNegocio
      tags: [admin]
      summary: Lista todas las líneas de negocio con su política de margen
      security:
        - bearer: []
      responses:
        '200':
          description: Líneas de negocio (activas e inactivas)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LineaNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '403':
          $ref: '#/components/responses/SinPermiso'

  /web/admin/lineas-negocio/{id}:
    put:
      operationId: actualizarLineaNegocio
      tags: [admin]
      summary: Edita margen, método de cálculo y estado de una línea existente
      description: No crea ni borra líneas.
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarLineaNegocio'
      responses:
        '200':
          description: Línea actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineaNegocio'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          description: La línea no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'

  /web/metricas/actividad:
    get:
      operationId: obtenerActividadComercial
      x-estado: borrador
      tags: [metricas]
      summary: Actividad por comercial (vista vActividadPorComercial)
      description: El rol gerente_comercial ve a los comerciales de su regional; el rol comercial solo su propia fila.
      security:
        - bearer: []
      responses:
        '200':
          description: Filas de actividad
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActividadComercial'
        '401':
          $ref: '#/components/responses/SesionExpirada'

  /web/metricas/ajustes-margen:
    get:
      operationId: obtenerAjustesMargen
      x-estado: borrador
      tags: [metricas]
      summary: Ajustes de margen por comercial (vista vAjustesMargenPorComercial)
      description: El rol gerente_comercial ve a los comerciales de su regional; el rol comercial solo su propia fila.
      security:
        - bearer: []
      responses:
        '200':
          description: Filas de ajustes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AjustesMargenComercial'
        '401':
          $ref: '#/components/responses/SesionExpirada'

  /web/usuario/telefono:
    get:
      operationId: obtenerTelefono
      tags: [web]
      summary: Teléfono actual del comercial (para confirmarlo antes de generar el PDF)
      security:
        - bearer: []
      responses:
        '200':
          description: Teléfono registrado (null si nunca se ha capturado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelefonoComercial'
        '401':
          $ref: '#/components/responses/SesionExpirada'
    put:
      operationId: guardarTelefono
      tags: [web]
      summary: Guarda o corrige el teléfono del comercial
      description: |
        El valor queda persistido en `UsuariosWeb.telefono` y es el que se imprime en los PDF siguientes
        (`null` o vacío lo borra y el PDF omite "Cel"). Errores, siempre con `ErrorWeb`: un teléfono fuera
        del patrón (`TELEFONO_INVALIDO` en el caso de uso) responde 400; si el comercial del token ya no
        existe en `UsuariosWeb` (`USUARIO_NO_ENCONTRADO`) responde 401.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelefonoComercial'
      responses:
        '200':
          description: Teléfono guardado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelefonoComercial'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/SesionExpirada'

  /web/cotizaciones/{id}/nueva-version:
    get:
      operationId: obtenerDatosNuevaVersion
      tags: [web]
      summary: Datos de una cotización existente para prellenar una nueva versión
      description: |
        No modifica la cotización original. El frontend usa estos datos para prellenar
        "Nueva cotización"; al confirmarse se crea una fila nueva con `version + 1` y
        folio base con sufijo `-vN`.
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Datos para prellenar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatosNuevaVersion'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'

  /web/clientes:
    get:
      operationId: buscarClientes
      tags: [web]
      summary: Busca clientes y prospectos en el catálogo de Nexo
      description: |
        Mismo catálogo (clientes de `DimBPSolicitante` y prospectos) que usa el formulario
        "Nueva solicitud" de Nexo y la herramienta `buscar_cliente` del agente (HU-005.2,
        ADR-005). `exacta=true` solo cuando hay un único candidato — Nexo no distingue
        coincidencia exacta de aproximada en la respuesta; el frontend nunca debe tratar el
        texto buscado como NIT/origen/BP: esos datos salen únicamente de `candidatos`.
      security:
        - bearer: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Nombre o NIT, tal como lo escribió el comercial.
      responses:
        '200':
          description: Candidatos encontrados (vacío si ninguno)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoBusquedaClientes'
        '400':
          description: Falta `q`, o la búsqueda en Nexo no está disponible (`CLIENTE_BUSQUEDA_NO_DISPONIBLE`)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
        '401':
          $ref: '#/components/responses/SesionExpirada'

  /web/municipios:
    get:
      operationId: listarMunicipios
      tags: [web]
      summary: Catálogo completo de municipios para origen/destino
      description: |
        Mismo catálogo de municipios (sin paginar) que usa el formulario "Nueva solicitud" de Nexo para el
        origen y el destino. Se omiten los campos de costeo interno (`nombreTarifasPlaza`, `zonaTarificacion`
        en la respuesta de Nexo): el frontend no los necesita.
      security:
        - bearer: []
      responses:
        '200':
          description: Catálogo completo de municipios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Municipio'
        '400':
          description: El catálogo de municipios en Nexo no está disponible (`MUNICIPIOS_NO_DISPONIBLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'

  /web/catalogos-flete:
    get:
      operationId: obtenerCatalogosFlete
      tags: [web]
      summary: Catálogos de tipo de vehículo, tipo de carrocería y clase de viaje
      description: |
        Catálogos de la biblioteca SAP TM histórico de Nexo para el formulario de captura. Se omite
        `lineasNegocio` de la respuesta de Nexo: Cotifly ya tiene su propio catálogo de línea de negocio.
      security:
        - bearer: []
      responses:
        '200':
          description: Los tres catálogos completos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogosFlete'
        '400':
          description: Los catálogos de flete en Nexo no están disponibles (`CATALOGOS_FLETE_NO_DISPONIBLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'

  /web/cubicacion:
    post:
      operationId: cubicar
      tags: [web]
      summary: Cubicación rápida - mejor vehículo y flota necesaria para un conjunto de bultos
      description: |
        Reenvía la solicitud a `POST {Nexo:UrlBase}/api/cubicacion` (la "cubicación rápida" de Nexo, sin
        persistencia: dado un conjunto de bultos, sugiere qué vehículo conviene usar), que a su vez es la única
        llamada síncrona de Nexo al servicio Cubicador. Unidades: **centímetros y kilogramos** (distinto del resto
        del catálogo "Plan de Cargue" de Nexo, que usa milímetros). Cotifly siempre evalúa contra todo el catálogo
        estándar de vehículos: no expone `unidad_ids` de Nexo. Se omiten de la respuesta las matrices de
        factibilidad por vehículo y las disposiciones de colocación 3D de la flota (`matrices` y
        `sugerencia_flota.disposiciones` de Nexo): demasiado detalle para el formulario de cotización.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CubicacionRequest'
      responses:
        '200':
          description: Sugerencia de vehículo/flota, advertencias y detección de extradimensión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoCubicacion'
        '400':
          description: |
            `ITEMS_REQUERIDOS` si `items` falta o viene vacío; `CUBICACION_DEMASIADO_GRANDE` si Nexo/Cubicador
            rechaza la solicitud (típicamente por superar el límite de bultos por solicitud, pero Nexo no distingue
            el motivo exacto en su propio código de error); `CUBICACION_NO_DISPONIBLE` si Nexo no responde o no está
            configurado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'

  /web/clientes/{nit}/destinatarios-previos:
    get:
      operationId: obtenerDestinatariosPrevios
      tags: [web]
      summary: Destinatarios usados en envíos anteriores para un cliente
      description: Solo considera envíos del comercial autenticado. Lista vacía si nunca se le ha enviado.
      security:
        - bearer: []
      parameters:
        - name: nit
          in: path
          required: true
          schema:
            type: string
            maxLength: 20
      responses:
        '200':
          description: Destinatarios del último envío
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destinatarios'
        '401':
          $ref: '#/components/responses/SesionExpirada'

  /web/cotizaciones/{folio}/correo/vista-previa:
    post:
      operationId: previsualizarCorreo
      tags: [web]
      summary: Renderiza el correo sin enviarlo
      description: Devuelve asunto, cuerpo y destinatarios prediligenciados para el modal de confirmación.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvioWeb'
      responses:
        '200':
          description: Vista previa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VistaPreviaCorreo'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'

  /pdfs/{archivo}:
    get:
      operationId: descargarPdf
      tags: [sistema]
      summary: Descarga el PDF de una cotización (inline)
      description: |
        Requiere sesión. Solo el dueño de la cotización (o un gerente_comercial de su misma
        regional; si la regional del gerente no se conoce, solo el dueño) puede descargarlo. Como exige `Authorization`, el frontend lo descarga con HttpClient
        como blob (un `<a href>` directo no envía el header).
        En el backend Python este endpoint era público (hallazgo de seguridad corregido).
        Alternativa sin `Authorization` para Google Chat (ADR-011 §3, #12 parte C): el enlace
        de la tarjeta del PDF lleva `?t=<token>`, una firma HMAC de vida corta (15 minutos por
        defecto) sobre el archivo, el comercial y el vencimiento; solo vale para el dueño.
        Un token alterado o vencido responde 401. El frontend sigue usando Bearer.
      security:
        - bearer: []
        - {}
      parameters:
        - name: archivo
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]+\.pdf$'
        - name: t
          in: query
          required: false
          description: Token del enlace firmado de Google Chat (`{usuario}.{vence}.{firma}`); con él no se exige Bearer.
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: Falta el token, expiró o fue revocado; o el enlace firmado está alterado o vencido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'
              example:
                error: "Inicia sesión de nuevo."
        '404':
          description: No existe o no es tuya
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'

  /chat/events:
    post:
      operationId: recibirEventoChat
      tags: [chat]
      summary: Webhook de Google Chat
      description: |
        Verifica el JWT de Google (audience = número de proyecto, emisor
        `chat@system.gserviceaccount.com`), responde de inmediato con un acuse y procesa
        el turno en segundo plano. La respuesta final se publica en el hilo de Chat.
        La identidad es el correo del remitente en `UsuariosWeb.email` (ADR-011): sin cuenta se
        responde en el hilo "Ingresa primero a Cotifly desde ClientePro." y no se cotiza. Los clics
        en los botones de la tarjeta de previsualización (`CARD_CLICKED`) cuentan como mensaje.
      security:
        - googleChat: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: |
            Acuse. Evento MESSAGE en formato clásico → `{"text": "..."}`; en formato
            add-on → `hostAppDataAction.chatDataAction.createMessageAction`. Otros eventos → `{}`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: El cuerpo no es JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'
        '401':
          description: JWT de Google inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'

  /health:
    get:
      operationId: salud
      tags: [sistema]
      summary: Liveness
      security: []
      responses:
        '200':
          description: Servicio vivo
          content:
            application/json:
              schema:
                type: object
                required: [status, servicio, entorno]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  servicio:
                    type: string
                    example: cotifly-api
                  entorno:
                    type: string
                    example: Development

  /health/ready:
    get:
      operationId: saludListo
      tags: [sistema]
      summary: Readiness (base de datos alcanzable)
      security: []
      responses:
        '200':
          description: Listo
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ready]
        '503':
          description: No disponible
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [unavailable]
                  detalle:
                    type: string

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT HS256, 60 minutos. Claims: `sub` (UUID del usuario en `UsuariosWeb`),
        `jti`, `username`, `rol` (`comercial` | `gerente_comercial`).
    googleChat:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT firmado por Google Chat (RS256).

  parameters:
    Folio:
      name: folio
      in: path
      required: true
      schema:
        type: string
        maxLength: 50
      description: |
        Folio de la cotización (ADR-011): `PCN-[{nitCliente}-]{INICIALES}-DDMMAAAA-{NNN}[-vN]`.
        Se acepta cualquier folio existente (también los heredados del Python, como
        `PCN-23072026`), por eso no se valida con un patrón.
      example: PCN-DG-25092026-001

  responses:
    Validacion:
      description: Cuerpo inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWeb'
    CredencialesInvalidas:
      description: Identidad no válida o sin rol autorizado (mensaje genérico)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWeb'
          example:
            error: "Credenciales inválidas"
    SesionExpirada:
      description: Falta el token, expiró o fue revocado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWeb'
          example:
            error: "Inicia sesión de nuevo."
    SinPermiso:
      description: El rol del usuario no permite esta operación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWeb'
          example:
            error: "No tienes permiso para esta operación."
    NoEsTuya:
      description: La cotización no existe o pertenece a otro comercial
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWeb'
          example:
            error: "Cotización no encontrada o no es tuya."
    DemasiadasPeticiones:
      description: Límite de peticiones alcanzado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWeb'

  schemas:
    Nulo:
      description: |
        Valor `null` en OAS 3.0.3 (que no tiene `type: 'null'`): un objeto anulable sin propiedades. Se usa como
        alternativa de `oneOf` para campos que pueden no traer valor; el servidor siempre envía `null`, nunca `{}`.
      type: object
      nullable: true
      maxProperties: 0

    ErrorWeb:
      type: object
      required: [error]
      properties:
        error:
          type: string

    ErrorNegocio:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [codigo, mensaje]
          properties:
            codigo:
              type: string
              description: |
                Mismos códigos que el backend Python, más nueve nuevos del backend .NET:
                `CLIENTE_BUSQUEDA_NO_DISPONIBLE` (HU-005.2: Nexo sin configurar, sin
                respuesta o el comercial sin `idUsuarioExterno`; nunca por "no hubo
                candidatos", que es `200` con `candidatos: []`), `HERRAMIENTA_DESCONOCIDA` (el modelo pidió una
                herramienta inexistente, HU-003.10), `AJUSTE_MARGEN_INVALIDO` (HU-003.4:
                el margen negociado por el comercial está fuera de rango para su método de
                cálculo, es decir negativo o ≥ 1 con `margen`, o el método no es
                `margen`/`markup`), `FOLIO_DUPLICADO` (HU-003.5: ya existe una cotización
                con ese folio; el Python versionaba el folio en silencio, en .NET el folio lo
                genera HU-003.6 y la colisión se informa), `FOLIO_CONSECUTIVO_AGOTADO` (HU-003.6:
                ya se usaron los 999 folios del día de esas iniciales, ADR-011), `CORREO_DESHABILITADO` (HU-003.5:
                `Correo:Habilitado=false`, el valor por defecto; en `/web/*` se responde 503),
                `CORREO_INVALIDO` (HU-003.5: destinatarios `para`/`cc` inválidos o vacíos, asunto
                de más de 300 caracteres o cuerpo de más de 5000; lo devuelve la herramienta
                `enviar_correo`, y en `POST /web/cotizaciones/{folio}/enviar` va como `ErrorWeb` 400),
                `MUNICIPIOS_NO_DISPONIBLE` (`GET /web/municipios`: mismas causas que
                `CLIENTE_BUSQUEDA_NO_DISPONIBLE`, catálogo de Nexo), `CATALOGOS_FLETE_NO_DISPONIBLE`
                (`GET /web/catalogos-flete`: idem, catálogos de tipo de vehículo/carrocería/clase de viaje),
                `ITEMS_REQUERIDOS` (`POST /web/cubicacion`: falta `items` o viene vacío, mismo código que usa Nexo),
                `CUBICACION_NO_DISPONIBLE` (`POST /web/cubicacion`: idem `MUNICIPIOS_NO_DISPONIBLE`, cubicación
                rápida de Nexo) y `CUBICACION_DEMASIADO_GRANDE` (`POST /web/cubicacion`: Nexo/Cubicador rechazó la
                solicitud, típicamente por superar el límite de bultos por solicitud).
                `PRECIO_INVALIDO` queda solo para el cálculo de precio.
              enum:
                - TARIFA_FUENTE_NO_DISPONIBLE
                - TARIFA_CONFIG_INVALIDA
                - MARGEN_FUENTE_NO_DISPONIBLE
                - MARGEN_LINEA_DESCONOCIDA
                - PRECIO_INVALIDO
                - PDF_PAYLOAD_INVALIDO
                - PDF_RENDER_NO_DISPONIBLE
                - CONFIRMACION_REQUERIDA
                - COTIZACION_NO_ENCONTRADA
                - CORREO_DUPLICADO
                - CORREO_PDF_NO_ENCONTRADO
                - CORREO_ENVIO_FALLIDO
                - AJUSTE_COTIZACION_INVALIDA
                - AJUSTE_ID_INVALIDO
                - AJUSTE_MARGEN_INVALIDO
                - FOLIO_DUPLICADO
                - FOLIO_CONSECUTIVO_AGOTADO
                - CORREO_DESHABILITADO
                - CORREO_INVALIDO
                - CLIENTE_BUSQUEDA_NO_DISPONIBLE
                - HERRAMIENTA_DESCONOCIDA
                - MUNICIPIOS_NO_DISPONIBLE
                - CATALOGOS_FLETE_NO_DISPONIBLE
                - ITEMS_REQUERIDOS
                - CUBICACION_NO_DISPONIBLE
                - CUBICACION_DEMASIADO_GRANDE
                - ERROR_INTERNO
            mensaje:
              type: string
            detalle:
              type: object
              additionalProperties: true

    LoginClienteProRequest:
      type: object
      required: [idUsuario]
      properties:
        idUsuario:
          type: string
          minLength: 1
          maxLength: 100
          description: Identidad a revalidar contra `tblSAPUsuariosApp` (como NOMBREUSUARIO o como ID).
        nombreUsuario:
          type: string
          nullable: true
          maxLength: 200
          description: Informativo (nombre para mostrar). No se usa para identificar a la persona.
        roles:
          type: array
          nullable: true
          items:
            type: string
          description: Informativo. Nunca decide el acceso; el rol se resuelve en el servidor.

    RefreshRequest:
      type: object
      required: [refresh]
      properties:
        refresh:
          type: string
          minLength: 1

    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          nullable: true

    UsuarioSesion:
      type: object
      required: [id, username, email, nombre_completo, rol]
      properties:
        id:
          type: string
          format: uuid
          description: Id interno de Cotifly (`UsuariosWeb.id`, UUID generado por Cotifly).
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        username:
          type: string
        email:
          type: string
        nombre_completo:
          type: string
        rol:
          type: string
          enum: [comercial, gerente_comercial]
        ubicacion:
          type: string
          nullable: true
          description: Regional del usuario (`UsuariosWeb.regional`); null si aún no se ha cruzado con DimEjecutivo.

    LoginResponse:
      type: object
      required: [access, refresh, user, debeCambiarPassword]
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/UsuarioSesion'
        debeCambiarPassword:
          type: boolean
          description: Siempre `false` en la puerta SSO.

    MensajeWeb:
      type: object
      required: [mensaje, sesion_id]
      properties:
        mensaje:
          type: string
          minLength: 1
          maxLength: 8000
        sesion_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{8,64}$'
        cotizacion_origen_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Opcional. Inicia una nueva versión de una cotización propia (botón "Nueva versión"): el agente
            parte de su cliente, línea y números, y el PDF sale como `{folio base}-vN`. Si no es del
            comercial responde 404 (igual que si no existe); si no es un UUID, 400.

    SalidaPrecio:
      type: object
      required: [precio, costo, margen, metodo, utilidad]
      properties:
        precio:
          type: number
        costo:
          type: number
        margen:
          type: number
        metodo:
          type: string
          enum: [margen, markup]
        utilidad:
          type: number

    SalidaMargen:
      type: object
      required: [margen, origen, trq_type, anomalo, detalle]
      properties:
        margen:
          type: number
          description: Fracción decimal (0.135 = 13,5 %).
        origen:
          type: string
          enum: [sap_tm, politica_linea, negociado]
        trq_type:
          type: string
          nullable: true
        anomalo:
          type: boolean
        detalle:
          type: string

    SalidaPdf:
      type: object
      required: [cotizacion_id, folio, pdf_url, registrada_en_bd]
      properties:
        cotizacion_id:
          type: string
          format: uuid
        folio:
          type: string
        pdf_url:
          type: string
        registrada_en_bd:
          type: boolean

    RespuestaChat:
      type: object
      required: [texto, herramientas]
      properties:
        texto:
          type: string
        herramientas:
          type: array
          items:
            type: string
          description: Nombres de las herramientas invocadas en el turno, en orden.
        precio:
          description: Última salida exitosa de la herramienta en el turno, o `null`.
          oneOf:
            - $ref: '#/components/schemas/SalidaPrecio'
            - $ref: '#/components/schemas/Nulo'
        margen:
          description: Última salida exitosa de la herramienta en el turno, o `null`.
          oneOf:
            - $ref: '#/components/schemas/SalidaMargen'
            - $ref: '#/components/schemas/Nulo'
        pdf:
          description: Última salida exitosa de la herramienta en el turno, o `null`.
          oneOf:
            - $ref: '#/components/schemas/SalidaPdf'
            - $ref: '#/components/schemas/Nulo'

    RespuestaChatError:
      type: object
      required: [texto, error]
      properties:
        texto:
          type: string
        error:
          type: boolean
          enum: [true]

    CotizacionResumen:
      type: object
      required: [id, folio, version, moneda, estado_envio]
      properties:
        id:
          type: string
          format: uuid
          description: Se usa en `GET /web/cotizaciones/{id}/nueva-version`.
        folio:
          type: string
        version:
          type: integer
          description: 1 para la original; la tabla muestra "v2", "v3", etc.
        nit_cliente:
          type: string
          nullable: true
          description: Se usa en `GET /web/clientes/{nit}/destinatarios-previos`.
        origen_cliente:
          type: string
          nullable: true
          enum: [cliente, prospecto, null]
        origen_margen:
          type: string
          nullable: true
          enum: [sap_tm, politica_linea, negociado, null]
          description: '`negociado` = ajuste manual del comercial (badge "Ajuste fuera de política").'
        cliente:
          type: string
          nullable: true
        linea_negocio:
          type: string
          nullable: true
        precio_final:
          type: number
          nullable: true
        margen_aplicado:
          type: number
          nullable: true
        moneda:
          type: string
          example: COP
        estado_costeo:
          type: string
          nullable: true
        estado_envio:
          type: string
          enum: [sin_enviar, enviada, reenviada]
        ganada:
          type: boolean
          nullable: true
        motivo_rechazo:
          type: string
          nullable: true
        pdf_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true

    MisCotizaciones:
      type: object
      required: [total, cotizaciones]
      properties:
        total:
          type: integer
        cotizaciones:
          type: array
          items:
            $ref: '#/components/schemas/CotizacionResumen'

    EnvioWeb:
      type: object
      required: [para]
      properties:
        para:
          type: array
          minItems: 1
          items:
            type: string
            format: email
            maxLength: 320
        cc:
          type: array
          items:
            type: string
            format: email
            maxLength: 320
          default: []
        asunto:
          type: string
          nullable: true
          maxLength: 300
          description: Por defecto "Cotización {folio} — Botero Soto".
        cuerpo:
          type: string
          nullable: true
          maxLength: 5000

    RespuestaEnvio:
      type: object
      required: [enviado]
      properties:
        enviado:
          type: boolean
          enum: [true]
        message_id:
          type: string
          nullable: true

    SeguimientoWeb:
      type: object
      properties:
        ganada:
          type: boolean
          nullable: true
        motivo_rechazo:
          type: string
          nullable: true
          maxLength: 2000

    LineaNegocio:
      type: object
      required: [id, linea_negocio, margen, metodo_calculo, is_active]
      properties:
        id:
          type: integer
        linea_negocio:
          type: string
        margen:
          type: number
        metodo_calculo:
          type: string
          enum: [margen, markup]
        is_active:
          type: boolean
        updated_at:
          type: string
          format: date-time
          nullable: true

    ActualizarLineaNegocio:
      type: object
      required: [margen, metodo_calculo, is_active]
      properties:
        margen:
          type: number
          minimum: 0
          maximum: 0.99
        metodo_calculo:
          type: string
          enum: [margen, markup]
        is_active:
          type: boolean

    ActividadComercial:
      type: object
      description: |
        Fila de la vista `vActividadPorComercial` más `nombre_completo` (JOIN con
        `UsuariosWeb`). `num_cotizaciones_enviadas` debe contar `enviada` y `reenviada`.
      required: [usuario_id, num_cotizaciones, num_cotizaciones_enviadas, num_ajustes]
      properties:
        usuario_id:
          type: string
          format: uuid
        nombre_completo:
          type: string
          nullable: true
        num_cotizaciones:
          type: integer
        num_cotizaciones_enviadas:
          type: integer
        num_ajustes:
          type: integer
        ultima_cotizacion:
          type: string
          format: date-time
          nullable: true

    AjustesMargenComercial:
      type: object
      description: Fila de la vista `vAjustesMargenPorComercial` más `nombre_completo` (JOIN con `UsuariosWeb`).
      required: [usuario_id, num_ajustes]
      properties:
        usuario_id:
          type: string
          format: uuid
          nullable: true
        nombre_completo:
          type: string
          nullable: true
        linea_negocio:
          type: string
          nullable: true
        num_ajustes:
          type: integer
        diferencia_promedio:
          type: number
          nullable: true
        diferencia_min:
          type: number
          nullable: true
        diferencia_max:
          type: number
          nullable: true
        ultimo_ajuste:
          type: string
          format: date-time
          nullable: true

    TelefonoComercial:
      type: object
      required: [telefono]
      properties:
        telefono:
          type: string
          nullable: true
          pattern: '^\+?[0-9 ]{7,20}$'

    Destinatarios:
      type: object
      required: [para, cc]
      properties:
        para:
          type: array
          items:
            type: string
            format: email
        cc:
          type: array
          items:
            type: string
            format: email

    ResultadoBusquedaClientes:
      type: object
      required: [exacta, candidatos]
      properties:
        exacta:
          type: boolean
          description: Único candidato encontrado (ver descripción del endpoint sobre el criterio provisional).
        candidatos:
          type: array
          items:
            $ref: '#/components/schemas/ClienteEncontrado'

    ClienteEncontrado:
      type: object
      required: [nit_cliente, nombre, origen_cliente]
      properties:
        nit_cliente:
          type: string
        nombre:
          type: string
        origen_cliente:
          type: string
          enum: [cliente, prospecto]
        bp:
          type: string
          nullable: true
          description: BP de Nexo; nunca se muestra al comercial (solo se usa internamente para consultar SAP TM).

    Municipio:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          description: Id del municipio en el catálogo de Nexo.
        codigo_dane:
          type: string
          nullable: true
        municipio:
          type: string
          nullable: true
        departamento:
          type: string
          nullable: true
        pais:
          type: string
          nullable: true

    OpcionCatalogo:
      type: object
      required: [valor, etiqueta]
      properties:
        valor:
          type: string
          description: Valor interno de la opción (el que viaja en la cotización).
        etiqueta:
          type: string
          description: Texto legible para mostrar en el formulario.

    CatalogosFlete:
      type: object
      required: [tipos_vehiculo, tipos_carroceria, clases_viaje]
      properties:
        tipos_vehiculo:
          type: array
          items:
            $ref: '#/components/schemas/OpcionCatalogo'
        tipos_carroceria:
          type: array
          items:
            $ref: '#/components/schemas/OpcionCatalogo'
        clases_viaje:
          type: array
          items:
            $ref: '#/components/schemas/OpcionCatalogo'

    ItemCubicacion:
      type: object
      required: [cantidad, largo_cm, ancho_cm, alto_cm]
      properties:
        descripcion:
          type: string
          nullable: true
        cantidad:
          type: integer
          description: Cuántos bultos idénticos con estas medidas.
        largo_cm:
          type: number
          description: Largo en centímetros.
        ancho_cm:
          type: number
          description: Ancho en centímetros.
        alto_cm:
          type: number
          description: Alto en centímetros.
        peso_kg:
          type: number
          nullable: true
          description: Peso en kilogramos de cada bulto.

    CubicacionRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Obligatorio; 400 `ITEMS_REQUERIDOS` si falta o viene vacío.
          items:
            $ref: '#/components/schemas/ItemCubicacion'
        clase_viaje:
          type: string
          nullable: true

    SugerenciaVehiculo:
      type: object
      required: [unidad_id, unidad_nombre, banda, factor_utilizacion]
      properties:
        unidad_id:
          type: string
        unidad_nombre:
          type: string
        banda:
          type: string
        factor_utilizacion:
          type: number
        config_vehiculo:
          type: string
          nullable: true
        carroceria:
          type: string
          nullable: true
        clase_viaje:
          type: string
          nullable: true
        clase_contenedor:
          type: string
          nullable: true

    SugerenciaFlota:
      type: object
      required: [unidad_id, unidad_nombre, cantidad_vehiculos, utilizacion_promedio]
      description: Igual que Nexo salvo que omite `disposiciones` (colocaciones 3D detalladas por vehículo de la flota).
      properties:
        unidad_id:
          type: string
        unidad_nombre:
          type: string
        cantidad_vehiculos:
          type: integer
        utilizacion_promedio:
          type: number
        config_vehiculo:
          type: string
          nullable: true
        carroceria:
          type: string
          nullable: true
        clase_viaje:
          type: string
          nullable: true
        clase_contenedor:
          type: string
          nullable: true

    MedidasEstandar:
      type: object
      required: [largo_max_cm, ancho_max_cm, alto_max_cm, peso_max_kg]
      properties:
        largo_max_cm:
          type: number
        ancho_max_cm:
          type: number
        alto_max_cm:
          type: number
        peso_max_kg:
          type: number

    PiezaExcedida:
      type: object
      required: [descripcion, excesos, largo_cm, ancho_cm, alto_cm]
      properties:
        descripcion:
          type: string
        excesos:
          type: array
          items:
            type: string
        largo_cm:
          type: number
        ancho_cm:
          type: number
        alto_cm:
          type: number
        peso_kg:
          type: number
          nullable: true

    DeteccionExtradimension:
      type: object
      required: [hay_extradimension, medidas_estandar, piezas]
      properties:
        hay_extradimension:
          type: boolean
        medidas_estandar:
          $ref: '#/components/schemas/MedidasEstandar'
        piezas:
          type: array
          items:
            $ref: '#/components/schemas/PiezaExcedida'
        sugerencia:
          type: string
          nullable: true

    ResultadoCubicacion:
      type: object
      required: [advertencias]
      properties:
        sugerencia:
          description: Mejor vehículo único, o `null` si ninguno de la flota estándar sirve.
          oneOf:
            - $ref: '#/components/schemas/SugerenciaVehiculo'
            - $ref: '#/components/schemas/Nulo'
        sugerencia_flota:
          description: Flota sugerida cuando hace falta más de un vehículo, o `null`.
          oneOf:
            - $ref: '#/components/schemas/SugerenciaFlota'
            - $ref: '#/components/schemas/Nulo'
        advertencias:
          type: array
          items:
            type: string
        extradimension:
          description: Detección de piezas que exceden las medidas estándar, o `null`.
          oneOf:
            - $ref: '#/components/schemas/DeteccionExtradimension'
            - $ref: '#/components/schemas/Nulo'

    VistaPreviaCorreo:
      type: object
      required: [asunto, cuerpo, para, cc]
      properties:
        asunto:
          type: string
        cuerpo:
          type: string
          description: Cuerpo renderizado con la plantilla real (texto plano).
        para:
          type: array
          items:
            type: string
        cc:
          type: array
          items:
            type: string
        adjunto:
          type: string
          description: Nombre del PDF que se adjuntará.

    DatosNuevaVersion:
      type: object
      description: |
        Datos de lectura para prellenar el formulario. `cotizacion_origen_id` es solo el
        id consultado; no se persiste como FK en la versión nueva.
      required: [cotizacion_origen_id, folio_base, version_siguiente]
      properties:
        cotizacion_origen_id:
          type: string
          format: uuid
        folio_base:
          type: string
        version_siguiente:
          type: integer
        cliente_nombre:
          type: string
          nullable: true
        nit_cliente:
          type: string
          nullable: true
        origen_cliente:
          type: string
          nullable: true
          enum: [cliente, prospecto, null]
        linea_negocio:
          type: string
          nullable: true
        costo:
          type: number
          nullable: true
        margen_politica:
          type: number
          nullable: true
        margen_aplicado:
          type: number
          nullable: true
        origen_margen:
          type: string
          nullable: true
          enum: [sap_tm, politica_linea, negociado, null]
        metodo_calculo:
          type: string
          nullable: true
          enum: [margen, markup, null]
        moneda:
          type: string
          nullable: true
