  /web/metricas/regional:
    get:
      operationId: obtenerMetricasRegional
      tags: [metricas]
      summary: Métricas de la regional del gerente comercial, o de todas para el director (tablero, HU-010.3, HU-037)
      description: |
        Solo `gerente_comercial` o `director` (claim `rol` del token; HU-037, #210; un `comercial` recibe 403).
        - **`gerente_comercial`:** el alcance es SIEMPRE su regional, resuelta en el servidor (`DWCubosEBSSAP.DimEjecutivo`
          cuando está conectada; si no, `UsuariosWeb.regional`, que fija el DBA; ADR-016). `?regional=` con su propia regional
          se acepta; con otra, 403 `REGIONAL_NO_PERMITIDA` (HU-037.3, #211).
        - **`director` (HU-037.3, #211; ADR-016 §11):** sin `regional`, todas las regionales (todos los usuarios de Cotifly;
          `regional` y `fuente_regional` en `null`); con `?regional=X`, solo los miembros de X (`regional = X`,
          `fuente_regional` en `null`). Las regionales posibles salen de `GET /web/regionales`.

        - Gerente sin regional asignada: 409 `REGIONAL_NO_ASIGNADA` (nunca se devuelven todas las regionales).
        - Fuente de la regional configurada pero caída: 503 `REGIONAL_NO_DISPONIBLE` (también para el director que filtra por
          `regional`).
        - `usuario_id` filtra `indicadores`, `serie_mensual` y `concentracion_ciudades` a un comercial. Si no está en el
          alcance (la regional del gerente, la regional elegida por el director o, para el director sin `regional`, cualquier
          usuario de Cotifly) o no existe, responde 404, igual en los dos casos. `comerciales` trae siempre a todos los del
          alcance (para el selector), cada uno con su `rol` y sus indicadores del periodo.
        - El propio gerente es miembro de su regional: aparece en `comerciales` (con `rol: gerente_comercial`) y sus
          cotizaciones cuentan en el agregado de la regional.
        - `concentracion_ciudades` agrupa por el municipio de destino (`por_destino`, el que usa el mapa) y también por
          el de origen (`por_origen`). Las columnas `origen`/`destino` llegan con el script 0004 (HU-005.8); mientras
          no esté aplicado, `disponible` es `false` y las listas van vacías. El dinero del mapa es `valor_ganado_cop`
          (valor cotizado de las ganadas, no dinero recaudado).
        - La regional resuelta se reutiliza 60 s por usuario (los cambios del selector no vuelven a consultar
          `DimEjecutivo`); los fallos no se guardan.
        - **Filtro por año y mes (HU-010.5, #187).** `?anio=2026` es el año completo (2026-01-01 a 2026-12-31) y
          `?anio=2026&mes=10` ese mes completo (2026-10-01 a 2026-10-31), en fechas de America/Bogota como `desde`/`hasta`
          (de 00:00 del primer día a 24:00 del último, UTC−5). Si llega `anio`, **reemplaza** a `desde`/`hasta`, que se
          ignoran (no se combinan). `periodo` de la respuesta trae el rango aplicado. 400 `ErrorWeb` si `mes` llega sin
          `anio`, si `mes` no es un entero de 1 a 12 o si `anio` no es un entero de 2020 al año en curso más uno. Sin
          `anio` ni `mes`, todo sigue igual. Solo en este endpoint: `/web/metricas/comercial` no los acepta (los ignora).
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/DesdeMetricas'
        - $ref: '#/components/parameters/HastaMetricas'
        - name: usuario_id
          in: query
          required: false
          description: |
            Id (`UsuariosWeb.id`) de un comercial del alcance para filtrar los indicadores (para el director sin `regional`, de
            cualquier regional).
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/RegionalFiltro'
        - name: anio
          in: query
          required: false
          description: |
            HU-010.5 (#187). Año completo del periodo (fechas de America/Bogota), de 2020 al año en curso más uno. Si llega,
            reemplaza a `desde`/`hasta` (se ignoran). Con `mes`, solo ese mes de ese año.
          schema:
            type: integer
            minimum: 2020
          example: 2026
        - name: mes
          in: query
          required: false
          description: |
