      summary: Ajustes de margen por comercial (vista vAjustesMargenPorComercial). Obsoleto, usar /web/metricas/regional
      description: |
        Borrador anterior a HU-010.1; se conserva por compatibilidad (la desviación promedio pasó a
        `IndicadoresMetricas.desviacion_promedio_margen`). El rol gerente_comercial ve a los comerciales de su regional;
        el rol comercial solo su propia fila.
      security:
