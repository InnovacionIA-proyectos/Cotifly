openapi: 3.0.3
info:
  title: Cotifly API
  version: 1.0.0
  license:
    name: Propietario — Botero Soto Soluciones Logísticas
  description: |
    Contrato congelado de la API de Cotifly (HU-004.1, issue #17) que consume el módulo
    Angular de ClientePro (HU-004) y que implementa el backend .NET 10 (HU-003).

    Convenciones:
    - Todo `/web/*` usa nombres de campo snake_case (los heredados del backend Python
      y los nuevos), para que el frontend no mezcle convenciones.
    - `/api/auth/*` usa los nombres que define el patrón "Login SSO — Cliente Pro"
      (`idUsuario`, `debeCambiarPassword`), que ya produce el frontend de ClientePro.
    - Las operaciones marcadas con `x-estado: borrador` no están congeladas.
    - Los errores de `/web/*` y `/api/auth/*` usan `ErrorWeb` (`{"error": "texto"}`).
    - Los errores de negocio que vienen de una herramienta usan `ErrorNegocio`
      (`{"error": {"codigo", "mensaje", "detalle?"}}`).
    - Autenticación: `Authorization: Bearer <access>` emitido por
      `POST /api/auth/login-clientepro` (patrón "Login SSO — Cliente Pro").
    - Las operaciones marcadas con `x-estado: pendiente` tienen el contrato acordado y todavía no
      están implementadas; `x-issue` dice qué issue las implementa. Mientras tanto la prueba de
      contrato las lista en `clsContratoRutasTests.PendientesDeImplementar` (HU-013, ADR-018).
    - Concurrencia optimista (HU-013, ADR-018 §8): `GET /web/cotizaciones/{folio}/costeo` devuelve el
      encabezado `ETag` (y `row_version` en el cuerpo), y toda respuesta 200 o 201 de una mutación del
      costeo trae el `ETag` nuevo. Las mutaciones de la etapa final (margen, conexos POST y PUT,
      re-solicitar, textos y redactar) EXIGEN `If-Match` con ese valor: sin él responden 428
      `PRECONDICION_REQUERIDA`; si la cotización cambió entretanto, 409 `CONFLICTO_CONCURRENCIA`, sin
      cambios. `POST .../costeo/pdf` lo acepta opcional. `POST .../costeo/servicios-conexos` y
      `POST .../costeo/re-solicitar` aceptan además `Idempotency-Key` (doble clic). Rige desde el
      script `0006` (columna `rowVersion`), que entrega #98 (HU-013.2).
    - Regla del PDF (ADR-018 §11): mientras la cotización no se haya enviado al cliente ni tenga
      resultado, ajustar el margen, agregar o seleccionar conexos, redactar o editar los textos y
      re-solicitar en el mismo folio invalidan el PDF (`pdf_url = null`, `pdf_desactualizado = true`)
      y el comercial lo regenera. Ya enviada o con resultado: 409 `PDF_YA_ENVIADO` (versión `-vN`).
    - Pipeline determinista (ADR-018): el costo sale de Nexo, el margen sugerido de SAP TM (o de la
      política de la línea) y el precio y el PDF los calcula el código. La IA solo redacta el asunto
      y la introducción del PDF y PROPONE acciones (`accion_propuesta`) que el frontend ejecuta con
      el botón Confirmar llamando al endpoint determinista. La IA nunca escribe datos de negocio.
servers:
  - url: http://localhost:8080
    description: Desarrollo local (contenedor)

tags:
  - name: auth
    description: Login SSO desde ClientePro, refresh y logout
  - name: web
    description: Consola de cotización del comercial
  - name: admin
    description: Administración de políticas de margen (rol gerente_comercial)
  - name: metricas
    description: |
      Tablero de métricas agregadas (HU-010.1, ADR-016). `GET /web/metricas/comercial` (las cotizaciones
      propias) y `GET /web/metricas/regional` (solo `gerente_comercial`: su regional, filtrable por comercial).
      `/web/metricas/actividad` y `/web/metricas/ajustes-margen` son el borrador anterior y quedan obsoletos.

      Definiciones (recalculables a mano sobre `dbo_cotifly`, ver `docs/CONTRATO_API_WEB.md` §3.1):
      - **Unidad: la cadena de versiones.** Cadena = filas del mismo `usuarioId` con el mismo folio base (el folio sin
        el sufijo `-vN`; ADR-011: la v2+ reutiliza el folio de la v1). Cada cadena cuenta UNA vez:
        - valores (precio, costo, margen, moneda, costeo, ciudades, deadline, ajustes) de la **versión vigente** (mayor
          `version`);
        - **periodo y mes** por la **primera creación** de la cadena, `MIN(createdAt)`, en fechas de America/Bogota. Una
          cotización creada el 10 de agosto y rehecha (v2) el 3 de septiembre cuenta en agosto, con los valores de la v2;
          rehacerla no cambia periodos pasados;
        - **resultado** = el más reciente de toda la cadena (mayor `marcadoAt`; a igualdad o sin fecha, la mayor
          `version` con `ganada` no nulo). Una v1 ganada con una v2 sin marcar cuenta como ganada.
        Se cuentan todos los estados (lo mismo que lista "Mis cotizaciones").
      - **Moneda:** `valor_cop = precioFinal` si `moneda` es `COP` (o nula); `valor_cop = round(precioFinal ×
        trmAplicada, 2)` si es otra moneda (USD) con `trmAplicada > 0`. Una fila en USD con `trmAplicada = 0` no suma
        dinero. `costo` siempre está en COP y nunca se convierte. `valor_cop` NO es el `precio_cop` de ADR-014 (precio en
        pesos recalculado del costo y el margen antes de convertir, piso del PDF): pueden diferir unos pesos.
      - Partición: `cantidad = ganadas + perdidas + sin_resultado + pendientes_por_cotizar`, con `ganadas` = resultado
        ganada, `perdidas` = resultado perdida (con o sin precio), `sin_resultado` = con precio y sin resultado y
        `pendientes_por_cotizar` = sin precio y sin resultado. `versiones` = filas de esas cadenas (todas las versiones).
      - `conversion` = ganadas / cantidad (definición del backlog HU-010, "#ganadas / #totales");
        `conversion_sobre_cerradas` = ganadas / (ganadas + perdidas). Fracción de 0 a 1 con 4 decimales; `null` si el
        denominador es 0.
      - `margen_promedio` = promedio simple de `margenAplicado` (fracción, 0.15 = 15 %) de las que lo tienen.
      - `costeo_total` = SUM(`costo`) en COP de todas; `costeo_ganadas` = SUM(`costo`) de las ganadas.
      - `valor_cotizado_cop` = SUM(`valor_cop`); `valor_ganado_cop` = SUM(`valor_cop`) de las ganadas. Es el valor
        cotizado de las ganadas, NO dinero recaudado: en la UI, "Valor ganado (COP)".
      - `ganancias` = SUM(`valor_cop` − `costo`) de las ganadas con precio y costo. Si todas las ganadas tienen precio y
        costo y ninguna en USD tiene TRM 0, `ganancias = valor_ganado_cop − costeo_ganadas`.
      - `tiempo_promedio_cotizacion_horas` = promedio de (`costeoListoAt` − `createdAt` de la versión vigente) en horas;
        se descartan las filas con `costeoListoAt` anterior a `createdAt`.
      - `desviacion_promedio_margen` = promedio de `MargenAjustes.diferencia` (negociado − política) de los ajustes de la
        versión vigente; `desviacion_promedio_margen_abs` = promedio de su valor absoluto; `ajustes_margen` = cuántos.
      - `deadline_vencidas` = sin resultado y con `deadline` anterior al momento de la consulta. `null` mientras el
        esquema no tenga la columna `deadline` (script 0004).
      - Montos en COP con 2 decimales; redondeo half-to-even.
      - Fuera de alcance por ahora: los servicios conexos (ADR-015) no se suman (pendiente tras #42), y una solicitud de
        varias líneas cuenta solo la ciudad de la cabecera (ADR-016 §7).

      Pendiente de Nexo, NO implementado: "score de urgencia" por cotización (su contrato depende del equipo de Nexo,
      ver ADR-016).
  - name: chat
    description: |
      Webhook de Google Chat. Obsoleto: Google Chat se retira del proyecto en HU-013.9 (#105, ADR-018).
  - name: sistema
    description: Salud del servicio y archivos PDF

paths:
  /api/auth/login-clientepro:
    post:
      operationId: loginClientePro
      tags: [auth]
      summary: Login SSO desde ClientePro (sin credenciales propias)
      description: |
        ClientePro ya autenticó a la persona. El backend revalida la identidad contra
        el almacén corporativo de solo lectura (`tblSAPUsuariosApp`, base
        `dbsolucionesti`): busca `idUsuario` como `NOMBREUSUARIO` y, si no resuelve,
        como `ID` numérico. El `NOMBREUSUARIO` de la fila encontrada (nunca el que
        envía el cliente) es la clave para ubicar o crear al usuario en `UsuariosWeb`
        (aprovisionamiento just-in-time). Luego traduce sus roles externos a roles
        internos y exige `comercial` o `gerente_comercial`.
        Cualquier falla (usuario inexistente, rol no autorizado, almacén caído) responde
        el mismo 401 genérico.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginClienteProRequest'
            example:
              idUsuario: "USR12345"
              nombreUsuario: "Nombre Apellido"
              roles: ["34"]
      responses:
        '200':
          description: Sesión emitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/CredencialesInvalidas'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'

  /api/auth/refresh:
    post:
      operationId: refrescarSesion
      tags: [auth]
      summary: Rota el refresh token y emite un par nuevo
      description: |
        El refresh token se invalida al usarse (rotación). Reutilizar un refresh ya
        rotado se trata como posible robo de sesión: responde 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Par nuevo emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'

  /api/auth/logout:
    post:
      operationId: cerrarSesion
      tags: [auth]
      summary: Cierra la sesión (revoca refresh y access)
      description: Responde siempre 204, exista o no el token (anti-enumeración).
      security:
        - bearer: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Sesión cerrada
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'

  /web/chat:
    post:
      operationId: enviarMensajeChat
      tags: [web]
      summary: Corre un turno del asistente IA sobre una cotización (folio)
      description: |
        **HU-013.6 (#102, ADR-018), pendiente de implementar:** el asistente trabaja sobre UNA cotización ya creada por
        el formulario. `folio` es obligatorio: sin él responde 400 `FOLIO_REQUERIDO`; si no existe o no es del comercial,
        404 (`Cotización no encontrada o no es tuya.`). Las cotizaciones ya no se crean por chat (flag
        `Chat:CreacionHabilitada=false`; después se borra el código): `cotizacion_origen_id` y `moneda` quedan obsoletos.
        Herramientas de solo lectura o propuesta: `consultar_cotizacion`, `proponer_ajuste_margen`,
        `proponer_re_solicitud` y `buscar_servicio_conexo`. **Ninguna entrega montos de dinero al LLM** (ni precio, ni
        costo, ni totales, ni valores de conexos): `consultar_cotizacion` da solo estado, ruta, línea, moneda, nombres de
        conexos y los porcentajes de margen actual y sugerido (ADR-018 §2b). El `resumen` con montos de la acción
        propuesta lo arma el servidor después del LLM. La respuesta es `{texto, accion_propuesta?}`: la acción
        propuesta trae el método, el endpoint, el cuerpo exacto y un resumen; el frontend la ejecuta solo si el comercial
        pulsa Confirmar, llamando a ese endpoint con ese cuerpo (y `If-Match` = `row_version`). **La IA nunca ejecuta
        cambios.** `precio`, `margen` y `pdf` de `RespuestaChat` quedan siempre en `null` desde HU-013.6.

        `sesion_id` lo genera el cliente (UUID sin guiones) y agrupa la conversación.
        La sesión queda ligada al usuario del token: otro usuario no puede continuarla.
        Un fallo interno del agente (incluido el límite de peticiones del proveedor de
        IA) responde **200** con `error: true` y un texto legible (paridad con el
        backend Python; el frontend lo muestra tal cual). El 429 de este endpoint es
        el límite de peticiones de la propia API, no el del proveedor de IA.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MensajeWeb'
            example:
              mensaje: "Súbele el margen al 18 % porque el cliente acepta el valor"
              sesion_id: "3f2a9c1b7e4d4a6f9b0c2d1e5f6a7b8c"
              folio: "PCN-900555111-DG-05102026-001"
      responses:
        '200':
          description: Respuesta del agente (o error controlado con `error = true`)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RespuestaChat'
                  - $ref: '#/components/schemas/RespuestaChatError'
              example:
                texto: "Te propongo subir el margen de 15 % a 18 %. El precio pasaría a 3.109.756 COP."
                herramientas: [consultar_cotizacion, proponer_ajuste_margen]
                precio: null
                margen: null
                pdf: null
                errores: []
                accion_propuesta:
                  tipo: ajustar_margen
                  metodo: PUT
                  endpoint: /web/cotizaciones/PCN-900555111-DG-05102026-001/costeo/margen
                  cuerpo:
                    margen: 0.18
                    justificacion: null
                  resumen: "Ajustar el margen de 15 % a 18 % (precio estimado 3.109.756 COP)."
                  row_version: "AAAAAAAAB9E="
        '400':
          description: |
            `ErrorWeb`: `sesion_id`, `cotizacion_origen_id` o `moneda` inválido, o cuerpo inválido. `ErrorNegocio`
            `FOLIO_REQUERIDO` (HU-013.6): falta `folio` o viene vacío.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorWeb'
                  - $ref: '#/components/schemas/ErrorNegocio'
              example:
                error: "sesion_id inválido"
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          description: |
            El `sesion_id` pertenece a otro usuario (`Sesión no encontrada.`), o `cotizacion_origen_id`
            no existe o no es del comercial (`Cotización no encontrada o no es tuya.`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'
              example:
                error: "Sesión no encontrada."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'

  /web/mis-cotizaciones:
    get:
      operationId: listarMisCotizaciones
      tags: [web]
      summary: Lista las cotizaciones del comercial autenticado
      description: Nunca devuelve cotizaciones de otro comercial. Máximo 100, más recientes primero.
      security:
        - bearer: []
      responses:
        '200':
          description: Cotizaciones del comercial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MisCotizaciones'
        '401':
          $ref: '#/components/responses/SesionExpirada'

  /web/cotizaciones/{folio}/enviar:
    post:
      operationId: enviarCotizacion
      tags: [web]
      summary: Envía la cotización al cliente por correo con el PDF adjunto
      description: |
        El remitente es el comercial autenticado. Solo puede enviar cotizaciones propias
        (si no es suya responde 404, igual que si no existe). Un envío idéntico a los
        mismos destinatarios en los últimos 5 minutos se rechaza como duplicado.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvioWeb'
      responses:
        '200':
          description: Correo enviado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaEnvio'
        '400':
          description: Error de negocio del envío (duplicado, sin PDF, fallo SMTP, validación)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '503':
          description: El envío de correo está deshabilitado (`Correo:Habilitado=false`, valor por defecto)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
              example:
                error:
                  codigo: CORREO_DESHABILITADO
                  mensaje: "El envío de correo está deshabilitado."

  /web/cotizaciones/{folio}/seguimiento:
    post:
      operationId: marcarSeguimiento
      tags: [web]
      summary: Marca la cotización como ganada o perdida (interino, obsoleto)
      deprecated: true
      description: |
        Obsoleto desde HU-005.14: las cotizaciones que pasaron por Nexo usan `POST /web/cotizaciones/{folio}/resultado`.
        Se conserva por compatibilidad con el frontend y para las cotizaciones del chat con costo manual
        (`estado_costeo` nulo). Una cotización del flujo de costeo en Nexo responde 409 `USAR_RESULTADO_NEXO`
        (marcarla solo en Cotifly desincronizaría el resultado), salvo en `descartada` y `costeo_vencido`: Nexo no les
        acepta resultado y se marcan aquí, solo en Cotifly.
        Interino hasta HU-005.14, que lo reemplaza por `POST /web/cotizaciones/{folio}/resultado`
        (registra también en Nexo, agrega `comentario` y no permite cambiar el
        resultado una vez definido).
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeguimientoWeb'
      responses:
        '200':
          description: Cotización actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionResumen'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '409':
          description: '`USAR_RESULTADO_NEXO`: la cotización pasó por Nexo; usar `POST /web/cotizaciones/{folio}/resultado`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'

  /web/admin/lineas-negocio:
    get:
      operationId: listarLineasNegocio
      tags: [admin]
      summary: Lista todas las líneas de negocio con su política de margen
      security:
        - bearer: []
      responses:
        '200':
          description: Líneas de negocio (activas e inactivas)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LineaNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '403':
          $ref: '#/components/responses/SinPermiso'

  /web/admin/lineas-negocio/{id}:
    put:
      operationId: actualizarLineaNegocio
      tags: [admin]
      summary: Edita margen, método de cálculo y estado de una línea existente
      description: No crea ni borra líneas.
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarLineaNegocio'
      responses:
        '200':
          description: Línea actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineaNegocio'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          description: La línea no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'

  /web/metricas/comercial:
    get:
      operationId: obtenerMetricasComercial
      tags: [metricas]
      summary: Métricas de las cotizaciones propias (tablero del comercial, HU-010.2)
      description: |
        Indicadores de las cotizaciones del usuario autenticado (roles `comercial` y `gerente_comercial`: el gerente
        también cotiza y aquí ve solo las suyas). El rol sale del claim `rol` del access token, emitido en el login SSO
        con la verificación doble de ClientePro (ADR-009); no se lee de `UsuariosWeb`. Definiciones en el tag
        `metricas`. Un comercial sin cotizaciones recibe 200 con ceros, `null` en los promedios y la serie con cada mes
        en 0 (el frontend muestra el estado vacío).
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/DesdeMetricas'
        - $ref: '#/components/parameters/HastaMetricas'
      responses:
        '200':
          description: Indicadores del comercial en el periodo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricasComercial'
              example:
                periodo: {desde: '2026-08-01', hasta: '2026-09-29', zona_horaria: America/Bogota}
                usuario_id: 5f0c2a8e-4b1d-4c55-9a51-2f7d0c1e9b10
                indicadores:
                  cantidad: 12
                  versiones: 14
                  ganadas: 3
                  perdidas: 4
                  sin_resultado: 3
                  pendientes_por_cotizar: 2
                  conversion: 0.25
                  conversion_sobre_cerradas: 0.4286
                  margen_promedio: 0.1542
                  costeo_total: 38500000.00
                  costeo_ganadas: 10540000.00
                  valor_cotizado_cop: 45310000.00
                  valor_ganado_cop: 12400000.00
                  ganancias: 1860000.00
                  cotizaciones_usd: 1
                  tiempo_promedio_cotizacion_horas: 5.75
                  desviacion_promedio_margen: -0.015
                  desviacion_promedio_margen_abs: 0.025
                  ajustes_margen: 2
                  deadline_vencidas: 1
                serie_mensual:
                  - {mes: '2026-08', cantidad: 5, ganadas: 1, perdidas: 2, valor_cotizado_cop: 18200000.00, valor_ganado_cop: 4100000.00}
                  - {mes: '2026-09', cantidad: 7, ganadas: 2, perdidas: 2, valor_cotizado_cop: 27110000.00, valor_ganado_cop: 8300000.00}
        '400':
          description: '`desde`/`hasta` no son fechas AAAA-MM-DD, `hasta` es anterior a `desde` o el rango supera 3 años'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'
              example:
                error: "El parámetro 'desde' debe ser una fecha AAAA-MM-DD."
        '401':
          $ref: '#/components/responses/SesionExpirada'

  /web/metricas/regional:
    get:
      operationId: obtenerMetricasRegional
      tags: [metricas]
      summary: Métricas de la regional del gerente comercial (tablero del gerente, HU-010.3)
      description: |
        Solo `gerente_comercial` (claim `rol` del token; un `comercial` recibe 403). El alcance es SIEMPRE la regional
        del usuario autenticado, resuelta en el servidor (`DWCubosEBSSAP.DimEjecutivo` cuando está conectada; si no,
        `UsuariosWeb.regional`, que fija el DBA; ADR-016). No se acepta una regional por parámetro.

        - Sin regional asignada: 409 `REGIONAL_NO_ASIGNADA` (nunca se devuelven todas las regionales).
        - Fuente de la regional configurada pero caída: 503 `REGIONAL_NO_DISPONIBLE`.
        - `usuario_id` filtra `indicadores`, `serie_mensual` y `concentracion_ciudades` a un comercial. Si no es de la
          regional (o no existe) responde 404, igual en los dos casos. `comerciales` trae siempre a todos los de la
          regional (para el selector), cada uno con su `rol` y sus indicadores del periodo.
        - El propio gerente es miembro de su regional: aparece en `comerciales` (con `rol: gerente_comercial`) y sus
          cotizaciones cuentan en el agregado de la regional.
        - `concentracion_ciudades` agrupa por el municipio de destino (`por_destino`, el que usa el mapa) y también por
          el de origen (`por_origen`). Las columnas `origen`/`destino` llegan con el script 0004 (HU-005.8); mientras
          no esté aplicado, `disponible` es `false` y las listas van vacías. El dinero del mapa es `valor_ganado_cop`
          (valor cotizado de las ganadas, no dinero recaudado).
        - La regional resuelta se reutiliza 60 s por usuario (los cambios del selector no vuelven a consultar
          `DimEjecutivo`); los fallos no se guardan.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/DesdeMetricas'
        - $ref: '#/components/parameters/HastaMetricas'
        - name: usuario_id
          in: query
          required: false
          description: Id (`UsuariosWeb.id`) de un comercial de la regional para filtrar los indicadores.
          schema:
            type: string
            format: uuid
      responses:
