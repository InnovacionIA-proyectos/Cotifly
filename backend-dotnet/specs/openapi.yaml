      description: |
        Indicadores de las cotizaciones del usuario autenticado (roles `comercial`, `gerente_comercial` y `director`: el gerente
        y el director también cotizan y aquí ven solo las suyas). El rol sale del claim `rol` del access token, emitido en el login SSO
        con la verificación doble de ClientePro (ADR-009); no se lee de `UsuariosWeb`. Definiciones en el tag
        `metricas`. Un comercial sin cotizaciones recibe 200 con ceros, `null` en los promedios y la serie con cada mes
        en 0 (el frontend muestra el estado vacío).
      security:
