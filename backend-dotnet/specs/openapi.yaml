        `SolicitudCosteoWeb`. Origen, destino, cliente y línea de negocio no se cambian aquí (eso es otra cotización).
        Si trae `posiciones`, reemplaza todas las anteriores. La combinación resultante (lo guardado más los cambios) se
        valida igual que en la captura, con las condiciones de G3 (`docs/HU-013-preguntas-nexo.md`): `clase_contenedor`
        solo con `clase_viaje = Contenedor`, `ciudad_devolucion_contenedor` con `retorna_contenedor`,
        `ciudad_levante_contenedor` con `levante_contenedor_diferente` y `valor_aprovisionamiento` solo con un levante
        distinto del origen, y la regla de peso.
      properties:
        tipo_vehiculo:
          type: string
          nullable: true
          maxLength: 100
        carroceria:
          type: string
          nullable: true
          maxLength: 100
        tipologia:
          type: string
          nullable: true
          maxLength: 50
        clase_viaje:
          type: string
          nullable: true
          maxLength: 50
        clase_contenedor:
          type: string
          nullable: true
          maxLength: 20
        exclusivo:
          type: boolean
          nullable: true
        consolidado:
          type: boolean
          nullable: true
        retorna_contenedor:
          type: boolean
          nullable: true
        ciudad_devolucion_contenedor:
          type: string
          nullable: true
          maxLength: 150
        levante_contenedor_diferente:
          type: boolean
          nullable: true
        ciudad_levante_contenedor:
          type: string
          nullable: true
          maxLength: 150
        valor_aprovisionamiento:
          type: number
          nullable: true
          minimum: 0
          maximum: 9999999999999.99
        horas_cargue:
          type: number
          nullable: true
          minimum: 0
          maximum: 240
        horas_descargue:
          type: number
          nullable: true
          minimum: 0
          maximum: 240
        peso_kg:
          type: number
          nullable: true
          minimum: 0
          maximum: 999999.99
        valor_mercancia:
          type: number
          nullable: true
          minimum: 0
          maximum: 9999999999999.99
        posiciones:
          type: array
          nullable: true
