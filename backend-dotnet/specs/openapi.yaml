        '400':
          description: '`AJUSTE_MARGEN_INVALIDO` (fuera de 0 a 0,99), `JUSTIFICACION_REQUERIDA` (con `detalle.margen_sugerido`, `detalle.linea_orden` y `detalle.linea_solicitud_id` de la ruta), `RUTA_REQUERIDA` (con `detalle.rutas`) o `RUTA_INEXISTENTE` (`ErrorNegocio`); `ErrorWeb` si el cuerpo no es JSON válido'
