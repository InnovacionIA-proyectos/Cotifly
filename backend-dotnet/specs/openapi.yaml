          nullable: true
        numCotizaciones:
          type: integer
        numCotizacionesEnviadas:
          type: integer
        numAjustes:
          type: integer
        ultimaCotizacion:
          type: string
          format: date-time
          nullable: true

    AjustesMargenComercial:
      type: object
      required: [usuarioId, numAjustes]
