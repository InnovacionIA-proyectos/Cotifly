  /web/licitaciones/recetas-lectura:
    put:
      operationId: guardarRecetaLectura
      tags: [web]
      summary: Guarda en NEXO el formato de lectura (receta) confirmado para el cliente
      description: |
        HU-044.5 (#256, ADR-028; NEXO PR #433). Se llama **solo cuando el comercial confirma** «Guardar este formato para el cliente»
        después de `leer-estructura`. Cotifly reenvía el formulario a `PUT {Nexo:UrlBase}/api/captura-solicitudes/recetas-lectura` con
        el **nombre original del archivo**, la identidad del comercial y el NIT como `clienteNit`. Con el formato guardado, el siguiente
        Excel del cliente con un formato parecido (≥ 85 %) se lee sin IA. NEXO guarda hasta 20 formatos por cliente; **Cotifly no
        guarda copia**.

        **`receta` es un texto JSON opaco**: la de la última respuesta de `leer-estructura`, que llega a NEXO exactamente como vino
        (Cotifly no la interpreta ni la cambia). `archivo` debe ser **el mismo Excel** con el que se confirmó: NEXO ejecuta la receta
        contra él y exige que dé filas (`RECETA_SIN_FILAS`).

        **Antes de NEXO Cotifly solo valida** que venga el archivo (`ARCHIVO_REQUERIDO`), su tamaño (`ARCHIVO_DEMASIADO_GRANDE`) y su
        extensión (`FORMATO_NO_SOPORTADO`, solo `.xlsx` o `.xlsm`), que venga la receta (`RECETA_REQUERIDA`) y el NIT
        (`CLIENTE_REQUERIDO`). **No abre el libro** (#277). **Sin reintentos automáticos** y con el tiempo largo hacia NEXO (al menos
        180 s, `ImportacionInteligente:TimeoutLecturaSegundos`).

        `201` la primera vez; `200` si reemplazó a un formato parecido del cliente.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo, receta, nit_cliente]
              properties:
                archivo:
                  type: string
                  format: binary
                receta:
                  type: string
                  description: La `receta` de la última respuesta de `leer-estructura`, como texto JSON (máx. 60.000).
                nit_cliente:
                  type: string
                  description: NIT de la licitación (con o sin puntos y dígito de verificación). Si no tiene cliente local en NEXO, NEXO lo crea desde el DW.
                nombre:
                  type: string
                  description: Nombre para reconocer el formato en la lista (máx. 100).
                instrucciones:
                  type: string
                  description: Lo que explicó el comercial (máx. 4000); NEXO se lo da a la IA si el formato cambia.
      responses:
        '201':
          description: Formato nuevo del cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecetaLectura'
        '200':
          description: Reemplazó a un formato parecido del cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecetaLectura'
        '400':
          description: |
            `ErrorWeb`: el formulario no se pudo leer o una parte viene más de una vez (dos `receta`, dos `nit_cliente`, dos `archivo`...;
            no se adivina cuál vale y no se llama a NEXO). `ErrorNegocio`: de Cotifly, sin llamar a NEXO, `ARCHIVO_REQUERIDO`,
            `FORMATO_NO_SOPORTADO`, `ARCHIVO_DEMASIADO_GRANDE` (un 413 de NEXO también), `RECETA_REQUERIDA`, `CLIENTE_REQUERIDO` y
            `CLIENTE_NIT_INVALIDO`; de NEXO, con su código y su mensaje, `RECETA_INVALIDA`, `RECETA_SIN_FILAS`,
            `CLIENTE_NIT_INVALIDO`, `CLIENTE_NO_ENCONTRADO`, `NOMBRE_DEMASIADO_LARGO`, `INSTRUCCIONES_DEMASIADO_LARGAS`, `EXCEL_INVALIDO`
            y `EXCEL_SIN_DATOS`; `COSTEO_NEXO_RECHAZADA` para otro 4xx de NEXO.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorWeb'
                  - $ref: '#/components/schemas/ErrorNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '403':
          description: '`ErrorWeb`: el rol no es de la consola del comercial. `ErrorNegocio` `NEXO_SIN_PERMISO`: NEXO respondió 401 o 403'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorWeb'
                  - $ref: '#/components/schemas/ErrorNegocio'
        '413':
          $ref: '#/components/responses/CuerpoDemasiadoGrande'
        '503':
          description: '`NEXO_NO_DISPONIBLE`: la importación apagada en el ambiente, NEXO caído o sin respuesta a tiempo (una sola llamada)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '500':
          $ref: '#/components/responses/ErrorInterno'
