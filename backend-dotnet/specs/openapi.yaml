  /web/catalogos-flete:
    get:
      operationId: obtenerCatalogosFlete
      tags: [web]
      summary: Catálogos de tipo de vehículo, tipo de carrocería y clase de viaje
      description: |
        Catálogos de la biblioteca SAP TM histórico de Nexo para el formulario de captura. Se omite
        `lineasNegocio` de la respuesta de Nexo: Cotifly ya tiene su propio catálogo de línea de negocio.

        **Migración pendiente (HU-013, ADR-018; `docs/HU-005.1-mapeo-campos-nexo.md`):** la fuente actual,
        `GET /api/biblioteca-sap-historico/filtros`, es el histórico de tarifas, no el catálogo maestro. La respuesta de
        este endpoint no cambia, pero sus opciones deben salir de los catálogos maestros de Nexo:
        - tipos de vehículo: `GET /api/catalogos/tipos-vehiculo` (`{codigo, descripcion, esCatalogoOficial}`, códigos SAP
          cortos como `2S3`; `valor` = `codigo`, `etiqueta` = `descripcion`);
        - clases de viaje: `GET /api/catalogos/clases-viaje` (`{id, descripcion}`);
        - clases de contenedor: `GET /api/catalogos/clases-contenedor` (`{id, descripcion, tamanoContenedor, pesoInfCnt,
          pesoSupCnt}`), hoy en código;
        - líneas de negocio: `GET /api/catalogos/lineas-negocio` (`{id, descripcion}`), solo para validar
          `MargenesPolitica.mapeoLineasNexo` (Cotifly conserva su catálogo propio);
        - carrocería: sigue en código hasta que Nexo publique su catálogo;
        - tipología: enum de Nexo de 7 valores, en código.
        El valor que el frontend envía a `POST /web/solicitudes-costeo` es siempre `valor` (el código), nunca la etiqueta.
      security:
        - bearer: []
      responses:
        '200':
          description: Los tres catálogos completos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogosFlete'
        '400':
          description: Los catálogos de flete en Nexo no están disponibles (`CATALOGOS_FLETE_NO_DISPONIBLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'

  /web/cubicacion:
    post:
      operationId: cubicar
      tags: [web]
      summary: Cubicación rápida - mejor vehículo y flota necesaria para un conjunto de bultos
      description: |
        Reenvía la solicitud a `POST {Nexo:UrlBase}/api/cubicacion` (la "cubicación rápida" de Nexo, sin
        persistencia: dado un conjunto de bultos, sugiere qué vehículo conviene usar), que a su vez es la única
        llamada síncrona de Nexo al servicio Cubicador. Unidades: **centímetros y kilogramos** (distinto del resto
        del catálogo "Plan de Cargue" de Nexo, que usa milímetros). Cotifly siempre evalúa contra todo el catálogo
        estándar de vehículos: no expone `unidad_ids` de Nexo. Se omiten de la respuesta las matrices de
        factibilidad por vehículo y las disposiciones de colocación 3D de la flota (`matrices` y
        `sugerencia_flota.disposiciones` de Nexo): demasiado detalle para el formulario de cotización.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CubicacionRequest'
      responses:
        '200':
          description: Sugerencia de vehículo/flota, advertencias y detección de extradimensión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoCubicacion'
        '400':
          description: |
            `ITEMS_REQUERIDOS` si `items` falta o viene vacío; `CUBICACION_DEMASIADO_GRANDE` si Nexo/Cubicador
            rechaza la solicitud (típicamente por superar el límite de bultos por solicitud, pero Nexo no distingue
            el motivo exacto en su propio código de error); `CUBICACION_NO_DISPONIBLE` si Nexo no responde o no está
            configurado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'

  /web/solicitudes-costeo:
    post:
      operationId: enviarSolicitudCosteo
      tags: [web]
      summary: Crea la cotización con el formulario ampliado y la envía a costeo en Nexo
      description: |
        HU-005.5 (ADR-015). Crea la cotización del comercial (folio del servidor, ADR-011, con el NIT) con el
        formulario ampliado y sus posiciones en `estado_costeo = pendiente_envio`, la **confirma antes de llamar a
        Nexo** y luego envía `POST {Nexo:UrlBase}/api/captura-solicitudes` con una sola línea. El BP del cliente sale
        del catálogo de Nexo (búsqueda por `nit_cliente`), nunca del cuerpo. Los catálogos cerrados (`tipo_vehiculo`,
        `carroceria`, `tipologia`, `clase_viaje`, `clase_contenedor`) van con el código de Nexo tal cual.

        Responde **201 aunque Nexo falle**: la cotización queda en `error_envio` con `motivo_estado_costeo`
        (tiempo agotado, rechazo 4xx con el código de Nexo, 5xx, red, cliente sin BP) y el comercial puede
        reintentar con `POST /web/cotizaciones/{folio}/costeo/reintentar` sin volver a llenar el formulario. Con
        éxito queda en `pendiente_costeo` (o `autocosteo` si Nexo costeó la línea en la misma petición) y el polling
        (HU-005.6) sigue su estado. `precio_final` es `null` hasta que el costeo pasa por el margen (HU-005.7).

        Es el ÚNICO camino para crear una cotización (ADR-018): el chat ya no crea cotizaciones.

        **Moneda (HU-013.7, #103, pendiente de implementar; mismo contrato que `POST /web/licitaciones`, ADR-014 §5):**
        `moneda` opcional, `COP` por defecto o `USD`. En USD la TRM del día se fija **antes de guardar** con
        `clsFijacionMonedaService` y queda en `trm_aplicada`; sin TRM responde 400 `TRM_NO_DISPONIBLE`, no guarda nada y
        no envía nada a Nexo. El polling calcula el precio del flete y de los conexos en pesos y lo convierte con esa TRM
        (`round(precio_cop / trm, 2)`); el costo sigue en COP. El PDF lleva la nota de TRM mínima con la `trm_aplicada`.
        Depende de #50 (PR #96, `clsFijacionMonedaService` y la nota del PDF), que todavía no está en `QA`.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCosteoWeb'
      responses:
        '201':
          description: Cotización creada; `estado_costeo` dice si Nexo recibió la solicitud
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionResumen'
        '400':
          description: |
            `SOLICITUD_COSTEO_INVALIDA` (campo obligatorio, largo o rango fuera de los límites de Nexo, más de 200
            posiciones, o la regla de peso de Nexo: `detalle.motivo` = `PESO_REQUERIDO` si la línea no trae peso > 0 ni
            posiciones con peso, `PESO_INCONSISTENTE` si el peso difiere más del 1 % de `sum(cantidad × peso_kg)`), `MARGEN_LINEA_DESCONOCIDA` (la línea no existe o está inactiva) o `FOLIO_CONSECUTIVO_AGOTADO`.
            Con `moneda = USD` (HU-013.7): `TRM_NO_DISPONIBLE` si ninguna fuente de la TRM respondió; `moneda` con otro valor
            es `SOLICITUD_COSTEO_INVALIDA` (el mensaje nombra el campo `moneda`).
            Nada queda guardado. `ErrorWeb` si el cuerpo no es JSON válido.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
        '401':
          $ref: '#/components/responses/SesionExpirada'

  /web/cotizaciones/{folio}/costeo/reintentar:
    post:
      operationId: reintentarCosteo
      tags: [web]
      summary: Reenvía a Nexo la solicitud guardada de una cotización que no llegó
      description: |
        HU-005.5. Nunca si la cotización ya tiene resultado (`ganada` con valor). Solo desde `estado_costeo` `error_envio` (salvo un rechazo 400 de Nexo, que es definitivo: el
        motivo empieza por "Rechazo definitivo de Nexo") o `pendiente_envio`; reenvía el formulario y las posiciones
        guardados (no hace falta volver a llenarlos). Mismo resultado que el envío: 200 con la cotización en
        `pendiente_costeo`/`autocosteo`, o de nuevo en `error_envio` con el motivo. Si el motivo anterior era
        "tiempo agotado", Nexo pudo haber creado la solicitud: el comercial debe verificar antes de reintentar
        (pendiente de confirmar con el equipo de Nexo una clave de idempotencia). Solo el dueño.
        HU-013.4: `POST .../costeo/re-solicitar` lo amplía (también costeo vencido o entregado, y con cambios de carga);
        este endpoint se conserva por compatibilidad.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
      responses:
        '200':
          description: Reenvío intentado; `estado_costeo` dice si Nexo lo recibió
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionResumen'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '409':
          description: '`COSTEO_NO_REINTENTABLE`: la cotización no está en `error_envio` ni en `pendiente_envio`, o no nació del formulario ampliado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'

  /web/cotizaciones/{folio}/resultado:
    post:
      operationId: marcarResultado
      tags: [web]
      summary: Marca la cotización como ganada o perdida en Nexo y en Cotifly
      description: |
        HU-005.14 (ADR-015 §6); reemplaza a `/seguimiento` para las cotizaciones que pasaron por Nexo. Dos escrituras:
        primero `POST /api/cotizaciones/{id}/resultado` de Nexo (`{id}` = la cotización de Nexo de la solicitud) y,
        **solo si Nexo responde 200**, `ganada` y `motivo_rechazo` (= `motivo`) en Cotifly. `comentario` se reenvía a
        Nexo y no se guarda en Cotifly. `409` de Nexo (`RESULTADO_YA_DEFINIDO`, `COTIZACION_NO_ENTREGADA`) o Nexo caído
        (`503`) no cambian nada local; el frontend puede deshabilitar el botón cuando `ganada` ya tiene valor.

        Entrega implícita: si Nexo entrega la cotización al marcar el resultado, `estado_costeo` salta a `entregada`
        aunque estuviera en `autocosteo` o `pendiente_costeo`; es un estado válido. Desde su issue #171, Nexo exige que la
        cotización esté entregada y responde `COTIZACION_NO_ENTREGADA` si sigue en borrador (pendiente de confirmar con
        el equipo de Nexo). Solo el dueño.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResultadoWeb'
      responses:
        '200':
          description: Resultado registrado en Nexo y en Cotifly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionResumen'
        '400':
          description: '`resultado` que no es `ganada`/`perdida` o `motivo`/`comentario` fuera de los límites de Nexo (100 y 500) (`ErrorWeb`); `COSTEO_NEXO_RECHAZADA` si Nexo responde otro 4xx (`ErrorNegocio`, código de Nexo en `detalle.motivo`); sin cambio local'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorWeb'
                  - $ref: '#/components/schemas/ErrorNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '409':
          description: |
            Sin cambio local. De Nexo: `RESULTADO_YA_DEFINIDO`, `COTIZACION_NO_ENTREGADA` (también sin llamar a Nexo si el
            costeo no está en `autocosteo` ni `entregada`) y `SOLICITUD_NO_TRANSICIONABLE`. De Cotifly: `COSTEO_NO_LISTO`
            (chat, descartada o costeo vencido, que se marcan con `/seguimiento`; o todavía no enviada a Nexo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '503':
          description: '`COSTEO_NEXO_NO_DISPONIBLE` (también si Nexo responde 401/403: identidad o rol del comercial en Nexo, es configuración) o `COSTEO_NEXO_TIEMPO_AGOTADO`; sin cambio local'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'

  /web/cotizaciones/{folio}/costeo:
    get:
      operationId: obtenerCosteo
      tags: [web]
      summary: Estado del costeo en Nexo, precio final y servicios conexos de la cotización
      description: |
        HU-005.7 (ADR-015 §5). Solo precios: el costo bruto de Nexo nunca se muestra (ni aquí ni en "Mis
        cotizaciones"); `precio_final` y el `precio` de cada servicio conexo salen del módulo de Precio con el margen
        de la cotización (resuelto al enviarla: SAP TM con el BP o la política de la línea). `precio_final` es `null`
        mientras no haya costeo. Solo el dueño.

        HU-013 (ADR-018): trae además `margen_sugerido` y `origen_margen` (botón de ajuste de margen, HU-013.2),
        `trm_aplicada` (HU-013.7), `textos` (asunto e introducción del PDF, HU-013.5), `pdf_desactualizado` (ADR-018 §11)
        y `row_version` (#98), que también va en
        el encabezado `ETag`. Son opcionales en el esquema hasta que cada issue los implemente.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
      responses:
        '200':
          description: Costeo de la cotización
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CosteoCotizacion'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'

  /web/cotizaciones/{folio}/costeo/margen:
    put:
      operationId: ajustarMargenCosteo
      tags: [web]
      summary: Ajusta el margen de la cotización y recalcula el precio del flete y de los conexos
      x-issue: '#98 (HU-013.2; entrega el script 0006)'
      description: |
        HU-013.2 (ADR-018 §3). Es el endpoint que ejecuta el botón de ajuste de margen y el Confirmar de la acción
        propuesta `ajustar_margen` del asistente.

        - `margen` es libre entre 0 y 0,99 (fracción: 0.18 = 18 %). Fuera de rango: 400 `AJUSTE_MARGEN_INVALIDO`.
        - `justificacion` es **obligatoria** si `margen` queda por debajo del margen sugerido (`margen_sugerido` del
          costeo: SAP TM con el BP o la política de la línea). Sin ella: 400 `JUSTIFICACION_REQUERIDA`.
        - Solo con costo disponible (`autocosteo` o `entregada` con `precio_final`; si no, 409 `COSTEO_NO_LISTO`).
        - **Regla del PDF (ADR-018 §11):** si la cotización ya se envió al cliente (`estado_envio` distinto de
          `sin_enviar`) o tiene resultado, 409 `PDF_YA_ENVIADO` (la `detalle` indica crear la versión `-vN`). Si no, se
          permite aunque haya PDF: el PDF actual queda invalidado (`pdf_url = null`, `pdf_desactualizado = true`, el
          anterior queda en el historial) y se regenera con `POST .../costeo/pdf`.
        - Recalcula con `IClsPrecioService` el `precio_final` y el precio de cada servicio conexo, con el método de
          cálculo de la cotización, respetando la moneda y la TRM ya fijada (`trm_aplicada`, nunca una TRM nueva).
        - Registra el ajuste en `MargenAjustes` (margen sugerido = `margenPolitica`, nuevo margen = `margenAplicado`,
          `diferencia`, usuario y justificación en `motivo`). `origen_margen` pasa a `negociado`. Las métricas de ajustes
          marcan los que quedan por debajo del sugerido.
        - Ajustar al mismo margen vigente responde 200 sin registrar un ajuste nuevo ni invalidar el PDF (idempotente).
        - `If-Match` **obligatorio** (428 `PRECONDICION_REQUERIDA` sin él; 409 `CONFLICTO_CONCURRENCIA` si no coincide).
          Solo el dueño.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
        - $ref: '#/components/parameters/IfMatchObligatorio'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AjusteMargenWeb'
            example:
              margen: 0.12
              justificacion: "Cliente estratégico; competencia cotizó 8 % por debajo."
      responses:
        '200':
          description: Margen ajustado y precios recalculados
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CosteoCotizacion'
        '400':
          description: '`AJUSTE_MARGEN_INVALIDO` (fuera de 0 a 0,99) o `JUSTIFICACION_REQUERIDA` (`ErrorNegocio`); `ErrorWeb` si el cuerpo no es JSON válido'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
              example:
                error:
                  codigo: JUSTIFICACION_REQUERIDA
                  mensaje: "El margen 12 % queda por debajo del sugerido (15 %): escribe la justificación."
                  detalle:
                    margen_sugerido: 0.15
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '409':
          description: '`COSTEO_NO_LISTO`, `PDF_YA_ENVIADO` (ya enviada o con resultado) o `CONFLICTO_CONCURRENCIA`; sin cambios'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
              example:
                error:
                  codigo: PDF_YA_ENVIADO
                  mensaje: "La cotización ya se envió al cliente: crea una versión nueva para cambiarla."
                  detalle:
                    accion: nueva_version
                    metodo: POST
                    endpoint: /web/cotizaciones/PCN-900555111-DG-05102026-001/costeo/re-solicitar
                    cuerpo:
                      motivo: "Ajuste de margen después del envío"
                      nueva_version: true
        '428':
          $ref: '#/components/responses/PrecondicionRequerida'

  /web/cotizaciones/{folio}/costeo/re-solicitar:
    post:
      operationId: reSolicitarCosteo
      tags: [web]
      summary: Vuelve a pedir el costeo a Nexo ("Cotizar costo"), en el mismo folio o en una versión nueva
      x-estado: pendiente
      x-issue: '#100 (HU-013.4)'
      description: |
        HU-013.4 (ADR-018 §5). Amplía `POST .../costeo/reintentar`. Es el endpoint del botón "Cotizar costo", del
        Confirmar de la acción propuesta `re_solicitar_costeo` y de la "versión nueva" que pide `PDF_YA_ENVIADO`.

        **Mismo folio** (sin `datos_carga` y sin `nueva_version`):
        - Permitido si `estado_costeo` es `costeo_vencido`, `entregada` o `error_envio`; en otro estado, 409
          `ESTADO_NO_PERMITE`. Si la cotización ya se envió al cliente o tiene resultado, 409 `PDF_YA_ENVIADO` (con
          `detalle.cuerpo.nueva_version = true`).
        - Se reenvía la misma cotización a Nexo. Responde **200** con la cotización en `pendiente_costeo` (o
          `autocosteo` si Nexo costea en la misma petición) y el polling se reanuda. Invalida el PDF actual
          (`pdf_desactualizado`). Desde `error_envio` equivale a `reintentar`.

        **Versión nueva** (con `datos_carga`, o con `nueva_version: true` sin cambios de carga):
        - Permitida en cualquier estado salvo con un costeo en curso (`pendiente_envio` o `pendiente_costeo`: 409
          `ESTADO_NO_PERMITE`), también si la cotización ya se envió o tiene resultado.
        - Crea `{folio base}-vN` (ADR-011) con el formulario de la vigente y los cambios de carga, si los hay, y la envía a
          Nexo como solicitud nueva; la versión anterior se conserva sin cambios. Responde **201** con la versión nueva y
          `Location` a su costeo.

        Comunes:
        - Si Nexo falla, igual que el alta: la cotización (o la versión nueva) queda en `error_envio` con el motivo.
        - Queda auditado (`EventosHerramienta`, `costeo_nexo_re_solicitud`) con el motivo y el usuario.
        - `If-Match` **obligatorio** (428 / 409). `Idempotency-Key` opcional: un doble clic con la misma clave devuelve la
          respuesta de la primera petición y no crea `-v2` y `-v3` ni reenvía a Nexo dos veces.
        - El mecanismo en Nexo para "reenviar la misma" está pendiente (`docs/HU-013-preguntas-nexo.md`). Solo el dueño.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
        - $ref: '#/components/parameters/IfMatchObligatorio'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReSolicitudCosteoWeb'
            example:
              motivo: "El cliente cambió el peso de la carga"
              datos_carga:
                peso_kg: 28000
                tipo_vehiculo: "3S3"
      responses:
        '200':
          description: Reenviada a Nexo con el mismo folio; `estado_costeo` dice si Nexo la recibió
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionResumen'
        '201':
          description: Versión nueva creada (`folio` con `-vN`) y enviada a Nexo; la anterior se conserva
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              description: '`/web/cotizaciones/{folio nuevo}/costeo`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionResumen'
        '400':
          description: '`SOLICITUD_COSTEO_INVALIDA` (`motivo` vacío o largo, `datos_carga` vacío, fuera de los límites de Nexo o incoherente, reglas de peso) (`ErrorNegocio`); `ErrorWeb` si el cuerpo no es JSON válido. Nada cambia'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '409':
          description: '`ESTADO_NO_PERMITE` (estado del costeo), `PDF_YA_ENVIADO` (mismo folio tras el envío o con resultado) o `CONFLICTO_CONCURRENCIA`; sin cambios. La versión nueva reutiliza el folio base, así que no consume consecutivo'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '428':
          $ref: '#/components/responses/PrecondicionRequerida'

  /web/servicios-conexos:
    get:
      operationId: buscarServiciosConexos
      tags: [web]
      summary: Catálogo de servicios conexos de Nexo (sin costos)
      x-estado: pendiente
      x-issue: '#99 (HU-013.3)'
      description: |
        HU-013.3 (ADR-018 §4). Consulta `GET {Nexo:UrlBase}/api/servicios-conexos?soloActivos=true&q=&categoria=&page=&pageSize=`
        con la identidad del comercial y devuelve solo servicios activos, **sin `costoUnitario`** (Nexo es la fuente de
        verdad del costo; Cotifly solo expone precios con margen, y solo de los conexos ya agregados a una cotización).
        Lo usan el buscador del detalle de la cotización y la herramienta `buscar_servicio_conexo` del asistente.
      security:
        - bearer: []
      parameters:
        - name: q
          in: query
          required: false
          description: Texto a buscar en el nombre (tipo de servicio) o en el código. Vacío = todos.
          schema:
            type: string
            maxLength: 100
        - name: categoria
          in: query
          required: false
          description: Segmento del catálogo de Nexo (`logistico` o `adicional`).
          schema:
            type: string
            maxLength: 20
          example: logistico
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Página del catálogo (puede venir vacía)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaServiciosConexos'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '403':
          description: '`NEXO_SIN_PERMISO`: Nexo respondió 403 al comercial (rol en Nexo)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '503':
          description: '`NEXO_NO_DISPONIBLE`: Nexo sin configurar, caído, sin respuesta a tiempo o el comercial sin `idUsuarioExterno`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'

  /web/cotizaciones/{folio}/costeo/servicios-conexos:
    post:
      operationId: agregarServiciosConexos
      tags: [web]
      summary: Agrega servicios conexos del catálogo a la cotización en Nexo
      x-estado: pendiente
      x-issue: '#99 (HU-013.3)'
      description: |
        HU-013.3 (ADR-018 §4). Es el endpoint del botón "Agregar conexo" y del Confirmar de la acción propuesta
        `agregar_servicios_conexos`. Los conexos se agregan **en Nexo**, que es la fuente de verdad del costo:

        1. `POST {Nexo:UrlBase}/api/cotizaciones/{cotizacionNexoId}/conexos` con
           `{items: [{lineaId, servicioConexoId, cantidad}]}` (`clsAgregarConexosRequest` / `clsConexoItemRequest` del
           swagger de Nexo; `lineaId` y `servicioConexoId` obligatorios, `cantidad` de 0,01 a 999.999,99). `lineaId` es la
           línea de la cotización de Nexo que corresponde a `linea_orden` (ver `ConexoAgregarWeb`). Cotifly **nunca**
           envía `valorAplicado`: si no viaja, Nexo lo calcula como valor base × cantidad (Nexo es la fuente de verdad del
           costo). Roles de Nexo para este endpoint: `Comercial`, `CoordinadorFletes` y `Admin` (leído del código de
           Nexo, `docs/HU-005.1-mapeo-campos-nexo.md`; el swagger no lo declara).
        2. Lee de nuevo la cotización de Nexo (`GET /api/cotizaciones/{id}`), aplica el margen de la cotización a cada
           conexo con `IClsPrecioService` y los deja `incluido = true`.

        - `items` de 1 a 20 (vacío o más de 20: 400 `ErrorWeb` por el esquema, sin llamar a Nexo), cada uno con
          `linea_orden`, `servicio_id` del catálogo (`GET /web/servicios-conexos`) y `cantidad` de 0,01 a 999.999,99. Una
          `linea_orden` que no existe en la cotización: 400 `CONEXO_INVALIDO` sin llamar a Nexo.
        - Una línea que existe pero todavía no tiene línea en la cotización de Nexo (sin flete, o sin el id de la línea de
          la cotización de Nexo guardado): 409 `LINEA_SIN_COTIZACION_NEXO`, sin llamar a Nexo. #99 debe guardar ese id
          (`clsCotizacionLineaDto.id`) junto a `lineaSolicitudId` en `clsLineaCosteoNexo`
          (`Cotifly.Dominio/Cotizaciones/clsCosteoConsultadoNexo.cs`) al leer la cotización.
        - Solo con costeo disponible (409 `COSTEO_NO_LISTO`). Regla del PDF (ADR-018 §11): ya enviada o con resultado, 409
          `PDF_YA_ENVIADO`; si no, invalida el PDF actual (`pdf_desactualizado`). Una licitación responde 409
          `ESTADO_NO_PERMITE` con `detalle.motivo = LICITACION` (su PDF de pliego no imprime conexos, ADR-017 §6).
        - Nexo 400 o 404 del servicio: 400 `CONEXO_INVALIDO` (el código de Nexo en `detalle.motivo`); 403:
          `NEXO_SIN_PERMISO`; caído o sin respuesta: 503 `NEXO_NO_DISPONIBLE`. En todos esos casos nada cambia en Cotifly.
        - Si Nexo lo agregó pero la relectura falla, responde 503 `NEXO_NO_DISPONIBLE` con `detalle.agregado_en_nexo =
          true`; Cotifly no reintenta el POST y el polling recoge el conexo en la siguiente consulta.
        - Si el conexo queda costeado de inmediato o pasa por Servicios Logísticos está pendiente de confirmar con Nexo.
        - `If-Match` **obligatorio** (428 / 409). `Idempotency-Key` opcional: un doble clic con la misma clave devuelve la
          respuesta de la primera petición sin volver a llamar a Nexo (el POST de Nexo no es idempotente). Solo el dueño.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
        - $ref: '#/components/parameters/IfMatchObligatorio'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgregarServiciosConexosWeb'
            example:
              items:
                - linea_orden: 1
                  servicio_id: "6f1c2a9e-3b7d-4c55-9a0e-1d2f3a4b5c6d"
                  cantidad: 2
      responses:
        '200':
          description: Conexos agregados en Nexo e incluidos con su precio
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CosteoCotizacion'
        '400':
          description: '`CONEXO_INVALIDO` (`ErrorNegocio`); `ErrorWeb` si el cuerpo no es JSON válido o no cumple el esquema (`items` vacío o con más de 20)'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '403':
          description: '`NEXO_SIN_PERMISO`: Nexo respondió 403 (el comercial no tiene `Comercial`, `CoordinadorFletes` ni `Admin` en Nexo)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '409':
          description: '`COSTEO_NO_LISTO`, `LINEA_SIN_COTIZACION_NEXO`, `PDF_YA_ENVIADO`, `ESTADO_NO_PERMITE` (`detalle.motivo = LICITACION`) o `CONFLICTO_CONCURRENCIA`; sin cambios'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '428':
          $ref: '#/components/responses/PrecondicionRequerida'
        '503':
          description: '`NEXO_NO_DISPONIBLE` (con `detalle.agregado_en_nexo = true` si solo falló la relectura)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
    put:
      operationId: seleccionarServiciosConexos
      tags: [web]
      summary: Elige qué servicios conexos del costeo se incluyen en el precio y en el PDF
      description: |
        HU-005.7. `incluidos` son los ids de `servicios_conexos` que van en el PDF; los demás quedan excluidos. Solo
        mientras la cotización tenga precio. Solo el dueño.

        Desde HU-013.2 (ADR-018 §11, #98, script `0006`): con PDF ya generado se permite e invalida el PDF
        (`pdf_url = null`, `pdf_desactualizado = true`, el anterior queda en el historial) en lugar de responder
        `PDF_YA_GENERADO`; ya enviada o con resultado responde 409 `PDF_YA_ENVIADO` (con la `detalle` para crear `-vN`).
        La misma selección vigente responde 200 sin invalidar nada. `If-Match` es obligatorio (428
        `PRECONDICION_REQUERIDA`; 409 `CONFLICTO_CONCURRENCIA` si no coincide) y la respuesta trae `ETag`.
        Excluir un conexo no lo borra en Nexo (no hay DELETE de conexos, pregunta abierta con Nexo).
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
        - $ref: '#/components/parameters/IfMatchObligatorio'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeleccionServiciosConexos'
      responses:
        '200':
          description: Selección guardada
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CosteoCotizacion'
        '400':
          description: '`SOLICITUD_COSTEO_INVALIDA`: algún id no es un servicio conexo del costeo'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '409':
          description: '`COSTEO_NO_LISTO` (todavía sin precio), `PDF_YA_ENVIADO` (ya enviada o con resultado) o `CONFLICTO_CONCURRENCIA`; sin cambios'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '428':
          $ref: '#/components/responses/PrecondicionRequerida'

  /web/cotizaciones/{folio}/costeo/textos/redactar:
    post:
      operationId: redactarTextosCosteo
      tags: [web]
      summary: La IA redacta el asunto y la introducción del PDF (con el texto estándar de respaldo)
      x-estado: pendiente
      x-issue: '#101 (HU-013.5; requiere el 0006 de #98)'
      description: |
        HU-013.5 (ADR-018 §2a). Sin cuerpo. El redactor (`IClsRedactorCotizacion`) **recibe** solo: cliente, línea de
        negocio, origen y destino, tipo de vehículo, nombres de los conexos incluidos, moneda y nombre del comercial.
        **Nunca recibe** costos, margen ni precios.

        - Tiempo máximo de 15 s. Si la IA tarda, falla, o su salida trae montos, URL o correos, o pasa de 120 caracteres
          (asunto) o 900 (introducción), se descarta y se usan los textos de `clsTextosEstandar`: responde igual **200**
          con `fuente = estandar`. Nunca responde error por la IA.
        - Guarda el resultado en `Cotizaciones.textosCotizacion` y lo audita (proveedor, modelo, duración y si se usó el
          respaldo). Si los textos guardados fueron editados por el comercial (`editado = true`), responde 409
          `TEXTOS_EDITADOS` sin llamar a la IA, salvo con `?sobrescribir=true`.
        - Regla del PDF (ADR-018 §11): ya enviada o con resultado, 409 `PDF_YA_ENVIADO`; si no, invalida el PDF actual.
        - `If-Match` **obligatorio** (428 / 409). Solo el dueño.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
        - $ref: '#/components/parameters/IfMatchObligatorio'
        - name: sobrescribir
          in: query
          required: false
          description: '`true` reemplaza textos editados por el comercial (el frontend lo pide tras confirmar con él).'
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Textos redactados (o estándar) y guardados
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextosCotizacion'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '409':
          description: '`TEXTOS_EDITADOS`, `PDF_YA_ENVIADO` o `CONFLICTO_CONCURRENCIA`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '428':
          $ref: '#/components/responses/PrecondicionRequerida'

  /web/cotizaciones/{folio}/costeo/textos:
    put:
      operationId: editarTextosCosteo
      tags: [web]
      summary: El comercial edita el asunto y la introducción del PDF
      x-estado: pendiente
      x-issue: '#101 (HU-013.5; requiere el 0006 de #98)'
      description: |
        HU-013.5 (ADR-018 §2a). Guarda los textos que escribió el comercial (`editado = true`; `fuente` conserva el origen
        del texto que editó, o `estandar` si no había). Mismos límites que el redactor: asunto de 1 a 120 caracteres e
        introducción de 1 a 900, sin URL ni correos (400 `TEXTOS_COTIZACION_INVALIDOS`). Los montos sí se permiten: los
        escribe el comercial, no la IA. Regla del PDF (ADR-018 §11): ya enviada o con resultado, 409 `PDF_YA_ENVIADO`; si
        no, invalida el PDF actual. `If-Match` **obligatorio** (428 / 409). Solo el dueño.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
        - $ref: '#/components/parameters/IfMatchObligatorio'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextosCotizacionWeb'
      responses:
        '200':
          description: Textos guardados
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextosCotizacion'
        '400':
          description: '`TEXTOS_COTIZACION_INVALIDOS` (`ErrorNegocio`); `ErrorWeb` si el cuerpo no es JSON válido'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '409':
          description: '`PDF_YA_ENVIADO` o `CONFLICTO_CONCURRENCIA`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '428':
          $ref: '#/components/responses/PrecondicionRequerida'

  /web/cotizaciones/{folio}/costeo/pdf:
    post:
      operationId: generarPdfCosteo
      tags: [web]
      summary: Genera el PDF de la cotización con el precio sobre el costeo de Nexo
      description: |
        HU-005.7, módulo PDF de HU-003.5. El payload lo arma el servidor desde la cotización: una fila con origen,
        destino, vehículo y `precio_final`, y solo los servicios conexos incluidos, cada uno con su precio. Una sola
        vez por cotización (para cambiarla, versión nueva). Solo el dueño. Desde HU-013 (ADR-018 §11, #98) se puede
        regenerar cuando `pdf_desactualizado = true` (el anterior queda en el historial); con el PDF vigente sigue
        respondiendo `PDF_YA_GENERADO` y, ya enviada o con resultado, `PDF_YA_ENVIADO`.

        HU-011.5 (ADR-017 §6): una licitación (aunque tenga una sola línea) o una cotización de dos o más líneas sale con el
        layout de pliego: resumen con una fila por ruta (número, ruta, vehículo y peso, tarifa) y el total del pliego sin
        servicios conexos, y luego una tabla por origen. Con más de 60 rutas o más de 20 orígenes solo trae el resumen
        (hasta 1000 rutas). Solo cuando todas las líneas tienen precio y el total es su suma (si no, `COSTEO_NO_LISTO`).
        En USD responde `PDF_PAYLOAD_INVALIDO` hasta integrar la TRM al costeo. Nunca imprime costos de Nexo.

        HU-013 (ADR-018): es el único generador de PDF (el chat ya no arma payloads). Desde HU-013.5 imprime el asunto y
        la introducción guardados en `textos` (o los de `clsTextosEstandar` si no hay); nunca llama a la IA, así que el
        PDF siempre sale. Desde HU-013.7 la cotización del formulario en USD imprime las tarifas en `US$` y la nota de
        TRM mínima con su `trm_aplicada`. Acepta `If-Match` opcional (desde el `0006` de #98: si viene y no coincide, 409
        `CONFLICTO_CONCURRENCIA`). Al regenerar un PDF desactualizado, el anterior se archiva en el almacén como
        `{folio}-hN.pdf` (queda en el historial) y el nuevo conserva el nombre `{folio}.pdf`.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '201':
          description: PDF generado y registrado
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalidaPdf'
        '400':
          description: Error del módulo PDF (`PDF_PAYLOAD_INVALIDO`, `PDF_RENDER_NO_DISPONIBLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '409':
          description: '`COSTEO_NO_LISTO`, `PDF_YA_GENERADO` (PDF vigente), `PDF_YA_ENVIADO` o `CONFLICTO_CONCURRENCIA`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'

  /web/licitaciones/analizar-excel:
    post:
      operationId: analizarExcelLicitacion
      tags: [web]
      summary: Analiza el Excel del pliego en Nexo para mapear sus columnas (no guarda nada)
      description: |
        HU-011.2 (ADR-017, `docs/HU-011-formato-excel-licitacion.md`). Cotifly no impone plantilla: reenvía el archivo a
        `POST {Nexo:UrlBase}/api/captura-solicitudes/analizar-excel` con la identidad del comercial y devuelve las hojas con
        su fila de encabezado, los encabezados y hasta 1000 filas como texto, para que el frontend mapee las columnas a los
        campos destino. Ni Nexo ni Cotifly guardan el archivo en este paso. `multipart/form-data` con el campo `archivo`
        (`.xlsx` o `.xlsm`, máximo 10 MB). El cuerpo completo de `/web/licitaciones*` admite hasta
        `SeguridadHttp:LimiteCuerpoLicitacionBytes` (12 MB por defecto; 413 al pasarlo).
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Hojas analizadas por Nexo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalisisExcel'
        '400':
          description: |
            `ARCHIVO_REQUERIDO` (falta o vacío), `FORMATO_NO_SOPORTADO` (otra extensión), `ARCHIVO_DEMASIADO_GRANDE` (más de
            10 MB), y de Nexo `EXCEL_INVALIDO` (no se pudo leer) o `EXCEL_SIN_DATOS` (ninguna hoja con tabla).
            `COSTEO_NEXO_RECHAZADA` para otro 4xx de Nexo. Un 413 de Nexo también es `ARCHIVO_DEMASIADO_GRANDE`: Cotifly acepta
            hasta 10 MB menos 64 KB para que el archivo con el sobre multipart quepa en el límite de 10 MB de Nexo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '403':
          description: '`NEXO_SIN_PERMISO`: Nexo respondió 403 (el comercial no tiene el rol de Cabina de Fletes que pide el análisis)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '413':
          description: El cuerpo supera `SeguridadHttp:LimiteCuerpoLicitacionBytes` (12 MB por defecto)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'
        '503':
          description: '`COSTEO_NEXO_NO_DISPONIBLE` o `COSTEO_NEXO_TIEMPO_AGOTADO`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'

  /web/licitaciones:
    post:
      operationId: crearLicitacion
      tags: [web]
      summary: Crea la licitación con sus líneas mapeadas y la envía a Nexo como una sola solicitud
      description: |
        HU-011.2 (ADR-017). Valida **todas** las filas antes de guardar nada (reporte por fila). Si son válidas, crea la
        cotización `licitacion` (folio del servidor con el NIT, ADR-011) con sus N líneas, sus posiciones y el Excel original
        en `pendiente_envio`, la confirma y la envía a Nexo (`POST /api/captura-solicitudes`) como una sola solicitud con N
        líneas, con el mismo mecanismo de `POST /web/solicitudes-costeo`: responde **201 aunque Nexo falle** (queda en
        `error_envio` y se reintenta con `POST /web/cotizaciones/{folio}/costeo/reintentar`). El polling (HU-005.6) deriva el
        estado y el precio de cada línea.

        Dos formas de cuerpo: `multipart/form-data` con la parte `licitacion` (JSON `LicitacionWeb`) y, opcional, la parte
        `archivo` (el Excel original, para exportarlo después con los precios, HU-011.3); o `application/json` con el
        `LicitacionWeb` sin archivo. Con archivo, `hoja` y la `fila` de cada línea son obligatorias y se verifican contra el
        archivo con la misma regla de detección de Nexo.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [licitacion]
              properties:
                licitacion:
                  type: string
                  description: JSON `LicitacionWeb`.
                archivo:
                  type: string
                  format: binary
          application/json:
            schema:
              $ref: '#/components/schemas/LicitacionWeb'
      responses:
        '201':
          description: Licitación creada; `estado_costeo` dice si Nexo recibió la solicitud
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Licitacion'
        '400':
          description: |
            `ReporteLicitacionInvalida` (`LICITACION_INVALIDA` con todas las filas que fallaron; nada queda guardado), o
            `ErrorNegocio` (`ARCHIVO_REQUERIDO`, `FORMATO_NO_SOPORTADO`, `ARCHIVO_DEMASIADO_GRANDE`, `EXCEL_INVALIDO`,
            `EXCEL_SIN_DATOS` si la hoja no existe, `EXCEL_INVALIDO` también con más de 10.000 rangos combinados, `MARGEN_LINEA_DESCONOCIDA` (la
            línea no existe, o está inactiva: `detalle.motivo` lo dice), `FOLIO_CONSECUTIVO_AGOTADO`). `ErrorWeb` si el cuerpo no
            es JSON válido. Si Nexo responde 403 al alta, la licitación queda igual en `error_envio` con el motivo
            `NEXO_SIN_PERMISO` (201).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReporteLicitacionInvalida'
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '413':
          description: El cuerpo (Excel + JSON) supera `SeguridadHttp:LimiteCuerpoLicitacionBytes` (12 MB por defecto)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'

  /web/licitaciones/{folio}:
    get:
      operationId: obtenerLicitacion
      tags: [web]
      summary: Estado y precio de cada línea de la licitación
      description: |
        HU-011.2. Solo precios con margen (nunca el costo de Nexo). Sirve para el polling de la pantalla: una línea sin flete
        tiene `precio_final = null`. Solo el dueño.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
      responses:
        '200':
          description: La licitación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Licitacion'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'

  /web/licitaciones/{folio}/excel:
    get:
      operationId: exportarExcelLicitacion
      tags: [web]
      summary: Descarga el Excel de la licitación con los precios de Cotifly
      description: |
        HU-011.3 (ADR-017 §5). Regenera el Excel original del cliente **sin modificar sus columnas** y agrega, a la derecha de
        la última columna usada de la hoja mapeada, `Precio final Cotifly ({moneda})` (precio con margen; COP sin decimales,
        USD con dos, ADR-014), `Estado costeo Cotifly` y `Servicios conexos Cotifly` en la fila de cada línea. Las líneas sin
        costeo llevan `SIN COSTEO` con fondo amarillo; las filas del pliego que no se enviaron, `Sin enviar`. Agrega la hoja
        `Resumen Cotifly` (folio, cliente, moneda y TRM si es USD, total, líneas sin costeo y servicios conexos incluidos con su
        precio). Sin archivo original genera una hoja `Licitación` con los campos mapeados. **Nunca incluye el costo de Nexo.**
        Se puede exportar en cualquier momento. Siempre un `.xlsx` real: un `.xlsm` se convierte sin macros, y gráficos,
        imágenes o tablas dinámicas del original pueden perderse. El total del resumen es sin servicios conexos. `Sin enviar`
        solo marca filas entre la primera y la última línea enviada. Solo el dueño y solo licitaciones (404 si no).
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
      responses:
        '200':
          description: 'El Excel con los resultados (`Content-Disposition` attachment, nombre `{folio}.xlsx`)'
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          description: '`EXCEL_INVALIDO` o `EXCEL_SIN_DATOS` si el original guardado ya no se puede leer'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'

  /web/clientes/{nit}/destinatarios-previos:
    get:
      operationId: obtenerDestinatariosPrevios
      tags: [web]
