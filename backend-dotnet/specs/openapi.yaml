openapi: 3.0.3
info:
  title: Cotifly API
  version: 1.0.0
  license:
    name: Propietario — Botero Soto Soluciones Logísticas
  description: |
    Contrato congelado de la API de Cotifly (HU-004.1, issue #17) que consume el módulo
    Angular de ClientePro (HU-004) y que implementa el backend .NET 10 (HU-003).

    Convenciones:
    - Todo `/web/*` usa nombres de campo snake_case (los heredados del backend Python
      y los nuevos), para que el frontend no mezcle convenciones.
    - `/api/auth/*` usa los nombres que define el patrón "Login SSO — Cliente Pro"
      (`idUsuario`, `debeCambiarPassword`), que ya produce el frontend de ClientePro.
    - Las operaciones marcadas con `x-estado: borrador` no están congeladas.
    - Dos formas de error. `ErrorWeb` (`{"error": "texto"}`, sin código): todo `/api/auth/*` y, en `/web/*`, el 401, el 403
      de rol, el 404 (no existe o no es tuya), el 413, el 415, el 429 y el 400 de validación del cuerpo (`Cuerpo inválido...`,
      `CORREO_INVALIDO`, teléfono, seguimiento, `Idempotency-Key` fuera de largo). `ErrorNegocio`
      (`{"error": {"codigo", "mensaje", "detalle?"}}`): el resto de errores de negocio de `/web/*`, que son la mayoría (400 con
      código, 409 de estado, `CONFLICTO_CONCURRENCIA` e `IDEMPOTENCY_KEY_REUTILIZADA`, 428 `PRECONDICION_REQUERIDA`, 403 `NEXO_SIN_PERMISO` y `REGIONAL_NO_PERMITIDA`, los 503 de
      dependencias y el 500 `ERROR_INTERNO`, respuesta común `ErrorInterno`; en `/api/auth/*` el 500 es `ErrorWeb`). Un mismo estado puede traer cualquiera de las dos (por ejemplo, el 400 de `POST /web/solicitudes-costeo`):
      el cliente distingue por el tipo de `error` (texto u objeto). El servidor nunca responde 412.
    - CORS (#12, deuda de #178): el navegador puede enviar `Authorization`, `Content-Type`, `If-Match` e `Idempotency-Key`
      (métodos `GET`, `POST` y `PUT`) y leer `ETag`, `Location`, `Retry-After` y `Content-Disposition`
      (`Access-Control-Expose-Headers`). Ningún otro encabezado propio pasa el preflight; no hay id de correlación.
    - Autenticación: `Authorization: Bearer <access>` emitido por
      `POST /api/auth/login-clientepro` (patrón "Login SSO — Cliente Pro"). HU-040.2 (#230, ADR-025): si la persona
      tiene varios roles, el login responde 200 `EleccionRolRequerida` (sin tokens) y el access lo emite
      `POST /api/auth/elegir-rol` con el rol elegido.
    - Las operaciones marcadas con `x-estado: pendiente` tienen el contrato acordado y todavía no
      están implementadas; `x-issue` dice qué issue las implementa. Mientras tanto la prueba de
      contrato las lista en `clsContratoRutasTests.PendientesDeImplementar` (HU-013, ADR-018).
    - **AVISO PARA EL FRONTEND (HU-021, ADR-019): `precio_final` de la cotización YA INCLUYE los servicios
      conexos.** Es la suma de las rutas, y el precio de cada ruta es su transporte (fletes, retorno y levante)
      con el margen + la venta de sus conexos SIN margen (HU-043.2, #251; antes el margen se aplicaba también a los
      conexos). NO sumarle el `precio` de los conexos: se cobrarían dos veces. El `precio` de
      cada conexo es informativo (desglose en pantalla). La excepción son la vista de la licitación
      (`Licitacion.precio_final` y `lineas[].precio_final`) y su Excel: allí cada fila es la tarifa del transporte y
      el total va sin conexos, que se listan aparte una sola vez. Tarifa + conexos = precio de la ruta, exacto. El
      PDF (de una ruta o del pliego), desde HU-033 (#199), imprime el valor final de cada ruta (conexos incluidos,
      sin desglose) y el total general "VALOR TOTAL DE LA COTIZACIÓN".
    - Concurrencia optimista (HU-013, ADR-018 §8): `GET /web/cotizaciones/{folio}/costeo` devuelve el
      encabezado `ETag` (y `row_version` en el cuerpo), y toda respuesta 200 o 201 de una mutación del
      costeo trae el `ETag` nuevo. Las mutaciones de la etapa final (margen, conexos POST y PUT,
      re-solicitar, textos y redactar), el recálculo de vehículos y la edición (`PUT .../solicitud`) EXIGEN
      `If-Match` con ese valor: sin él responden 428 `PRECONDICION_REQUERIDA`; si la cotización cambió
      entretanto, 409 `CONFLICTO_CONCURRENCIA`, sin cambios. `POST .../costeo/pdf` lo acepta opcional.
      `POST /web/solicitudes-costeo`, `POST .../costeo/servicios-conexos`, `POST .../costeo/re-solicitar`,
      `PUT .../solicitud` y las operaciones en lote de HU-041.1 (`PUT .../costeo/margen/lineas`,
      `POST .../costeo/servicios-conexos/lineas` y `.../lineas/quitar`) aceptan además `Idempotency-Key` (doble clic). `POST /web/cubicacion` no usa ninguno
      de los dos (202 con `Location` y `Retry-After` si sigue calculando). Rige desde el
      script `0006` (columna `versionNegocio`), que entrega #98 (HU-013.2). El valor es opaco: el cliente
      lo guarda y lo reenvía tal cual. Solo cambia con cambios de negocio (margen, conexos, textos,
      re-solicitud, PDF, o el polling cuando cambia el estado, el costo o el precio), no con cada consulta.
    - Regla del PDF (ADR-018 §11): mientras la cotización no se haya enviado al cliente ni tenga
      resultado, ajustar el margen, agregar o seleccionar conexos, redactar o editar los textos y
      re-solicitar en el mismo folio invalidan el PDF (`pdf_url = null`, `pdf_desactualizado = true`)
      y el comercial lo regenera. Ya enviada o con resultado: 409 `PDF_YA_ENVIADO` (versión `-vN`).
    - Pipeline determinista (ADR-018): el costo sale de Nexo, el margen sugerido de SAP TM (o de la
      política de la línea) y el precio y el PDF los calcula el código. La IA solo redacta el asunto
      y la introducción del PDF y PROPONE acciones (`accion_propuesta`) que el frontend ejecuta con
      el botón Confirmar llamando al endpoint determinista. La IA nunca escribe datos de negocio.
servers:
  - url: http://localhost:8080
    description: Desarrollo local (contenedor)

tags:
  - name: auth
    description: Login SSO desde ClientePro, refresh y logout
  - name: web
    description: Consola de cotización del comercial
  - name: admin
    description: |
      Administración de políticas de margen (roles gerente_comercial y director, HU-037) y de la sincronización del margen de
      SAP TM (HU-042.2, #243, ADR-027).
  - name: metricas
    description: |
      Tablero de métricas agregadas (HU-010.1, ADR-016). `GET /web/metricas/comercial` (las cotizaciones
      propias) y `GET /web/metricas/regional` (`gerente_comercial` o `director`, HU-037: su regional, filtrable por comercial).
      El borrador anterior (`/web/metricas/actividad` y `/web/metricas/ajustes-margen`) se retiró en HU-014.3 (#152).

      Definiciones (recalculables a mano sobre `dbo_cotifly`, ver `docs/docs_front/CONTRATO_API_WEB.md` §3.1):
      - **Unidad: la cadena de versiones.** Cadena = filas del mismo `usuarioId` con el mismo folio base (el folio sin
        el sufijo `-vN`; ADR-011: la v2+ reutiliza el folio de la v1). Cada cadena cuenta UNA vez:
        - valores (precio, costo, margen, moneda, costeo, ciudades, deadline, ajustes) de la **versión vigente** (mayor
          `version`);
        - **periodo y mes** por la **primera creación** de la cadena, `MIN(createdAt)`, en fechas de America/Bogota. Una
          cotización creada el 10 de agosto y rehecha (v2) el 3 de septiembre cuenta en agosto, con los valores de la v2;
          rehacerla no cambia periodos pasados;
        - **resultado** = el más reciente de toda la cadena (mayor `marcadoAt`; a igualdad o sin fecha, la mayor
          `version` con `ganada` no nulo). Una v1 ganada con una v2 sin marcar cuenta como ganada.
        Se cuentan todos los estados (lo mismo que lista "Mis cotizaciones").
      - **Moneda:** `valor_cop = precioFinal` si `moneda` es `COP` (o nula); `valor_cop = round(precioFinal ×
        trmAplicada, 2)` si es otra moneda (USD) con `trmAplicada > 0`. Una fila en USD con `trmAplicada = 0` no suma
        dinero. `costo` siempre está en COP y nunca se convierte. `valor_cop` NO es el `precio_cop` de ADR-014 (precio en
        pesos recalculado del costo y el margen antes de convertir, piso del PDF): pueden diferir unos pesos.
      - Partición: `cantidad = ganadas + perdidas + sin_resultado + pendientes_por_cotizar`, con `ganadas` = resultado
        ganada, `perdidas` = resultado perdida (con o sin precio), `sin_resultado` = con precio y sin resultado y
        `pendientes_por_cotizar` = sin precio y sin resultado. `versiones` = filas de esas cadenas (todas las versiones).
      - `conversion` = ganadas / cantidad (definición del backlog HU-010, "#ganadas / #totales");
        `conversion_sobre_cerradas` = ganadas / (ganadas + perdidas). Fracción de 0 a 1 con 4 decimales; `null` si el
        denominador es 0.
      - **Rutas (HU-021, decisión 8 del 2026-10-08):** los CONTEOS (`cantidad`, `ganadas`, `perdidas`…) son por
        cotización: una cotización con 3 rutas de 3 líneas de negocio cuenta 1. Los VALORES salen de sus rutas:
        `costo` = SUM(`costoFinal`) de las rutas (fletes + retorno + levante + conexos; `null` si alguna no lo tiene),
        `precioFinal` de la cabecera = SUM(`precioFinalLinea`), y el margen de la cotización = promedio de sus rutas
        ponderado por `costoFinal`. La apertura por línea de negocio (`por_linea_negocio`) es por ruta.
      - `margen_promedio` = promedio simple del margen de cada cotización (el de sus rutas ponderado por costo). HU-043.2
        (#251): el margen de una ruta se aplica solo a su transporte (fletes + retorno + levante); los servicios conexos se
        cotizan a su precio de venta, sin margen. Desde entonces `margen_promedio` mide el margen sobre el transporte, ya no
        sobre el precio completo; `margen_ponderado` y `ganancias` siguen siendo (precio − costo) e incluyen la diferencia
        entre la venta y el costo de los conexos. HU-045.2 (#264): el seguro de la mercancía (`valor_seguro` de la ruta) es un
        traslado: `margen_ponderado` y `ganancias` lo restan del precio en COP; `valor_cotizado_cop` y `valor_ganado_cop` lo incluyen.
      - `margen_ponderado` = margen agregado sobre el precio: SUM(`valor_cop` de la ruta − `costoFinal`) / SUM(`valor_cop`
        de la ruta) de TODAS las rutas del universo con costo > 0 y precio > 0 (el precio de la ruta en COP, USD × TRM).
        `null` si no hay ninguna.
      - `costeo_total` = SUM(`costo`) en COP de todas; `costeo_ganadas` = SUM(`costo`) de las ganadas.
      - `valor_cotizado_cop` = SUM(`valor_cop`); `valor_ganado_cop` = SUM(`valor_cop`) de las ganadas. Es el valor
        cotizado de las ganadas, NO dinero recaudado: en la UI, "Valor ganado (COP)".
      - `ganancias` = SUM(`valor_cop` − `costo`) de las ganadas con precio y costo. Si todas las ganadas tienen precio y
        costo y ninguna en USD tiene TRM 0, `ganancias = valor_ganado_cop − costeo_ganadas`.
      - `tiempo_promedio_cotizacion_horas` = promedio de (`costeoListoAt` − `createdAt` de la versión vigente) en horas;
        se descartan las filas con `costeoListoAt` anterior a `createdAt`.
      - `desviacion_promedio_margen` = promedio de `MargenAjustes.diferencia` (negociado − política) de los ajustes de la
        versión vigente; `desviacion_promedio_margen_abs` = promedio de su valor absoluto; `ajustes_margen` = cuántos.
      - **Margen contra la política (HU-016.1, #154, decisiones del 2026-10-27):** el margen aplicado se compara con el margen de
        política de las **mismas rutas** (`margenPoliticaSugerido`, guardado en cada ruta al cotizar), calculado en el servidor.
        Rutas comparables = las de la versión vigente, sin las rechazadas, con `margenAplicado` y `margenPoliticaSugerido`.
        **HU-016.2 (#295): además, solo de las cotizaciones FINALIZADAS** (`finalizadaAt`, script 14): mientras la cotización no se
        finaliza su margen aún puede cambiar y no debe pesar en la comparación. Sin ninguna finalizada, los cuatro márgenes son `null`
        y `rutas_sin_margen_politica` = 0. El resto del tablero (cantidad, `margen_promedio`, `margen_ponderado`, montos, serie y
        apertura por línea) sigue contando con TODAS.
        `margen_politica_promedio` = promedio simple de su política; `margen_aplicado_promedio` = promedio simple de su margen
        aplicado (las mismas rutas, para comparar simple contra simple); `margen_politica_ponderado` = SUM(política × `costoFinal`) /
        SUM(`costoFinal`) de las que tienen costo > 0; `desviacion_margen_politica` = SUM((aplicado − política) × `costoFinal`) /
        SUM(`costoFinal`) de esas mismas (el semáforo: verde ≥ 0, rojo < 0); `rutas_sin_margen_politica` = rutas con margen
        aplicado y sin política (no entran). Los márgenes son fracciones: la moneda y la TRM no los afectan.
      - `deadline_vencidas` = sin resultado y con `deadline` anterior al momento de la consulta. `null` mientras el
        esquema no tenga la columna `deadline` (script 0004).
      - `por_linea_negocio` (apertura por ruta): una fila por línea de negocio de las rutas (la de `null` agrupa las
        rutas sin línea). `cotizaciones`/`ganadas`/`perdidas` cuentan cotizaciones DISTINTAS con al menos una ruta de
        esa línea (una cotización de 3 líneas aparece en las 3 filas, así que la suma de la apertura puede superar
        `cantidad`); `rutas` cuenta rutas. Los valores son de las rutas de esa línea: `costeo_total` =
        SUM(`costoFinal`), `valor_cotizado_cop` = SUM(`valor_cop` de cada ruta), con `valor_cop` de la ruta =
        `precioFinalLinea` en COP o `round(precioFinalLinea × trmAplicada, 2)` en USD; `ganancias` = SUM(`valor_cop` −
        `costoFinal`) de las rutas de cotizaciones ganadas con precio y costo; `margen_ponderado` como arriba; y
        `ajustes_margen`/`desviacion_promedio_margen` de los `MargenAjustes` de la ruta (`lineaSolicitudId`; un ajuste sin
        ruta va a la ruta 1). Por el redondeo por ruta, la suma de `valor_cotizado_cop` de la apertura puede diferir unos
        centavos de `indicadores.valor_cotizado_cop` en USD.
      - `serie_mensual` (HU-034.1, #201): cada mes del periodo (America/Bogota, por la primera creación de la cadena) con
        los conteos y los montos de arriba (`valor_cotizado_cop`, `valor_ganado_cop`, `costeo_total`, `costeo_ganadas`,
        `ganancias`) calculados con la misma regla sobre las cotizaciones de ese mes. La suma de los meses es exactamente
        el valor de `indicadores` del mismo periodo.
      - Montos en COP con 2 decimales; redondeo half-to-even.
      - Los servicios conexos ya están en `costoFinal` de la ruta (HU-021). Las ciudades del mapa son las de la ruta 1.

      Pendiente de Nexo, NO implementado: "score de urgencia" por cotización (su contrato depende del equipo de Nexo,
      ver ADR-016).
  - name: sistema
    description: Salud del servicio y archivos PDF

paths:
  /api/auth/login-clientepro:
    post:
      operationId: loginClientePro
      tags: [auth]
      summary: Login SSO desde ClientePro (sin credenciales propias)
      description: |
        ClientePro ya autenticó a la persona. El backend revalida la identidad contra
        el almacén corporativo de solo lectura (`tblSAPUsuariosApp`, base
        `dbsolucionesti`): busca `idUsuario` como `NOMBREUSUARIO` y, si no resuelve,
        como `ID` numérico. El `NOMBREUSUARIO` de la fila encontrada (nunca el que
        envía el cliente) es la clave para ubicar o crear al usuario en `UsuariosWeb`
        (aprovisionamiento just-in-time). Luego traduce sus roles externos a roles
        internos y exige `comercial`, `gerente_comercial` o `director` (HU-037, #210).

        **HU-040.2 (#230, ADR-025), multi-rol.** La respuesta 200 tiene dos formas; el frontend las distingue por
        `requiereEleccionRol`:
        - **Un solo rol** (`LoginResponse`, sin `requiereEleccionRol`): igual que siempre, con `access` y `refresh`. Es el
          caso de quien tiene una sola asignación activa en Cotifly; si tiene varios roles externos, aplica la jerarquía
          `director` > `gerente_comercial` > `comercial` (regla auditada `precedencia_director` o `precedencia_gerente_comercial`).
        - **Varios roles** (`EleccionRolRequerida`, `requiereEleccionRol: true`): quien tiene dos o más asignaciones activas
          (o entra por primera vez con varios roles externos mapeados). NO trae tokens: trae `roles` (código y descripción),
          `user` (sin rol) y `ticketEleccion`, un ticket de UN SOLO USO que vence en 5 minutos (`ticketExpiraAt`). El
          frontend muestra el selector y llama a `POST /api/auth/elegir-rol`. Si el ticket vence, se vuelve a llamar al login.
        Cualquier falla (usuario inexistente, rol no autorizado, almacén caído) responde
        el mismo 401 genérico.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginClienteProRequest'
            example:
              idUsuario: "USR12345"
              nombreUsuario: "Nombre Apellido"
              roles: ["32"]
      responses:
        '200':
          description: |
            Sesión emitida (`LoginResponse`, un solo rol) o elección de rol pendiente (`EleccionRolRequerida`, varios roles,
            sin tokens; HU-040.2).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - $ref: '#/components/schemas/EleccionRolRequerida'
              examples:
                rolUnico:
                  summary: Un solo rol (igual que antes de HU-040)
                  value:
                    access: "eyJhbGciOiJIUzI1NiIs..."
                    refresh: "q8Jm1..."
                    user:
                      id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                      username: "JPEREZ"
                      email: "jperez@boterosoto.com.co"
                      nombre_completo: "Juan Pérez"
                      rol: comercial
                      ubicacion: "Antioquia"
                    debeCambiarPassword: false
                variosRoles:
                  summary: Varios roles (HU-040.2)
                  value:
                    requiereEleccionRol: true
                    ticketEleccion: "eyJhbGciOiJIUzI1NiIsInR5cCI6ImVsZWNjaW9uLXJvbCtqd3QifQ..."
                    ticketExpiraAt: "2026-10-27T15:05:00+00:00"
                    roles:
                      - codigo: comercial
                        descripcion: Comercial
                      - codigo: gerente_comercial
                        descripcion: Gerente comercial
                    user:
                      id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                      username: "JPEREZ"
                      nombre_completo: "Juan Pérez"
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/CredencialesInvalidas'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInternoAuth'
        '415':
          $ref: '#/components/responses/TipoContenidoNoSoportado'

  /api/auth/elegir-rol:
    post:
      operationId: elegirRol
      tags: [auth]
      summary: Elige el rol con el que entra una persona con varios roles (HU-040.2)
      description: |
        **HU-040.2 (#230, ADR-025).** Recibe el `ticketEleccion` de la respuesta `EleccionRolRequerida` del login y el
        `rol` elegido (uno de los `roles[].codigo` ofrecidos). El ticket es de UN SOLO USO: se consume en la primera
        llamada aunque la elección falle (un segundo intento con el mismo ticket es 401; hay que volver a llamar al login).
        Antes de emitir, el servidor revalida contra ClientePro y las asignaciones de Cotifly que la persona siga teniendo
        ese rol. Emite `access` (claim `rol` = el elegido) y `refresh`; el refresh conserva el rol elegido (no vuelve a
        preguntar) y revalida en cada renovación que siga vigente (si se lo quitaron, 401 "Inicia sesión de nuevo.").
        Para cambiar de rol: cerrar sesión y volver a entrar. Mismo límite de peticiones por IP que el login (429).
        Todo rechazo (ticket vencido, alterado, ya usado o de otra sesión; rol no ofrecido o retirado) responde el mismo
        401 `{"error":"Inicia sesión de nuevo."}`; el motivo queda en la auditoría (`elegir_rol`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElegirRolRequest'
            example:
              ticket: "eyJhbGciOiJIUzI1NiIsInR5cCI6ImVsZWNjaW9uLXJvbCtqd3QifQ..."
              rol: gerente_comercial
      responses:
        '200':
          description: Sesión emitida con el rol elegido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInternoAuth'
        '415':
          $ref: '#/components/responses/TipoContenidoNoSoportado'

  /api/auth/refresh:
    post:
      operationId: refrescarSesion
      tags: [auth]
      summary: Rota el refresh token y emite un par nuevo
      description: |
        El refresh token se invalida al usarse (rotación). Reutilizar un refresh ya
        rotado se trata como posible robo de sesión: responde 401. HU-040.2 (#230): el par nuevo
        conserva el rol de la sesión (el elegido en `elegir-rol` o el único); si ya no lo tiene, 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Par nuevo emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInternoAuth'
        '415':
          $ref: '#/components/responses/TipoContenidoNoSoportado'

  /api/auth/logout:
    post:
      operationId: cerrarSesion
      tags: [auth]
      summary: Cierra la sesión (revoca refresh y access)
      description: Responde siempre 204, exista o no el token (anti-enumeración).
      security:
        - bearer: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Sesión cerrada
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInternoAuth'
        '415':
          $ref: '#/components/responses/TipoContenidoNoSoportado'

  /web/chat:
    post:
      operationId: enviarMensajeChat
      tags: [web]
      summary: Corre un turno del asistente IA sobre una cotización (folio)
      description: |
        **HU-013.6 (#102, ADR-018), implementado:** el asistente trabaja sobre UNA cotización ya creada por
        el formulario. `folio` es obligatorio: sin él responde 400 `FOLIO_REQUERIDO`; si no existe o no es del comercial,
        404 (`Cotización no encontrada o no es tuya.`), sin llamar al modelo. Las cotizaciones ya no se crean por chat: el
        agente legado y el flag `Chat:CreacionHabilitada` se retiraron en HU-013.9 (#105), así que sin `folio` la respuesta
        es siempre 400 `FOLIO_REQUERIDO`; `cotizacion_origen_id` y `moneda` quedan obsoletos y se ignoran. La sesión queda
        ligada al comercial y al folio (el mismo `sesion_id` con otro folio es otra conversación).
        Herramientas de solo lectura o propuesta: `consultar_cotizacion`, `proponer_ajuste_margen`,
        `proponer_re_solicitud` y `buscar_servicio_conexo`. **Ninguna entrega montos de dinero al LLM** (ni precio, ni
        costo, ni totales, ni valores de conexos): `consultar_cotizacion` da solo estado, ruta, línea, moneda, nombres de
        conexos y los porcentajes de margen actual y sugerido (ADR-018 §2b). El `resumen` con montos de la acción
        propuesta lo arma el servidor después del LLM. La respuesta es `{texto, accion_propuesta?}`: la acción
        propuesta trae el método, el endpoint, el cuerpo exacto y un resumen; el frontend la ejecuta solo si el comercial
        pulsa Confirmar, llamando a ese endpoint con ese cuerpo (y `If-Match` = `row_version`). **La IA nunca ejecuta
        cambios.** `precio`, `margen` y `pdf` de `RespuestaChat` quedan siempre en `null` desde HU-013.6.

        `sesion_id` lo genera el cliente (UUID sin guiones) y agrupa la conversación.
        La sesión queda ligada al usuario del token: otro usuario no puede continuarla.
        Un fallo interno del agente (incluido el límite de peticiones del proveedor de
        IA) responde **200** con `error: true` y un texto legible (paridad con el
        backend Python; el frontend lo muestra tal cual). El 429 de este endpoint es
        el límite de peticiones de la propia API, no el del proveedor de IA.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MensajeWeb'
            example:
              mensaje: "Súbele el margen al 18 % porque el cliente acepta el valor"
              sesion_id: "3f2a9c1b7e4d4a6f9b0c2d1e5f6a7b8c"
              folio: "PCN-900555111-DG-05102026-001"
      responses:
        '200':
          description: Respuesta del agente (o error controlado con `error = true`)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RespuestaChat'
                  - $ref: '#/components/schemas/RespuestaChatError'
              example:
                texto: "Te propongo subir el margen de 15 % a 18 %. Revisa el resumen y, si estás de acuerdo, confírmalo."
                herramientas: [consultar_cotizacion, proponer_ajuste_margen]
                precio: null
                margen: null
                pdf: null
                errores: []
                accion_propuesta:
                  tipo: ajustar_margen
                  metodo: PUT
                  endpoint: /web/cotizaciones/PCN-900555111-DG-05102026-001/costeo/margen
                  cuerpo:
                    margen: 0.18
                    justificacion: null
                  resumen: "Ajustar el margen de 15 % a 18 % (precio estimado 3.109.756 COP)."
                  row_version: "7"
        '400':
          description: |
            `ErrorWeb`: `sesion_id` o `folio` (más de 50 caracteres: `folio inválido`) inválido, o cuerpo inválido.
            `ErrorNegocio` `FOLIO_REQUERIDO` (HU-013.6): falta `folio` o viene vacío. Los obsoletos `cotizacion_origen_id` y
            `moneda` se ignoran desde HU-013.9 (#105): ya no producen 400.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorWeb'
                  - $ref: '#/components/schemas/ErrorNegocio'
              example:
                error: "sesion_id inválido"
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          description: |
            El `sesion_id` pertenece a otro usuario (`Sesión no encontrada.`), o el `folio` no existe o no es del comercial
            (`Cotización no encontrada o no es tuya.`). El obsoleto `cotizacion_origen_id` se ignora desde HU-013.9 (#105).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'
              example:
                error: "Sesión no encontrada."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '413':
          $ref: '#/components/responses/CuerpoDemasiadoGrande'
        '415':
          $ref: '#/components/responses/TipoContenidoNoSoportado'

  /web/mis-cotizaciones:
    get:
      operationId: listarMisCotizaciones
      tags: [web]
      summary: Lista las cotizaciones del comercial autenticado
      description: Nunca devuelve cotizaciones de otro comercial. Máximo 100, más recientes primero.
      security:
        - bearer: []
      responses:
        '200':
          description: Cotizaciones del comercial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MisCotizaciones'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/cotizaciones/regional:
    get:
      operationId: listarCotizacionesRegional
      tags: [web]
      summary: Lista las cotizaciones de los comerciales de la regional del gerente comercial, o de todas para el director (HU-016.1, HU-037)
      description: |
        HU-016.1 (#154). Vista "Todas las cotizaciones" del gerente: fila por fila, con la misma forma que
        `GET /web/mis-cotizaciones` (`CotizacionResumen`) y, en cada fila, el comercial dueño (`comercial`).

        - Solo `gerente_comercial` o `director` (claim `rol` del token; HU-037, #210; un `comercial` recibe 403).
        - **`gerente_comercial`:** el alcance es SIEMPRE su regional, resuelta en el servidor con la misma regla que
          `GET /web/metricas/regional` (`DimEjecutivo` cuando está conectada; si no, `UsuariosWeb.regional`). Nunca se devuelven
          cotizaciones de otra regional. `?regional=` con su propia regional se acepta (sin distinguir mayúsculas ni espacios
          sobrantes); con otra, 403 `REGIONAL_NO_PERMITIDA` (HU-037.3, #211).
        - **`director` (HU-037.3, #211):** sin `regional`, las cotizaciones de **todos** los usuarios (todas las regionales,
          `regional` y `fuente_regional` en `null`); con `?regional=X`, solo las de los miembros de X (con la misma regla de la
          regional efectiva; `fuente_regional` en `null`). Las regionales posibles salen de `GET /web/regionales`. Una regional sin
          miembros responde 200 con la lista vacía.
        - El propio gerente es miembro de su regional: sus cotizaciones también salen.
        - Gerente sin regional asignada: 409 `REGIONAL_NO_ASIGNADA` (nunca se devuelven todas las regionales). Fuente de la
          regional configurada pero caída: 503 `REGIONAL_NO_DISPONIBLE` (también para el director que filtra por `regional`).
        - Máximo 100 en total (no por comercial), de la más reciente a la más antigua (`createdAt` y, a igualdad, `folio`
          descendente), como "Mis cotizaciones". Sin filtros ni paginación.
        - `linea_negocio` es la de la ruta 1 (o `Varias`) y `precio_final` el de la cabecera, como en "Mis cotizaciones".
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/RegionalFiltro'
      responses:
        '200':
          description: Cotizaciones de la regional del gerente (o de todas, o de la elegida, para el director)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionesRegional'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '403':
          description: |
            `ErrorWeb` "No tienes permiso para esta operación." si el rol no es `gerente_comercial` ni `director`. HU-037.3 (#211):
            `ErrorNegocio` `REGIONAL_NO_PERMITIDA` si un `gerente_comercial` pide con `regional` una regional que no es la suya.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorWeb'
                  - $ref: '#/components/schemas/ErrorNegocio'
              examples:
                rol:
                  value:
                    error: "No tienes permiso para esta operación."
                otraRegional:
                  value:
                    error:
                      codigo: REGIONAL_NO_PERMITIDA
                      mensaje: "Solo puedes consultar tu propia regional."
        '409':
          description: El gerente no tiene regional asignada (`REGIONAL_NO_ASIGNADA`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
              example:
                error:
                  codigo: REGIONAL_NO_ASIGNADA
                  mensaje: "Tu usuario no tiene una regional asignada. Pide al administrador que la registre."
        '503':
          description: La fuente de la regional (`DimEjecutivo`) está configurada pero no responde (`REGIONAL_NO_DISPONIBLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/cotizaciones/{folio}:
    get:
      operationId: obtenerDetalleCotizacion
      tags: [web]
      summary: Detalle completo de una cotización en una sola llamada ("Ver detalle")
      x-issue: '#179 (HU-027.1, parte A)'
      description: |
        HU-027.1 (#179). Todo lo que necesita "Ver detalle" (HU-021-FE.7, #75) para pintar y **recargar** la página sin combinar
        `GET /web/mis-cotizaciones` con `GET .../costeo`. Es una composición de las proyecciones que ya existen, con sus mismas reglas:
        - `cotizacion`: la cabecera (`CotizacionResumen`, la fila de "Mis cotizaciones"): folio, versión, cliente y NIT, estado de envío,
          estado del costeo, resultado (`ganada`, `motivo_rechazo`), `deadline` en UTC, `score_prioridad`, moneda y TRM, `pdf_url`, y el
          dueño en `comercial` (siempre presente aquí).
        - `costeo`: lo mismo que `GET .../costeo` (`CosteoCotizacion`): por ruta los camiones con vehículo, porcentajes de llenado y estado
          del costeo, las mercancías, los conexos con precio, el margen, el precio, el costo bruto (`costo_final`, HU-039.1, #218) y los
          avisos; `pdf_desactualizado`, `textos` y `row_version`. El costo bruto es solo del dueño: con `solo_lectura = true` (gerente)
          `costeo.rutas[].costo_final` es siempre `null`.
        - `captura`: cada ruta como la capturó el comercial (`RutaEditable`, la de `GET .../solicitud`): municipios por id y nombre y
          condiciones (tipología, clases, exclusivo, contenedor, horas, valores, peso). Se cruza con `costeo.rutas[]` por
          `linea_solicitud_id`. Los conexos salen con el id del catálogo guardado (aquí no se consulta Nexo).
        - `tipo`, `notas`, `fechas` y `totales` (rutas, camiones, peso, transporte, conexos y precio final).
        - `row_version` (también en el `ETag`) para el `If-Match` de las acciones que siguen.

        Solo lectura de lo que Cotifly tiene guardado: no consulta Nexo, no dispara el polling ni cambia la cotización.

        Acceso: el **dueño**; un `director` (HU-037.3, #211), de cualquier regional; o un `gerente_comercial` cuya regional efectiva incluye
        al dueño (la misma regla que `GET /web/cotizaciones/regional` y la descarga del PDF). Gerente y director solo consultan (`solo_lectura = true`; las acciones siguen siendo del
        dueño y a él le responden 404). Si la regional del gerente no se puede comprobar (sin regional o fuente caída) se niega. Cualquier
        otro usuario recibe 404, igual que si el folio no existiera.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
      responses:
        '200':
          description: Detalle de la cotización
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetalleCotizacion'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/cotizaciones/{folio}/excel:
    get:
      operationId: exportarExcelCotizacion
      tags: [web]
      summary: Descarga el Excel de la cotización ("Ver detalle")
      x-issue: '#155 (HU-018.1, parte C)'
      description: |
        HU-018.1 (#155, parte C). Un `.xlsx` (ClosedXML) con cuatro hojas: `Resumen` (folio, cliente, NIT, comercial, tipo, moneda y TRM
        en USD, estado del costeo, resultado, si está finalizada y con el precio congelado, la versión del archivo y los totales), `Rutas`
        (una fila por ruta con su estado, el motivo de rechazo de la Mesa, peso, camiones que cuentan, precio del transporte, de los
        conexos y de la ruta, y una fila `Total`), `Camiones` (una fila por camión: vehículo, carrocería, peso, estado, si cuenta en el
        precio y el precio de su transporte, que es su costo con el margen de la ruta) y `Conexos` (una fila por servicio conexo con su
        precio). Precios en la moneda de la cotización (COP sin decimales, USD con dos); `Sin precio` donde no hay.

        **Dos versiones según quién lo descarga** (la misma regla de acceso de `GET /web/cotizaciones/{folio}`):
        - el **dueño** recibe la versión **interna**: además, por ruta, `Costo fletes`, `Costo retorno`, `Costo levante`, `Costo conexos`,
          `Costo bruto` (todos `(COP)`: el costeo de Nexo nunca se convierte), `Margen aplicado`, `Margen sugerido`, `Origen del margen` y
          `Método de cálculo`; por camión, sus costos y el margen; por conexo, su costo; y el `Costo bruto total (COP)` en el resumen. Las
          columnas internas tienen otro color en el encabezado. Como en el costeo (HU-039.1, #218), nunca un costo sin su precio: una ruta
          rechazada o un camión que no cuenta salen sin costos;
        - el **gerente comercial** de la regional del dueño y el **director** (HU-037) reciben el mismo Excel en **solo lectura y sin
          ninguna columna de costo ni de margen** (ni sus encabezados: con el margen y el precio se deduce el costo). La versión dice
          `Solo lectura (sin costos ni márgenes)`. Cada descarga suya, permitida o no, queda en la auditoría
          (`exportar_excel_cotizacion`);
        - cualquier otro usuario recibe 404, igual que si el folio no existiera.

        Solo lee lo que Cotifly guardó (ni Nexo ni el cubicador). Con la cotización finalizada o con PDF (HU-036) los precios y los costos
        son los congelados. Las rutas rechazadas por la Mesa de Costeo (HU-028.1) salen sin precio, sin conexos y no suman en los totales.
        Requiere el costeo listo: sin `precio_final`, 409 `COSTEO_NO_LISTO`. No toma el cupo de lecturas de Excel (solo escribe).
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
      responses:
        '200':
          description: 'El Excel de la cotización (`Content-Disposition` attachment, nombre `{folio}.xlsx`)'
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '409':
          description: '`COSTEO_NO_LISTO`: la cotización todavía no tiene `precio_final` (costeo sin terminar)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/cotizaciones/{folio}/enviar:
    post:
      operationId: enviarCotizacion
      tags: [web]
      summary: Envía la cotización al cliente por correo con el PDF adjunto
      description: |
        El remitente es el comercial autenticado. Solo puede enviar cotizaciones propias
        (si no es suya responde 404, igual que si no existe). Endurecimiento A (#199): el dueño se comprueba ANTES que
        todo lo demás, así que un folio ajeno o inexistente responde 404 aunque el correo esté deshabilitado (antes 503
        `CORREO_DESHABILITADO`) o los destinatarios sean inválidos (antes 400 `CORREO_INVALIDO`): esas respuestas ya no
        permiten saber qué folios existen. Un envío idéntico a los
        mismos destinatarios en los últimos 5 minutos se rechaza como duplicado (cuenta
        un envío `enviado` o todavía en curso: `encolado`/`enviando`; un `fallido` no).

        HU-033 (#199, ADR-023): el correo sale por el microservicio interno MailSender. El 200 significa que MailSender
        lo ACEPTÓ (202) y quedó `encolado` (`estado`); la entrega al relay se confirma después y se ve en
        `GET /web/cotizaciones/{folio}/correos` (`enviado` o `fallido` con su error). `message_id` es el id del correo en
        MailSender y `correo_id` el del envío en Cotifly (historial y reintento). El comercial va en copia oculta.
        El cuerpo va en HTML con un bloque fijo después del texto del comercial: el precio de cada ruta y el VALOR
        TOTAL de la cotización, sin desglose, con la leyenda de impuestos del PDF.
        Por defecto, en todos los ambientes (`Correo:Proteccion:Modo=redirigir`), el correo va SOLO al buzón de pruebas
        (sin CC ni CCO), con `[QA]` en el asunto y los destinatarios originales en el cuerpo; `redirigido_a` trae ese buzón.
        Solo producción con `Correo:Proteccion:Modo=ninguno` y `Correo:Proteccion:PermitirEnvioReal=true` escribe a los
        destinatarios reales. En la base y
        en el historial quedan los destinatarios originales.

        Concurrencia (HU-013.2, ADR-018 §12): antes de que el correo salga, la cotización queda marcada como enviada
        con control de versión; si un ajuste (margen, conexos) la cambió entretanto, o su PDF quedó desactualizado,
        responde 409 `CONFLICTO_CONCURRENCIA` sin enviar nada. Si el transporte falla, la marca se deshace.

        Seguridad de las cabeceras (DEF-1027B-2, #228, ADR-023): el asunto y las direcciones viajan como cabeceras del correo,
        así que se validan TAL COMO LLEGAN (antes de recortar) y nunca se sanean en silencio:
        - un `asunto` con caracteres de control (CR, LF, NUL, tabulador, U+0085, U+2028, U+2029 y los demás de la categoría
          Unicode `Cc`) es 400 `CORREO_INVALIDO` (`ErrorWeb`), también si solo están al final;
        - cada dirección de `para` y `cc` es UNA dirección simple `parte-local@dominio`: sin caracteres de control, sin
          comas, punto y coma, espacios, comillas, ángulos ni comentarios; parte local de hasta 64 caracteres (letras,
          dígitos y los símbolos de un `atom` del RFC 5322, con puntos que no van al principio, al final ni seguidos),
          dominio de hasta 255 con al menos dos etiquetas de hasta 63 (letras, dígitos y guiones, sin literales IP), y hasta
          320 en total. Si no, 400 `CORREO_INVALIDO`;
        - tope (#228): hasta **10 destinatarios por defecto entre `para` y `cc`**, configurable con
          `Correo__MaximoDestinatarios` (1 a 100; la copia oculta al comercial no cuenta; MailSender no tiene tope propio).
          Pasado el tope, 400 `CORREO_DEMASIADOS_DESTINATARIOS` (`ErrorNegocio`) con `detalle = {maximo, recibidos}`, donde
          `maximo` es el tope configurado: el frontend lo lee de ahí y no lo fija;
        - el transporte lo vuelve a revisar antes del POST a MailSender (defensa en profundidad): si algo se cuela, el correo
          no sale y responde 400 `CORREO_ENVIO_FALLIDO` (fila `fallido` en el historial).
        El orden es: dueño (404), correo deshabilitado (503), asunto con controles, destinatarios con controles, tope,
        formato de las direcciones, largos. Nada de esto llama a MailSender ni cambia el estado de envío.

        HU-045.3 (#265): el precio de cada ruta y el total del bloque fijo incluyen el seguro de la mercancía (sin desglose, regla de HU-033);
        la ruta que lo incluye dice "Incluye el seguro de la mercancía". Una ruta con el seguro marcado sin valor de la mercancía no bloquea
        el envío (decisión del usuario del 2026-11-09): su precio no lo incluye y no lo menciona.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvioWeb'
      responses:
        '200':
          description: MailSender aceptó el correo (queda `encolado`; la entrega se sigue en el historial)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaEnvio'
        '400':
          description: |
            Error de negocio del envío: duplicado (`CORREO_DUPLICADO`), sin PDF (`CORREO_PDF_NO_ENCONTRADO`), más
            destinatarios entre `para` y `cc` que el tope (10 por defecto, configurable) (`CORREO_DEMASIADOS_DESTINATARIOS`, #228, con `detalle.maximo` y
            `detalle.recibidos`), MailSender lo
            rechazó (400/413/422), no está disponible o no respondió a tiempo (`CORREO_ENVIO_FALLIDO`; con tiempo agotado el
            correo pudo quedar encolado: la cotización queda enviada y el mismo envío cuenta 5 minutos para `CORREO_DUPLICADO`;
            también si el ambiente redirige sin buzón de pruebas, o si el transporte encuentra una cabecera inválida: no sale
            nada), o validación (`ErrorWeb`, código interno `CORREO_INVALIDO`: sin `para`, una dirección mal formada o con
            caracteres de control, un asunto con caracteres de control, asunto o cuerpo demasiado largos)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
              examples:
                asunto_con_saltos:
                  summary: DEF-1027B-2 (#228)
                  value:
                    error: "El asunto no puede tener saltos de línea ni otros caracteres de control (va como cabecera del correo): escríbelo en una sola línea."
                demasiados_destinatarios:
                  summary: Tope de destinatarios, 10 por defecto (#228)
                  value:
                    error:
                      codigo: CORREO_DEMASIADOS_DESTINATARIOS
                      mensaje: "El correo admite hasta 10 destinatarios entre 'para' y 'cc' (llegaron 60)."
                      detalle:
                        maximo: 10
                        recibidos: 60
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '409':
          description: '`CONFLICTO_CONCURRENCIA`: la cotización cambió mientras se preparaba el envío o su PDF quedó desactualizado; o (HU-036.3, #207) `COTIZACION_NO_FINALIZADA`: en el flujo de costeo, finaliza la cotización antes de enviarla al cliente (`detalle` con la llamada a `.../finalizar`); no se envió nada'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '503':
          description: El envío de correo está deshabilitado (`Correo:Habilitado=false`, valor por defecto); solo con una cotización propia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
              example:
                error:
                  codigo: CORREO_DESHABILITADO
                  mensaje: "El envío de correo está deshabilitado."
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '413':
          $ref: '#/components/responses/CuerpoDemasiadoGrande'
        '415':
          $ref: '#/components/responses/TipoContenidoNoSoportado'

  /web/cotizaciones/{folio}/correos:
    get:
      operationId: historialCorreos
      tags: [web]
      summary: Historial de envíos de la cotización con el estado de MailSender
      description: |
        HU-033 (#199, ADR-023). Los envíos de la cotización, del más reciente al más antiguo, con el estado que reporta
        MailSender: `encolado` (aceptado, sin entregar), `enviando` (entregando o con un reintento programado por un error
        transitorio), `enviado` (el relay lo aceptó: `enviado_at`) o `fallido` (rechazado al encolarlo, reintentos agotados
        o sin confirmación en 24 h: `error`). Un worker de Cotifly consulta MailSender cada 30 s mientras el envío está en
        curso. Los destinatarios son los ORIGINALES aunque el correo se haya redirigido al buzón de pruebas
        (`redirigido_a`). Solo el dueño; una cotización ajena es 404.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
      responses:
        '200':
          description: Historial de envíos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistorialCorreos'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/cotizaciones/{folio}/correos/{correoId}/reintentar:
    post:
      operationId: reintentarCorreo
      tags: [web]
      summary: Pide a MailSender que reintente un envío fallido
      description: |
        HU-033 (#199, ADR-023). Los reintentos de entrega los hace MailSender solo (hasta 5, con espera exponencial); este
        endpoint pide uno más (`POST /api/v1/emails/{id}/retry`) para un envío `fallido` que MailSender conoce
        (`reintentable = true`). El envío vuelve a `encolado` y el worker sigue su estado. Un envío que se rechazó al
        encolarlo (sin id de MailSender) no se reintenta: se envía de nuevo con `POST .../enviar`. Solo el dueño.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
        - name: correoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: MailSender aceptó el reintento (el envío vuelve a `encolado`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvioCorreo'
        '400':
          description: '`CORREO_ENVIO_FALLIDO`: MailSender no respondió o no está disponible'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          description: La cotización no es suya o el envío no es de ella
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'
        '409':
          description: '`CORREO_NO_REINTENTABLE`: el envío no está `fallido`, ya se está reintentando, nunca llegó a MailSender, MailSender ya no lo conoce o (validación de #228) su asunto o un destinatario guardado tiene caracteres de control (un correo anterior a DEF-1027B-2: MailSender lo reenviaría con las cabeceras inyectadas; el historial lo muestra con `reintentable = false`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '503':
          description: '`CORREO_DESHABILITADO`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/cotizaciones/{folio}/seguimiento:
    post:
      operationId: marcarSeguimiento
      tags: [web]
      summary: Marca la cotización como ganada o perdida (interino, obsoleto)
      deprecated: true
      description: |
        Obsoleto desde HU-005.14: las cotizaciones que pasaron por Nexo usan `POST /web/cotizaciones/{folio}/resultado`.
        Se conserva por compatibilidad con el frontend y para las cotizaciones del chat con costo manual
        (`estado_costeo` nulo). Una cotización del flujo de costeo en Nexo responde 409 `USAR_RESULTADO_NEXO`
        (marcarla solo en Cotifly desincronizaría el resultado), salvo en `descartada` y `costeo_vencido`: Nexo no les
        acepta resultado y se marcan aquí, solo en Cotifly.
        Interino hasta HU-005.14, que lo reemplaza por `POST /web/cotizaciones/{folio}/resultado`
        (registra también en Nexo, agrega `comentario` y no permite cambiar el
        resultado una vez definido).

        HU-018.1 (#155): una perdida exige `motivo_rechazo` de la lista de `GET /web/motivos-perdida` y, con `Otro`, `comentario`
        (400 `MOTIVO_NO_PERMITIDO`). Sigue siendo el camino de las cotizaciones del chat, `descartada` y `costeo_vencido`.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeguimientoWeb'
      responses:
        '200':
          description: Cotización actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionResumen'
        '400':
          description: |
            `motivo_rechazo` de más de 2000 caracteres o `comentario` de más de 500 (`ErrorWeb`). HU-018.1 (#155): al marcar
            `ganada = false`, `MOTIVO_NO_PERMITIDO` (`ErrorNegocio`) si el motivo falta, no es de la lista de `GET /web/motivos-perdida`
            o es `Otro` sin `comentario`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorWeb'
                  - $ref: '#/components/schemas/ErrorNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '409':
          description: |
            `USAR_RESULTADO_NEXO`: la cotización pasó por Nexo; usar `POST /web/cotizaciones/{folio}/resultado` con `If-Match`.
            HU-021.13: `detalle` lo dice sin que el frontend lo deduzca: `metodo` (`POST`), `endpoint`
            (`/web/cotizaciones/{folio}/resultado` con el folio real) y `requiere_if_match` (`true`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '413':
          $ref: '#/components/responses/CuerpoDemasiadoGrande'
        '415':
          $ref: '#/components/responses/TipoContenidoNoSoportado'

  /web/lineas-negocio:
    get:
      operationId: listarLineasNegocioActivas
      tags: [web]
      summary: Líneas de negocio activas para el desplegable de la captura (sin margen)
      x-issue: '#154 (HU-016.1, parte B)'
      description: |
        HU-016.1 (#154, decisión P4b del 2026-10-27). Las líneas de negocio **activas** de Cotifly (`MargenesPolitica` con
        `isActive = 1`), ordenadas por nombre, para el desplegable "Línea de negocio" de cada ruta en "Nueva solicitud" (reemplaza
        el catálogo fijo del frontend; trae, por ejemplo, `DevolucionContenedor`). Roles `comercial`, `gerente_comercial` y
        `director`. **Nunca trae el margen ni el método de la política**: la política de margen solo la ve la administración
        (`GET /web/admin/lineas-negocio`). `linea_negocio` es el valor que se envía en `RutaCapturaWeb.linea_negocio`;
        `etiqueta` es el texto para mostrar (con tildes y espacios). Se lee de la base en cada petición: un cambio de la
        administración (activar o desactivar una línea) se ve de inmediato.
      security:
        - bearer: []
      responses:
        '200':
          description: Líneas de negocio activas, ordenadas por `linea_negocio`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LineaNegocioOpcion'
              example:
                - {linea_negocio: DevolucionContenedor, etiqueta: Devolución Contenedor}
                - {linea_negocio: Distribucion, etiqueta: Distribución}
                - {linea_negocio: Exportacion, etiqueta: Exportación}
                - {linea_negocio: Importacion, etiqueta: Importación}
                - {linea_negocio: Internacional, etiqueta: Internacional}
                - {linea_negocio: Nacional, etiqueta: Nacional}
        '401':
