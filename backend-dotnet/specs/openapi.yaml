  /web/usuario/telefono:
    get:
      operationId: obtenerTelefono
      tags: [web]
      summary: Teléfono actual del comercial (para confirmarlo antes de generar el PDF)
      security:
        - bearer: []
      responses:
        '200':
          description: Teléfono registrado (null si nunca se ha capturado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelefonoComercial'
        '401':
          $ref: '#/components/responses/SesionExpirada'
    put:
      operationId: guardarTelefono
      tags: [web]
      summary: Guarda o corrige el teléfono del comercial
      description: |
        El valor queda persistido en `UsuariosWeb.telefono` y es el que se imprime en los PDF siguientes
        (`null` o vacío lo borra y el PDF omite "Cel"). Errores, siempre con `ErrorWeb`: un teléfono fuera
        del patrón (`TELEFONO_INVALIDO` en el caso de uso) responde 400; si el comercial del token ya no
        existe en `UsuariosWeb` (`USUARIO_NO_ENCONTRADO`) responde 401.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelefonoComercial'
      responses:
        '200':
          description: Teléfono guardado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelefonoComercial'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/SesionExpirada'

  /web/cotizaciones/{id}/nueva-version:
    get:
      operationId: obtenerDatosNuevaVersion
      tags: [web]
      summary: Datos de una cotización existente para prellenar una nueva versión
      description: |
        No modifica la cotización original. El frontend usa estos datos para prellenar
        "Nueva cotización"; al confirmarse se crea una fila nueva con `version + 1` y
        folio base con sufijo `-vN`.
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Datos para prellenar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatosNuevaVersion'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'

  /web/clientes:
    get:
      operationId: buscarClientes
      tags: [web]
      summary: Busca clientes y prospectos en el catálogo de Nexo
      description: |
        Mismo catálogo (clientes de `DimBPSolicitante` y prospectos) que usa el formulario
        "Nueva solicitud" de Nexo y la herramienta `buscar_cliente` del agente (HU-005.2,
        ADR-005). `exacta=true` solo cuando hay un único candidato — Nexo no distingue
        coincidencia exacta de aproximada en la respuesta; el frontend nunca debe tratar el
        texto buscado como NIT/origen/BP: esos datos salen únicamente de `candidatos`.
      security:
        - bearer: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Nombre o NIT, tal como lo escribió el comercial.
      responses:
        '200':
          description: Candidatos encontrados (vacío si ninguno)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoBusquedaClientes'
        '400':
          description: Falta `q`, o la búsqueda en Nexo no está disponible (`CLIENTE_BUSQUEDA_NO_DISPONIBLE`)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
        '401':
          $ref: '#/components/responses/SesionExpirada'

  /web/municipios:
    get:
      operationId: listarMunicipios
      tags: [web]
      summary: Catálogo completo de municipios para origen/destino
      description: |
        Mismo catálogo de municipios (sin paginar) que usa el formulario "Nueva solicitud" de Nexo para el
        origen y el destino. Se omiten los campos de costeo interno (`nombreTarifasPlaza`, `zonaTarificacion`
        en la respuesta de Nexo): el frontend no los necesita.
      security:
        - bearer: []
      responses:
        '200':
          description: Catálogo completo de municipios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Municipio'
        '400':
          description: El catálogo de municipios en Nexo no está disponible (`MUNICIPIOS_NO_DISPONIBLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'

  /web/catalogos-flete:
    get:
      operationId: obtenerCatalogosFlete
      tags: [web]
      summary: Catálogos de tipo de vehículo, tipo de carrocería y clase de viaje
      description: |
        Catálogos de la biblioteca SAP TM histórico de Nexo para el formulario de captura. Se omite
        `lineasNegocio` de la respuesta de Nexo: Cotifly ya tiene su propio catálogo de línea de negocio.
      security:
        - bearer: []
      responses:
        '200':
          description: Los tres catálogos completos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogosFlete'
        '400':
          description: Los catálogos de flete en Nexo no están disponibles (`CATALOGOS_FLETE_NO_DISPONIBLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'

  /web/cubicacion:
    post:
      operationId: cubicar
      tags: [web]
      summary: Cubicación rápida - mejor vehículo y flota necesaria para un conjunto de bultos
      description: |
        Reenvía la solicitud a `POST {Nexo:UrlBase}/api/cubicacion` (la "cubicación rápida" de Nexo, sin
        persistencia: dado un conjunto de bultos, sugiere qué vehículo conviene usar), que a su vez es la única
        llamada síncrona de Nexo al servicio Cubicador. Unidades: **centímetros y kilogramos** (distinto del resto
        del catálogo "Plan de Cargue" de Nexo, que usa milímetros). Cotifly siempre evalúa contra todo el catálogo
        estándar de vehículos: no expone `unidad_ids` de Nexo. Se omiten de la respuesta las matrices de
        factibilidad por vehículo y las disposiciones de colocación 3D de la flota (`matrices` y
        `sugerencia_flota.disposiciones` de Nexo): demasiado detalle para el formulario de cotización.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CubicacionRequest'
      responses:
        '200':
          description: Sugerencia de vehículo/flota, advertencias y detección de extradimensión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoCubicacion'
        '400':
          description: |
            `ITEMS_REQUERIDOS` si `items` falta o viene vacío; `CUBICACION_DEMASIADO_GRANDE` si Nexo/Cubicador
            rechaza la solicitud (típicamente por superar el límite de bultos por solicitud, pero Nexo no distingue
            el motivo exacto en su propio código de error); `CUBICACION_NO_DISPONIBLE` si Nexo no responde o no está
            configurado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'

  /web/solicitudes-costeo:
    post:
      operationId: enviarSolicitudCosteo
      tags: [web]
      summary: Crea la cotización con el formulario ampliado y la envía a costeo en Nexo
      description: |
        HU-005.5 (ADR-015). Crea la cotización del comercial (folio del servidor, ADR-011, con el NIT) con el
        formulario ampliado y sus posiciones en `estado_costeo = pendiente_envio`, la **confirma antes de llamar a
        Nexo** y luego envía `POST {Nexo:UrlBase}/api/captura-solicitudes` con una sola línea. El BP del cliente sale
        del catálogo de Nexo (búsqueda por `nit_cliente`), nunca del cuerpo. Los catálogos cerrados (`tipo_vehiculo`,
        `carroceria`, `tipologia`, `clase_viaje`, `clase_contenedor`) van con el código de Nexo tal cual.

        Responde **201 aunque Nexo falle**: la cotización queda en `error_envio` con `motivo_estado_costeo`
        (tiempo agotado, rechazo 4xx con el código de Nexo, 5xx, red, cliente sin BP) y el comercial puede
        reintentar con `POST /web/cotizaciones/{folio}/costeo/reintentar` sin volver a llenar el formulario. Con
        éxito queda en `pendiente_costeo` (o `autocosteo` si Nexo costeó la línea en la misma petición) y el polling
        (HU-005.6) sigue su estado. `precio_final` es `null` hasta que el costeo pasa por el margen (HU-005.7).
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCosteoWeb'
      responses:
        '201':
          description: Cotización creada; `estado_costeo` dice si Nexo recibió la solicitud
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionResumen'
        '400':
          description: |
            `SOLICITUD_COSTEO_INVALIDA` (campo obligatorio, largo o rango fuera de los límites de Nexo, más de 200
            posiciones, o la regla de peso de Nexo: `detalle.motivo` = `PESO_REQUERIDO` si la línea no trae peso > 0 ni
            posiciones con peso, `PESO_INCONSISTENTE` si el peso difiere más del 1 % de `sum(cantidad × peso_kg)`), `MARGEN_LINEA_DESCONOCIDA` (la línea no existe o está inactiva) o `FOLIO_CONSECUTIVO_AGOTADO`.
            Nada queda guardado. `ErrorWeb` si el cuerpo no es JSON válido.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
        '401':
          $ref: '#/components/responses/SesionExpirada'

  /web/cotizaciones/{folio}/costeo/reintentar:
    post:
      operationId: reintentarCosteo
      tags: [web]
      summary: Reenvía a Nexo la solicitud guardada de una cotización que no llegó
      description: |
        HU-005.5. Solo desde `estado_costeo` `error_envio` (salvo un rechazo 400 de Nexo, que es definitivo: el
        motivo empieza por "Rechazo definitivo de Nexo") o `pendiente_envio`; reenvía el formulario y las posiciones
        guardados (no hace falta volver a llenarlos). Mismo resultado que el envío: 200 con la cotización en
        `pendiente_costeo`/`autocosteo`, o de nuevo en `error_envio` con el motivo. Si el motivo anterior era
        "tiempo agotado", Nexo pudo haber creado la solicitud: el comercial debe verificar antes de reintentar
        (pendiente de confirmar con el equipo de Nexo una clave de idempotencia). Solo el dueño.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
      responses:
        '200':
          description: Reenvío intentado; `estado_costeo` dice si Nexo lo recibió
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionResumen'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '409':
          description: '`COSTEO_NO_REINTENTABLE`: la cotización no está en `error_envio` ni en `pendiente_envio`, o no nació del formulario ampliado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'

  /web/cotizaciones/{folio}/costeo:
    get:
      operationId: obtenerCosteo
      tags: [web]
      summary: Estado del costeo en Nexo, precio final y servicios conexos de la cotización
      description: |
        HU-005.7 (ADR-015 §5). Solo precios: el costo bruto de Nexo nunca se muestra (ni aquí ni en "Mis
        cotizaciones"); `precio_final` y el `precio` de cada servicio conexo salen del módulo de Precio con el margen
        de la cotización (resuelto al enviarla: SAP TM con el BP o la política de la línea). `precio_final` es `null`
        mientras no haya costeo. Solo el dueño.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
      responses:
        '200':
          description: Costeo de la cotización
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CosteoCotizacion'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'

  /web/cotizaciones/{folio}/costeo/servicios-conexos:
    put:
      operationId: seleccionarServiciosConexos
      tags: [web]
      summary: Elige qué servicios conexos del costeo se incluyen en el precio y en el PDF
      description: |
        HU-005.7. `incluidos` son los ids de `servicios_conexos` que van en el PDF; los demás quedan excluidos. Solo
        mientras la cotización tenga precio y no tenga PDF. Solo el dueño.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeleccionServiciosConexos'
      responses:
        '200':
          description: Selección guardada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CosteoCotizacion'
        '400':
          description: '`SOLICITUD_COSTEO_INVALIDA`: algún id no es un servicio conexo del costeo'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '409':
          description: '`COSTEO_NO_LISTO` (todavía sin precio) o `PDF_YA_GENERADO`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'

  /web/cotizaciones/{folio}/costeo/pdf:
    post:
      operationId: generarPdfCosteo
      tags: [web]
      summary: Genera el PDF de la cotización con el precio sobre el costeo de Nexo
      description: |
        HU-005.7, módulo PDF de HU-003.5. El payload lo arma el servidor desde la cotización: una fila con origen,
        destino, vehículo y `precio_final`, y solo los servicios conexos incluidos, cada uno con su precio. Una sola
        vez por cotización (para cambiarla, versión nueva). Solo el dueño.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
      responses:
        '201':
          description: PDF generado y registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalidaPdf'
        '400':
          description: Error del módulo PDF (`PDF_PAYLOAD_INVALIDO`, `PDF_RENDER_NO_DISPONIBLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '409':
          description: '`COSTEO_NO_LISTO` o `PDF_YA_GENERADO`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'

  /web/clientes/{nit}/destinatarios-previos:
    get:
      operationId: obtenerDestinatariosPrevios
      tags: [web]
      summary: Destinatarios usados en envíos anteriores para un cliente
      description: Solo considera envíos del comercial autenticado. Lista vacía si nunca se le ha enviado.
      security:
        - bearer: []
      parameters:
        - name: nit
          in: path
          required: true
          schema:
            type: string
            maxLength: 20
      responses:
        '200':
          description: Destinatarios del último envío
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destinatarios'
        '401':
          $ref: '#/components/responses/SesionExpirada'

  /web/cotizaciones/{folio}/correo/vista-previa:
    post:
      operationId: previsualizarCorreo
      tags: [web]
      summary: Renderiza el correo sin enviarlo
      description: Devuelve asunto, cuerpo y destinatarios prediligenciados para el modal de confirmación.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvioWeb'
      responses:
        '200':
          description: Vista previa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VistaPreviaCorreo'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'

  /pdfs/{archivo}:
    get:
      operationId: descargarPdf
      tags: [sistema]
      summary: Descarga el PDF de una cotización (inline)
      description: |
        Requiere sesión. Solo el dueño de la cotización (o un gerente_comercial de su misma
        regional; si la regional del gerente no se conoce, solo el dueño) puede descargarlo. Como exige `Authorization`, el frontend lo descarga con HttpClient
        como blob (un `<a href>` directo no envía el header).
        En el backend Python este endpoint era público (hallazgo de seguridad corregido).
        Alternativa sin `Authorization` para Google Chat (ADR-011 §3, #12 parte C): el enlace
        de la tarjeta del PDF lleva `?t=<token>`, una firma HMAC de vida corta (15 minutos por
        defecto) sobre el archivo, el comercial y el vencimiento; solo vale para el dueño.
        Un token alterado o vencido responde 401. El frontend sigue usando Bearer.
      security:
        - bearer: []
        - {}
      parameters:
        - name: archivo
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]+\.pdf$'
        - name: t
          in: query
          required: false
          description: Token del enlace firmado de Google Chat (`{usuario}.{vence}.{firma}`); con él no se exige Bearer.
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: Falta el token, expiró o fue revocado; o el enlace firmado está alterado o vencido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'
              example:
                error: "Inicia sesión de nuevo."
        '404':
          description: No existe o no es tuya
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'

  /chat/events:
    post:
      operationId: recibirEventoChat
      tags: [chat]
      summary: Webhook de Google Chat
      description: |
        Verifica el JWT de Google (audience = número de proyecto, emisor
        `chat@system.gserviceaccount.com`), responde de inmediato con un acuse y procesa
        el turno en segundo plano. La respuesta final se publica en el hilo de Chat.
        La identidad es el correo del remitente en `UsuariosWeb.email` (ADR-011): sin cuenta se
        responde en el hilo "Ingresa primero a Cotifly desde ClientePro." y no se cotiza. Los clics
        en los botones de la tarjeta de previsualización (`CARD_CLICKED`) cuentan como mensaje.
      security:
        - googleChat: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: |
            Acuse. Evento MESSAGE en formato clásico → `{"text": "..."}`; en formato
            add-on → `hostAppDataAction.chatDataAction.createMessageAction`. Otros eventos → `{}`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: El cuerpo no es JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'
        '401':
          description: JWT de Google inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'

  /health:
    get:
      operationId: salud
      tags: [sistema]
      summary: Liveness
      security: []
      responses:
        '200':
          description: Servicio vivo
          content:
            application/json:
              schema:
                type: object
                required: [status, servicio, entorno]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  servicio:
                    type: string
                    example: cotifly-api
                  entorno:
                    type: string
                    example: Development

  /health/ready:
    get:
      operationId: saludListo
      tags: [sistema]
      summary: Readiness (base de datos alcanzable)
      security: []
      responses:
        '200':
          description: Listo
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ready]
        '503':
          description: No disponible
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [unavailable]
                  detalle:
                    type: string

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT HS256, 60 minutos. Claims: `sub` (UUID del usuario en `UsuariosWeb`),
        `jti`, `username`, `rol` (`comercial` | `gerente_comercial`).
    googleChat:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT firmado por Google Chat (RS256).

  parameters:
    Folio:
      name: folio
      in: path
      required: true
      schema:
        type: string
        maxLength: 50
      description: |
        Folio de la cotización (ADR-011): `PCN-[{nitCliente}-]{INICIALES}-DDMMAAAA-{NNN}[-vN]`.
        Se acepta cualquier folio existente (también los heredados del Python, como
        `PCN-23072026`), por eso no se valida con un patrón.
      example: PCN-DG-25092026-001
    DesdeMetricas:
      name: desde
      in: query
      required: false
      description: |
        Primer día del periodo (AAAA-MM-DD, fecha de America/Bogota, incluido). Por defecto el 1 de enero del año en
        curso. El periodo va de `desde` 00:00 a `hasta` 24:00 en Bogotá (UTC−5) y se compara con `createdAt` de la
        versión vigente. Rango máximo de 3 años.
      schema:
        type: string
        format: date
      example: '2026-01-01'
    HastaMetricas:
      name: hasta
      in: query
      required: false
      description: Último día del periodo (AAAA-MM-DD, America/Bogota, incluido). Por defecto hoy.
      schema:
        type: string
        format: date
      example: '2026-09-29'

  responses:
    Validacion:
      description: Cuerpo inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWeb'
    CredencialesInvalidas:
      description: Identidad no válida o sin rol autorizado (mensaje genérico)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWeb'
          example:
            error: "Credenciales inválidas"
    SesionExpirada:
      description: Falta el token, expiró o fue revocado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWeb'
          example:
            error: "Inicia sesión de nuevo."
    SinPermiso:
      description: El rol del usuario no permite esta operación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWeb'
          example:
            error: "No tienes permiso para esta operación."
    NoEsTuya:
      description: La cotización no existe o pertenece a otro comercial
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWeb'
          example:
            error: "Cotización no encontrada o no es tuya."
    DemasiadasPeticiones:
      description: Límite de peticiones alcanzado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWeb'

  schemas:
    Nulo:
      description: |
        Valor `null` en OAS 3.0.3 (que no tiene `type: 'null'`): un objeto anulable sin propiedades. Se usa como
        alternativa de `oneOf` para campos que pueden no traer valor; el servidor siempre envía `null`, nunca `{}`.
      type: object
      nullable: true
      maxProperties: 0

    ErrorWeb:
      type: object
      required: [error]
      properties:
        error:
          type: string

    ErrorNegocio:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [codigo, mensaje]
          properties:
            codigo:
              type: string
              description: |
                Mismos códigos que el backend Python, más los nuevos del backend .NET:
                `CLIENTE_BUSQUEDA_NO_DISPONIBLE` (HU-005.2: Nexo sin configurar, sin
                respuesta o el comercial sin `idUsuarioExterno`; nunca por "no hubo
                candidatos", que es `200` con `candidatos: []`), `HERRAMIENTA_DESCONOCIDA` (el modelo pidió una
                herramienta inexistente, HU-003.10), `AJUSTE_MARGEN_INVALIDO` (HU-003.4:
                el margen negociado por el comercial está fuera de rango para su método de
                cálculo, es decir negativo o ≥ 1 con `margen`, o el método no es
                `margen`/`markup`), `FOLIO_DUPLICADO` (HU-003.5: ya existe una cotización
                con ese folio; el Python versionaba el folio en silencio, en .NET el folio lo
                genera HU-003.6 y la colisión se informa), `FOLIO_CONSECUTIVO_AGOTADO` (HU-003.6:
                ya se usaron los 999 folios del día de esas iniciales, ADR-011), `CORREO_DESHABILITADO` (HU-003.5:
                `Correo:Habilitado=false`, el valor por defecto; en `/web/*` se responde 503),
                `CORREO_INVALIDO` (HU-003.5: destinatarios `para`/`cc` inválidos o vacíos, asunto
                de más de 300 caracteres o cuerpo de más de 5000; lo devuelve la herramienta
                `enviar_correo`, y en `POST /web/cotizaciones/{folio}/enviar` va como `ErrorWeb` 400),
                `MUNICIPIOS_NO_DISPONIBLE` (`GET /web/municipios`: mismas causas que
                `CLIENTE_BUSQUEDA_NO_DISPONIBLE`, catálogo de Nexo), `CATALOGOS_FLETE_NO_DISPONIBLE`
                (`GET /web/catalogos-flete`: idem, catálogos de tipo de vehículo/carrocería/clase de viaje),
                `ITEMS_REQUERIDOS` (`POST /web/cubicacion`: falta `items` o viene vacío, mismo código que usa Nexo),
                `CUBICACION_NO_DISPONIBLE` (`POST /web/cubicacion`: idem `MUNICIPIOS_NO_DISPONIBLE`, cubicación
                rápida de Nexo) y `CUBICACION_DEMASIADO_GRANDE` (`POST /web/cubicacion`: Nexo/Cubicador rechazó la
                solicitud, típicamente por superar el límite de bultos por solicitud) y `TRM_NO_DISPONIBLE`
                (HU-012.1/HU-012.2, ADR-014: la fuente oficial de la TRM, datos abiertos de la Superintendencia
                Financiera, no respondió o no tiene TRM vigente para el día; no se cotiza en USD y el comercial
                puede reintentar o cotizar en COP). Solo en la herramienta
                `resolver_municipio` del agente (HU-005.13), nunca en `/web/*`: `MUNICIPIO_ARGUMENTO_INVALIDO`
                (`campo` distinto de `origen`/`destino` o `texto` vacío; no se consulta Nexo).
                Costeo en Nexo (ADR-015): `SOLICITUD_COSTEO_INVALIDA` (formulario ampliado fuera de los límites de
                Nexo), `COSTEO_NEXO_NO_DISPONIBLE` (Nexo sin configurar, 5xx, red, circuito abierto o el comercial sin
                `idUsuarioExterno`), `COSTEO_NEXO_TIEMPO_AGOTADO` (Nexo no respondió a tiempo), `COSTEO_NEXO_RECHAZADA`
                (Nexo respondió 4xx; el código de Nexo va en `detalle.motivo`), `COSTEO_NEXO_SOLICITUD_INVALIDA` (Nexo respondió 400 al alta:
                `error_envio` definitivo, no se reintenta), `COSTEO_NO_REINTENTABLE` (409: la
                cotización no está en `error_envio` ni en `pendiente_envio`), `COSTEO_NO_LISTO` (409: la cotización todavía no
                tiene el costeo con margen) y `PDF_YA_GENERADO` (409: ya tiene PDF, se cambia con una versión nueva).
                `PRECIO_INVALIDO` queda solo para el cálculo de precio.
                Solo en `GET /web/metricas/regional` (HU-010.1, ADR-016): `REGIONAL_NO_ASIGNADA` (409: el gerente no
                tiene regional en `DimEjecutivo` ni en `UsuariosWeb.regional`) y `REGIONAL_NO_DISPONIBLE` (503: la
                conexión a `DimEjecutivo` está configurada pero falla).
              enum:
                - TARIFA_FUENTE_NO_DISPONIBLE
                - TARIFA_CONFIG_INVALIDA
                - MARGEN_FUENTE_NO_DISPONIBLE
                - MARGEN_LINEA_DESCONOCIDA
                - PRECIO_INVALIDO
                - PDF_PAYLOAD_INVALIDO
                - PDF_RENDER_NO_DISPONIBLE
                - CONFIRMACION_REQUERIDA
                - COTIZACION_NO_ENCONTRADA
                - CORREO_DUPLICADO
                - CORREO_PDF_NO_ENCONTRADO
                - CORREO_ENVIO_FALLIDO
                - AJUSTE_COTIZACION_INVALIDA
                - AJUSTE_ID_INVALIDO
                - AJUSTE_MARGEN_INVALIDO
                - FOLIO_DUPLICADO
                - FOLIO_CONSECUTIVO_AGOTADO
                - CORREO_DESHABILITADO
                - CORREO_INVALIDO
                - CLIENTE_BUSQUEDA_NO_DISPONIBLE
                - HERRAMIENTA_DESCONOCIDA
                - MUNICIPIOS_NO_DISPONIBLE
                - CATALOGOS_FLETE_NO_DISPONIBLE
                - ITEMS_REQUERIDOS
                - CUBICACION_NO_DISPONIBLE
                - CUBICACION_DEMASIADO_GRANDE
                - SOLICITUD_COSTEO_INVALIDA
                - COSTEO_NEXO_NO_DISPONIBLE
                - COSTEO_NEXO_TIEMPO_AGOTADO
                - COSTEO_NEXO_RECHAZADA
                - COSTEO_NEXO_SOLICITUD_INVALIDA
                - COSTEO_NEXO_SOLICITUD_NO_ENCONTRADA
                - COSTEO_NO_REINTENTABLE
                - COSTEO_NO_LISTO
                - PDF_YA_GENERADO
                - TRM_NO_DISPONIBLE
                - MUNICIPIO_ARGUMENTO_INVALIDO
                - REGIONAL_NO_ASIGNADA
                - REGIONAL_NO_DISPONIBLE
                - ERROR_INTERNO
            mensaje:
              type: string
            detalle:
              type: object
              additionalProperties: true

    LoginClienteProRequest:
      type: object
      required: [idUsuario]
      properties:
        idUsuario:
          type: string
          minLength: 1
          maxLength: 100
          description: Identidad a revalidar contra `tblSAPUsuariosApp` (como NOMBREUSUARIO o como ID).
        nombreUsuario:
          type: string
          nullable: true
          maxLength: 200
          description: Informativo (nombre para mostrar). No se usa para identificar a la persona.
        roles:
          type: array
          nullable: true
          items:
            type: string
          description: Informativo. Nunca decide el acceso; el rol se resuelve en el servidor.

    RefreshRequest:
      type: object
      required: [refresh]
      properties:
        refresh:
          type: string
          minLength: 1

    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          nullable: true

    UsuarioSesion:
      type: object
      required: [id, username, email, nombre_completo, rol]
      properties:
        id:
          type: string
          format: uuid
          description: Id interno de Cotifly (`UsuariosWeb.id`, UUID generado por Cotifly).
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        username:
          type: string
        email:
          type: string
        nombre_completo:
          type: string
        rol:
          type: string
          enum: [comercial, gerente_comercial]
        ubicacion:
          type: string
          nullable: true
          description: Regional del usuario (`UsuariosWeb.regional`); null si aún no se ha cruzado con DimEjecutivo.

    LoginResponse:
      type: object
      required: [access, refresh, user, debeCambiarPassword]
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/UsuarioSesion'
        debeCambiarPassword:
          type: boolean
          description: Siempre `false` en la puerta SSO.

    MensajeWeb:
      type: object
      required: [mensaje, sesion_id]
      properties:
        mensaje:
          type: string
          minLength: 1
          maxLength: 8000
        sesion_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{8,64}$'
        cotizacion_origen_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Opcional. Inicia una nueva versión de una cotización propia (botón "Nueva versión"): el agente
            parte de su cliente, línea y números, y el PDF sale como `{folio base}-vN`. Si no es del
            comercial responde 404 (igual que si no existe); si no es un UUID, 400.
        moneda:
          type: string
          nullable: true
          enum: [COP, USD, null]
          description: |
            Opcional (HU-012.2, ADR-014). Moneda de la cotización que eligió el comercial en el selector del
            formulario (HU-012.4). Queda en el estado de la conversación y manda sobre lo que diga el modelo;
            si cambia, el precio ya calculado se descarta y se recalcula. Sin el campo, la conversación sigue
            con la moneda que ya tenía (COP por defecto). Con `USD`, el precio se convierte con la TRM oficial
            del día; si la fuente de la TRM falla, el agente responde que no puede cotizar en dólares
            (`TRM_NO_DISPONIBLE` en la herramienta) y el comercial puede reintentar o cotizar en COP.
            Se acepta sin distinguir mayúsculas ni espacios al borde (`usd`, ` Usd ` → `USD`). Otro valor, o una cadena
            vacía, responde 400 (`moneda inválida`).

    SalidaPrecio:
      type: object
      required: [precio, costo, margen, metodo, utilidad]
      description: |
        `costo` y `utilidad` siempre en COP (el costeo es en pesos). `precio` va en `moneda`: en COP a pesos
        enteros; en USD, `precio_cop / trm_aplicada` a 2 decimales (half-to-even, HU-012.2, ADR-014).
        `moneda`, `trm_aplicada` y `precio_cop` son opcionales para compatibilidad: si faltan, la moneda es COP.
      properties:
        precio:
          type: number
        costo:
          type: number
        margen:
          type: number
        metodo:
          type: string
          enum: [margen, markup]
        utilidad:
          type: number
        moneda:
          type: string
          enum: [COP, USD]
          description: Moneda de `precio` (COP por defecto).
        trm_aplicada:
          type: number
          description: TRM oficial del día (COP por USD) con que se convirtió el precio; 0 cuando la moneda es COP.
        trm_vigencia_desde:
          type: string
          format: date
          nullable: true
          description: Primer día de vigencia de `trm_aplicada` (Superintendencia Financiera); `null` en COP.
        trm_vigencia_hasta:
          type: string
          format: date
          nullable: true
          description: |
            Último día de vigencia de `trm_aplicada`; `null` en COP. Si el comercial confirma después de esta
            fecha (America/Bogota), el servidor recalcula el precio con la TRM vigente y vuelve a previsualizar.
        precio_cop:
          type: number
          nullable: true
          description: |
            Precio en pesos antes de convertir; `null` cuando la moneda es COP (es el mismo `precio`). En USD es el
            mínimo a pagar (piso, HU-012.3): el valor cotizado originalmente en pesos que imprime el PDF.

    SalidaMargen:
      type: object
      required: [margen, origen, trq_type, anomalo, detalle]
      properties:
        margen:
          type: number
          description: Fracción decimal (0.135 = 13,5 %).
        origen:
          type: string
          enum: [sap_tm, politica_linea, negociado]
        trq_type:
          type: string
          nullable: true
        anomalo:
          type: boolean
        detalle:
          type: string

    SalidaPdf:
      type: object
      required: [cotizacion_id, folio, pdf_url, registrada_en_bd]
      properties:
        cotizacion_id:
          type: string
          format: uuid
        folio:
          type: string
        pdf_url:
          type: string
        registrada_en_bd:
          type: boolean

    RespuestaChat:
      type: object
      required: [texto, herramientas]
      properties:
        texto:
          type: string
        herramientas:
          type: array
          items:
            type: string
          description: Nombres de las herramientas invocadas en el turno, en orden.
        precio:
          description: Última salida exitosa de la herramienta en el turno, o `null`.
          oneOf:
            - $ref: '#/components/schemas/SalidaPrecio'
            - $ref: '#/components/schemas/Nulo'
        margen:
          description: Última salida exitosa de la herramienta en el turno, o `null`.
          oneOf:
            - $ref: '#/components/schemas/SalidaMargen'
            - $ref: '#/components/schemas/Nulo'
        pdf:
          description: Última salida exitosa de la herramienta en el turno, o `null`.
          oneOf:
            - $ref: '#/components/schemas/SalidaPdf'
            - $ref: '#/components/schemas/Nulo'
        errores:
          type: array
          description: |
            Opcional (HU-012.4, aditivo). Errores de negocio que devolvieron las herramientas del turno, en orden,
            para que el frontend reaccione sin interpretar el texto del agente (por ejemplo `TRM_NO_DISPONIBLE`:
            no hay precio en dólares, ofrecer reintentar o cotizar en COP). Vacío si ninguna herramienta falló.
            Los códigos son los de `ErrorNegocio`.
          items:
            $ref: '#/components/schemas/ErrorHerramienta'

    ErrorHerramienta:
      type: object
      required: [herramienta, codigo]
      properties:
        herramienta:
          type: string
          description: Nombre de la herramienta (`calcular_precio`, `registrar_ajuste_margen`...).
        codigo:
          type: string
          description: Código de `ErrorNegocio` (ej. `TRM_NO_DISPONIBLE`).

    RespuestaChatError:
      type: object
      required: [texto, error]
      properties:
        texto:
          type: string
        error:
          type: boolean
          enum: [true]

    CotizacionResumen:
      type: object
      required: [id, folio, version, moneda, estado_envio]
      properties:
        id:
          type: string
          format: uuid
          description: Se usa en `GET /web/cotizaciones/{id}/nueva-version`.
        folio:
          type: string
        version:
          type: integer
          description: 1 para la original; la tabla muestra "v2", "v3", etc.
        nit_cliente:
          type: string
          nullable: true
          description: Se usa en `GET /web/clientes/{nit}/destinatarios-previos`.
        origen_cliente:
          type: string
          nullable: true
          enum: [cliente, prospecto, null]
        origen_margen:
          type: string
          nullable: true
          enum: [sap_tm, politica_linea, negociado, null]
          description: '`negociado` = ajuste manual del comercial (badge "Ajuste fuera de política").'
        cliente:
          type: string
          nullable: true
        linea_negocio:
          type: string
          nullable: true
        precio_final:
          type: number
          nullable: true
        margen_aplicado:
          type: number
          nullable: true
        moneda:
          type: string
          example: COP
        trm_aplicada:
          type: number
          description: |
            TRM con que se convirtió el precio (HU-012.2); 0 cuando la moneda es COP. En USD es la referencia del
            ajuste diario en pesos. El mínimo a pagar (piso, HU-012.3) no es `precio_final × trm_aplicada`: es el valor
            cotizado originalmente en pesos, el precio en pesos del costo y el margen aplicado (`precio_cop` de `SalidaPrecio`).
        estado_costeo:
          type: string
          nullable: true
          enum: [pendiente_envio, error_envio, pendiente_costeo, autocosteo, entregada, descartada, costeo_vencido, null]
          description: |
            Estado del costeo en Nexo (ADR-015). `null` = la cotización no pasa por Nexo (chat con costo manual).
            `pendiente_envio` y `error_envio` = Nexo todavía no la tiene (ver `motivo_estado_costeo`; se puede
            reintentar); `pendiente_costeo` = alguna línea sin flete ("en costeo"); `autocosteo` = todas las líneas con
            flete y la cotización de Nexo en borrador; `entregada` = Nexo la entregó; `descartada` = Nexo descartó la
            solicitud; `costeo_vencido` = se agotó el tiempo máximo del polling sin costeo. "Costeado" = `autocosteo`
            o `entregada` con `precio_final`.
        motivo_estado_costeo:
          type: string
          nullable: true
          description: Motivo legible del estado del costeo (error al enviar, rechazo de Nexo, costeo vencido...).
        estado_envio:
          type: string
          enum: [sin_enviar, enviada, reenviada]
        ganada:
          type: boolean
          nullable: true
        motivo_rechazo:
          type: string
          nullable: true
        pdf_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true

    MisCotizaciones:
      type: object
      required: [total, cotizaciones]
      properties:
        total:
          type: integer
        cotizaciones:
          type: array
          items:
            $ref: '#/components/schemas/CotizacionResumen'

    EnvioWeb:
      type: object
      required: [para]
      properties:
        para:
          type: array
          minItems: 1
          items:
            type: string
            format: email
            maxLength: 320
        cc:
          type: array
          items:
            type: string
            format: email
            maxLength: 320
          default: []
        asunto:
          type: string
          nullable: true
          maxLength: 300
          description: Por defecto "Cotización {folio} — Botero Soto".
        cuerpo:
          type: string
          nullable: true
          maxLength: 5000

    RespuestaEnvio:
      type: object
      required: [enviado]
      properties:
        enviado:
          type: boolean
          enum: [true]
        message_id:
          type: string
          nullable: true

    SeguimientoWeb:
      type: object
      properties:
        ganada:
          type: boolean
          nullable: true
        motivo_rechazo:
          type: string
          nullable: true
          maxLength: 2000

    LineaNegocio:
      type: object
      required: [id, linea_negocio, margen, metodo_calculo, is_active]
      properties:
        id:
          type: integer
        linea_negocio:
          type: string
        margen:
          type: number
        metodo_calculo:
          type: string
          enum: [margen, markup]
        is_active:
          type: boolean
        updated_at:
          type: string
          format: date-time
          nullable: true

    ActualizarLineaNegocio:
      type: object
      required: [margen, metodo_calculo, is_active]
      properties:
        margen:
          type: number
          minimum: 0
          maximum: 0.99
        metodo_calculo:
          type: string
          enum: [margen, markup]
        is_active:
          type: boolean

    PeriodoMetricas:
      type: object
      description: Periodo efectivamente aplicado (con los valores por defecto ya resueltos).
      required: [desde, hasta, zona_horaria]
      properties:
        desde:
          type: string
          format: date
        hasta:
          type: string
          format: date
        zona_horaria:
          type: string
          example: America/Bogota

    IndicadoresMetricas:
      type: object
      description: |
        KPIs de un conjunto de cotizaciones (una por cadena de versiones, periodo por su primera creación). Definición
        exacta de cada campo en el tag `metricas` y en ADR-016. Montos en COP con 2 decimales; fracciones de 0 a 1.
        Siempre se cumple `cantidad = ganadas + perdidas + sin_resultado + pendientes_por_cotizar`.
      required: [cantidad, versiones, ganadas, perdidas, sin_resultado, pendientes_por_cotizar, conversion,
                 conversion_sobre_cerradas, margen_promedio, costeo_total, costeo_ganadas, valor_cotizado_cop,
                 valor_ganado_cop, ganancias, cotizaciones_usd, tiempo_promedio_cotizacion_horas,
                 desviacion_promedio_margen, desviacion_promedio_margen_abs, ajustes_margen, deadline_vencidas]
      properties:
        cantidad:
          type: integer
          description: Cadenas de versiones cuya primera creación cae en el periodo, en cualquier estado.
        versiones:
          type: integer
          description: Filas (todas las versiones) de esas cadenas (referencia; no entra en ningún cociente).
        ganadas:
          type: integer
          description: Resultado ganada (el más reciente de la cadena).
        perdidas:
          type: integer
          description: Resultado perdida (el más reciente de la cadena).
        sin_resultado:
          type: integer
          description: Con precio y sin resultado (pendientes por marcar ganada o perdida).
        pendientes_por_cotizar:
          type: integer
          description: Sin precio y sin resultado (esperando el costeo o el precio).
        conversion:
          type: number
          nullable: true
          description: ganadas / cantidad (backlog HU-010). `null` si cantidad es 0.
        conversion_sobre_cerradas:
          type: number
          nullable: true
          description: ganadas / (ganadas + perdidas). `null` si no hay ninguna cerrada.
        margen_promedio:
          type: number
          nullable: true
          description: Promedio simple de `margenAplicado` (fracción). `null` si ninguna lo tiene.
        costeo_total:
          type: number
          description: SUM(`costo`) en COP de todas (el costo nunca se convierte).
        costeo_ganadas:
          type: number
          description: SUM(`costo`) en COP de las ganadas.
        valor_cotizado_cop:
          type: number
          description: SUM(`valor_cop`), con `valor_cop = round(precioFinal × trmAplicada, 2)` en USD (no es el `precio_cop` de ADR-014).
        valor_ganado_cop:
          type: number
          description: SUM(`valor_cop`) de las ganadas. Valor cotizado, no recaudado; en la UI "Valor ganado (COP)".
        ganancias:
          type: number
          description: SUM(`valor_cop` − `costo`) de las ganadas con precio y costo (= `valor_ganado_cop − costeo_ganadas` si todas tienen precio y costo y ninguna en USD tiene TRM 0).
        cotizaciones_usd:
          type: integer
          description: Cotizaciones del universo en una moneda distinta de COP.
        tiempo_promedio_cotizacion_horas:
          type: number
          nullable: true
          description: Promedio de (`costeoListoAt` − `createdAt` de la versión vigente) en horas (2 decimales), sin las filas con `costeoListoAt` anterior a `createdAt`. `null` si no queda ninguna.
        desviacion_promedio_margen:
          type: number
          nullable: true
          description: Promedio de `MargenAjustes.diferencia` (con signo) de la versión vigente de cada cotización (4 decimales). `null` sin ajustes.
        desviacion_promedio_margen_abs:
          type: number
          nullable: true
          description: Promedio del valor absoluto de esas diferencias (4 decimales). `null` sin ajustes.
        ajustes_margen:
          type: integer
          description: Ajustes de margen (`MargenAjustes`) de la versión vigente de cada cotización.
        deadline_vencidas:
          type: integer
          nullable: true
          description: Sin resultado y con `deadline` anterior al momento de la consulta. `null` si el esquema no tiene la columna `deadline` (script 0004).

    PuntoSerieMensual:
      type: object
      description: |
        Un mes (America/Bogota, por la primera creación de la cadena) del periodo, para la línea de tiempo. La serie trae todos los meses del periodo en orden,
        también los que no tienen cotizaciones (en 0). Mismo universo y mismas definiciones que `IndicadoresMetricas`.
      required: [mes, cantidad, ganadas, perdidas, valor_cotizado_cop, valor_ganado_cop]
      properties:
        mes:
          type: string
          pattern: '^\d{4}-\d{2}$'
          example: '2026-09'
        cantidad:
          type: integer
        ganadas:
          type: integer
        perdidas:
          type: integer
        valor_cotizado_cop:
          type: number
        valor_ganado_cop:
          type: number

    MetricaCiudad:
      type: object
      description: |
        Cotizaciones con ese municipio (texto del catálogo de Nexo, tal como se guardó en la cabecera de la cotización; una
        solicitud de varias líneas cuenta solo la ciudad de la cabecera).
      required: [ciudad, cantidad, ganadas, valor_cotizado_cop, valor_ganado_cop]
      properties:
        ciudad:
          type: string
        cantidad:
          type: integer
        ganadas:
          type: integer
        valor_cotizado_cop:
          type: number
        valor_ganado_cop:
          type: number
          description: Valor cotizado de las ganadas en COP (no dinero recaudado; en la UI "Valor ganado (COP)").

    ConcentracionCiudades:
      type: object
      description: |
        Concentración por municipio para el mapa (HU-010.3). `por_destino` es la vista principal (dónde se entrega);
        `por_origen` se da como complemento. Ordenadas por `cantidad` descendente y luego por nombre. Las cotizaciones del
        chat no guardan ciudades y cuentan en `sin_destino`/`sin_origen`.
      required: [disponible, por_destino, por_origen, sin_destino, sin_origen]
      properties:
        disponible:
          type: boolean
          description: '`false` mientras el esquema no tenga las columnas `origen`/`destino` (script 0004 sin aplicar).'
        por_destino:
          type: array
          items:
            $ref: '#/components/schemas/MetricaCiudad'
        por_origen:
          type: array
          items:
            $ref: '#/components/schemas/MetricaCiudad'
        sin_destino:
          type: integer
        sin_origen:
          type: integer

    MetricasComercial:
      type: object
      required: [periodo, usuario_id, indicadores, serie_mensual]
      properties:
        periodo:
          $ref: '#/components/schemas/PeriodoMetricas'
        usuario_id:
          type: string
          format: uuid
        indicadores:
          $ref: '#/components/schemas/IndicadoresMetricas'
        serie_mensual:
          type: array
          items:
            $ref: '#/components/schemas/PuntoSerieMensual'

    ComercialRegional:
      type: object
      description: |
        Un usuario de la regional con su rol y sus indicadores del periodo (para el selector del tablero). El gerente
        aparece también en la lista.
      required: [usuario_id, nombre_usuario, nombre_completo, rol, indicadores]
      properties:
        usuario_id:
          type: string
          format: uuid
        nombre_usuario:
          type: string
          nullable: true
        nombre_completo:
          type: string
          nullable: true
        rol:
          type: string
          nullable: true
          description: "`comercial`, `gerente_comercial` o `null`: rol interno asignado en `UsuariosRoles` (se fija en el login SSO, ADR-009); `null` si no tiene asignación activa."
        indicadores:
          $ref: '#/components/schemas/IndicadoresMetricas'

    MetricasRegional:
      type: object
      required: [periodo, regional, fuente_regional, usuario_id, indicadores, lineas_negocio_activas, comerciales,
                 serie_mensual, concentracion_ciudades]
      properties:
        periodo:
          $ref: '#/components/schemas/PeriodoMetricas'
        regional:
          type: string
          description: Regional del gerente autenticado.
        fuente_regional:
          type: string
          enum: [dim_ejecutivo, usuarios_web]
          description: De dónde salió la regional (`DWCubosEBSSAP.DimEjecutivo` o `UsuariosWeb.regional`).
        usuario_id:
          type: string
          format: uuid
          nullable: true
          description: Comercial filtrado, o `null` si los indicadores son de toda la regional.
        indicadores:
          $ref: '#/components/schemas/IndicadoresMetricas'
        lineas_negocio_activas:
          type: integer
          description: Líneas de `MargenesPolitica` con `isActive = 1` (no depende del periodo ni de la regional).
        comerciales:
          type: array
          description: Todos los usuarios de la regional (también el gerente), ordenados por nombre, aunque se filtre por `usuario_id`.
          items:
            $ref: '#/components/schemas/ComercialRegional'
        serie_mensual:
          type: array
          items:
            $ref: '#/components/schemas/PuntoSerieMensual'
        concentracion_ciudades:
          $ref: '#/components/schemas/ConcentracionCiudades'

    ActividadComercial:
      type: object
      description: |
        Fila de la vista `vActividadPorComercial` más `nombre_completo` (JOIN con
        `UsuariosWeb`). `num_cotizaciones_enviadas` debe contar `enviada` y `reenviada`.
      required: [usuario_id, num_cotizaciones, num_cotizaciones_enviadas, num_ajustes]
      properties:
        usuario_id:
          type: string
          format: uuid
        nombre_completo:
          type: string
          nullable: true
        num_cotizaciones:
          type: integer
        num_cotizaciones_enviadas:
          type: integer
        num_ajustes:
          type: integer
        ultima_cotizacion:
          type: string
          format: date-time
          nullable: true

    AjustesMargenComercial:
      type: object
      description: Fila de la vista `vAjustesMargenPorComercial` más `nombre_completo` (JOIN con `UsuariosWeb`).
      required: [usuario_id, num_ajustes]
      properties:
        usuario_id:
          type: string
          format: uuid
          nullable: true
        nombre_completo:
          type: string
          nullable: true
        linea_negocio:
          type: string
          nullable: true
        num_ajustes:
          type: integer
        diferencia_promedio:
          type: number
          nullable: true
        diferencia_min:
          type: number
          nullable: true
        diferencia_max:
          type: number
          nullable: true
        ultimo_ajuste:
          type: string
          format: date-time
          nullable: true

    TelefonoComercial:
      type: object
      required: [telefono]
      properties:
        telefono:
          type: string
          nullable: true
          pattern: '^\+?[0-9 ]{7,20}$'

    Destinatarios:
      type: object
      required: [para, cc]
      properties:
        para:
          type: array
          items:
            type: string
            format: email
        cc:
          type: array
          items:
            type: string
            format: email

    ResultadoBusquedaClientes:
      type: object
      required: [exacta, candidatos]
      properties:
        exacta:
          type: boolean
          description: Único candidato encontrado (ver descripción del endpoint sobre el criterio provisional).
        candidatos:
          type: array
          items:
            $ref: '#/components/schemas/ClienteEncontrado'

    ClienteEncontrado:
      type: object
      required: [nit_cliente, nombre, origen_cliente]
      properties:
        nit_cliente:
          type: string
        nombre:
          type: string
        origen_cliente:
          type: string
          enum: [cliente, prospecto]
        bp:
          type: string
          nullable: true
          description: BP de Nexo; nunca se muestra al comercial (solo se usa internamente para consultar SAP TM).

    Municipio:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          description: Id del municipio en el catálogo de Nexo.
        codigo_dane:
          type: string
          nullable: true
        municipio:
          type: string
          nullable: true
        departamento:
          type: string
          nullable: true
        pais:
          type: string
          nullable: true

    OpcionCatalogo:
      type: object
      required: [valor, etiqueta]
      properties:
        valor:
          type: string
          description: Valor interno de la opción (el que viaja en la cotización).
        etiqueta:
          type: string
          description: Texto legible para mostrar en el formulario.

    CatalogosFlete:
      type: object
      required: [tipos_vehiculo, tipos_carroceria, clases_viaje]
      properties:
        tipos_vehiculo:
          type: array
          items:
            $ref: '#/components/schemas/OpcionCatalogo'
        tipos_carroceria:
          type: array
          items:
            $ref: '#/components/schemas/OpcionCatalogo'
        clases_viaje:
          type: array
          items:
            $ref: '#/components/schemas/OpcionCatalogo'

    ServicioConexoCosteo:
      type: object
      required: [id, nombre, categoria, cantidad, precio, incluido]
      description: Servicio conexo del costeo de Nexo con su precio (margen de la cotización). Nunca trae el costo.
      properties:
        id:
          type: string
        nombre:
          type: string
          nullable: true
        categoria:
          type: string
          example: logistico
        cantidad:
          type: number
        precio:
          type: number
        incluido:
          type: boolean
          description: Si va en el precio y en el PDF (por defecto sí).

    CosteoCotizacion:
      type: object
      required: [folio, estado_costeo, motivo_estado_costeo, costeo_listo_at, precio_final, margen_aplicado, moneda, servicios_conexos, pdf_url]
      properties:
        folio:
          type: string
        estado_costeo:
          type: string
          nullable: true
          enum: [pendiente_envio, error_envio, pendiente_costeo, autocosteo, entregada, descartada, costeo_vencido, null]
        motivo_estado_costeo:
          type: string
          nullable: true
        costeo_listo_at:
          type: string
          format: date-time
          nullable: true
        precio_final:
          type: number
          nullable: true
          description: Precio al cliente (costeo de Nexo con margen). `null` mientras no haya costeo.
        margen_aplicado:
          type: number
          nullable: true
        moneda:
          type: string
          example: COP
        servicios_conexos:
          type: array
          items:
            $ref: '#/components/schemas/ServicioConexoCosteo'
        pdf_url:
          type: string
          nullable: true

    SeleccionServiciosConexos:
      type: object
      required: [incluidos]
      properties:
        incluidos:
          type: array
          items:
            type: string

    PosicionCargaWeb:
      type: object
      required: [largo_cm, ancho_cm, alto_cm]
      description: Posición de cubicaje (`CapturaPosicionRequest` de Nexo), en centímetros y kilogramos.
      properties:
        descripcion:
          type: string
          nullable: true
          maxLength: 200
        cantidad:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
        largo_cm:
          type: number
          minimum: 0.1
          maximum: 999999
        ancho_cm:
          type: number
          minimum: 0.1
          maximum: 999999
        alto_cm:
          type: number
          minimum: 0.1
          maximum: 999999
        peso_kg:
          type: number
          nullable: true
          minimum: 0
          maximum: 999999.99

    SolicitudCosteoWeb:
      type: object
      required: [tipo, nit_cliente, linea_negocio, origen, destino]
      description: |
        Formulario ampliado (HU-005.3, mapeo aprobado en `docs/MAPEO_CAMPOS_NEXO_COTIFLY.md`): encabezado y la única
        línea de `CapturaSolicitudRequest` de Nexo, con sus mismos límites.
      properties:
        tipo:
          type: string
          enum: [spot, licitacion]
        nit_cliente:
          type: string
          maxLength: 20
          description: NIT elegido en el buscador (`GET /web/clientes`). El BP se resuelve en el catálogo de Nexo.
        cliente_nombre:
          type: string
          nullable: true
          maxLength: 300
          description: Referencia visible mientras se resuelve; se reemplaza por el nombre del catálogo de Nexo.
        linea_negocio:
          type: string
          description: Línea de negocio de Cotifly (`MargenesPolitica`); a Nexo va su `mapeoLineasNexo`.
        deadline:
          type: string
          format: date-time
          nullable: true
        valor_estimado:
          type: number
          nullable: true
          minimum: 0
        referencia:
          type: string
          nullable: true
          maxLength: 200
        horas_cargue:
          type: number
          nullable: true
          minimum: 0
          maximum: 240
        horas_descargue:
          type: number
          nullable: true
          minimum: 0
          maximum: 240
        origen:
          type: string
          maxLength: 150
          description: Municipio de `GET /web/municipios`.
        destino:
          type: string
          maxLength: 150
        tipo_vehiculo:
          type: string
          nullable: true
          maxLength: 100
          description: Código SICE-TAC de Nexo (`2`, `2S3`, `3S3`...).
        carroceria:
          type: string
          nullable: true
          maxLength: 100
        tipologia:
          type: string
          nullable: true
          maxLength: 50
        clase_viaje:
          type: string
          nullable: true
          maxLength: 50
        clase_contenedor:
          type: string
          nullable: true
          maxLength: 20
        exclusivo:
          type: boolean
          nullable: true
        consolidado:
          type: boolean
          nullable: true
        retorna_contenedor:
          type: boolean
          nullable: true
        ciudad_devolucion_contenedor:
          type: string
          nullable: true
          maxLength: 150
        levante_contenedor_diferente:
          type: boolean
          nullable: true
        ciudad_levante_contenedor:
          type: string
          nullable: true
          maxLength: 150
        valor_aprovisionamiento:
          type: number
          nullable: true
          minimum: 0
        peso_kg:
          type: number
          nullable: true
          minimum: 0
          maximum: 999999.99
        valor_mercancia:
          type: number
          nullable: true
          minimum: 0
        posiciones:
          type: array
          maxItems: 200
          default: []
          items:
            $ref: '#/components/schemas/PosicionCargaWeb'

    ItemCubicacion:
      type: object
      required: [cantidad, largo_cm, ancho_cm, alto_cm]
      properties:
        descripcion:
          type: string
          nullable: true
        cantidad:
          type: integer
          description: Cuántos bultos idénticos con estas medidas.
        largo_cm:
          type: number
          description: Largo en centímetros.
        ancho_cm:
          type: number
          description: Ancho en centímetros.
        alto_cm:
          type: number
          description: Alto en centímetros.
        peso_kg:
          type: number
          nullable: true
          description: Peso en kilogramos de cada bulto.

    CubicacionRequest:
      type: object
      required: [items]
      properties:
        items:
