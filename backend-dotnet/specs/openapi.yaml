                $ref: '#/components/schemas/VistaPreviaCorreo'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'

  /pdfs/{archivo}:
    get:
      operationId: descargarPdf
      tags: [sistema]
      summary: Descarga el PDF de una cotización (inline)
      description: |
        Requiere sesión. Solo el dueño de la cotización (o un gerente_comercial de su misma
        regional; si la regional del gerente no se conoce, solo el dueño) puede descargarlo. Como exige `Authorization`, el frontend lo descarga con HttpClient
        como blob (un `<a href>` directo no envía el header).
        En el backend Python este endpoint era público (hallazgo de seguridad corregido).
        Alternativa sin `Authorization` para Google Chat (ADR-011 §3, #12 parte C): el enlace
        de la tarjeta del PDF lleva `?t=<token>`, una firma HMAC de vida corta (15 minutos por
        defecto) sobre el archivo, el comercial y el vencimiento; solo vale para el dueño.
        Un token alterado o vencido responde 401. El frontend sigue usando Bearer.
      security:
        - bearer: []
        - {}
      parameters:
        - name: archivo
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]+\.pdf$'
        - name: t
          in: query
          required: false
          description: Token del enlace firmado de Google Chat (`{usuario}.{vence}.{firma}`); con él no se exige Bearer.
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: Falta el token, expiró o fue revocado; o el enlace firmado está alterado o vencido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'
              example:
                error: "Inicia sesión de nuevo."
        '404':
          description: No existe o no es tuya
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'

  /chat/events:
    post:
      operationId: recibirEventoChat
      tags: [chat]
      summary: Webhook de Google Chat (obsoleto, se retira en HU-013.9)
      deprecated: true
      description: |
        **Obsoleto (ADR-018):** Google Chat sale del alcance de Cotifly; el webhook, su controlador y
        `Infraestructura/GoogleChat/*` se retiran en HU-013.9 (#105). Las tablas `EventosConversacion` y `Sesiones` se
        conservan como auditoría. No integrar nada nuevo contra este endpoint.

        Verifica el JWT de Google (audience = número de proyecto, emisor
        `chat@system.gserviceaccount.com`), responde de inmediato con un acuse y procesa
        el turno en segundo plano. La respuesta final se publica en el hilo de Chat.
        La identidad es el correo del remitente en `UsuariosWeb.email` (ADR-011): sin cuenta se
        responde en el hilo "Ingresa primero a Cotifly desde ClientePro." y no se cotiza. Los clics
        en los botones de la tarjeta de previsualización (`CARD_CLICKED`) cuentan como mensaje.
      security:
        - googleChat: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: |
            Acuse. Evento MESSAGE en formato clásico → `{"text": "..."}`; en formato
            add-on → `hostAppDataAction.chatDataAction.createMessageAction`. Otros eventos → `{}`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: El cuerpo no es JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'
        '401':
          description: JWT de Google inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'

  /health:
    get:
      operationId: salud
      tags: [sistema]
      summary: Liveness
      security: []
      responses:
        '200':
