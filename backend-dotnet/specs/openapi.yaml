          description: Obligatorio; 400 `ITEMS_REQUERIDOS` si falta o viene vacío.
          items:
            $ref: '#/components/schemas/ItemCubicacion'
        clase_viaje:
          type: string
          nullable: true

    SugerenciaVehiculo:
      type: object
      required: [unidad_id, unidad_nombre, banda, factor_utilizacion]
      properties:
        unidad_id:
          type: string
        unidad_nombre:
          type: string
        banda:
          type: string
        factor_utilizacion:
          type: number
        config_vehiculo:
          type: string
          nullable: true
        carroceria:
          type: string
          nullable: true
        clase_viaje:
          type: string
          nullable: true
        clase_contenedor:
          type: string
          nullable: true

    SugerenciaFlota:
