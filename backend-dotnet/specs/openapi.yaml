        '409':
          description: '`COSTEO_NO_LISTO`, `RUTA_RECHAZADA` (con la ruta en `detalle`), `SIN_RUTAS_COTIZABLES`, `PDF_YA_ENVIADO`, `CONFLICTO_CONCURRENCIA` o `IDEMPOTENCY_KEY_REUTILIZADA`; ninguna ruta cambia'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '428':
          $ref: '#/components/responses/PrecondicionRequerida'
