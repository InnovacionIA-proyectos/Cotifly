        config_vehiculo:
          type: string
          nullable: true
        carroceria:
          type: string
          nullable: true
        clase_viaje:
          type: string
          nullable: true
        clase_contenedor:
          type: string
          nullable: true

    MedidasEstandar:
      type: object
      required: [largo_max_cm, ancho_max_cm, alto_max_cm, peso_max_kg]
      properties:
        largo_max_cm:
          type: number
        ancho_max_cm:
          type: number
        alto_max_cm:
          type: number
        peso_max_kg:
          type: number

    PiezaExcedida:
      type: object
      required: [descripcion, excesos, largo_cm, ancho_cm, alto_cm]
      properties:
        descripcion:
          type: string
        excesos:
          type: array
          items:
            type: string
        largo_cm:
          type: number
        ancho_cm:
          type: number
        alto_cm:
          type: number
        peso_kg:
          type: number
          nullable: true

    DeteccionExtradimension:
      type: object
      required: [hay_extradimension, medidas_estandar, piezas]
      properties:
        hay_extradimension:
          type: boolean
        medidas_estandar:
          $ref: '#/components/schemas/MedidasEstandar'
        piezas:
          type: array
          items:
            $ref: '#/components/schemas/PiezaExcedida'
        sugerencia:
          type: string
          nullable: true

    ResultadoCubicacion:
      type: object
      required: [advertencias]
      properties:
        sugerencia:
          description: Mejor vehículo único, o `null` si ninguno de la flota estándar sirve.
          oneOf:
            - $ref: '#/components/schemas/SugerenciaVehiculo'
            - $ref: '#/components/schemas/Nulo'
        sugerencia_flota:
          description: Flota sugerida cuando hace falta más de un vehículo, o `null`.
          oneOf:
            - $ref: '#/components/schemas/SugerenciaFlota'
            - $ref: '#/components/schemas/Nulo'
        advertencias:
          type: array
          items:
            type: string
        extradimension:
          description: Detección de piezas que exceden las medidas estándar, o `null`.
          oneOf:
            - $ref: '#/components/schemas/DeteccionExtradimension'
            - $ref: '#/components/schemas/Nulo'

    VistaPreviaCorreo:
      type: object
      required: [asunto, cuerpo, para, cc]
      properties:
        asunto:
          type: string
        cuerpo:
          type: string
          description: Cuerpo renderizado con la plantilla real (texto plano).
        para:
          type: array
          items:
            type: string
        cc:
          type: array
          items:
            type: string
        adjunto:
          type: string
          description: Nombre del PDF que se adjuntará.

    DatosNuevaVersion:
      type: object
      description: |
        Datos de lectura para prellenar el formulario. `cotizacion_origen_id` es solo el
        id consultado; no se persiste como FK en la versión nueva.
      required: [cotizacion_origen_id, folio_base, version_siguiente]
      properties:
        cotizacion_origen_id:
          type: string
          format: uuid
        folio_base:
          type: string
        version_siguiente:
          type: integer
        cliente_nombre:
          type: string
          nullable: true
        nit_cliente:
          type: string
          nullable: true
        origen_cliente:
          type: string
          nullable: true
          enum: [cliente, prospecto, null]
        linea_negocio:
          type: string
          nullable: true
        costo:
          type: number
          nullable: true
        margen_politica:
          type: number
          nullable: true
        margen_aplicado:
          type: number
          nullable: true
        origen_margen:
          type: string
          nullable: true
          enum: [sap_tm, politica_linea, negociado, null]
        metodo_calculo:
          type: string
          nullable: true
          enum: [margen, markup, null]
        moneda:
          type: string
          nullable: true
