  /web/cotizaciones/{folio}/correo/vista-previa:
    post:
      operationId: previsualizarCorreo
      tags: [web]
      summary: Renderiza el correo sin enviarlo
      description: Devuelve asunto, cuerpo y destinatarios prediligenciados para el modal de confirmación.
      security:
        - bearer: []
