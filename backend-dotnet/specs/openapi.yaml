  /web/licitaciones:
    post:
      operationId: crearLicitacion
      tags: [web]
      summary: Crea la licitación con sus líneas mapeadas y la envía a Nexo como una sola solicitud
      description: |
        HU-011.2 (ADR-017). Valida **todas** las filas antes de guardar nada (reporte por fila). Si son válidas, crea la
        cotización `licitacion` (folio del servidor con el NIT, ADR-011) con sus N líneas, sus posiciones y el Excel original
        en `pendiente_envio`, la confirma y la envía a Nexo (`POST /api/captura-solicitudes`) como una sola solicitud con N
        líneas, con el mismo mecanismo de `POST /web/solicitudes-costeo`: responde **201 aunque Nexo falle** (queda en
        `error_envio` y se reintenta con `POST /web/cotizaciones/{folio}/costeo/reintentar`). El polling (HU-005.6) deriva el
        estado y el precio de cada línea.

        Dos formas de cuerpo: `multipart/form-data` con la parte `licitacion` (JSON `LicitacionWeb`) y, opcional, la parte
        `archivo` (el Excel original, para exportarlo después con los precios, HU-011.3); o `application/json` con el
        `LicitacionWeb` sin archivo. Con archivo, `hoja` es obligatoria; la `fila` de cada línea se verifica contra el archivo con la misma
        regla de detección de Nexo, salvo las líneas agregadas a mano (`fila: null`, HU-044.10 #293), que no apuntan a ninguna fila del Excel.

        **Origen de la lectura (HU-044.7, #290).** `origen_lectura` dice cómo se leyó el Excel. `analizar_excel` (por defecto;
        ausente o vacío cae aquí y **el flujo de hoy NO cambia**): la `fila` es el índice en `hojas[h].filas` de `analizar-excel`,
        Cotifly relee la hoja para validar y calcular `filas_excel`, y la exportación escribe los precios sobre el Excel original.
        `leer_estructura`: lo leyó la IA de NEXO (`leer-estructura`); la `hoja` es el **nombre de la tabla** (solo referencia), la
        `fila` es el índice (base 0) **dentro de la tabla**, obligatoria y única; Cotifly **no relee** la hoja ni calcula
        `filas_excel`, los errores por fila dicen «línea N de la tabla X» y la exportación arma un Excel **nuevo** (hoja
        «Licitación»), sin tocar el original (`GET /web/licitaciones/{folio}/excel`). Un `origen_lectura` desconocido es 400
        `VALIDATION_ERROR` con `detalle.campos = ["origen_lectura"]`.

        Moneda (ADR-014 §5): `moneda` opcional, `COP` por defecto o `USD`. En USD la TRM del día (DolarApi con respaldo en la
        Superintendencia Financiera) se consulta antes de guardar y queda en `trm_aplicada`; el polling calcula cada precio en
        pesos y lo convierte con ella (`round(precio_cop / trm, 2)`), también el total y los servicios conexos. Sin TRM responde
        400 `TRM_NO_DISPONIBLE` y no guarda nada. Otro valor de `moneda` es un error del reporte (campo `moneda`,
        `VALOR_FUERA_DE_RANGO`).

        Captura por fila (HU-013.11, #108; ver `LineaLicitacionWeb`): cada fila se valida por código de catálogo (G2), con las
        reglas condicionales de contenedor y aprovisionamiento (G3) y con el origen y el destino resueltos a ids de municipio de
        Nexo (G6). Todos los errores vuelven juntos en `errores[]` (índice, fila, campo y código), con el encabezado primero y
        luego por línea. Como en `POST /web/solicitudes-costeo`: sin catálogo maestro de Nexo ni una copia de menos de 24 h
        responde 503 `CATALOGOS_FLETE_NO_DISPONIBLE`; si alguna fila necesita resolver su municipio y el catálogo de municipios
        no responde, 503 `MUNICIPIOS_NO_DISPONIBLE` (el mismo 503 que `GET /web/municipios`).
        En los dos casos nada se guarda. Si además hay errores que se detectan sin ese catálogo (forma, contenedor y
        aprovisionamiento, tipología, carrocería, clase de contenedor), se devuelve primero el reporte 400 con todos ellos y el
        código del catálogo caído en `error.detalle.motivo`: lo que dependía de él se valida al volver a enviarla.

        **Cubicación en segundo plano (HU-023.5, #160).** Con el cubicador configurado (y `Cubicador:LicitacionEnSegundoPlano`,
        por defecto sí) la licitación se guarda **sin esperar al cubicador**: cada ruta queda con un camión provisional sin vehículo
        y `estado_cubicacion = pendiente`, la respuesta trae `progreso_cubicacion.estado = en_curso` y **todavía no se envía a
        Nexo** (`estado_costeo = pendiente_envio`). Un proceso en segundo plano le pide los camiones al cubicador ruta por ruta,
        con `Cubicador:MaximoParalelo` llamadas a la vez entre todas las réplicas (petición P6), y cuando la última ruta queda
        cubicada envía la solicitud completa a Nexo. El frontend consulta `GET /web/licitaciones/{folio}` cada pocos segundos
        mientras `progreso_cubicacion.estado = en_curso`. Si una ruta falla (`fallida`, con `error_cubicacion`), la licitación
        no sale a Nexo hasta `POST /web/licitaciones/{folio}/cubicacion/reintentar`. Sin cubicador, como antes: un camión sin
        vehículo por ruta y el envío a Nexo de una vez.

        **Idempotency-Key (HU-044.10, #293).** Cabecera opcional (ámbito `crear-licitacion` por comercial). Una repetición con la misma
        clave y el mismo cuerpo+archivo (la huella es el cuerpo más el nombre y el SHA-256 del archivo, no los bytes) relee la licitación
        creada y responde **201 con su estado de ahora**, sin crear otro folio. Solo el **201** consume la clave: un reporte por fila (400)
        o un 503 NO la consumen y la repetición se vuelve a evaluar (devuelve el reporte completo). La misma clave con otro cuerpo u otro
        archivo es 409 `IDEMPOTENCY_KEY_REUTILIZADA`; fuera de 8 a 64 caracteres, 400 `ErrorWeb`.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [licitacion]
              properties:
                licitacion:
                  type: string
                  description: JSON `LicitacionWeb`.
                archivo:
                  type: string
                  format: binary
          application/json:
            schema:
              $ref: '#/components/schemas/LicitacionWeb'
      responses:
        '201':
          description: Licitación creada; `estado_costeo` dice si Nexo recibió la solicitud
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Licitacion'
        '400':
          description: |
            `ReporteLicitacionInvalida` (`LICITACION_INVALIDA` con todas las filas que fallaron; nada queda guardado), o
            `ErrorNegocio` (`VALIDATION_ERROR` con `detalle.campos = ["origen_lectura"]` si `origen_lectura` no es `analizar_excel`
            ni `leer_estructura`, HU-044.7 #290; `ARCHIVO_REQUERIDO`, `FORMATO_NO_SOPORTADO`, `ARCHIVO_DEMASIADO_GRANDE`, `EXCEL_INVALIDO`; HU-035.2,
            #213: el archivo pasa por los controles del análisis y un rechazo trae su `detalle.motivo`; `EXCEL_SIN_DATOS` si la hoja no existe, `EXCEL_INVALIDO` también con más de 10.000 rangos combinados, `MARGEN_LINEA_DESCONOCIDA` (la
            línea no existe, o está inactiva: `detalle.motivo` lo dice; HU-013.15: en los dos casos `detalle.lineas_validas` trae las
            líneas activas de Cotifly y, con `linea_negocio = Licitaciones` (la línea del catálogo de Nexo, que no da margen), `detalle.motivo =
            LINEA_DE_NEXO`), `FOLIO_CONSECUTIVO_AGOTADO`, `TRM_NO_DISPONIBLE` con
            `moneda = USD`). `ARCHIVO_DEMASIADO_GRANDE`: el Excel pasa de 10 MB menos 64 KB (10.420.224 bytes). Endurecimiento A
            (#199): con `Cubicador:LicitacionEnSegundoPlano = false` (no es el valor por defecto) las filas se cubican al crear y un
            rechazo del cubicador es 400 `ErrorNegocio` con su código (`MERCANCIAS_REQUERIDAS`, `MERCANCIA_DESCONOCIDA`,
            `MERCANCIA_NO_CUBICABLE`, `DIMENSIONES_INVALIDAS`, `POSICION_INVALIDA`, `CUBICACION_DEMASIADO_GRANDE`,
            `CUBICADOR_PETICION_RECHAZADA`); en segundo plano (por defecto) esos rechazos quedan en la fila (`estado_cubicacion =
            fallida`, `error_cubicacion`) y el 201 sale igual. Un código de mercancía desconocido o no cubicable se reporta por fila en
            `ReporteLicitacionInvalida`. `ErrorWeb` si el cuerpo no
            es JSON válido. Si Nexo responde 403 al **alta** (`POST /api/captura-solicitudes`), la licitación queda igual creada (201)
            en `error_envio` y `motivo_estado_costeo` dice que el usuario no tiene permiso en Nexo (Cabina de Fletes). En cambio, un
            403 del **catálogo de conexos** (filas con `servicios_conexos`) ocurre antes de guardar: 403 `NEXO_SIN_PERMISO` y nada se
            crea (endurecimiento B de #199).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReporteLicitacionInvalida'
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '403':
          description: |
            `NEXO_SIN_PERMISO` (endurecimiento B de #199): Nexo respondió 403 al leer el costo de los servicios conexos de una ruta
            en su catálogo (`GET /api/servicios-conexos`: el comercial no tiene el rol `Comercial` ni `Admin` en Nexo). Nada queda
            guardado ni se captura en Nexo; `detalle.motivo` trae solo el código de Nexo. `ErrorWeb` si el rol de Cotifly no alcanza.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
        '409':
          description: |
            HU-044.10 (#293). `IDEMPOTENCY_KEY_REUTILIZADA`: la misma `Idempotency-Key` con otro cuerpo u otro archivo; no se crea nada
            (generar una clave nueva por intención).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '503':
          description: |
            HU-013.11: `CATALOGOS_FLETE_NO_DISPONIBLE` (alguna fila trae `tipo_vehiculo` o `clase_viaje` y no hay catálogo maestro
            de Nexo ni una copia de menos de 24 h para validarlos) o `MUNICIPIOS_NO_DISPONIBLE` (alguna fila sin id de municipio y el
            catálogo de municipios no responde). Nada se guarda. `SERVICIO_OCUPADO` (#125) si el candado del folio siguió ocupado
            tras los reintentos: nada se guarda y se puede reintentar; también (HU-035.2, #213) si el cupo de lecturas de Excel siguió
            lleno 15 s al leer el archivo. Endurecimiento A (#199): solo con
            `Cubicador:LicitacionEnSegundoPlano = false`, `CUBICADOR_NO_DISPONIBLE` (con `Cubicador:RespaldoSiFalla = false`),
            `CUBICADOR_NO_AUTORIZADO` o `CUBICADOR_RESPUESTA_INVALIDA`; nada se guarda.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '413':
          description: El cuerpo (Excel + JSON) supera `SeguridadHttp:LimiteCuerpoLicitacionBytes` (12 MB por defecto)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '415':
          $ref: '#/components/responses/TipoContenidoNoSoportado'

  /web/licitaciones/{folio}:
    get:
      operationId: obtenerLicitacion
      tags: [web]
      summary: Estado y precio de cada línea de la licitación
      description: |
        HU-011.2. Solo precios con margen (nunca el costo de Nexo). Sirve para el polling de la pantalla: una línea sin flete
        tiene `precio_final = null`. Solo el dueño. HU-023.5 (#160): trae los camiones de cada ruta (`lineas[].camiones`), el
        estado de su cubicación en segundo plano (`lineas[].estado_cubicacion`, `error_cubicacion`), el progreso
        (`progreso_cubicacion`) y los avisos del cubicador por ruta (`cubicacion`, la misma forma de `POST /web/solicitudes-costeo`).
        Endurecimiento A (#199): un folio que no es una licitación (formulario o chat) responde 404, como el Excel y reintentar
        (antes respondía 200).

        HU-034.1 (#201, parte A). Acceso: el **dueño**; un `director` (HU-037.3, #211), de cualquier regional; o un `gerente_comercial`
        cuya regional efectiva incluye al dueño (la misma regla que `GET /web/cotizaciones/{folio}` y la descarga del PDF). Gerente y
        director solo consultan (`solo_lectura = true`): reintentar la cubicación (con o sin `usar_respaldo`), reintentar el envío y
        las demás acciones siguen siendo del dueño y a ellos les responden 404. La vista es la misma del dueño: nunca trae costos. Si
        la regional del gerente no se puede comprobar (sin regional o fuente caída) se niega (fail-closed). Cada consulta de un
        gerente o director a una licitación ajena, permitida o no, queda en la auditoría (`consultar_licitacion`). Cualquier otro
        usuario recibe 404, igual que si el folio no existiera.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
      responses:
        '200':
          description: La licitación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Licitacion'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/licitaciones/{folio}/cubicacion/reintentar:
    post:
      operationId: reintentarCubicacionLicitacion
      tags: [web]
      summary: Reintenta las rutas de la licitación cuya cubicación falló
      description: |
        HU-023.5 (#160). Las rutas con `estado_cubicacion = fallida` vuelven a la cola del cubicador. Con `usar_respaldo = true`,
        solo las que fallaron porque el cubicador no respondió (`error_cubicacion` empieza por `CUBICADOR_NO_DISPONIBLE`) se
        aceptan con el respaldo, sin volver a llamar al cubicador, y, si ya no queda ninguna pendiente ni fallida, la licitación se
        envía a Nexo en la misma petición. Endurecimiento B (#199, HU-032, ADR-022 §9): el respaldo es el mismo del camino en
        segundo plano: con el vehículo elegido de la ruta (`tipo_vehiculo`) y válido en Nexo, el camión lo lleva con el aviso
        `VEHICULO_ELEGIDO_USADO`; si no es un código de Nexo, va sin vehículo con `VEHICULO_ELEGIDO_INVALIDO`; sin elegido, sin
        vehículo (lo resuelve la Mesa de Costeo de Nexo). Los avisos salen en la ruta (`cubicacion`, `avisos_cubicacion`). Un rechazo de la petición (mercancía o medidas) no se acepta
        con respaldo: esconde un dato malo (HU-023.1). Solo antes de enviarla a Nexo. Cuerpo opcional.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                usar_respaldo:
                  type: boolean
                  nullable: true
                  description: '`true` = aceptar las rutas que fallaron por una caída del cubicador con el respaldo (el vehículo elegido de la ruta si es de Nexo, si no sin vehículo) en vez de volver a llamar al cubicador.'
      responses:
        '200':
          description: La licitación con su progreso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Licitacion'
        '400':
          description: El cuerpo no es JSON válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '409':
          description: '`ESTADO_NO_PERMITE`: no hay rutas con la cubicación fallida, la licitación ya salió a Nexo, o con `usar_respaldo` las fallidas son rechazos de la petición'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '413':
          $ref: '#/components/responses/CuerpoDemasiadoGrande'
        '415':
          $ref: '#/components/responses/TipoContenidoNoSoportado'

  /web/licitaciones/{folio}/excel:
    get:
      operationId: exportarExcelLicitacion
      tags: [web]
      summary: Descarga el Excel de la licitación con los precios de Cotifly
      description: |
        HU-011.3 (ADR-017 §5). Regenera el Excel original del cliente **sin modificar sus columnas** y agrega, a la derecha de
        la última columna usada de la hoja mapeada, `Precio final Cotifly ({moneda})` (precio con margen; COP sin decimales,
        USD con dos, ADR-014), `Estado costeo Cotifly` y `Servicios conexos Cotifly` en la fila de cada línea. Las líneas sin
        costeo llevan `SIN COSTEO` con fondo amarillo; las filas del pliego que no se enviaron, `Sin enviar`. Agrega la hoja
        `Resumen Cotifly` (folio, cliente, moneda y TRM si es USD, total, líneas sin costeo y servicios conexos incluidos con su
        precio). Sin archivo original genera una hoja `Licitación` con los campos mapeados. **Nunca incluye el costo de Nexo.**
        Se puede exportar en cualquier momento. Siempre un `.xlsx` real: un `.xlsm` se convierte sin macros, y gráficos,
        imágenes o tablas dinámicas del original pueden perderse. El total del resumen es sin servicios conexos. `Sin enviar`
        solo marca filas entre la primera y la última línea enviada. Solo licitaciones (404 si no).

        HU-044.7 (#290): una licitación creada con `origen_lectura = leer_estructura` (leída con la IA de NEXO) se exporta en un Excel
        **nuevo**: NO se escribe sobre el archivo original (NEXO reorganizó las filas, así que el índice de una fila ya no corresponde a
        una fila de la hoja). Se arma la hoja `Licitación` (como sin archivo) más `Resumen Cotifly` y `Camiones Cotifly`, y el resumen
        deja la nota de que se leyó con la IA de NEXO y que los precios no van sobre el original.

        HU-034.1 (#201, parte A). Acceso: el dueño, un `director` (cualquier regional) o un `gerente_comercial` de la regional del
        dueño, con la regla de `GET /web/licitaciones/{folio}` (fail-closed, 404 para cualquier otro). Gerente y director reciben **el
        mismo archivo que el dueño**: la exportación nunca tuvo costos (ni el flete de Nexo, ni el costo de los conexos, ni el margen),
        así que no hay nada que quitar. Cada descarga de un gerente o director de una licitación ajena, permitida o no, queda en la
        auditoría (`exportar_excel_licitacion`).

        HU-023.5 (#160): agrega también la columna `Camiones Cotifly` (un camión por línea de la celda: vehículo y carrocería con
        el nombre del catálogo del cubicador, peso y llenado de volumen; "Sin vehículo (Mesa de Costeo)" si el cubicador no
        escogió; y "Cubicando" o el error si la cubicación no terminó) y la hoja `Camiones Cotifly` con un camión por fila
        (línea, ruta, camión, vehículo, carrocería, peso, volumen, llenado de volumen y de peso, cubicación). La exportación de una
        cotización desde "Ver detalle" (HU-018.1, parte C) reusa esta misma función.

        HU-035.2 (#213, ADR-024): el **original guardado** se abre con los mismos controles del Excel subido (firma, 1000 entradas,
        64 MB descomprimidos, 1.000.000 de elementos XML sin DTD) y dentro del mismo cupo de lecturas de Excel del proceso. Un original
        guardado antes de esos controles que no los pasa responde **400** `EXCEL_INVALIDO` o `ARCHIVO_DEMASIADO_GRANDE` con
        `detalle.motivo` (los mismos motivos del análisis), como cualquier original ilegible; nunca un 500. Con el cupo lleno 15 s,
        **503** `SERVICIO_OCUPADO` con `Retry-After`. Sin original no se toma el cupo.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
      responses:
        '200':
          description: 'El Excel con los resultados (`Content-Disposition` attachment, nombre `{folio}.xlsx`)'
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          description: '`EXCEL_INVALIDO` o `EXCEL_SIN_DATOS` si el original guardado ya no se puede leer. HU-035.2 (#213): también `EXCEL_INVALIDO` o `ARCHIVO_DEMASIADO_GRANDE` con `detalle.motivo` (`NO_ES_XLSX`, `CIFRADO_O_XLS`, `ZIP_INVALIDO`, `DEMASIADAS_ENTRADAS`, `SIN_LIBRO`, `LIBRO_ILEGIBLE`, `DESCOMPRIMIDO_EXCEDE_LIMITE`) si el original guardado no pasa los controles del Excel subido'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '503':
          description: 'HU-035.2 (#213): `SERVICIO_OCUPADO` con `Retry-After` si el cupo de lecturas de Excel siguió lleno 15 s'
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/licitaciones/sugerir-mapeo:
    post:
      operationId: sugerirMapeoLicitacion
      tags: [web]
      summary: Propone el mapeo de las columnas de una hoja con la importación inteligente de NEXO (no guarda nada)
      description: |
        HU-044.2 (#253, ADR-028). Cotifly reenvía la hoja a `POST {Nexo:UrlBase}/api/captura-solicitudes/sugerir-mapeo` con la
        identidad del comercial (`X-Portal-clsUsuario-Id`) y el NIT de la licitación como `clienteNit` (sin puntos ni dígito de
        verificación). NEXO propone en este orden: la **plantilla** guardada del cliente para esos encabezados, el **diccionario** del
        cliente y, para lo que falte, la **IA**. Es solo una sugerencia: el comercial la confirma o la cambia antes de `aplicar-mapeo`.
        Sirve igual para una hoja de `analizar-excel` que para una tabla de `leer-estructura` (misma forma, sin transformarla).

        **`campo` es el nombre de NEXO** (`origen`, `destino`, `tipoVehiculo`, `peso`, `pesoKg`, `largoCm`...; `ignorar` = sin
        propuesta): es el mismo que vuelve en `aplicar-mapeo` y en las plantillas. La tabla de equivalencias con los campos del
        frontend está en `docs/docs_front/CONTRATOS_API_COTIFLY_FRONTEND.md` (4.6.6).

        **Sin propuesta no es un error.** Responde 200 con todas las columnas en `campo = ignorar`, `origen = ninguno`,
        `confianza = 0`, `ia_usada = false` y el motivo en `motivo_sin_ia`, y el comercial sigue en manual:
        - más de 100 encabezados: `DEMASIADAS_COLUMNAS`, **sin llamar a NEXO** (el NIT se valida antes: uno inválido es 400
          `CLIENTE_NIT_INVALIDO`);
        - la importación apagada en el ambiente (`ImportacionInteligente:Habilitada`), NEXO caído o sin respuesta a tiempo:
          `NEXO_NO_DISPONIBLE` (una sola llamada: nunca se reintenta, porque puede gastar IA).
        Con la IA de NEXO apagada o caída NEXO responde 200 con lo que resolvieron la plantilla y el diccionario, `ia_usada = false` y
        su motivo (`IA_NO_DISPONIBLE` o un `IA_*` del proveedor). Otros motivos de NEXO: `PLANTILLA_RECONOCIDA` (con `plantilla_id`) y
        `DICCIONARIO_COMPLETO`.

        `filas` es una muestra (el frontend manda hasta 200; NEXO usa las 20 primeras): Cotifly reenvía las 200 primeras y descarta el
        resto. Un encabezado o una celda `null` viaja como texto vacío.

        **Peso (DU §8):** la sugerencia no trae pesos, solo propone columnas, así que la regla del peso total con tara no se aplica aquí.
        Se aplica al convertir las filas (`aplicar-mapeo`, #254) y en la captura.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SugerirMapeoWeb'
      responses:
        '200':
          description: La propuesta de NEXO, o la hoja sin propuesta con `ia_usada = false`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SugerenciaMapeo'
        '400':
          description: |
            `ErrorWeb`: cuerpo inválido. `ErrorNegocio`: `ENCABEZADOS_REQUERIDOS` (sin encabezados, sin llamar a NEXO),
            `CLIENTE_NIT_INVALIDO` (el NIT no tiene letras ni dígitos o pasa de 30, sin llamar a NEXO), o el rechazo de NEXO con su
            código y su mensaje (`ENCABEZADOS_REQUERIDOS`, `DEMASIADAS_COLUMNAS`...); `COSTEO_NEXO_RECHAZADA` para otro 4xx de NEXO.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorWeb'
                  - $ref: '#/components/schemas/ErrorNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '403':
          description: '`NEXO_SIN_PERMISO`: NEXO respondió 401 o 403 (la identidad del comercial o su rol en NEXO, que debe ser Comercial o Admin)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '413':
          description: El cuerpo supera `SeguridadHttp:LimiteCuerpoLicitacionBytes` (12 MB por defecto, el límite de todo `/web/licitaciones*`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'
        '415':
          $ref: '#/components/responses/TipoContenidoNoSoportado'
        '429':
          description: '`IA_TOPE_DIARIO`: el comercial agotó su cupo diario de IA en NEXO. Es suyo: no bloquea a los demás comerciales. Sin `Retry-After` (se libera al día siguiente); mientras tanto, mapear a mano'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/licitaciones/leer-estructura:
    post:
      operationId: leerEstructuraLicitacion
      tags: [web]
      summary: Lee con IA un Excel de formato complejo y devuelve tablas listas para sugerir-mapeo (no guarda nada)
      description: |
        HU-044.2 (#253, ADR-028; NEXO PR #433). Paso previo a `sugerir-mapeo` cuando el Excel tiene un formato complejo (encabezado en
        varias filas, matrices con los puertos en las columnas, el destino en un recuadro suelto). Cotifly solo hace de puente: reenvía
        el formulario a `POST {Nexo:UrlBase}/api/captura-solicitudes/leer-estructura` con el **nombre original del archivo** y la
        identidad del comercial, y devuelve la lectura de NEXO **sin alterar `receta` ni `tablas`**. Ni NEXO ni Cotifly guardan nada en
        esta llamada; Cotifly tampoco guarda el historial del chat.

        Tres usos:
        - **Primera lectura:** solo `archivo` (y `nit_cliente`). Con un formato guardado del cliente, NEXO lo reutiliza sin IA.
        - **Corrección:** el mismo archivo, la frase del comercial en `instrucciones` y la `receta` de la respuesta anterior (llega a
          NEXO exactamente como vino).
        - **Reaplicar sin IA:** el archivo y una `receta`, sin `instrucciones`.

        **Antes de NEXO Cotifly solo valida el archivo:** que venga (`ARCHIVO_REQUERIDO`), su tamaño (`ARCHIVO_DEMASIADO_GRANDE`, más de
        10 MB menos 64 KB) y su extensión (`FORMATO_NO_SOPORTADO`, solo `.xlsx` o `.xlsm`). **No abre el libro**, para no rechazar un
        archivo que NEXO sí puede leer (#277): los errores de lectura los decide NEXO. `instrucciones` (máx. 4000) y `receta` (máx.
        60.000) también los valida NEXO.

        **`ia_usada = false` con `motivo_sin_ia` es un 200 normal**, no un error (`IA_NO_DISPONIBLE`, `IA_RESPUESTA_INVALIDA` o un
        código del proveedor; también cuando NEXO usó una receta guardada o la enviada). **Sin reintentos automáticos:** cada llamada
        puede gastar IA. Puede tardar: el tiempo de espera hacia NEXO es de al menos 180 s (`ImportacionInteligente:TimeoutLecturaSegundos`).
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
                nit_cliente:
                  type: string
                  description: NIT de la licitación (con o sin puntos y dígito de verificación). Solo busca el cliente en NEXO, no lo crea; sin cliente no se reutiliza ningún formato guardado.
                instrucciones:
                  type: string
                  description: La frase del comercial para corregir la lectura (máx. 4000). Si viene, NEXO siempre consulta a la IA.
                receta:
                  type: string
                  description: La `receta` de una respuesta anterior, como texto JSON (máx. 60.000). Sola se ejecuta sin IA; con `instrucciones`, la IA la ajusta.
      responses:
        '200':
          description: La lectura de NEXO (también con `ia_usada = false`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LecturaEstructura'
        '400':
          description: |
            `ErrorWeb`: el formulario no se pudo leer, o una parte (`archivo`, `nit_cliente`, `instrucciones` o `receta`) viene más de
            una vez (`Formulario inválido: la parte '…' viene más de una vez.`, el mismo texto de `recetas-lectura`); no se llama a NEXO.
            `ErrorNegocio`: de Cotifly, sin llamar a NEXO, `ARCHIVO_REQUERIDO`,
            `FORMATO_NO_SOPORTADO`, `ARCHIVO_DEMASIADO_GRANDE` (el archivo solo pasa de 10 MB menos 64 KB; un 413 de NEXO también),
            `LECTURA_DEMASIADO_GRANDE` (el archivo cabe, pero con `receta` e `instrucciones`, contadas en bytes UTF-8, el envío pasa ese
            tope: leer sin la receta o con un archivo más pequeño) y `CLIENTE_NIT_INVALIDO`; de NEXO, con su mismo código y su mensaje,
            `EXCEL_INVALIDO`, `EXCEL_SIN_DATOS`, `RECETA_INVALIDA` (no es JSON, es demasiado grande o no corresponde al archivo),
            `INSTRUCCIONES_DEMASIADO_LARGAS` y `VALIDATION_ERROR` (la forma del formulario; `detalle.campos` trae solo los nombres de los
            campos que NEXO rechazó, nunca sus valores); `COSTEO_NEXO_RECHAZADA` para otro 4xx de NEXO.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorWeb'
                  - $ref: '#/components/schemas/ErrorNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '403':
          description: '`NEXO_SIN_PERMISO`: NEXO respondió 401 o 403 (la identidad del comercial o su rol en NEXO, que debe ser Comercial o Admin)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '413':
          description: El cuerpo supera `SeguridadHttp:LimiteCuerpoLicitacionBytes` (12 MB por defecto)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'
        '429':
          description: '`IA_TOPE_DIARIO`: el comercial agotó su cupo diario de IA en NEXO. No bloquea a los demás comerciales. Sin `Retry-After`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '503':
          description: '`NEXO_NO_DISPONIBLE`: la importación apagada en el ambiente, NEXO caído, sin respuesta a tiempo o con su cupo por minuto (`DEMASIADAS_SOLICITUDES`, con el `Retry-After` en `detalle.motivo`). No se reintenta solo'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/licitaciones/normalizar-valores:
    post:
      operationId: normalizarValoresLicitacion
      tags: [web]
      summary: Normaliza con NEXO los textos del Excel de licitación (vehículo, carrocería, ciudad y línea de negocio)
      description: |
        HU-044.4 (#255, ADR-028 y ADR-029). Lleva los textos distintos del Excel a los valores oficiales con
        `POST {Nexo:UrlBase}/api/captura-solicitudes/normalizar-valores` (diccionario del cliente, alias, catálogo y, al final, IA
        con lista cerrada), con la identidad del comercial. Rol Comercial. No guarda nada. El front manda **solo los valores
        distintos**; Cotifly quita además los repetidos (mismo `campo` y mismo `valor` sin los espacios de los extremos) y devuelve
        **un resultado por cada valor distinto, en el orden de la petición**. Con `nit_cliente` (el de la licitación, con o sin
        dígito de verificación) NEXO usa además el diccionario de ese cliente; sin él, solo el general.

        **Es una sugerencia.** Un valor con `origen = ia` es una propuesta que el comercial confirma. Sin IA en NEXO (apagada,
        caída o sin pendientes) la respuesta es **200** con `ia_usada = false`, `motivo_sin_ia` y lo que resolvieron las reglas.

        **Ciudad.** `municipio_id` es el id de municipio de NEXO (el mismo de `GET /web/municipios` y de
        `origen_municipio_id`/`destino_municipio_id`). Una ciudad `ambigua` trae `candidatos` (máx. 8) para que el comercial elija.
        `POST /web/licitaciones` sigue validando las ciudades al crear.

        **Línea de negocio (`linea_negocio`).** En una licitación cada ruta lleva su línea de negocio **de Cotifly** (la que tiene
        margen). Por eso `codigo` es el nombre de la línea de Cotifly, el que va en `lineas[].linea_negocio` de
        `POST /web/licitaciones`, y `linea_nexo` la de NEXO de la que sale:
        - un texto que ya es el nombre de una línea de Cotifly (sin tildes ni mayúsculas, como en el alta) se resuelve sin NEXO,
          con `origen = linea_cotifly` (así «Distribución», que no tiene línea en NEXO, no la cambia la IA). Si esa línea está
          inactiva o su mapeo a NEXO no es válido, queda `sin_resolver` con el motivo en `nota`;
        - cualquier otro texto lo resuelve NEXO (diccionario del cliente → sinónimos `impo`/`expo` → IA con las seis líneas). Lo
          que NEXO devuelve se valida contra sus seis líneas y se traduce a la línea activa de Cotifly cuyo mapeo es esa: una sola,
          `codigo` = esa línea; ninguna (p. ej. `Licitaciones`), `sin_resolver`; varias, `ambiguo` con `lineas_candidatas`.

        **Clase de contenedor:** no se normaliza aquí (`CAMPO_INVALIDO`); sigue por `GET /web/alias/resolver?tipo=contenedor`.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NormalizarValoresWeb'
      responses:
        '200':
          description: Un resultado por valor distinto, en el orden de la petición
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NormalizacionValores'
        '400':
          description: |
            Validación local, sin llamar a NEXO y con los códigos de NEXO: `VALORES_REQUERIDOS` (sin valores o uno vacío),
            `DEMASIADOS_VALORES` (más de 1000), `CAMPO_INVALIDO` (otro campo; la clase de contenedor va por `GET /web/alias/resolver`),
            `VALOR_DEMASIADO_LARGO` (más de 150 caracteres), `CLIENTE_NIT_INVALIDO` (NIT de más de 30 caracteres o sin dígitos; siempre, aunque todo se resuelva sin NEXO). De NEXO, su código
            con su mensaje; `COSTEO_NEXO_RECHAZADA` para otro 4xx. Un cuerpo que no es JSON: `ErrorWeb`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '403':
          description: '`NEXO_SIN_PERMISO`: NEXO respondió 401/403 para el comercial. Sin el rol Comercial en Cotifly, `ErrorWeb`'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
        '415':
          $ref: '#/components/responses/TipoContenidoNoSoportado'
        '429':
          description: '`IA_TOPE_DIARIO`: el comercial agotó su cupo diario de IA en NEXO (sin `Retry-After`; no afecta a los demás)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '503':
          description: '`NEXO_NO_DISPONIBLE`: la importación inteligente está apagada, NEXO no responde, tardó más de 90 s o respondió el 429 por minuto (`detalle.motivo` con el `Retry-After`). El comercial elige los valores a mano'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/licitaciones/aplicar-mapeo:
    post:
      operationId: aplicarMapeoLicitacion
      tags: [web]
      summary: Aplica en NEXO el mapeo confirmado a todas las filas y las traduce a líneas de licitación de Cotifly
      description: |
        HU-044.3 (#254, ADR-028 y ADR-029; **provisional, se renumera al integrar**). Reenvía el mapeo confirmado y TODAS las filas de
        la hoja a `POST {Nexo:UrlBase}/api/captura-solicitudes/aplicar-mapeo`, con la identidad del comercial (Rol Comercial). NEXO
        convierte cada fila con las reglas de su captura (diccionario del cliente por `nit_cliente`, transformaciones como toneladas a
        kg, «ORIGEN - DESTINO» o coma decimal) y Cotifly traduce cada línea al formato de `LineaLicitacionWeb`, lista para
        `POST /web/licitaciones`, sin que el front arme las líneas a mano. No guarda nada.

        **Líneas (`lineas[]`).** Usan los mismos nombres que `lineas[]` de `POST /web/licitaciones`, más `fila_excel` (el número de fila
        de Excel que dio NEXO) y `linea_nexo` (la línea de negocio de NEXO). `fila` es el índice base 0 en las `filas` enviadas
        (`fila = fila_excel - primera_fila`). Los ids de municipio van **siempre en `null`** (los resuelve el alta). `peso_kg` es la
        carga sin tara. Una mercancía sin código recibe el más parecido del catálogo del cubicador (si lo hay); si no, queda sin código
        y lo escoge el comercial.

        **Línea de negocio.** `linea_negocio` es la de **Cotifly** (la misma traducción de `normalizar-valores`, ADR-029) y `linea_nexo`
        la de NEXO. Si NEXO trae una línea sin equivalencia en Cotifly, la fila vuelve en `lineas[]` (con `linea_negocio = null`) **y** en
        `errores[]` con el código `LINEA_NEGOCIO_SIN_EQUIVALENCIA`: el comercial elige la línea en la revisión.

        **Errores por fila (`errores[]`).** Una fila con errores de NEXO va **solo** en `errores[]` (NEXO devuelve hasta 100 en la lista);
        `campo` va tal como lo manda NEXO. No reemplaza las validaciones de `POST /web/licitaciones`: la línea se valida al crear.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AplicarMapeoWeb'
      responses:
        '200':
          description: Las líneas traducidas y los errores por fila (también 200 con `errores[]` por fila)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapeoAplicado'
        '400':
          description: |
            Validación local, sin llamar a NEXO y con los códigos de NEXO: `MAPEO_REQUERIDO`, `DEMASIADAS_COLUMNAS` (más de 100
            columnas, o una fila con más de 100 celdas), `COLUMNA_INVALIDA`, `COLUMNA_FUERA_DE_RANGO`, `CAMPO_INVALIDO`,
            `CAMPO_DUPLICADO`, `TRANSFORMACION_INVALIDA`, `EXCEL_SIN_DATOS`, `DEMASIADAS_FILAS` (más de 5000, el tope de NEXO),
            `FILA_INVALIDA`, `CLIENTE_NIT_INVALIDO`. De NEXO, el 400 del mapeo con su código (`CAMPO_REQUERIDO`,
            `TRANSFORMACION_NO_APLICA`...). Un cuerpo que no es JSON: `ErrorWeb`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '403':
          description: '`NEXO_SIN_PERMISO`: NEXO respondió 401/403 para el comercial. Sin el rol Comercial en Cotifly, `ErrorWeb`'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
        '415':
          $ref: '#/components/responses/TipoContenidoNoSoportado'
        '429':
          description: '`IA_TOPE_DIARIO`: el comercial agotó su cupo diario de IA en NEXO'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '503':
          description: '`NEXO_NO_DISPONIBLE`: la importación inteligente está apagada, NEXO no responde o respondió el 429 por minuto'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/clientes/{nit}/destinatarios-previos:
    get:
      operationId: obtenerDestinatariosPrevios
      tags: [web]
      summary: Destinatarios usados en envíos anteriores para un cliente
      description: Solo considera envíos del comercial autenticado. Lista vacía si nunca se le ha enviado.
      security:
        - bearer: []
      parameters:
        - name: nit
          in: path
          required: true
          schema:
            type: string
            maxLength: 20
      responses:
        '200':
          description: Destinatarios del último envío
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destinatarios'
        '400':
          description: 'El NIT supera 20 caracteres (`ErrorWeb`). Declarado en #138 al comparar las acciones con el contrato.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/cotizaciones/{folio}/correo/vista-previa:
    post:
      operationId: previsualizarCorreo
      tags: [web]
      summary: Renderiza el correo sin enviarlo
      description: |
        Devuelve asunto, cuerpo y destinatarios prediligenciados para el modal de confirmación. HU-033 (#199): también el
        cuerpo en HTML tal como lo recibe el cliente (`cuerpo_html`), el resumen sin desglose (`resumen`: precio por ruta y
        total), la copia oculta al comercial (`copia_oculta`) y, en un ambiente de pruebas, `entorno_pruebas = true` con el
        buzón (`redirigido_a`) y el texto del aviso (`aviso`) para mostrarlo tal cual.
        #228: lo que trae el borrador se valida igual que en `POST .../enviar` (asunto y direcciones sin caracteres de
        control, formato estricto de cada dirección, el tope de destinatarios entre `para` y `cc`, 10 por defecto, largos), después de
        comprobar el dueño. Sin `para` se precargan los destinatarios previos (no se exige `para`).
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BorradorCorreoWeb'
      responses:
        '200':
          description: Vista previa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VistaPreviaCorreo'
        '400':
          description: |
            #228: el borrador no pasaría el envío. `ErrorWeb` (`CORREO_INVALIDO`: asunto o dirección con caracteres de control,
            dirección mal formada, asunto o cuerpo demasiado largos) o `ErrorNegocio` `CORREO_DEMASIADOS_DESTINATARIOS` (más
            destinatarios entre `para` y `cc` que el tope, 10 por defecto y configurable, con `detalle.maximo` y `detalle.recibidos`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '413':
          $ref: '#/components/responses/CuerpoDemasiadoGrande'
        '415':
          $ref: '#/components/responses/TipoContenidoNoSoportado'

  /pdfs/{archivo}:
    get:
      operationId: descargarPdf
      tags: [sistema]
      summary: Descarga el PDF de una cotización (inline)
      description: |
        Requiere sesión. Solo el dueño de la cotización, un director (HU-037.3, #211: de cualquier regional) o un gerente_comercial cuya
        regional efectiva incluye al dueño (con la misma regla que `GET /web/cotizaciones/regional`; si la regional del gerente
        no se conoce o la fuente está caída, solo el dueño, 404 para el gerente) puede descargarlo. Como exige `Authorization`, el frontend lo descarga con HttpClient
        como blob (un `<a href>` directo no envía el header).
        En el backend Python este endpoint era público (hallazgo de seguridad corregido).
        La URL firmada sin `Authorization` (`?t=`, ADR-011 §3), que solo emitía Google Chat, se retiró en HU-013.9 (#105):
        el endpoint exige siempre Bearer.
      security:
        - bearer: []
      parameters:
        - name: archivo
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]+\.pdf$'
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: Falta el token, expiró o fue revocado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'
              example:
                error: "Inicia sesión de nuevo."
        '404':
          description: No existe o no es tuya
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /health:
    get:
      operationId: salud
      tags: [sistema]
      summary: Liveness
      security: []
      responses:
        '200':
          description: Servicio vivo
          content:
            application/json:
              schema:
                type: object
                required: [status, servicio, entorno]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  servicio:
                    type: string
                    example: cotifly-api
                  entorno:
                    type: string
                    example: Development

  /health/ready:
    get:
      operationId: saludListo
      tags: [sistema]
      summary: Readiness (base de datos alcanzable)
      security: []
      responses:
        '200':
          description: Listo
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ready]
        '503':
          description: No disponible
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [unavailable]
                  detalle:
                    type: string

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT HS256, 60 minutos. Claims: `sub` (UUID del usuario en `UsuariosWeb`),
        `jti`, `username`, `rol` (`comercial` | `gerente_comercial` | `director`).

  parameters:
    Folio:
      name: folio
      in: path
      required: true
      schema:
        type: string
        maxLength: 50
      description: |
        Folio de la cotización (ADR-011): `PCN-[{nitCliente}-]{INICIALES}-DDMMAAAA-{NNN}[-vN]`.
        Se acepta cualquier folio existente (también los heredados del Python, como
        `PCN-23072026`), por eso no se valida con un patrón.
      example: PCN-DG-25092026-001
    RegionalFiltro:
      name: regional
      in: query
      required: false
      description: |
        HU-037.3 (#211). Regional a consultar (una de `GET /web/regionales`; se compara sin mayúsculas ni espacios sobrantes).
        `director`: sin ella, todas las regionales; con ella, solo esa. `gerente_comercial`: solo se acepta la suya (otra: 403
        `REGIONAL_NO_PERMITIDA`). Vacía o solo espacios equivale a no enviarla.
      schema:
        type: string
        maxLength: 200
      example: OCCIDENTE
    DesdeMetricas:
      name: desde
      in: query
      required: false
      description: |
        Primer día del periodo (AAAA-MM-DD, fecha de America/Bogota, incluido). Por defecto el 1 de enero del año en
        curso. El periodo va de `desde` 00:00 a `hasta` 24:00 en Bogotá (UTC−5) y se compara con `createdAt` de la
        versión vigente. Rango máximo de 3 años.
      schema:
        type: string
        format: date
      example: '2026-01-01'
    HastaMetricas:
      name: hasta
      in: query
      required: false
      description: Último día del periodo (AAAA-MM-DD, America/Bogota, incluido). Por defecto hoy.
      schema:
        type: string
        format: date
      example: '2026-09-29'
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        Concurrencia optimista (HU-013, ADR-018). El `ETag` (o `row_version`) que el frontend leyó en
        `GET /web/cotizaciones/{folio}/costeo`, o el `row_version` de la `accion_propuesta` que confirma. Con comillas o
        sin ellas. Si la cotización cambió entretanto responde 409 `CONFLICTO_CONCURRENCIA` sin cambiar nada (el frontend
        recarga el costeo y vuelve a pedir la confirmación). Sin el encabezado, el servidor igual confirma contra la
        versión que cargó (un PDF nunca queda vigente con un precio que cambió mientras se generaba). Rige desde el script
        `0006` (`versionNegocio`, #98). Opcional solo en `POST .../costeo/pdf`; las mutaciones de la etapa final usan
        `IfMatchObligatorio`.
      schema:
        type: string
        maxLength: 64
      example: '"7"'
    IfMatchObligatorio:
      name: If-Match
      in: header
      required: true
      description: |
        Obligatorio en las mutaciones de la etapa final (ADR-018 §8): el `ETag`/`row_version` leído en
        `GET .../costeo` o el `row_version` de la `accion_propuesta`. Sin él responde 428 `PRECONDICION_REQUERIDA`; si no
        coincide, 409 `CONFLICTO_CONCURRENCIA`, sin cambios. Rige desde el script `0006` de #98; antes de aplicarlo el
        servidor no lo exige.
      schema:
        type: string
        maxLength: 64
      example: '"7"'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Opcional (ADR-018 §8). Clave única por intención del usuario (UUID generado al pulsar Confirmar o el botón). Una
        repetición con la misma clave y el mismo usuario en 24 h devuelve la respuesta guardada de la primera petición sin
        volver a ejecutarla (un doble clic no duplica el conexo en Nexo ni crea `-v2` y `-v3`). La misma clave con otro
        cuerpo responde 409 `ErrorNegocio` con `codigo = IDEMPOTENCY_KEY_REUTILIZADA` (D4, E2E 2026-10-16; antes 400 `ErrorWeb`
        con el texto) y no ejecuta nada; una clave fuera de 8 a 64 caracteres sigue siendo 400 `ErrorWeb`. Solo los éxitos consumen la clave: en `re-solicitar`, un 200 con `error_envio` (Nexo
        falló) tampoco la consume, y repetirla vuelve a ejecutar (con el mismo `If-Match` responde `CONFLICTO_CONCURRENCIA`:
        recargar y reintentar). En `POST /web/solicitudes-costeo` (#173) toda captura 201 la consume, también con `error_envio`.
        #191: la clave se guarda en la base (sobrevive a un reinicio y la comparten las réplicas). Una repetición simultánea que
        cae en la misma réplica espera a la primera y recibe su respuesta; si cae en otra réplica mientras la primera está en
        curso, responde 409 `ESTADO_NO_PERMITE` con `detalle.motivo = CAPTURA_EN_CURSO` sin ejecutar nada (esperar unos segundos
        y repetir, o revisar el folio). Los números del cuerpo se comparan por valor:
        `1.5` y `1.50` son la misma petición.
      schema:
        type: string
        minLength: 8
        maxLength: 64
      example: 5f0c1e2a-9b8d-4c7e-a6f5-3d2c1b0a9f8e

  headers:
    ETag:
      description: |
        Versión de negocio de la cotización (`Cotizaciones.versionNegocio`, script 0006), entre comillas. Valor opaco: el
        cliente no lo interpreta, lo reenvía en `If-Match`. Mismo valor que `row_version` del cuerpo.
      schema:
        type: string
      example: '"7"'
    RetryAfter:
      description: |
        Segundos que conviene esperar antes de reintentar o volver a consultar. Con `SERVICIO_OCUPADO` (#125) siempre 1; con
        `CUBICADOR_OCUPADO` (opción C) 10; en el 202 de `POST /web/cubicacion` y en `GET /web/cubicacion/{id}` con `en_proceso`
        (opción D) 2; en el 429 (endurecimiento A, #199) lo que falta para que se abra la ventana del límite. Las demás causas del
        503 no lo envían.
      schema:
        type: integer
      example: 1

  responses:
    PrecondicionRequerida:
      description: '`PRECONDICION_REQUERIDA`: falta `If-Match` en una mutación de la etapa final (ADR-018 §8)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorNegocio'
          example:
            error:
              codigo: PRECONDICION_REQUERIDA
              mensaje: "Recarga la cotización y vuelve a intentarlo (falta If-Match)."
    Validacion:
      description: Cuerpo inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWeb'
    CredencialesInvalidas:
      description: Identidad no válida o sin rol autorizado (mensaje genérico)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWeb'
          example:
            error: "Credenciales inválidas"
    SesionExpirada:
      description: Falta el token, expiró o fue revocado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWeb'
          example:
            error: "Inicia sesión de nuevo."
    SinPermiso:
      description: El rol del usuario no permite esta operación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWeb'
          example:
            error: "No tienes permiso para esta operación."
    NoEsTuya:
      description: La cotización no existe o pertenece a otro comercial
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWeb'
          example:
            error: "Cotización no encontrada o no es tuya."
    DemasiadasPeticiones:
      description: |
        Límite de peticiones alcanzado (`/api/auth/*`: `LimiteAuth`; `/web/chat`: `LimiteChat`). Endurecimiento A (#199): trae
        `Retry-After` con los segundos que faltan para que se abra la ventana.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWeb'
          example:
            error: "Demasiadas peticiones. Intenta de nuevo en unos segundos."
    CuerpoDemasiadoGrande:
      description: |
        Endurecimiento A (#199): el cuerpo supera el límite de `/web/*` (`SeguridadHttp:LimiteCuerpoWebBytes`, 64 KB por defecto;
        12 MB en `/web/licitaciones*` y, desde HU-035.1, en `POST /web/mercancias/analizar-excel`, `SeguridadHttp:LimiteCuerpoLicitacionBytes`).
        `ErrorWeb`; no se procesa nada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWeb'
          example:
            error: "El cuerpo de la petición es demasiado grande."
    TipoContenidoNoSoportado:
      description: |
        Endurecimiento A (#199): el cuerpo no viene como `application/json` (o como `multipart/form-data` donde el endpoint lo pide).
        `ErrorWeb`; no se procesa nada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWeb'
          example:
            error: "Cuerpo inválido: envía JSON con Content-Type: application/json."
    ErrorInterno:
      description: |
        Endurecimiento A (#199): error interno no controlado (una excepción, o un error que no es del cliente como una restricción
        única que el caso de uso no tradujo). Siempre `ErrorNegocio` con `codigo = ERROR_INTERNO`, un mensaje genérico y, como único
        `detalle`, `id_correlacion` (el id de la petición en el log del servidor: dárselo a soporte); nunca el mensaje de la excepción
        ni la traza, que quedan solo en el log con ese id. Una petición que el cliente abortó no recibe respuesta. Reintentar más tarde; si se repite,
        reportar a soporte la hora y la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorNegocio'
          example:
            error:
              codigo: ERROR_INTERNO
              mensaje: "Ocurrió un error interno. Intenta de nuevo y, si se repite, contacta a soporte."
              detalle:
                id_correlacion: "0HNPGF5LGM4MM:00000001"
    ErrorInternoAuth:
      description: |
        Endurecimiento A (#199): error interno no controlado en `/api/auth/*`. `ErrorWeb` con el mismo mensaje genérico (la única forma
        de error de ese grupo); el detalle queda solo en el log del servidor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWeb'
          example:
            error: "Ocurrió un error interno. Intenta de nuevo y, si se repite, contacta a soporte."

  schemas:
    Nulo:
      description: |
        Valor `null` en OAS 3.0.3 (que no tiene `type: 'null'`): un objeto anulable sin propiedades. Se usa como
        alternativa de `oneOf` para campos que pueden no traer valor; el servidor siempre envía `null`, nunca `{}`.
      type: object
      nullable: true
      maxProperties: 0

    ErrorWeb:
      type: object
      required: [error]
      properties:
        error:
          type: string

    ErrorNegocio:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [codigo, mensaje]
          properties:
            codigo:
              type: string
              description: |
                Mismos códigos que el backend Python, más los nuevos del backend .NET:
                `CLIENTE_BUSQUEDA_NO_DISPONIBLE` (HU-005.2: Nexo sin configurar, sin
                respuesta o el comercial sin `idUsuarioExterno`; nunca por "no hubo
                candidatos", que es `200` con `candidatos: []`; 503 en `GET /web/clientes` desde OBS-1021B-3), `HERRAMIENTA_DESCONOCIDA` (el modelo pidió una
                herramienta inexistente, HU-003.10), `AJUSTE_MARGEN_INVALIDO` (HU-003.4:
                el margen negociado por el comercial está fuera de rango para su método de
                cálculo, es decir negativo o ≥ 1 con `margen`, o el método no es
                `margen`/`markup`), `FOLIO_DUPLICADO` (HU-003.5: ya existe una cotización
                con ese folio; el Python versionaba el folio en silencio, en .NET el folio lo
                genera HU-003.6 y la colisión se informa), `FOLIO_CONSECUTIVO_AGOTADO` (HU-003.6:
                ya se usaron los 999 folios del día de esas iniciales, ADR-011), `CORREO_DESHABILITADO` (HU-003.5:
                `Correo:Habilitado=false`, el valor por defecto; en `/web/*` se responde 503), `CORREO_NO_REINTENTABLE`
                (HU-033, #199: 409 en `POST .../correos/{correoId}/reintentar`: el envío no está `fallido`, nunca llegó a
                MailSender o MailSender ya no lo conoce),
                `CORREO_INVALIDO` (HU-003.5: destinatarios `para`/`cc` inválidos o vacíos, asunto
                de más de 300 caracteres o cuerpo de más de 5000; lo devuelve la herramienta
                `enviar_correo`, y en `POST /web/cotizaciones/{folio}/enviar` va como `ErrorWeb` 400),
                `MUNICIPIOS_NO_DISPONIBLE` (`GET /web/municipios`: mismas causas que
                `CLIENTE_BUSQUEDA_NO_DISPONIBLE`, catálogo de Nexo), `CATALOGOS_FLETE_NO_DISPONIBLE`
                (503 en `GET /web/catalogos-flete`: catálogos maestros de Nexo sin copia utilizable; también 503 en
                `POST /web/solicitudes-costeo` si no se puede validar `tipo_vehiculo`/`clase_viaje`, HU-013.10),
                `ITEMS_REQUERIDOS` (`POST /web/cubicacion`: falta `items` o viene vacío; `CUBICACION_NO_DISPONIBLE` se retiró con
                la cubicación de Nexo en HU-023.2, #157: "Calcular cubicaje" responde los códigos del cubicador),
                `CUBICACION_DEMASIADO_GRANDE` (vigente desde HU-023, #176: 400 cuando las mercancías de una ruta o de un cálculo suman
                más de 10.000 unidades, el tope del cubicador; Cotifly no llama al cubicador ni guarda nada. Aplica en "Calcular
                cubicaje", la captura, el recálculo de vehículos y la licitación, siempre con el cubicador configurado) y `TRM_NO_DISPONIBLE`
                (HU-012.1/HU-012.2, ADR-014: ninguna fuente de la TRM entregó una TRM válida para el día; por defecto
                DolarApi y, de respaldo, los datos abiertos de la Superintendencia Financiera; no se cotiza en USD y el
                comercial puede reintentar o cotizar en COP; en `POST /web/licitaciones` con `moneda = USD` también). Endurecimiento A
                (#199): se retiran del enum los códigos que ningún código emite (`AJUSTE_ID_INVALIDO`, `TARIFA_FUENTE_NO_DISPONIBLE`,
                `TARIFA_CONFIG_INVALIDA` y `MUNICIPIO_ARGUMENTO_INVALIDO`, este último de la herramienta `resolver_municipio`, retirada
                con el agente legado en HU-013.9; los tres de tarifa y municipio, además, se borraron del backend en el endurecimiento B);
                `clsContratoReflexionTests` exige que cada valor del enum lo emita algún código.
                Costeo en Nexo (ADR-015): `SOLICITUD_COSTEO_INVALIDA` (formulario ampliado fuera de los límites de
                Nexo), `COSTEO_NEXO_NO_DISPONIBLE` (Nexo sin configurar, 5xx, red, circuito abierto o el comercial sin
                `idUsuarioExterno`), `COSTEO_NEXO_TIEMPO_AGOTADO` (Nexo no respondió a tiempo), `COSTEO_NEXO_RECHAZADA`
                (Nexo respondió 4xx; el código de Nexo va en `detalle.motivo`), `COSTEO_NEXO_SOLICITUD_INVALIDA` (Nexo respondió 400 al alta:
                `error_envio` definitivo, no se reintenta), `COSTEO_NO_REINTENTABLE` (409: la
                cotización no está en `error_envio` ni en `pendiente_envio`), `COSTEO_NO_LISTO` (409: la cotización todavía no
                tiene el costeo con margen) y `PDF_YA_GENERADO` (409: ya tiene un PDF **vigente**; un ajuste de la etapa final lo invalida con
                `pdf_desactualizado = true` y entonces se regenera, ADR-018 §11).
                Cubicador (HU-021.5, #133; HU-023.1, #156): `CUBICADOR_NO_DISPONIBLE` (503 en `GET /web/tipos-mercancia`,
                `/web/tipos-carroceria`, `/web/tipos-vehiculo` y `POST /web/cubicacion` (HU-023.2, #157: sin respaldo) sin cubicador o
                sin respuesta, y en `POST /web/solicitudes-costeo` y
                `POST /web/licitaciones` solo con `Cubicador:RespaldoSiFalla = false`), `CUBICADOR_NO_AUTORIZADO` (503: el cubicador
                rechazó la llave de Cotifly; nunca va al respaldo), `CUBICADOR_RESPUESTA_INVALIDA` (503:
                la respuesta no cumple el contrato, por ejemplo un vehículo sin peso; nunca va al respaldo y no se guarda nada),
                `CUBICADOR_OCUPADO` (opción C, E2E 2026-10-16: 503 con `Retry-After: 10` en `POST /web/cubicacion` o `fallida` en
                `GET /web/cubicacion/{id}`: el cupo global de llamadas al cubicador no se liberó a tiempo o hay demasiadas cubicaciones en
                curso; en la captura, el recálculo y la licitación cuenta como una caída) y los
                rechazos 400 del cubicador con su mismo código: `MERCANCIAS_REQUERIDAS`, `MERCANCIA_DESCONOCIDA`,
                `MERCANCIA_NO_CUBICABLE` y `DIMENSIONES_INVALIDAS` (no se guarda nada). D1 (E2E 2026-10-16): un 422 del cubicador
                (validación de su esquema en `POST /recomendaciones`) es 400: `DIMENSIONES_INVALIDAS` o `POSICION_INVALIDA` con
                `detalle.item` si señala una mercancía, o `CUBICADOR_PETICION_RECHAZADA` si no; nunca va al respaldo. En
                `POST /web/cubicacion`, `POSICION_INVALIDA` también es la cantidad de un ítem fuera de 1 a 100.000. D-1019-1
                (E2E 2026-10-19): `MERCANCIA_DESCONOCIDA` y `MERCANCIA_NO_CUBICABLE` traen `detalle.item` (base 0) y
                `detalle.campo = codigo_mercancia` cuando se sabe qué mercancía es (en la captura, también `detalle.ruta`).
                Resultado en Nexo (HU-005.14), con el mismo código de Nexo: `RESULTADO_YA_DEFINIDO` y
                `COTIZACION_NO_ENTREGADA` (409, sin cambio local) y `USAR_RESULTADO_NEXO` (409: `/seguimiento`
                sobre una cotización que pasó por Nexo). HU-018.1 (#155): `MOTIVO_NO_PERMITIDO` (400 en `POST .../resultado` y
                `POST .../seguimiento` al marcar `perdida`: el motivo falta o no es de la lista de `GET /web/motivos-perdida`, o es
                `Otro` sin `comentario`; `detalle.motivos_permitidos` trae la lista y `detalle.requiere_comentario` si solo faltó el
                comentario).
                `PRECIO_INVALIDO` queda solo para el cálculo de precio.
                En `GET /web/metricas/regional` (HU-010.1, ADR-016) y en `GET /web/cotizaciones/regional` (HU-016.1, #154): `REGIONAL_NO_ASIGNADA` (409: el gerente no
                tiene regional en `DimEjecutivo` ni en `UsuariosWeb.regional`) y `REGIONAL_NO_DISPONIBLE` (503: la
                conexión a `DimEjecutivo` está configurada pero falla). HU-037.3 (#211): `REGIONAL_NO_PERMITIDA` (403: un
                `gerente_comercial` pidió con `?regional=` una regional que no es la suya; el director puede pedir cualquiera).
                Licitaciones (HU-011, ADR-017): `ARCHIVO_REQUERIDO`, `FORMATO_NO_SOPORTADO`, `EXCEL_INVALIDO` y `EXCEL_SIN_DATOS`
                (mismos códigos que Nexo en `analizar-excel`), `ARCHIVO_DEMASIADO_GRANDE` (más de 10 MB) y
                `LICITACION_INVALIDA` (filas inválidas; el detalle viaja en `ReporteLicitacionInvalida`), `MARGEN_LINEA_DESCONOCIDA` en
                `POST /web/licitaciones` con `detalle.lineas_validas` (las líneas activas de Cotifly; con "Licitaciones", la línea de
                Nexo, además `detalle.motivo = LINEA_DE_NEXO`, HU-013.15) y `NEXO_SIN_PERMISO`
                (403 de Nexo al alta o al análisis: el comercial no tiene el rol de Cabina de Fletes; en `/web/*` responde 403).
                Pipeline determinista (HU-013, ADR-018): `CONFLICTO_CONCURRENCIA` (409: el `If-Match` no coincide con la
                versión actual de la cotización; nada cambió), `FOLIO_REQUERIDO` (400: `/web/chat` sin `folio`),
                `ESTADO_NO_PERMITE` (409: el estado de la cotización no admite la operación, por ejemplo con resultado
                registrado o un costeo que no está vencido, entregado ni con error de envío), `JUSTIFICACION_REQUERIDA`
                (400: margen por debajo del sugerido sin justificación; `detalle.margen_sugerido`), `CONEXO_INVALIDO`
                (400: servicio inexistente o inactivo en Nexo, o cantidad fuera de rango; el código de Nexo en
                `detalle.motivo`), `NEXO_NO_DISPONIBLE` (503: Nexo caído, sin configurar o sin respuesta al consultar o
                agregar servicios conexos) y `TEXTOS_COTIZACION_INVALIDOS` (400: asunto o introducción vacíos, largos o con
                URL o correos). `AJUSTE_MARGEN_INVALIDO` también es el margen fuera de 0 a 0,99 en
                `PUT .../costeo/margen`. `PDF_YA_ENVIADO` (409: la cotización ya se envió al cliente o tiene resultado;
                `detalle` trae `accion = nueva_version` con el método, el endpoint y el cuerpo para crear `-vN`),
                `PRECONDICION_REQUERIDA` (428: falta `If-Match`), `LINEA_SIN_COTIZACION_NEXO` (409: la línea no tiene
                todavía línea en la cotización de Nexo) y `TEXTOS_EDITADOS` (409: redactar sobre textos editados por el
                comercial sin `?sobrescribir=true`). `SERVICIO_OCUPADO` (503, #125: otra operación retiene el candado del
                folio más allá de los reintentos; nada se guardó y se puede reintentar). `RUTA_REQUERIDA` (400, HU-021.8 #135: la
                cotización tiene varias rutas y el ajuste de margen o el cambio de conexos no dice a cuál aplica; `detalle.rutas`
                trae `linea_orden`, `linea_solicitud_id`, `origen` y `destino` de cada una, sin montos) y `RUTA_INEXISTENTE` (400:
                la ruta indicada no es de la cotización, o `linea_orden` y `linea_solicitud_id` no son la misma ruta).
                HU-028.1 (#183, Nexo #320): `RUTA_RECHAZADA` (409: la Mesa de Costeo de Nexo rechazó la ruta indicada, todos sus
                camiones; no admite ajuste de margen ni de conexos; `detalle` trae `linea_orden`, `linea_solicitud_id` y
                `motivo_rechazo`) y `SIN_RUTAS_COTIZABLES` (409: la Mesa rechazó todas las rutas; `POST .../costeo/pdf` no genera
                el PDF, decisión D1).
                Endurecimiento A (#199): `ERROR_INTERNO` es 500 (antes salía como 400) y lo emiten tanto los casos de uso (por ejemplo,
                el comercial autenticado no existe en `UsuariosWeb`) como el manejador global de errores no controlados, siempre con un
                mensaje genérico y con `detalle.id_correlacion` como único detalle (respuesta común `ErrorInterno`). Una restricción única que el caso de uso no tradujo
                (`REGISTRO_DUPLICADO` interno) también sale como 500 `ERROR_INTERNO`, sin el nombre de la restricción.
                Endurecimiento B (#199): `COTIZACION_NEXO_NO_ENCONTRADA` (409 en `POST .../resultado`: Nexo respondió 404
                `COTIZACION_NO_ENCONTRADA`, no reconoce la cotización de Nexo del folio; `detalle.motivo` = ese código; nunca el 404
                "no es tuya") y `FOLIO_INVALIDO` (400: el folio que arma el servidor no cumple ADR-011; en la práctica solo en la
                versión nueva de `re-solicitar` y en `nueva_version` de `PUT .../solicitud` si el folio de la original no tiene esa forma
                o el `-vN` pasaría de 50 caracteres; en la captura y la licitación solo si el folio armado no la cumple, lo que el
                límite de 20 del NIT ya impide; el PDF no lo responde).
                HU-036.2 (#206): `COTIZACION_NO_FINALIZABLE` (409 en `POST .../finalizar`: `estado_costeo` distinto de `autocosteo` y
                `entregada`, sin el costeo de Nexo listo no hay precio que aceptar; `detalle.estado_costeo` trae el estado actual; o
                con un conexo de Nexo pendiente de leer, `detalle.motivo = conexos_pendientes_de_leer`; #228: o con conexos que todavía
                no están en Nexo, `estado_nexo = pendiente`, `detalle.motivo = conexos_pendientes_en_nexo` y `detalle.conexos_pendientes`).
                HU-036.3 (#207): `COTIZACION_NO_FINALIZADA` (409: "Finaliza la cotización antes de..."; `POST .../costeo/pdf`,
                `POST .../enviar`, `POST .../costeo/textos/redactar`, `PUT .../costeo/textos` y `POST .../resultado` exigen la
                cotización finalizada; `detalle` trae `accion = finalizar`, `metodo = POST` y `endpoint` = `.../finalizar`. No aplica a
                las ya enviadas o con resultado ni a las del chat; en `/resultado`, solo con el costeo listo: antes del costeo siguen la
                perdida solo en Cotifly y la ganada pendiente de sincronizar). Y `PDF_YA_ENVIADO` también con la cotización
                **finalizada** (margen, conexos, conexos en Nexo, re-solicitud en el mismo folio y recálculo de camiones; la edición
                pasa a `nueva_version`).
                HU-042.2 (#243, ADR-027): `SAP_MARGEN_NO_CONFIGURADO` (503: en `POST /web/admin/sap-margen/sincronizar` con la
                sincronización deshabilitada, `SapTm:SincronizacionHabilitada = false`; en los dos endpoints, habilitada pero sin
                `SapTm:Url`, `SapTm:User` o `SapTm:Pass` o con la URL o el mandante mal escritos, con el motivo en `detalle.motivo`; el
                margen sigue con la copia local existente o la política de la línea),
                `SAP_MARGEN_SINCRONIZACION_EN_CURSO` (409 en `POST /web/admin/sap-margen/sincronizar`: esta réplica ya está
                sincronizando; nada cambió) y `SAP_MARGEN_NO_DISPONIBLE` (503 en `/web/admin/sap-margen/*`: la base de Cotifly no
                respondió al leer el estado o al registrar la corrida; reintentable).
                Contrato único de NEXO, fase 0 (#278, DU §8 y §9): `LINEA_NEGOCIO_INVALIDO` (400, mismo código que NEXO: la línea de
                negocio que viajaría a NEXO, el `mapeoLineasNexo` de la línea de la ruta, no es una de las seis de NEXO: `Nacional`,
                `Puerto a interior`, `Interior a puerto`, `Devolución de contenedor`, `Andino` o `Licitaciones`, en cualquier escritura
                que NEXO acepte. En `POST /web/solicitudes-costeo` y `POST /web/licitaciones` se valida antes de guardar y no se llama a
                NEXO; `detalle.linea_negocio`, `detalle.linea_negocio_nexo` y `detalle.permitidas`. Al reenviar una guardada, o si NEXO lo
                responde, la cotización queda en `error_envio` reintentable: el mapeo no tiene endpoint para corregirse, avisar a soporte) e `IA_TOPE_DIARIO`
                (429, mismo código que NEXO, sin `Retry-After`: el comercial agotó su cupo DIARIO de IA en NEXO al analizar un Excel; se
                reintenta al día siguiente. El `429 DEMASIADAS_SOLICITUDES` de NEXO, el cupo por minuto, sigue siendo
                `COSTEO_NEXO_NO_DISPONIBLE` con el `Retry-After` en `detalle.motivo`). `CUBICACION_DEMASIADO_GRANDE` también si NEXO
                lo responde al alta (más de 200 posiciones o 10.000 unidades en una línea): `error_envio` definitivo.
                HU-045.2 (#264): `SEGURO_SIN_VALOR_MERCANCIA` (400 en `PUT .../costeo/seguro`: la ruta no tiene `valor_mercancia`; con
                `detalle.linea_orden` y `detalle.linea_solicitud_id`).
                HU-044.1 (#252, ADR-028): importación inteligente del Excel con NEXO. Los rechazos de NEXO llegan con su mismo código y su
                mensaje: `ENCABEZADOS_REQUERIDOS`, `DEMASIADAS_COLUMNAS`, `DEMASIADAS_FILAS`, `ENCABEZADO_DEMASIADO_LARGO`,
                `COLUMNA_FUERA_DE_RANGO`, `COLUMNA_INVALIDA`, `MAPEO_REQUERIDO`, `CAMPO_INVALIDO`, `CAMPO_DUPLICADO`, `CAMPO_REQUERIDO`,
                `TRANSFORMACION_INVALIDA`, `TRANSFORMACION_NO_APLICA`, `VALORES_REQUERIDOS`, `DEMASIADOS_VALORES`, `VALOR_DEMASIADO_LARGO`,
                `CLIENTE_NO_ENCONTRADO`, `CLIENTE_NIT_INVALIDO` (el NIT no es de ningún cliente ni prospecto al guardar una plantilla o un
                formato), `NOMBRE_DEMASIADO_LARGO`, `INSTRUCCIONES_DEMASIADO_LARGAS`, `RECETA_REQUERIDA`, `RECETA_INVALIDA`, `RECETA_SIN_FILAS`
                y `TIPO_TERMINO_INVALIDO` (400), `PLANTILLA_NO_ENCONTRADA` y `RECETA_NO_ENCONTRADA` (404 en NEXO, al borrar).
                `CLIENTE_REQUERIDO` (400) también lo responde Cotifly, sin llamar a NEXO, al listar plantillas o formatos sin el NIT de la
                licitación. `IA_TOPE_DIARIO` (429) es el cupo diario de IA del comercial y no bloquea a los demás. Sin la importación
                habilitada, NEXO caído o sin respuesta a tiempo: `NEXO_NO_DISPONIBLE` (503). Los endpoints `/web` llegan con #253 a #256.
                HU-044.2 (#253): `VALIDATION_ERROR` (400) es el de NEXO en `leer-estructura` (la forma del formulario), con su mensaje y
                solo los nombres de los campos en `detalle.campos`. HU-044.7 (#290): el mismo `VALIDATION_ERROR` (400) lo responde Cotifly en
                `POST /web/licitaciones` cuando `origen_lectura` no es `analizar_excel` ni `leer_estructura` (con `detalle.campos = ["origen_lectura"]`).
                `LECTURA_DEMASIADO_GRANDE` (400) lo responde Cotifly en
                `leer-estructura`, sin llamar a NEXO, cuando el archivo cabe solo pero no con la receta y las instrucciones.
              enum:
