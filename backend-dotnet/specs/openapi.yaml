  /web/cotizaciones/{folio}/costeo/seguro:
    put:
      operationId: cambiarSeguroCosteo
      tags: [web]
      summary: Incluye o quita el seguro de la mercancía de UNA ruta y recalcula el precio de esa ruta y el total
      x-issue: '#264 (HU-045.2; usa el script 20 de HU-045.1, #263)'
      description: |
        HU-045.2 (#264, ADR-032). El check "incluir seguro" de cada ruta en el costeo (decisión 3 de HU-045: endpoint propio con
        `If-Match`, como el ajuste de margen). Es el seguro de la mercancía de la **póliza específica** (NOGE0076): se cobra aparte del
        flete y nunca como descuento.

        - **Cálculo.** Al incluirlo se toma la tasa VIGENTE (`TarifasSeguro`, la de `tasa_seguro_vigente` del costeo; hoy 0,345 %
          = `0.003450`) y se copia en la ruta: `valor_seguro = valor_mercancia × tasa_seguro` en pesos, **sin redondear a pesos**
          (decisión del usuario del 2026-11-09; se guarda en centavos, la escala de `costoSeguro DECIMAL(18,2)`). Un cambio posterior
          de la tasa vigente no toca las rutas que ya lo tienen.
        - **Precio.** El seguro **no lleva margen** (decisión 1): `precio_final_linea` = (fletes + retorno + levante) con el margen
          + la venta de los conexos + `valor_seguro`, y `precio_final` es la suma de las rutas. En USD se convierte con la
          `trm_aplicada` de la cotización (decisión 2). `costo_final` no cambia: el seguro no es costo de Nexo. Sin flete (ruta sin
          costeo) la ruta no tiene precio, como con los conexos.
        - **Sin `valor_mercancia`:** 400 `SEGURO_SIN_VALOR_MERCANCIA` (decisión 4) y nada cambia. El valor se cambia editando la
          solicitud o con `datos_carga.valor_mercancia` de la re-solicitud (versión nueva): el seguro se recalcula con la tasa vigente
          (decisión 5). Si la edición deja la ruta sin valor, el seguro sigue marcado pero sin tasa ni valor (no suma).
        - La ruta, con `linea_orden` o `linea_solicitud_id` como en `PUT .../costeo/margen` (`RUTA_REQUERIDA`, `RUTA_INEXISTENTE`).
        - **Regla del PDF (ADR-018 §11, HU-036):** enviada al cliente, con resultado o **finalizada**: 409 `PDF_YA_ENVIADO` (el mismo
          del margen, con la llamada de la versión nueva en `detalle`). Si no, se permite aunque haya PDF: queda invalidado
          (`pdf_desactualizado = true`; en el historial con el motivo `servicios_conexos`).
        - **Licitación:** 409 `ESTADO_NO_PERMITE` con `detalle.motivo = LICITACION` (la HU no la incluye todavía). Ruta rechazada por
          la Mesa: 409 `RUTA_RECHAZADA`.
        - Marcar una ruta que ya tiene el seguro (o quitarlo de una que no lo tiene) responde 200 sin cambios (idempotente).
        - No se envía a Nexo (decisión 6). Se audita en `EventosHerramienta` (`cambiar_seguro_costeo`) sin montos ni tasa.
        - `If-Match` **obligatorio** (428 `PRECONDICION_REQUERIDA` sin él; 409 `CONFLICTO_CONCURRENCIA` si no coincide). Solo el dueño.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
        - $ref: '#/components/parameters/IfMatchObligatorio'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeguroRutaWeb'
            example:
              incluye_seguro: true
              linea_orden: 1
      responses:
        '200':
          description: Seguro de la ruta incluido o quitado, precios recalculados (esa ruta y el total) y la tasa vigente
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CosteoCotizacion'
        '400':
          description: '`SEGURO_SIN_VALOR_MERCANCIA` (con `detalle.linea_orden` y `detalle.linea_solicitud_id`), `RUTA_REQUERIDA` (con `detalle.rutas`) o `RUTA_INEXISTENTE` (`ErrorNegocio`); `ErrorWeb` sin `incluye_seguro` o si el cuerpo no es JSON válido'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
              example:
                error:
                  codigo: SEGURO_SIN_VALOR_MERCANCIA
                  mensaje: "La ruta 1 no tiene valor de la mercancía: el seguro es el valor de la mercancía por la tasa vigente. Edita la solicitud con el valor y vuelve a marcarlo."
                  detalle:
                    linea_orden: 1
                    linea_solicitud_id: "5b1f6a1e-2c3d-4e5f-8a9b-0c1d2e3f4a5b"
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '409':
          description: '`PDF_YA_ENVIADO` (enviada, con resultado o finalizada), `RUTA_RECHAZADA`, `ESTADO_NO_PERMITE` (licitación, `detalle.motivo = LICITACION`) o `CONFLICTO_CONCURRENCIA`; sin cambios'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
              example:
                error:
                  codigo: PDF_YA_ENVIADO
                  mensaje: "La cotización ya está finalizada: crea una versión nueva para cambiarla."
                  detalle:
                    accion: nueva_version
                    metodo: POST
                    endpoint: /web/cotizaciones/PCN-900555111-DG-05102026-001/costeo/re-solicitar
                    cuerpo:
                      motivo: "Cambio del seguro de la mercancía después del envío"
                      nueva_version: true
        '428':
          $ref: '#/components/responses/PrecondicionRequerida'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '413':
          $ref: '#/components/responses/CuerpoDemasiadoGrande'
        '415':
          $ref: '#/components/responses/TipoContenidoNoSoportado'

  /web/cotizaciones/{folio}/costeo/margen/lineas:
    put:
      operationId: ajustarMargenCosteoLineas
      tags: [web]
      summary: Aplica el mismo margen (o vuelve al sugerido) en varias rutas o en todas, en una sola operación
      x-issue: '#231 (HU-041.1)'
      description: |
        HU-041.1 (#231, ADR-026). La versión masiva de `PUT .../costeo/margen`: las MISMAS reglas que una llamada por ruta, pero
        atómica. Si una ruta no admite el cambio, **no cambia ninguna** y el error dice cuál la bloqueó en `detalle.linea_orden` y
        `detalle.linea_solicitud_id` (más los datos propios del error, p. ej. `detalle.margen_sugerido` de `JUSTIFICACION_REQUERIDA`).

        - **Rutas:** `lineas` (los `rutas[].linea_orden`, de 1 a 1000, sin repetir) o `todas: true` (las rutas cotizables: las
          rechazadas por la Mesa de Costeo no cuentan; si no queda ninguna, 409 `SIN_RUTAS_COTIZABLES`). Exactamente una de las dos.
          Una ruta pedida que no existe: 400 `RUTA_INEXISTENTE`; una pedida que la Mesa rechazó: 409 `RUTA_RECHAZADA`.
        - **Margen:** `margen` (fracción de 0 a 0,99, el mismo para todas; 400 `AJUSTE_MARGEN_INVALIDO` fuera de rango) o
          `revertir_sugerido: true` (cada ruta vuelve a SU `margen_sugerido` y `origen_margen` deja de ser `negociado`; una ruta sin
          sugerido: 400 `AJUSTE_MARGEN_INVALIDO`). Exactamente una de las dos (si no, 400 `ErrorWeb`).
        - `justificacion` es obligatoria si `margen` queda por debajo del sugerido de ALGUNA ruta elegida (400
          `JUSTIFICACION_REQUERIDA` con esa ruta); se guarda en `MargenAjustes.motivo` de cada ruta ajustada.
        - Cada ruta necesita precio (409 `COSTEO_NO_LISTO` con la ruta). Regla del PDF (ADR-018 §11) y cotización finalizada
          (HU-036.3): 409 `PDF_YA_ENVIADO` con la llamada de la versión nueva en `detalle`.
        - Con `margen`, cada ruta que cambia queda en `MargenAjustes` (con su ruta y su sugerido) y `origen_margen = negociado`,
          como por ruta. Volver al sugerido no registra un ajuste negociado (queda en la auditoría).
        - Las rutas que ya tienen ese margen no cambian; si ninguna cambia, 200 sin invalidar el PDF ni subir la versión.
        - **Una sola** invalidación del PDF vigente y **una sola** entrada de auditoría (`EventosHerramienta`, herramienta
          `ajustar_margen_costeo_lineas`, con las rutas cambiadas) por operación.
        - `If-Match` **obligatorio** (428 / 409 `CONFLICTO_CONCURRENCIA`). `Idempotency-Key` opcional: la repetición con la misma
          clave devuelve la respuesta guardada sin volver a ejecutar. Solo el dueño (404 si no es suya).
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
        - $ref: '#/components/parameters/IfMatchObligatorio'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MargenLineasWeb'
            examples:
              margen:
                summary: El mismo margen en las rutas 1, 2 y 4
                value:
                  lineas: [1, 2, 4]
                  margen: 0.2
              revertir:
                summary: Todas las rutas vuelven a su margen sugerido
                value:
                  todas: true
                  revertir_sugerido: true
      responses:
        '200':
          description: Margen aplicado en las rutas elegidas y precios recalculados (esas rutas y el total)
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CosteoCotizacion'
        '400':
          description: '`AJUSTE_MARGEN_INVALIDO`, `JUSTIFICACION_REQUERIDA` (con `detalle.margen_sugerido`) o `RUTA_INEXISTENTE` (`ErrorNegocio`, con `detalle.linea_orden` de la ruta que bloquea); `ErrorWeb` si la forma no es válida (`lineas` y `todas` juntas o ninguna, `margen` y `revertir_sugerido` juntos o ninguno, `lineas` vacía, repetida o con más de 1000) o la `Idempotency-Key` está fuera de largo'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
              examples:
                justificacion:
                  value:
                    error:
                      codigo: JUSTIFICACION_REQUERIDA
                      mensaje: "El margen 12 % queda por debajo del sugerido (15 %): escribe la justificación."
                      detalle:
                        margen_sugerido: 0.15
                        linea_orden: 3
                        linea_solicitud_id: "5b1f6a1e-2c3d-4e5f-8a9b-0c1d2e3f4a5b"
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '409':
          description: '`COSTEO_NO_LISTO` o `RUTA_RECHAZADA` (con `detalle.linea_orden` y `detalle.linea_solicitud_id` de la ruta que bloquea), `SIN_RUTAS_COTIZABLES`, `PDF_YA_ENVIADO` (enviada, con resultado o finalizada; `detalle` con la versión nueva), `CONFLICTO_CONCURRENCIA` o `IDEMPOTENCY_KEY_REUTILIZADA`; ninguna ruta cambia'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
              example:
                error:
                  codigo: COSTEO_NO_LISTO
                  mensaje: "La cotización PCN-900555111-DG-05102026-001 todavía no tiene el costeo de Nexo con margen aplicado."
                  detalle:
                    linea_orden: 2
                    linea_solicitud_id: "7c2e6b2f-3d4e-4f60-9b0c-1d2e3f4a5b6c"
        '428':
          $ref: '#/components/responses/PrecondicionRequerida'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '413':
          $ref: '#/components/responses/CuerpoDemasiadoGrande'
        '415':
          $ref: '#/components/responses/TipoContenidoNoSoportado'

  /web/cotizaciones/{folio}/costeo/re-solicitar:
    post:
      operationId: reSolicitarCosteo
      tags: [web]
      summary: Vuelve a pedir el costeo a Nexo ("Cotizar costo"), en el mismo folio o en una versión nueva
      x-issue: '#100 (HU-013.4)'
      description: |
        HU-013.4 (ADR-018 §5). Amplía `POST .../costeo/reintentar`. Es el endpoint del botón "Cotizar costo", del
        Confirmar de la acción propuesta `re_solicitar_costeo` y de la "versión nueva" que pide `PDF_YA_ENVIADO`.

        **Mismo folio** (sin `datos_carga` y sin `nueva_version`):
        - Permitido si `estado_costeo` es `costeo_vencido`, `entregada` o `error_envio`; en otro estado, 409
          `ESTADO_NO_PERMITE`. Si la cotización ya se envió al cliente o tiene resultado, 409 `PDF_YA_ENVIADO` (con
          `detalle.cuerpo.nueva_version = true`).
        - Se reenvía la misma cotización a Nexo. Responde **200** con la cotización en `pendiente_costeo` (o
          `autocosteo` si Nexo costea en la misma petición) y el polling se reanuda. Invalida el PDF actual
          (`pdf_desactualizado`). Desde `error_envio` equivale a `reintentar`.
        - Si el comercial había ajustado el margen (`origen_margen = negociado`), se CONSERVA sobre el costo nuevo; el
          `margen_sugerido` se refresca con SAP TM o la política como referencia (decisión del 2026-10-06).

        **Versión nueva** (con `datos_carga`, o con `nueva_version: true` sin cambios de carga):
        - Permitida en cualquier estado salvo con un costeo en curso (`pendiente_envio` o `pendiente_costeo`: 409
          `ESTADO_NO_PERMITE`), también si la cotización ya se envió o tiene resultado.
        - Crea `{folio base}-vN` (ADR-011) con el formulario de la vigente y los cambios de carga, si los hay, y la envía a
          Nexo como solicitud nueva; la versión anterior conserva su costeo (solo sube su versión de negocio: la reserva que
          impide crear dos versiones con el mismo `If-Match`). Responde **201** con la versión nueva y `Location` a su costeo.
          El margen negociado de la original se copia. Los cambios de carga se validan por catálogo (G2) y con las reglas de
          la captura (G3 y peso).
        - La captura nueva lleva en `notas` "Re-solicitud de {folio}; reemplaza la solicitud {id anterior}".

        Comunes:
        - Si Nexo falla, igual que el alta: la cotización (o la versión nueva) queda en `error_envio` con el motivo.
        - Queda auditado (`EventosHerramienta`, `costeo_nexo_re_solicitud`) con el motivo y el usuario.
        - `If-Match` **obligatorio** (428 / 409). `Idempotency-Key` opcional: un doble clic con la misma clave devuelve la
          respuesta de la primera petición y no crea `-v2` y `-v3` ni reenvía a Nexo dos veces.
        - Nexo no tiene una operación para reabrir ni para re-solicitar una solicitud (`docs/conexion_nexo/HU-013-preguntas-nexo.md`,
          pregunta 4): en los dos casos Cotifly hace una **captura nueva** (`POST /api/captura-solicitudes`) con lo guardado, y
          guarda el id de la solicitud nueva. En el mismo folio el costo y el precio anteriores se limpian (quedan en la auditoría
          con el id de la solicitud anterior) y el polling consulta la solicitud nueva.
        - **Por ruta (HU-021.9, #136).** La versión `-vN` copia cada ruta con su línea de negocio, sus mercancías, sus camiones
          vigentes (los `descartada` en Nexo no) y sus conexos. Si los `datos_carga` cambian el peso o las mercancías, los camiones
          de la ruta se borran y se vuelven a planificar (hoy un camión sin vehículo con el peso de la ruta; el cubicador cuando
          exista, #133); un error del planificador no reserva ni crea nada. `tipo_vehiculo` y `carroceria` en `datos_carga` se
          ignoran (decisión 7: los define el cubicador o la Mesa de Costeo de Nexo). El margen ajustado de cada ruta se conserva
          en el mismo folio y se copia a la `-vN`.
        - **Servicios conexos (HU-021.9, #136; rehace el aviso de #124 con la decisión 3).** Los conexos son filas de la ruta en
          Cotifly (costo de Nexo como precio) y Cotifly es su fuente: en el mismo folio **se conservan** en su ruta y la `-vN` **los
          copia** con la misma cantidad y el costo unitario del catálogo de Nexo de hoy; siguen en el precio. La respuesta (200 o
          201) trae siempre `conexos_conservados` con sus nombres (sin montos; `[]` si no había) y el resumen de la propuesta del
          asistente lo dice antes de confirmar; `conexos_descartados` queda en `[]` (obsoleto). La re-solicitud no los agrega en
          Nexo en el acto: el envío diferido (decisión 10) los manda UNA vez a la cotización nueva de Nexo cuando el polling ve
          costeada la línea del primer camión vigente de la ruta (Nexo no tiene DELETE ni idempotencia en ese POST: un envío
          incierto se relee y nunca se repite a ciegas). La cotización anterior de Nexo queda como estaba. Un camión descartado en
          Nexo no se reenvía (mismo folio) ni se copia (`-vN`). Un `error_envio` por un rechazo
          definitivo de Nexo (400) no se reenvía igual en el mismo folio (`ESTADO_NO_PERMITE`): se corrige con `datos_carga`.
          Con `datos_carga`, una licitación (varias líneas) responde `ESTADO_NO_PERMITE` con `detalle.motivo = LICITACION`
          (con `nueva_version: true` y sin cambios sí se copia con todas sus líneas). Moneda (decisión del 2026-10-06, ADR-014 §5): en el
          mismo folio se conservan la moneda y la TRM fijadas; la versión nueva copia la moneda y fija la TRM del día antes de
          reservar la original y de llamar a Nexo (sin TRM: 400 `TRM_NO_DISPONIBLE` y no se crea nada). Solo el dueño.
        - **Camiones rechazados por la Mesa de Costeo (HU-028.1, #183, decisión del 2026-10-20: "no reenviar los camiones rechazados
          por defecto").** Un camión cuya línea rechazó la Mesa **no viaja** a Nexo: en el mismo folio sigue rechazado (con su
          `motivo_rechazo` y `rechazada_at`) y sin línea de Nexo; la `-vN` lo copia **como rechazado** (mismo motivo y fecha:
          trazable). Una ruta con todos sus camiones rechazados **no se envía** (no se manda a Nexo una ruta sin camiones): queda en
          la cotización visible como `rechazada`, sin precio. La respuesta trae `aviso_rechazos` con lo que se omitió (rutas, camiones
          y motivos). Si no queda ningún camión que viaje: 409 `SIN_RUTAS_COTIZABLES` (`detalle.motivo = TODOS_RECHAZADOS`). Para que
          la Mesa los reconsidere, el comercial edita la solicitud con `reincluir_rechazados` en la ruta (`PUT .../solicitud`).
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
        - $ref: '#/components/parameters/IfMatchObligatorio'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReSolicitudCosteoWeb'
            example:
              motivo: "El cliente cambió el peso de la carga"
              datos_carga:
                peso_kg: 28400
                valor_mercancia: 150000000
      responses:
        '200':
          description: Reenviada a Nexo con el mismo folio; `estado_costeo` dice si Nexo la recibió
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionResumen'
        '201':
          description: Versión nueva creada (`folio` con `-vN`) y enviada a Nexo; la anterior se conserva
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              description: '`/web/cotizaciones/{folio nuevo}/costeo`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionResumen'
        '400':
          description: '`SOLICITUD_COSTEO_INVALIDA` (`motivo` vacío o largo, `datos_carga` vacío, fuera de los límites de Nexo o incoherente, reglas de peso), `TRM_NO_DISPONIBLE` (versión nueva en USD sin TRM del día), `FOLIO_INVALIDO` (versión nueva: el folio de la original no tiene la forma de ADR-011, p. ej. migrado, o el `-vN` pasaría de 50 caracteres; endurecimiento B de #199) o, en una licitación, `LICITACION_INVALIDA` con `detalle.motivo = LICITACION_REQUIERE_NUEVA_CARGA` y `detalle.errores[]` (sus filas guardadas ya no cumplen las reglas de captura, HU-013.11: ni el mismo folio ni la `-vN` se pueden enviar; crear una licitación nueva) (`ErrorNegocio`); `ErrorWeb` si el cuerpo no es JSON válido. Nada cambia. Con un catálogo de Nexo caído al revalidar una licitación, 503 `CATALOGOS_FLETE_NO_DISPONIBLE` o `MUNICIPIOS_NO_DISPONIBLE`'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '403':
          description: |
            `NEXO_SIN_PERMISO` (endurecimiento B de #199): Nexo respondió 403 al leer el costo de los servicios conexos de una ruta
            en su catálogo (la versión nueva copia los conexos con el costo de hoy) (`GET /api/servicios-conexos`: el comercial no tiene el rol `Comercial` ni `Admin` en Nexo). Nada queda
            guardado ni se crea la versión ni se captura en Nexo; `detalle.motivo` trae solo el código de Nexo. `ErrorWeb` si el rol de Cotifly no alcanza.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '409':
          description: '`ESTADO_NO_PERMITE` (estado del costeo), `PDF_YA_ENVIADO` (mismo folio tras el envío o con resultado), `SIN_RUTAS_COTIZABLES` (HU-028.1, #183, `detalle.motivo = TODOS_RECHAZADOS`: la Mesa de Costeo rechazó todos los camiones y no hay nada que enviar; para reconsiderarlos, `PUT .../solicitud` con `reincluir_rechazados`), `CONFLICTO_CONCURRENCIA` o `IDEMPOTENCY_KEY_REUTILIZADA` (la misma `Idempotency-Key` con otro cuerpo; antes 400 `ErrorWeb`); sin cambios. La versión nueva reutiliza el folio base, así que no consume consecutivo'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '428':
          $ref: '#/components/responses/PrecondicionRequerida'
        '503':
          description: |
            Licitación (HU-013.11): `CATALOGOS_FLETE_NO_DISPONIBLE` (sin catálogo maestro de Nexo ni copia de 24 h para revalidar las
            filas guardadas) o `MUNICIPIOS_NO_DISPONIBLE` (alguna fila guardada sin id de municipio y el catálogo no responde). Nada
            cambia ni se envía a Nexo. `SERVICIO_OCUPADO` (#125) si el candado del folio de la versión `-vN` siguió ocupado tras
            los reintentos: no se creó la versión. Endurecimiento B (#199): la reserva de la original va dentro de ese candado, así
            que con `SERVICIO_OCUPADO` **nada cambia**: la `versionNegocio` de la original no sube y su `If-Match` sigue valiendo.
            Cubicador (endurecimiento A, #199): `CUBICADOR_NO_DISPONIBLE` (sin respaldo), `CUBICADOR_NO_AUTORIZADO` o
            `CUBICADOR_RESPUESTA_INVALIDA` al volver a pedir los camiones; nada cambia.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '413':
          $ref: '#/components/responses/CuerpoDemasiadoGrande'
        '415':
          $ref: '#/components/responses/TipoContenidoNoSoportado'

  /web/cotizaciones/{folio}/solicitud:
    get:
      operationId: obtenerSolicitudEditable
      tags: [web]
      summary: La solicitud para editarla ("Editar solicitud")
      x-issue: '#186 (HU-028)'
      description: |
        HU-028 (#186, ADR-021). El modelo editable completo de la solicitud: cada ruta con su `linea_solicitud_id`, sus municipios
        (origen, destino, devolución y levante) por **id y nombre**, sus condiciones, horas, valores, peso, mercancías con
        `codigo_mercancia` y conexos con el **id del catálogo de Nexo** (sin precios ni costos), y su margen. También los campos
        bloqueados con su valor (`bloqueados`, `campos_bloqueados`) y cómo se aplicaría la edición ahora (`edicion`):
        - `modo`: `en_sitio` (nunca llegó a Nexo), `reemplazo` (está en Nexo sin entregar al cliente ni resultado: se rechaza la
          solicitud anterior en Nexo y se captura de nuevo en el mismo folio) o `nueva_version` (ya entregada o con resultado: se crea
          `-vN`);
        - `permitida = false` con `motivo_no_permitida` (`LICITACION`: fase 2; `SIN_FORMULARIO`: cotización del chat;
          `ENVIO_EN_CURSO`; `CUBICACION_EN_CURSO`) y `mensaje`;
        - `avisos` para confirmar antes de guardar (`REEMPLAZA_SOLICITUD_NEXO`, `PIERDE_TRABAJO_MESA`, `PIERDE_COSTEO_ACTUAL`,
          `INVALIDA_PDF`, `CREA_VERSION_NUEVA`).
        Trae el `ETag` para el `If-Match` del `PUT`. Solo el dueño. Reemplaza a `GET .../nueva-version` para prellenar.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
      responses:
        '200':
          description: El modelo editable
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudEditable'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    put:
      operationId: editarSolicitud
      tags: [web]
      summary: Edita la solicitud (en sitio, reemplazo en Nexo o versión nueva según el estado)
      x-issue: '#186 (HU-028)'
      description: |
        HU-028 (#186, ADR-021). **Reemplazo completo** del contenido editable con la forma de la captura: cada ruta con
        `linea_solicitud_id` es la misma ruta (conserva su id, su línea de negocio y su margen negociado); sin él, una ruta nueva; las
        guardadas que no vienen se quitan (sus ajustes de margen quedan sin ruta). Las rutas que se conservan no se reordenan
        (`RUTAS_REORDENADAS`); las nuevas van en cualquier posición.

        **Bloqueados** (400 `CAMPO_NO_EDITABLE` con `detalle.campo`, `detalle.campos` y `detalle.errores`): el cliente (`nit_cliente`,
        `cliente_nombre`, `origen_cliente`), el `tipo` (spot/licitación) y la `linea_negocio` de cada ruta. Si vienen con el valor
        guardado se aceptan. Una ruta nueva solo usa una línea de negocio que ya exista en la solicitud.

        **Modo** (lo decide el estado; `modo_esperado` opcional: si cambió, 409 `ESTADO_NO_PERMITE` con `detalle.motivo = MODO_CAMBIO`):
        - `en_sitio`: nunca llegó a Nexo (`error_envio`, incluido el rechazo definitivo, o `pendiente_envio` abandonado). Se edita y se envía.
        - `reemplazo`: en Nexo sin entregar al cliente ni resultado (también en `pendiente_costeo`: se pierde el trabajo de la Mesa,
          aviso `PIERDE_TRABAJO_MESA`). Cotifly reserva la versión, rechaza la solicitud anterior en Nexo
          (`POST /api/solicitudes/{id}/rechazar`, motivo "Edición de la solicitud desde Cotifly"; si ya estaba descartada o Nexo no la
          conoce, sigue) y solo entonces aplica la edición, invalida el PDF (`pdf_desactualizado`) y captura de nuevo en el **mismo
          folio**. Si el rechazo falla, **no** se captura otra solicitud: 503 `NEXO_NO_DISPONIBLE` (403 `NEXO_SIN_PERMISO`) con
          `detalle.motivo = RECHAZO_NEXO_FALLIDO` y `detalle.version_negocio` (la versión subió: recargar). Endurecimiento B (#199):
          `detalle.motivo` es siempre `RECHAZO_NEXO_FALLIDO`, también en el 403; el texto técnico de Nexo solo va al log.
        - `nueva_version`: ya entregada al cliente o con resultado. Se crea `-vN` (201 y `Location`) con lo editado y el margen
          negociado de las rutas que se conservan; la original no cambia ni se rechaza en Nexo. Endurecimiento B (#199): la reserva
          de la original va dentro del candado del folio `-vN`; con 503 `SERVICIO_OCUPADO` nada cambia (ni su `versionNegocio`).
        - Las licitaciones no se editan en esta fase (409 `ESTADO_NO_PERMITE`, `detalle.motivo = LICITACION`).

        **Validación y camiones:** las mismas reglas que `POST /web/solicitudes-costeo` (todos los errores en `detalle.errores`) y el
        mismo planificador con el cupo del cubicador. Solo se vuelven a cubicar las rutas nuevas y aquellas cuyo peso, mercancías o
        clase de viaje cambiaron (`rutas_replanificadas`); las demás conservan sus camiones, también el vehículo que la Mesa haya
        cambiado en Nexo. Los conexos toman el costo unitario del catálogo de Nexo de hoy. `moneda` ausente conserva la guardada; si
        cambia, se fija la TRM del día. Sin cambios reales responde 200 con `sin_cambios = true` y no toca nada.

        **Camiones rechazados por la Mesa de Costeo (HU-028.1, #183, decisión del 2026-10-20).** Por defecto **no viajan** en ningún
        modo: siguen rechazados en la ruta (`RutaEditable.camiones_rechazados` y `motivo_rechazo` lo dicen) y la `-vN` los copia como
        rechazados; una ruta con todos rechazados no se envía y queda `rechazada`, visible y sin precio. La respuesta lo avisa en
        `aviso_rechazos` (y en `cotizacion.aviso_rechazos` y el aviso `RECHAZADOS_OMITIDOS`). Para que la Mesa los reconsidere, la ruta
        trae `reincluir_rechazados: true`: sus camiones rechazados olvidan el rechazo y **vuelven a viajar tal como están** (mismo
        vehículo, carrocería y peso; lo que la Mesa haya cambiado se conserva, D2; no se vuelve a cubicar). Pedirlo en una ruta con
        rechazados es un cambio (no es `sin_cambios`); tener rechazados sin pedirlo no lo es. Una ruta que se vuelve a cubicar estrena
        camiones (el rechazo no aplica). Si con la edición ninguna ruta manda camiones a Nexo: 409 `SIN_RUTAS_COTIZABLES`
        (`detalle.motivo = TODOS_RECHAZADOS`), sin tocar nada.

        `If-Match` **obligatorio** (428 / 409). `Idempotency-Key` opcional (ámbito `editar_solicitud` por comercial; la misma clave con
        otro cuerpo, 409 `IDEMPOTENCY_KEY_REUTILIZADA`). Si la captura en Nexo falla, la cotización queda en `error_envio` y se responde
        igual. Auditado en `EventosHerramienta` (`editar_solicitud`, sin `ThreadId`). Solo el dueño.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
        - $ref: '#/components/parameters/IfMatchObligatorio'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EdicionSolicitudWeb'
      responses:
        '200':
          description: Edición aplicada en el mismo folio (`en_sitio` o `reemplazo`) o sin cambios
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdicionSolicitudResultado'
        '201':
          description: Versión nueva (`-vN`) creada con lo editado y enviada a Nexo; la original no cambia
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              description: '`/web/cotizaciones/{folio nuevo}/costeo`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdicionSolicitudResultado'
        '400':
          description: '`CAMPO_NO_EDITABLE` (`detalle.campo`, `detalle.campos`, `detalle.errores`), `SOLICITUD_COSTEO_INVALIDA` (`detalle.errores` por ruta y campo: reglas de la captura, `RUTA_INEXISTENTE`, `RUTA_REPETIDA`, `RUTAS_REORDENADAS`, `motivo` largo), un rechazo del cubicador (`MERCANCIA_DESCONOCIDA`...), `TRM_NO_DISPONIBLE` o, en `nueva_version`, `FOLIO_INVALIDO` (el folio de la original no tiene la forma de ADR-011 o el `-vN` pasaría de 50 caracteres). Nada cambia'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '403':
          description: '`NEXO_SIN_PERMISO`: Nexo no deja rechazar la solicitud anterior (rol o solicitud ajena), con `detalle.motivo = RECHAZO_NEXO_FALLIDO` (nunca el texto de Nexo; endurecimiento B de #199), o Nexo respondió 403 al leer el costo de los conexos en su catálogo. Nada se capturó'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '409':
          description: '`CONFLICTO_CONCURRENCIA`, `ESTADO_NO_PERMITE` (`detalle.motivo`: `LICITACION`, `SIN_FORMULARIO`, `ENVIO_EN_CURSO`, `CUBICACION_EN_CURSO`, `MODO_CAMBIO`), `SIN_RUTAS_COTIZABLES` (HU-028.1, #183, `detalle.motivo = TODOS_RECHAZADOS`: ninguna ruta mandaría camiones a Nexo; marcar `reincluir_rechazados`) o `IDEMPOTENCY_KEY_REUTILIZADA`; sin cambios'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '428':
          $ref: '#/components/responses/PrecondicionRequerida'
        '503':
          description: '`NEXO_NO_DISPONIBLE` con `detalle.motivo = RECHAZO_NEXO_FALLIDO` (el rechazo de la solicitud anterior falló: no se capturó otra), `CATALOGOS_FLETE_NO_DISPONIBLE`, `MUNICIPIOS_NO_DISPONIBLE`, `NEXO_NO_DISPONIBLE` (conexos), `CUBICADOR_NO_DISPONIBLE` (sin respaldo), `CUBICADOR_NO_AUTORIZADO`, `CUBICADOR_RESPUESTA_INVALIDA` o `SERVICIO_OCUPADO` (`nueva_version`: el candado del folio `-vN` siguió ocupado; la original no cambia, su `If-Match` sigue valiendo). Nada se aplicó'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '413':
          $ref: '#/components/responses/CuerpoDemasiadoGrande'
        '415':
          $ref: '#/components/responses/TipoContenidoNoSoportado'

  /web/servicios-conexos:
    get:
      operationId: buscarServiciosConexos
      tags: [web]
      summary: Catálogo de servicios conexos de Nexo (sin costos)
      x-issue: '#99 (HU-013.3)'
      description: |
        HU-013.3 (ADR-018 §4). Consulta `GET {Nexo:UrlBase}/api/servicios-conexos?soloActivos=true&q=&categoria=&page=&pageSize=`
        con la identidad del comercial y devuelve solo servicios activos, **sin `costoUnitario`** (Nexo es la fuente de
        verdad del costo; Cotifly solo expone precios, y solo de los conexos ya agregados a una cotización: desde HU-043.2, #251,
        su precio de venta sin margen).
        Lo usan el buscador del detalle de la cotización y la herramienta `buscar_servicio_conexo` del asistente.
      security:
        - bearer: []
      parameters:
        - name: q
          in: query
          required: false
          description: Texto a buscar en el nombre (tipo de servicio) o en el código. Vacío = todos.
          schema:
            type: string
            maxLength: 100
        - name: categoria
          in: query
          required: false
          description: Segmento del catálogo de Nexo (`logistico` o `adicional`).
          schema:
            type: string
            maxLength: 20
          example: logistico
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Página del catálogo (puede venir vacía)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaServiciosConexos'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '403':
          description: '`NEXO_SIN_PERMISO`: Nexo respondió 403 al comercial (rol en Nexo)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '503':
          description: '`NEXO_NO_DISPONIBLE`: Nexo sin configurar, caído, sin respuesta a tiempo o el comercial sin `idUsuarioExterno`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/cotizaciones/{folio}/costeo/servicios-conexos:
    post:
      operationId: agregarServiciosConexos
      tags: [web]
      summary: Agrega servicios conexos del catálogo a la cotización en Nexo
      x-issue: '#99 (HU-013.3)'
      description: |
        HU-013.3 (ADR-018 §4). Es el endpoint del botón "Agregar conexo" y del Confirmar de la acción propuesta
        `agregar_servicios_conexos`. Los conexos se agregan **en Nexo**, que es la fuente de verdad del costo:

        1. `POST {Nexo:UrlBase}/api/cotizaciones/{cotizacionNexoId}/conexos` con
           `{items: [{lineaId, servicioConexoId, cantidad}]}` (`clsAgregarConexosRequest` / `clsConexoItemRequest` del
           swagger de Nexo; `lineaId` y `servicioConexoId` obligatorios, `cantidad` de 0,01 a 999.999,99). `lineaId` es la
           línea de la cotización de Nexo que corresponde a `linea_orden` (ver `ConexoAgregarWeb`). Cotifly **nunca**
           envía `valorAplicado`: si no viaja, Nexo lo calcula como valor base × cantidad (Nexo es la fuente de verdad del
           costo). Roles de Nexo para este endpoint: `Comercial` y `Admin` (NEXO#307, S6-HU-25.1: `CoordinadorFletes` pasa
           a `AdminBiblioteca` y sale de cotizaciones; el swagger de Nexo no lo declara).
        2. Lee de nuevo la cotización de Nexo (`GET /api/cotizaciones/{id}`), aplica el margen de la cotización a cada
           conexo con `IClsPrecioService` y los deja `incluido = true`.

        - `items` de 1 a 20 (vacío o más de 20: 400 `ErrorWeb` por el esquema, sin llamar a Nexo), cada uno con la ruta
          (`linea_orden` o `linea_solicitud_id`), `servicio_id` del catálogo (`GET /web/servicios-conexos`) y `cantidad` de 0,01
          a 999.999,99. Una ruta que no existe en la cotización: 400 `CONEXO_INVALIDO` sin llamar a Nexo.
        - **Por ruta (HU-021.8, #135, decisión 3).** Los conexos son filas de la ruta (`CotizacionServiciosConexos`) con el
          costo unitario de Nexo (valor base del catálogo × cantidad, que Nexo calcula) y la ruta les aplica SU margen. Sin
          ruta en los items, la única de la cotización; con varias rutas y sin indicarla, 400 `RUTA_REQUERIDA` con
          `detalle.rutas`. Todos los items de una petición deben ser de la misma ruta (si no, 400 `ErrorWeb`): los conexos
          nuevos que devuelve Nexo no dicen su línea y se guardan en la ruta pedida. En Nexo se pegan a la línea del PRIMER
          camión de la ruta. Solo se recalculan esa ruta y el total.
        - Una línea que existe pero todavía no tiene línea en la cotización de Nexo (sin flete, o sin el id de la línea de
          la cotización de Nexo guardado): 409 `LINEA_SIN_COTIZACION_NEXO`, sin llamar a Nexo. #99 debe guardar ese id
          (`clsCotizacionLineaDto.id`) junto a `lineaSolicitudId` en `clsLineaCosteoNexo`
          (`Cotifly.Dominio/Cotizaciones/clsCosteoConsultadoNexo.cs`) al leer la cotización.
        - Solo con costeo disponible (409 `COSTEO_NO_LISTO`). Regla del PDF (ADR-018 §11): ya enviada o con resultado, 409
          `PDF_YA_ENVIADO`; si no, invalida el PDF actual (`pdf_desactualizado`). Una licitación responde 409
          `ESTADO_NO_PERMITE` con `detalle.motivo = LICITACION` (ADR-017 §6); una solicitud del formulario con varias rutas
          sí admite conexos, por ruta (HU-021.8).
        - Nexo 400 o 404 del servicio: 400 `CONEXO_INVALIDO` (el código de Nexo en `detalle.motivo`); 403:
          `NEXO_SIN_PERMISO`; caído o sin respuesta: 503 `NEXO_NO_DISPONIBLE`. En todos esos casos no se agrega nada en
          Cotifly, pero la versión ya se reservó (ver el punto siguiente): el `ETag` cambió y hay que recargar el costeo. En
          `detalle.motivo` viaja solo el código de Nexo (o `HTTP 401`), nunca su texto.
        - La versión se RESERVA en la base antes del POST a Nexo (ADR-018 §13): de varias peticiones con el mismo `If-Match` solo una
          llega a Nexo; las demás reciben 409 `CONFLICTO_CONCURRENCIA` sin tocar Nexo. Por eso un fallo de Nexo después de la reserva
          deja la versión (y el `ETag`) cambiada aunque nada más cambie: recargar el costeo antes de reintentar.
        - Todo 2xx de Nexo es efecto: Cotifly usa la cotización que devuelve el POST y solo relee (`GET /api/cotizaciones/{id}`)
          si el cuerpo falta o no se puede leer. Si no se puede releer, 503 `NEXO_NO_DISPONIBLE` con `detalle.agregado_en_nexo =
          true`.
        - Si Nexo no responde al POST (tiempo agotado, red o 5xx), Cotifly relee la cotización: si muestra el conexo nuevo, termina
          normal (200); si no se puede determinar, 503 `NEXO_NO_DISPONIBLE` con `detalle.agregado_en_nexo = "desconocido"`.
          Nunca reintenta el POST; el polling recoge el conexo en la siguiente consulta. Con `agregado_en_nexo` (true o
          "desconocido") el frontend NO debe volver a agregar sin recargar el costeo; la respuesta queda guardada para la misma
          `Idempotency-Key`.
        - Si el conexo queda costeado de inmediato o pasa por Servicios Logísticos está pendiente de confirmar con Nexo.
        - `If-Match` **obligatorio** (428 / 409). `Idempotency-Key` opcional: un doble clic con la misma clave devuelve la
          respuesta de la primera petición sin volver a llamar a Nexo (el POST de Nexo no es idempotente). Solo el dueño.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
        - $ref: '#/components/parameters/IfMatchObligatorio'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgregarServiciosConexosWeb'
            example:
              items:
                - linea_orden: 1
                  servicio_id: "6f1c2a9e-3b7d-4c55-9a0e-1d2f3a4b5c6d"
                  cantidad: 2
      responses:
        '200':
          description: Conexos agregados en Nexo e incluidos con su precio
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CosteoCotizacion'
        '400':
          description: '`CONEXO_INVALIDO` o `RUTA_REQUERIDA` (`ErrorNegocio`); `ErrorWeb` si el cuerpo no es JSON válido o no cumple el esquema (`items` vacío o con más de 20, o de rutas distintas)'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '403':
          description: '`NEXO_SIN_PERMISO`: Nexo respondió 403 (el comercial no tiene `Comercial` ni `Admin` en Nexo)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '409':
          description: |
            `COSTEO_NO_LISTO`, `RUTA_RECHAZADA` (HU-028.1, #183: la Mesa de Costeo rechazó la ruta), `LINEA_SIN_COTIZACION_NEXO`,
            `PDF_YA_ENVIADO`, `ESTADO_NO_PERMITE` con `detalle.motivo = LICITACION`, `CONFLICTO_CONCURRENCIA` o
            `IDEMPOTENCY_KEY_REUTILIZADA` (la misma `Idempotency-Key` con otro cuerpo; antes 400 `ErrorWeb`): sin cambios.
            Endurecimiento A (#199):
            - `ESTADO_NO_PERMITE` con `detalle.motivo = CAPTURA_EN_CURSO` (y `detalle.folio`): otra petición con la misma
              `Idempotency-Key` sigue en curso en otra réplica; no se ejecuta nada. Esperar y repetir con la misma clave.
            - `CONFLICTO_CONCURRENCIA` con `detalle.agregado_en_nexo = true`: la cotización cambió DESPUÉS de que Nexo agregó el
              conexo. El conexo SÍ quedó en Nexo (el polling lo trae a Cotifly): recargar el costeo y NO repetir el POST (Nexo no
              tiene DELETE; la misma `Idempotency-Key` devuelve esta misma respuesta).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '428':
          $ref: '#/components/responses/PrecondicionRequerida'
        '503':
          description: '`NEXO_NO_DISPONIBLE` (con `detalle.agregado_en_nexo = true` si Nexo lo agregó pero no se pudo releer, o `"desconocido"` si Nexo no respondió al POST y no se pudo confirmar)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '413':
          $ref: '#/components/responses/CuerpoDemasiadoGrande'
        '415':
          $ref: '#/components/responses/TipoContenidoNoSoportado'
    put:
      operationId: seleccionarServiciosConexos
      tags: [web]
      summary: Quita servicios conexos de una ruta o cambia su cantidad
      x-issue: 'HU-005.7; por ruta desde #135 (HU-021.8)'
      description: |
        HU-005.7; por ruta desde HU-021.8 (#135, ADR-019 decisión 3). Los conexos son filas de la ruta
        (`CotizacionServiciosConexos`): no hay "excluidos". Dos formas, y debe venir exactamente una (las dos juntas o ninguna: 400 `ErrorWeb`; `{"linea_orden": 2}` solo NO borra nada):

        - **`conexos`** (nueva): la lista de los conexos que deben QUEDAR en la ruta indicada (`linea_orden` o
          `linea_solicitud_id`; sin ruta, la única de la cotización, y con varias 400 `RUTA_REQUERIDA`), cada uno con su `id`
          (`servicios_conexos[].id`) y su `cantidad` nueva (0,01 a 999.999,99, hasta 2 decimales). Los que no vienen se
          **quitan**: se BORRA su fila. A los demás se les cambia la cantidad con el mismo costo unitario de Nexo. Un `id` que no
          es conexo de esa ruta: 400 `SOLICITUD_COSTEO_INVALIDA` (para agregar uno nuevo se usa el `POST`).
        - **`incluidos`** (HU-005.7): los ids que se conservan, sin cambiar cantidades; los demás se quitan. Con ruta, solo en esa
          ruta; sin ruta, en todas (compatibilidad).

        Después del cambio se recalculan la ruta (`costoServiciosConexos`, su costo final y su precio: el transporte con su
        margen + la venta de los conexos, sin margen, HU-043.2) y el total.
        Cada conexo quitado o con cantidad nueva queda en la auditoría (`EventosHerramienta`, herramienta
        `cambiar_servicios_conexos`, sin montos). Solo mientras la cotización tenga precio. Solo el dueño.

        Desde HU-013.2 (ADR-018 §11, #98, script `0006`): con PDF ya generado se permite e invalida el PDF
        (`pdf_url = null`, `pdf_desactualizado = true`, el anterior queda en el historial) en lugar de responder
        `PDF_YA_GENERADO`; ya enviada o con resultado responde 409 `PDF_YA_ENVIADO` (con la `detalle` para crear `-vN`).
        La misma selección (y las mismas cantidades) responde 200 sin invalidar nada ni subir la versión. `If-Match` es
        obligatorio (428 `PRECONDICION_REQUERIDA`; 409 `CONFLICTO_CONCURRENCIA` si no coincide) y la respuesta trae `ETag`.
        Quitar un conexo o cambiar su cantidad no cambia la cotización de Nexo (no hay DELETE de conexos): Cotifly es la fuente
        de los conexos (decisión 3) y los manda a Nexo con la ruta en el siguiente envío.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
        - $ref: '#/components/parameters/IfMatchObligatorio'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeleccionServiciosConexos'
            examples:
              por_ruta:
                summary: La ruta 2 conserva un conexo con cantidad 1 (los demás se quitan)
                value:
                  linea_orden: 2
                  conexos:
                    - id: "CX-1"
                      cantidad: 1
              incluidos:
                summary: Compatibilidad HU-005.7 (sin ruta, en todas las rutas)
                value:
                  incluidos: ["CX-1"]
      responses:
        '200':
          description: Conexos de la ruta guardados
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CosteoCotizacion'
        '400':
          description: '`SOLICITUD_COSTEO_INVALIDA` (algún id no es un conexo del costeo o de la ruta), `RUTA_REQUERIDA` o `RUTA_INEXISTENTE` (`ErrorNegocio`); `ErrorWeb` si la forma no es válida (las dos formas juntas, cantidad fuera de rango o id repetido)'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '409':
          description: '`COSTEO_NO_LISTO` (todavía sin precio), `RUTA_RECHAZADA` (HU-028.1, #183: la ruta indicada fue rechazada por la Mesa de Costeo), `PDF_YA_ENVIADO` (ya enviada o con resultado) o `CONFLICTO_CONCURRENCIA`; sin cambios'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '428':
          $ref: '#/components/responses/PrecondicionRequerida'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '413':
          $ref: '#/components/responses/CuerpoDemasiadoGrande'
        '415':
          $ref: '#/components/responses/TipoContenidoNoSoportado'

  /web/cotizaciones/{folio}/costeo/servicios-conexos/lineas:
    post:
      operationId: agregarServicioConexoLineas
      tags: [web]
      summary: Agrega un servicio conexo del catálogo a varias rutas o a todas, en una sola operación
      x-issue: '#231 (HU-041.1)'
      description: |
        HU-041.1 (#231, ADR-026). Agrega el servicio `servicio_id` del catálogo de Nexo (`GET /web/servicios-conexos`), con la misma
        `cantidad`, a las rutas elegidas (`lineas` o `todas: true`, como en `PUT .../costeo/margen/lineas`). Atómica: si una ruta no lo
        admite, no cambia ninguna y el error trae `detalle.linea_orden` y `detalle.linea_solicitud_id` de la que bloqueó.

        - Las mismas reglas que `POST .../costeo/servicios-conexos` por ruta: no en licitaciones (409 `ESTADO_NO_PERMITE`,
          `detalle.motivo = LICITACION`), costeo con margen (409 `COSTEO_NO_LISTO`), regla del PDF y cotización finalizada (409
          `PDF_YA_ENVIADO`), ruta no rechazada (409 `RUTA_RECHAZADA`) y con su línea en la cotización de Nexo (409
          `LINEA_SIN_COTIZACION_NEXO`).
        - **Nexo (ADR-026).** Cotifly NO llama al `POST` de conexos de Nexo dentro de esta petición (no podría deshacer un éxito
          parcial: Nexo no tiene DELETE). El conexo se guarda en cada ruta con el **costo del catálogo de Nexo** (como un conexo
          capturado con la ruta) y queda `estado_nexo = pendiente`; la siguiente consulta del polling se adelanta a ese momento y el envío
          diferido lo lleva a la línea del primer camión de cada ruta (en segundos), una sola vez, y pasa a `enviado` (o `incierto` / `fallido_definitivo`, visibles en el costeo). Mientras quede
          alguno `pendiente`, finalizar responde 409 `COTIZACION_NO_FINALIZABLE` (`conexos_pendientes_en_nexo`). El catálogo se
          lee antes de cambiar nada: un servicio inactivo o inexistente es 400 `CONEXO_INVALIDO` (`detalle.motivo =
          CONEXO_NO_ENCONTRADO`); Nexo caído, 503 `NEXO_NO_DISPONIBLE` (o 403 `NEXO_SIN_PERMISO`), sin cambios.
        - Las rutas que ya tienen ese servicio no cambian (para cambiar su cantidad: `PUT .../costeo/servicios-conexos`); si todas lo
          tienen, 200 sin cambios. En la respuesta cada conexo trae `servicio_id` (el id del catálogo) para reconocerlo entre rutas.
        - **Una sola** invalidación del PDF vigente y **una sola** entrada de auditoría (`agregar_servicio_conexo_lineas`).
        - `If-Match` **obligatorio** (428 / 409). `Idempotency-Key` opcional. Solo el dueño.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
        - $ref: '#/components/parameters/IfMatchObligatorio'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConexoLineasWeb'
            example:
              todas: true
              servicio_id: "6f1c2a9e-3b7d-4c55-9a0e-1d2f3a4b5c6d"
              cantidad: 1
      responses:
        '200':
          description: Conexo agregado a las rutas elegidas, con su precio (`estado_nexo = pendiente` hasta que el envío diferido lo lleve a Nexo)
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CosteoCotizacion'
        '400':
          description: '`CONEXO_INVALIDO` o `RUTA_INEXISTENTE` (`ErrorNegocio`); `ErrorWeb` si la forma no es válida (`lineas`/`todas`, `servicio_id` que no es UUID, `cantidad` fuera de 0,01 a 999.999,99) o la `Idempotency-Key` está fuera de largo'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '403':
          description: '`NEXO_SIN_PERMISO` al leer el catálogo de conexos de Nexo; sin cambios'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '409':
          description: '`COSTEO_NO_LISTO`, `RUTA_RECHAZADA` o `LINEA_SIN_COTIZACION_NEXO` (con `detalle.linea_orden` y `detalle.linea_solicitud_id`), `ESTADO_NO_PERMITE` (licitación), `SIN_RUTAS_COTIZABLES`, `PDF_YA_ENVIADO`, `CONFLICTO_CONCURRENCIA` o `IDEMPOTENCY_KEY_REUTILIZADA`; ninguna ruta cambia'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '428':
          $ref: '#/components/responses/PrecondicionRequerida'
        '503':
          description: '`NEXO_NO_DISPONIBLE`: no se pudo leer el catálogo de conexos de Nexo; sin cambios'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '413':
          $ref: '#/components/responses/CuerpoDemasiadoGrande'
        '415':
          $ref: '#/components/responses/TipoContenidoNoSoportado'

  /web/cotizaciones/{folio}/costeo/servicios-conexos/lineas/quitar:
