          maxLength: 50
        clase_contenedor:
          type: string
          nullable: true
          maxLength: 20
        exclusivo:
          type: boolean
          nullable: true
        consolidado:
          type: boolean
          nullable: true
        retorna_contenedor:
          type: boolean
          nullable: true
        ciudad_devolucion_contenedor:
          type: string
          nullable: true
          maxLength: 150
        levante_contenedor_diferente:
          type: boolean
          nullable: true
        ciudad_levante_contenedor:
