          type: string
          nullable: true
          example: logistico
        unidad:
          type: string
          nullable: true
          example: Viaje
        origen:
          type: string
          nullable: true
        destino:
          type: string
          nullable: true
        puerto:
          type: string
          nullable: true
        ruta:
          type: string
          nullable: true
        tipo_maquina:
          type: string
          nullable: true
        vigencia:
          type: string
          format: date
          nullable: true

    PaginaServiciosConexos:
      type: object
      required: [total, page, page_size, items]
      properties:
        total:
          type: integer
          description: Total de servicios que cumplen el filtro (todas las páginas).
        page:
          type: integer
        page_size:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServicioConexoCatalogo'

    TextosCotizacion:
      type: object
      required: [asunto, introduccion, fuente, editado, actualizado_at]
      description: HU-013.5. Asunto e introducción del PDF guardados en `Cotizaciones.textosCotizacion`.
      properties:
        asunto:
          type: string
          maxLength: 120
        introduccion:
          type: string
          maxLength: 900
          description: Uno o más párrafos separados por una línea en blanco.
        fuente:
          type: string
          enum: [ia, estandar]
          description: |
            `ia` = los redactó la IA y pasaron la validación; `estandar` = textos de `clsTextosEstandar` (la IA tardó más
            de 15 s, falló o su salida no pasó la validación, o no se ha redactado).
        editado:
          type: boolean
          description: '`true` si el comercial los editó después (`PUT .../costeo/textos`).'
        actualizado_at:
          type: string
          format: date-time

    TextosCotizacionWeb:
      type: object
      required: [asunto, introduccion]
      description: HU-013.5. Cuerpo de `PUT /web/cotizaciones/{folio}/costeo/textos`.
      properties:
        asunto:
          type: string
          minLength: 1
          maxLength: 120
        introduccion:
          type: string
          minLength: 1
          maxLength: 900

    PosicionCargaWeb:
      type: object
      required: [largo_cm, ancho_cm, alto_cm]
      description: |
        Posición de cubicaje (`clsCapturaPosicionRequest` de Nexo: `descripcion`, `cantidad`, `largoCm`, `anchoCm`,
        `altoCm`, `pesoKg`), en centímetros y kilogramos. `largo_cm`, `ancho_cm` y `alto_cm` son obligatorios (0,1 a
        999.999). `peso_kg` es opcional y **por unidad**: el peso de la posición es `cantidad × peso_kg`.
      properties:
        descripcion:
          type: string
          nullable: true
          maxLength: 200
        cantidad:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
        largo_cm:
          type: number
          minimum: 0.1
          maximum: 999999
        ancho_cm:
          type: number
          minimum: 0.1
          maximum: 999999
        alto_cm:
          type: number
          minimum: 0.1
          maximum: 999999
        peso_kg:
          type: number
          nullable: true
          minimum: 0
          maximum: 999999.99

    SolicitudCosteoWeb:
      type: object
      required: [tipo, nit_cliente, linea_negocio, origen, destino]
      description: |
        Formulario ampliado (HU-005.3, mapeo aprobado en `docs/MAPEO_CAMPOS_NEXO_COTIFLY.md` y verificado contra el código
        el 2026-10-05 en `docs/HU-005.1-mapeo-campos-nexo.md`): encabezado y la única línea de `clsCapturaSolicitudRequest`
        / `clsCapturaLineaRequest` de Nexo, con sus mismos límites. Cotifly lo reenvía a `POST /api/captura-solicitudes` en
        camelCase (nombre de Nexo entre paréntesis en cada campo).

        Catálogos (HU-013, ADR-018): `POST /api/captura-solicitudes` de Nexo NO valida contra sus catálogos: resuelve el
        texto por coincidencia aproximada y, si no encuentra el tipo de vehículo, **crea una fila nueva de catálogo**
        (duplicados). Por eso el frontend envía SOLO códigos de catálogo (los de `GET /web/catalogos-flete`) en
        `tipo_vehiculo`, `carroceria`, `clase_viaje`, `clase_contenedor` y `tipologia`, nunca texto libre; la validación
        del lado de Cotifly contra el catálogo es un gap documentado en `docs/HU-013-preguntas-nexo.md`.

        No se envían (decisión de HU-005.1 o gap documentado): `modalidad` (la cubre la línea de negocio), `notas` (la
        personalización es del PDF), `clienteId` (Cotifly envía `clienteBp`), `origenMunicipioId`/`destinoMunicipioId`
        y las horas de cargue y descargue por línea (gaps).
      properties:
        tipo:
          type: string
          enum: [spot, licitacion]
          description: Encabezado (`tipo`), en minúscula como lo valida Nexo.
        nit_cliente:
          type: string
          maxLength: 20
          description: |
            Encabezado. NIT elegido en el buscador (`GET /web/clientes`). Nexo no acepta el NIT: Cotifly resuelve el BP en
            el catálogo de Nexo y envía `clienteBp`.
        cliente_nombre:
          type: string
          nullable: true
          maxLength: 300
          description: Referencia visible mientras se resuelve; se reemplaza por el nombre del catálogo de Nexo. No viaja a Nexo.
        linea_negocio:
          type: string
          description: |
            Línea (`lineaNegocio`, máx. 100 en Nexo). Línea de negocio de Cotifly (`MargenesPolitica`, da el margen); a
            Nexo va su `mapeoLineasNexo` (enum de Nexo `PuertoAInterior`, `InteriorAPuerto`, `Nacional`,
            `DevolucionContenedor`, `Andino`, `Licitaciones`; catálogo `GET /api/catalogos/lineas-negocio`).
        deadline:
          type: string
          format: date-time
          nullable: true
          description: |
            Encabezado (`deadline`, `date-time` en Nexo). Cotifly lo lee como fecha y hora con zona y lo reenvía a Nexo en
            ISO 8601 con desplazamiento (`2026-10-10T17:00:00-05:00`). El frontend debe enviar fecha y hora con
            `-05:00`: una fecha sola o sin zona (`2026-10-10`) toma la zona del servidor (UTC en el contenedor), es decir
            las 19:00 del día anterior en Bogotá; gap documentado.
        valor_estimado:
          type: number
          nullable: true
          minimum: 0
          maximum: 9999999999999.99
          description: Encabezado (`valorEstimado`), uno por solicitud; distinto de `valor_mercancia` (por línea).
        referencia:
          type: string
          nullable: true
          maxLength: 200
          description: Encabezado (`referencia`), la referencia u orden de compra del cliente (distinta de `notas`).
        horas_cargue:
          type: number
          nullable: true
          minimum: 0
          maximum: 240
          description: |
            Encabezado (`horasCargue`). Nexo también lo acepta por línea (sobreescribe el valor por defecto de la línea);
            Cotifly solo lo envía en el encabezado (gap no bloqueante).
        horas_descargue:
          type: number
          nullable: true
          minimum: 0
          maximum: 240
          description: Encabezado (`horasDescargue`). Igual que `horas_cargue`.
        origen:
          type: string
          maxLength: 150
          description: Línea (`origen`). Municipio de `GET /web/municipios` (columna `municipio`).
        destino:
          type: string
          maxLength: 150
          description: Línea (`destino`). Municipio de `GET /web/municipios`.
        tipo_vehiculo:
          type: string
          nullable: true
          maxLength: 100
          description: |
            Línea (`tipoVehiculo`). Código SICE-TAC/SAP de Nexo (`2`, `2S3`, `3S3`...), SOLO del catálogo: un texto que no
            coincide crea un tipo de vehículo nuevo en Nexo.
        carroceria:
          type: string
          nullable: true
          maxLength: 100
          description: |
            Línea (`carroceria`). Código del catálogo (`ESTACAS`, `ESTIBAS`, `FURGON`, `FURGON REFRIGERADO`,
            `PLATAFORMA`, `PORTACONTENEDORES`, `TANQUE`, `TRAYLER`, `VOLCO`); en código hasta que Nexo publique su catálogo.
        tipologia:
          type: string
          nullable: true
          maxLength: 50
          description: |
            Línea (`tipologia`; en Nexo solo existe a nivel de LÍNEA, no por posición). Enum de Nexo de 7 valores:
            `Contenedor`, `CargaSuelta`, `GranelSolido`, `GranelLiquido`, `Alimentos`, `Refrigerados`, `CargaSeca`.
        clase_viaje:
          type: string
          nullable: true
          maxLength: 50
          description: Línea (`claseViaje`). Catálogo de Nexo (`Contenedor`, `Cupo`, `Carga Suelta`, `Extradimensionado`).
        clase_contenedor:
          type: string
          nullable: true
          maxLength: 20
          description: |
            Línea (`claseContenedor`), condicional a `clase_viaje = Contenedor`. Catálogo de Nexo (`CNT20.IT`, `CNT20.RE`,
            `CNT20.ST`, `CNT40.HC`, `CNT40.RE`).
        exclusivo:
          type: boolean
          nullable: true
          description: Línea (`exclusivo`).
        consolidado:
          type: boolean
          nullable: true
          description: Línea (`consolidado`).
        retorna_contenedor:
          type: boolean
          nullable: true
          description: Línea (`retornaContenedor`). Nexo lo fuerza a `true` si viene `ciudad_devolucion_contenedor`.
        ciudad_devolucion_contenedor:
          type: string
          nullable: true
          maxLength: 150
          description: Línea (`ciudadDevolucionContenedor`), condicional a `retorna_contenedor`.
        levante_contenedor_diferente:
          type: boolean
          nullable: true
          description: Línea (`levanteContenedorDiferente`). Nexo lo fuerza a `true` si la ciudad de levante difiere del origen.
        ciudad_levante_contenedor:
          type: string
          nullable: true
          maxLength: 150
          description: Línea (`ciudadLevanteContenedor`), condicional a `levante_contenedor_diferente`.
        valor_aprovisionamiento:
          type: number
          nullable: true
          minimum: 0
          maximum: 9999999999999.99
          description: |
            Línea (`valorAprovisionamiento`), condicional a un levante distinto del origen: Nexo solo lo guarda en ese caso.
        peso_kg:
          type: number
          nullable: true
          minimum: 0
          maximum: 999999.99
          description: |
            Línea (`peso`). Obligatorio (> 0) si las posiciones no aportan peso; si ambos vienen, deben coincidir con
            `sum(cantidad × posiciones[].peso_kg)` dentro del 1 % (`PESO_REQUERIDO` / `PESO_INCONSISTENTE`).
        valor_mercancia:
          type: number
          nullable: true
          minimum: 0
          maximum: 9999999999999.99
          description: Línea (`valorMercancia`).
        posiciones:
          type: array
          maxItems: 200
          default: []
          items:
            $ref: '#/components/schemas/PosicionCargaWeb'
        moneda:
          type: string
          nullable: true
          enum: [COP, USD, null]
          description: |
            Opcional (HU-013.7, #103; mismo contrato que `LicitacionWeb.moneda`, ADR-014 §5). Moneda de la cotización: `COP`
            por defecto. Con `USD` la TRM del día se fija al crear (`trm_aplicada`), los precios del flete y de los
            conexos se convierten con ella y el PDF lleva la nota de TRM mínima. Sin TRM, 400 `TRM_NO_DISPONIBLE` y nada
            se guarda ni se envía a Nexo. Se acepta sin distinguir mayúsculas ni espacios al borde. Depende de #50 (PR #96).

    HojaExcel:
