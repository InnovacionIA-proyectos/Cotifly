        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextosCotizacionWeb'
      responses:
        '200':
          description: Textos guardados
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextosCotizacion'
        '400':
          description: '`TEXTOS_COTIZACION_INVALIDOS` (`ErrorNegocio`); `ErrorWeb` si el cuerpo no es JSON válido'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNegocio'
                  - $ref: '#/components/schemas/ErrorWeb'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '409':
          description: '`PDF_YA_ENVIADO` (ya enviada o con resultado), `COTIZACION_NO_FINALIZADA` (HU-036.3, #207: finaliza la cotización antes de editar los textos) o `CONFLICTO_CONCURRENCIA`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '428':
          $ref: '#/components/responses/PrecondicionRequerida'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '413':
          $ref: '#/components/responses/CuerpoDemasiadoGrande'
        '415':
          $ref: '#/components/responses/TipoContenidoNoSoportado'

  /web/cotizaciones/{folio}/costeo/pdf:
    post:
      operationId: generarPdfCosteo
      tags: [web]
      summary: Genera el PDF de la cotización con el precio sobre el costeo de Nexo
      description: |
        HU-005.7, módulo PDF de HU-003.5. El payload lo arma el servidor desde la cotización: una fila con origen,
        destino, vehículo y el valor final de la ruta (HU-033: conexos incluidos, sin desglose), los servicios conexos
        listados como incluidos sin precio y el "VALOR TOTAL DE LA COTIZACIÓN" al final. Solo el dueño.
        Desde HU-013 (ADR-018 §11, #98) ya no es "una sola vez": mientras la cotización no se haya enviado ni tenga resultado,
        los ajustes (margen, conexos, textos, re-solicitar en el mismo folio) invalidan el PDF (`pdf_desactualizado = true`) y
        se regenera aquí (el anterior queda en el historial). Con el PDF vigente responde `PDF_YA_GENERADO`; ya enviada o con
        resultado, `PDF_YA_ENVIADO` (versión `-vN`, con la llamada en `detalle` desde #228).

        **Por ruta (HU-021.9, #136).** Con una ruta, el PDF sale de la ruta y sus camiones: origen, destino, los camiones
        agrupados ("2 × 3S3 - FURGON (20000 KG)"; un camión sin vehículo es "Vehículo por definir" y uno descartado en Nexo no
        se imprime) y el valor final de la ruta (HU-033, #199: transporte con su margen y conexos a su venta, HU-043.2, sin desglose; los
        conexos se listan como incluidos, sin precio). Con **más de una ruta** (formulario o licitación) sale con el layout
        de pliego: resumen con una fila por ruta (número, ruta, vehículo y peso, valor final) y "VALOR TOTAL DE LA
        COTIZACIÓN (N RUTAS)" (antes la tarifa sin conexos y "TOTAL DEL PLIEGO (N RUTAS, SIN SERVICIOS CONEXOS)"), y luego
        **una sección por ruta** con su título (y la línea de negocio de la ruta), su origen, su destino, sus camiones y su
        valor final. Una ruta rechazada por la Mesa sale "Sin costeo" y no suma. OBS-C-3 (endurecimiento B de #199): los textos
        dependen del tipo. Una **licitación** dice "presentación oferta de servicios de Transporte para su licitación (N rutas)",
        "RESUMEN DEL PLIEGO" y "RUTA n: PLIEGO DE TRANSPORTE …"; una cotización **spot** de varias rutas (formulario) dice
        "presentación oferta de servicios de Transporte (N rutas)", "RESUMEN DE LAS RUTAS" y "RUTA n: TARIFA DE TRANSPORTE …".
        `POST /web/cotizaciones/{folio}/costeo/pdf` no responde `FOLIO_INVALIDO`: su `PDF_YA_ENVIADO` lleva a la versión nueva
        (`re-solicitar`), que sí puede.
        Con más de 20 rutas solo trae el resumen (hasta 1000 rutas). Una licitación de una sola fila sale con el PDF de una
        ruta. En los dos casos el PDF exige que **todas** las rutas tengan precio y que `precio_final` sea la suma de sus
        `precio_final_linea` (con los conexos incluidos); si no, `COSTEO_NO_LISTO` (el ajuste de margen es por ruta, el PDF no).
        En USD (HU-012.1, licitaciones con `moneda = USD`) las tarifas salen en `US$` con 2 decimales y el PDF lleva la nota
        "Esta cotización está bajo una TRM mínima de {TRM} y es de resaltar que la tarifa puede variar de acuerdo al
        comportamiento de la misma a la fecha de elaboración de la CPI." con la `trm_aplicada` de la cotización (formato
        `$3.273,49`); en COP no la lleva. Nunca imprime costos de Nexo.

        HU-013 (ADR-018): es el único generador de PDF (el chat ya no arma payloads). Desde HU-013.5 imprime el asunto y
        la introducción guardados en `textos` (o los de `clsTextosEstandar` si no hay); nunca llama a la IA, así que el
        PDF siempre sale. Desde HU-013.7 la cotización del formulario en USD reutiliza el mismo formato y nota de TRM de
        HU-012.1. Acepta `If-Match` opcional (desde el `0006` de #98: si viene y no coincide, 409 `CONFLICTO_CONCURRENCIA`).
        Al regenerar un PDF desactualizado, el anterior se archiva en el almacén como `{folio}-hN.pdf` (queda en el
        historial) y el nuevo conserva el nombre `{folio}.pdf`.

        **Seguro de la mercancía (HU-045.3, #265, ADR-032 §9).** Una ruta con el seguro (`incluye_seguro`, #264) lo trae en una fila propia,
        "Seguro de la mercancía", aparte del flete (política NOGE0076): la fila de la ruta imprime su valor final SIN el seguro y la fila del
        seguro su `valor_seguro`; en el pliego, el resumen agrega la fila del seguro debajo de la ruta (con su número). El "VALOR TOTAL DE LA
        COTIZACIÓN" no cambia: la suma de los `precio_final_linea`, con el seguro. Nunca imprime la tasa. En COP, el seguro y los montos que
        lo incluyen (resumen y total) se imprimen con sus centavos cuando los tienen (`$100,40`), para que lo impreso cuadre con lo guardado
        (B1, decisión del usuario); sin centavos, en pesos enteros como siempre. Una ruta que cotiza con el seguro
        marcado y sin valor de la mercancía (una edición quitó el valor) NO bloquea (decisión del usuario del 2026-11-09): el seguro no suma,
        la ruta sale sin su fila y el 201 trae `aviso_seguro` (`AvisoSeguro`) con las rutas.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Folio'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '201':
          description: PDF generado y registrado
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalidaPdf'
        '400':
          description: Payload del PDF inválido (`PDF_PAYLOAD_INVALIDO`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '404':
          $ref: '#/components/responses/NoEsTuya'
        '409':
          description: '`SIN_RUTAS_COTIZABLES` (HU-028.1, #183, decisión D1: la Mesa de Costeo rechazó todas las rutas), `COSTEO_NO_LISTO` (alguna ruta NO rechazada sin precio; las rechazadas salen "Sin costeo", sin precio ni motivo, y no suman; con la cotización finalizada y una ruta rechazada después, el total congelado ya no cuadra: `detalle` trae la versión nueva, `accion = nueva_version`), `PDF_YA_GENERADO` (PDF vigente), `PDF_YA_ENVIADO` (ya enviada o con resultado; DEF-1027B-1, #228: `detalle` con la llamada para crear la versión nueva, igual que margen y conexos: `accion = nueva_version`, `metodo = POST`, `endpoint = /web/cotizaciones/{folio}/costeo/re-solicitar` y `cuerpo = {motivo: "Generar el PDF después del envío", nueva_version: true}`), `COTIZACION_NO_FINALIZADA` (HU-036.3, #207: el PDF sale con el precio que aceptó el comercial; `detalle` con la llamada a `.../finalizar`) o `CONFLICTO_CONCURRENCIA`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '503':
          description: |
            `PDF_RENDER_NO_DISPONIBLE`: el render falló o no consiguió turno a tiempo (#92/#95: el render es uno a la vez por
            proceso y espera hasta `Pdf:TiempoEsperaRenderSegundos`, 30 s por defecto). Es transitorio: reintentar. No queda nada
            guardado ni cambia la versión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/licitaciones/analizar-excel:
    post:
      operationId: analizarExcelLicitacion
      tags: [web]
      summary: Analiza el Excel del pliego en Nexo para mapear sus columnas (no guarda nada)
      description: |
        HU-011.2 (ADR-017, `docs/conexion_nexo/HU-011-formato-excel-licitacion.md`). Cotifly no impone plantilla: reenvía el archivo a
        `POST {Nexo:UrlBase}/api/captura-solicitudes/analizar-excel` con la identidad del comercial y devuelve las hojas con
        su fila de encabezado, los encabezados y hasta 1000 filas como texto, para que el frontend mapee las columnas a los
        campos destino. Ni Nexo ni Cotifly guardan el archivo en este paso. `multipart/form-data` con el campo `archivo`
        (`.xlsx` o `.xlsm`, máximo 10 MB menos 64 KB: 10.420.224 bytes). El cuerpo completo de `/web/licitaciones*` admite hasta
        `SeguridadHttp:LimiteCuerpoLicitacionBytes` (12 MB por defecto; 413 al pasarlo).

        **Código de mercancía (HU-023.5, #160).** Cotifly reconoce en cada hoja la columna de la mercancía (encabezado con
        "mercancía", "producto", "tipo de carga", "commodity" o "descripción", sin tildes ni mayúsculas) y la del código ("código
        mercancía", "cód. producto"...). Por cada fila con mercancía devuelve en `hojas[h].mercancias` el `codigo_mercancia`: el de
        la columna de código tal cual (`origen = excel`, `sugerido = false`) o, si no hay, el más parecido del catálogo del
        cubicador (`GET /web/tipos-mercancia`, solo tipos activos y cubicables), comparado sin tildes ni mayúsculas, con
        `origen = parecido`, `sugerido = true` y su `similitud` (0 a 1): **el frontend lo muestra como sugerido y el comercial lo
        confirma o lo cambia** antes de mandarlo en `POST /web/licitaciones`. Sin nada parecido (similitud menor que 0,5) el código
        queda `null`. Sin cubicador o con su catálogo caído el análisis no falla: `catalogo_mercancias_disponible = false` y solo
        se usa la columna de código.

        **Controles del archivo ANTES de Nexo (HU-035.2, #213).** Cotifly lee primero el archivo con los mismos controles del Excel
        de mercancías (`POST /web/mercancias/analizar-excel`, ADR-024): firma `PK` (un `.xls` antiguo o cifrado renombrado es
        `EXCEL_INVALIDO` con `detalle.motivo = CIFRADO_O_XLS`), a lo sumo 1000 entradas en el zip, 64 MB descomprimidos contados de
        verdad (bomba zip) y 1.000.000 de elementos XML contados en flujo sin DTD ni entidades externas (libro denso, XXE). Un archivo
        que no pasa, o que Cotifly no puede abrir, se rechaza con 400 y **nunca se envía a Nexo**. La misma lectura calcula
        `filas_excel` (de las primeras 20 hojas), y después el archivo va a Nexo; el cupo de lecturas se libera antes de llamar a
        Nexo. Cotifly lee hasta 4 archivos de Excel a la vez (cupo compartido con el Excel de mercancías); si el cupo sigue lleno 15
        s, 503 `SERVICIO_OCUPADO` con `Retry-After`.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Hojas analizadas por Nexo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalisisExcel'
        '400':
          description: |
            `ARCHIVO_REQUERIDO` (falta o vacío), `FORMATO_NO_SOPORTADO` (otra extensión), `ARCHIVO_DEMASIADO_GRANDE` (más de
            10 MB menos 64 KB, 10.420.224 bytes; o, de los controles de Cotifly, `detalle.motivo = DESCOMPRIMIDO_EXCEDE_LIMITE`: más
            de 64 MB descomprimido o más de 1.000.000 de elementos XML), `EXCEL_INVALIDO` de los controles de Cotifly, antes de Nexo,
            con `detalle.motivo` (`NO_ES_XLSX`, `CIFRADO_O_XLS`, `ZIP_INVALIDO`, `SIN_LIBRO`, `DEMASIADAS_ENTRADAS`,
            `LIBRO_ILEGIBLE`), y de Nexo `EXCEL_INVALIDO` (no se pudo leer) o `EXCEL_SIN_DATOS` (ninguna hoja con tabla).
            `COSTEO_NEXO_RECHAZADA` para otro 4xx de Nexo. Un 413 de Nexo también es `ARCHIVO_DEMASIADO_GRANDE`: Cotifly acepta
            hasta 10 MB menos 64 KB para que el archivo con el sobre multipart quepa en el límite de 10 MB de Nexo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '403':
          description: '`NEXO_SIN_PERMISO`: Nexo respondió 403 (el comercial no tiene el rol de Cabina de Fletes que pide el análisis)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '413':
          description: El cuerpo supera `SeguridadHttp:LimiteCuerpoLicitacionBytes` (12 MB por defecto)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWeb'
        '429':
          description: '`IA_TOPE_DIARIO` (#278): Nexo respondió 429 `IA_TOPE_DIARIO`, el comercial agotó su cupo diario de IA en Nexo. Sin `Retry-After`: se reintenta al día siguiente (o se captura la licitación sin el análisis). El 429 `DEMASIADAS_SOLICITUDES` de Nexo (cupo por minuto) es 503 `COSTEO_NEXO_NO_DISPONIBLE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '503':
          description: '`COSTEO_NEXO_NO_DISPONIBLE` o `COSTEO_NEXO_TIEMPO_AGOTADO`. Como en el resto de los endpoints, `detalle.motivo` lleva solo el código de Nexo (por ejemplo `SESION_INVALIDA`, o `HTTP 401` si Nexo no manda código), nunca su texto (HU-013.15, #124). #278: también el 429 `DEMASIADAS_SOLICITUDES` de Nexo, con `detalle.motivo` = `DEMASIADAS_SOLICITUDES (Retry-After N s)`. HU-035.2 (#213): `SERVICIO_OCUPADO` con `Retry-After` si el cupo de lecturas de Excel siguió lleno 15 s (el archivo no se envió a Nexo)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '415':
          $ref: '#/components/responses/TipoContenidoNoSoportado'

  /web/mercancias/analizar-excel:
    post:
      operationId: analizarExcelMercancias
      tags: [web]
      summary: Lee en Cotifly el Excel de mercancías de una ruta y devuelve su grilla cruda (sin Nexo, no guarda nada)
      description: |
        HU-035.1 (#202, ADR-024). Para importar las mercancías de UNA ruta (tipo, cantidad, largo, ancho, alto, peso) desde un Excel
        del comercial. **Cotifly lee el archivo localmente (ClosedXML) y nunca llama a Nexo**: a diferencia de
        `POST /web/licitaciones/analizar-excel`, no espera el formato de un pliego. Devuelve, por hoja, el encabezado detectado, los
        encabezados y las filas con datos como texto; **el frontend mapea las columnas a los campos de la mercancía**, igual que con las
        rutas de una licitación. Ni Cotifly ni nadie guarda el archivo. `multipart/form-data` con el campo `archivo` (`.xlsx` o
        `.xlsm`, máximo 10 MB menos 64 KB: 10.420.224 bytes; las macros nunca se ejecutan). El cuerpo completo admite hasta
        `SeguridadHttp:LimiteCuerpoLicitacionBytes` (12 MB por defecto; 413 al pasarlo). Rol: el de la captura (comercial o gerente).

        **Lectura.** El encabezado de cada hoja es la primera de sus 15 primeras filas usadas con al menos 3 valores distintos (la
        misma regla de las licitaciones); si ninguna los tiene, la primera fila con datos. `filas` son las filas no vacías debajo del
        encabezado, del ancho de `encabezados` (las celdas vacías van como `""`); `filas_excel[i]` es el número de fila de Excel
        (base 1) de `filas[i]`. Las celdas combinadas no se expanden (el valor queda en la primera). Las hojas sin datos no aparecen.
        Las hojas ocultas en Excel (`hidden` y `veryHidden`) **se leen igual** y vienen con `oculta = true` (las visibles, `false`): el
        frontend decide si las ofrece o las muestra al final.

        **Formato estable de las celdas** (independiente de la cultura y del formato visual de la celda): números con punto decimal,
        sin separador de miles y hasta 15 cifras significativas (`12000`, `1.25`, un porcentaje `15 %` llega como `0.15`); fechas
        `yyyy-MM-dd` (con hora, `yyyy-MM-ddTHH:mm:ss`); duraciones `HH:mm:ss`; booleanos `true`/`false`; errores de Excel como su
        texto (`#DIV/0!`); el texto sin espacios al borde y con los saltos de línea como un espacio. **Una celda con fórmula trae el
        valor que Excel guardó** al último guardado (Cotifly nunca evalúa fórmulas); sin valor guardado, `""`.

        **Topes** (el truncado se indica en la respuesta): hasta 20 hojas con datos (`hojas_truncadas`), 1000 filas por hoja
        (`filas_truncadas`; `total_filas` es el total real), 50 columnas desde la primera usada (`columnas_truncadas`;
        `total_columnas` es el ancho real), 500 caracteres por celda (`celdas_recortadas`) y 100.000 celdas en toda la respuesta (al
        pasarlo, las filas que faltan se cortan con `filas_truncadas = true`). Contra archivos maliciosos el paquete se revisa antes
        de abrirlo: más de 64 MB descomprimido o más de 1.000.000 de elementos XML (un libro pequeño con millones de celdas) es
        `ARCHIVO_DEMASIADO_GRANDE` con `detalle.motivo = DESCOMPRIMIDO_EXCEDE_LIMITE` (bomba zip); un archivo que no es un `.xlsx` válido es `EXCEL_INVALIDO`. Cotifly analiza hasta 4 archivos a la vez; si el
        cupo sigue lleno 15 s, 503 `SERVICIO_OCUPADO` con `Retry-After`.

        **Código de mercancía (opcional).** Como en el análisis de licitaciones (HU-023.5), Cotifly reconoce la columna de la
        mercancía ("mercancía", "producto", "tipo de carga", "commodity" o "descripción") y la del código ("código mercancía",
        "cód. producto"...) y sugiere en `hojas[h].mercancias` el `codigo_mercancia` de cada fila contra el catálogo del cubicador
        (solo tipos cubicables). El catálogo es opcional: sin cubicador o con él caído el análisis **no falla**
        (`catalogo_mercancias_disponible = false`, solo se usa la columna de código).
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Grilla cruda de las hojas con datos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalisisExcelMercancias'
        '400':
          description: |
            `ARCHIVO_REQUERIDO` (falta la parte `archivo` o viene vacía), `FORMATO_NO_SOPORTADO` (otra extensión),
            `ARCHIVO_DEMASIADO_GRANDE` (más de 10.420.224 bytes, o más de 64 MB descomprimido o de 1.000.000 de elementos XML con
            `detalle.motivo = DESCOMPRIMIDO_EXCEDE_LIMITE`), `EXCEL_INVALIDO` (no es un `.xlsx`/`.xlsm` legible: corrupto, otro formato renombrado, un
            `.xls` antiguo o protegido con contraseña, o un paquete con demasiadas entradas; `detalle.motivo` dice cuál) y
            `EXCEL_SIN_DATOS` (ninguna hoja tiene datos). Nunca un 500 por el contenido del archivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '413':
          $ref: '#/components/responses/CuerpoDemasiadoGrande'
        '415':
          $ref: '#/components/responses/TipoContenidoNoSoportado'
        '503':
          description: '`SERVICIO_OCUPADO`: el cupo de análisis simultáneos siguió lleno 15 s (trae `Retry-After`). Reintentar'
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /web/licitaciones/plantillas-mapeo:
    put:
      operationId: guardarPlantillaMapeo
      tags: [web]
      summary: Guarda (o reemplaza) en NEXO la plantilla de mapeo del cliente para esos encabezados
      description: |
        HU-044.5 (#256, ADR-028). Cotifly reenvía a `PUT {Nexo:UrlBase}/api/captura-solicitudes/plantillas-mapeo` con la identidad del
        comercial y el NIT de la licitación como `clienteNit` (sin puntos ni dígito de verificación). Se llama cuando el comercial
        confirma el mapeo y elige guardarlo. Con la plantilla, la siguiente carga del mismo formato (mismos encabezados) sale de la
        plantilla en `sugerir-mapeo`, sin IA. **Cotifly no guarda copia**: NEXO registra quién la guardó (`tbl_audit_log`).

        `201` la primera vez; `200` si reemplaza a la plantilla del cliente con esos mismos encabezados (el mismo `id`). Si el NIT no
        tiene cliente local en NEXO, NEXO lo crea desde el DW; si no es de ningún cliente ni prospecto, `CLIENTE_NIT_INVALIDO`.
        `campo` es el nombre de NEXO (el de `sugerir-mapeo` y `aplicar-mapeo`). Las reglas de `encabezados` (1 a 100, máx. 200
        caracteres) y de `columnas` las valida NEXO y sus rechazos llegan con su código.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantillaMapeoWeb'
      responses:
        '201':
          description: Plantilla nueva del cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantillaMapeo'
        '200':
          description: Reemplazó a la plantilla del cliente con esos encabezados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantillaMapeo'
        '400':
          description: |
            `ErrorWeb`: cuerpo inválido. `ErrorNegocio`: `CLIENTE_REQUERIDO` (sin `nit_cliente`) o `CLIENTE_NIT_INVALIDO` (el NIT no
            tiene letras ni dígitos o pasa de 30), sin llamar a NEXO; de NEXO, con su código y su mensaje, `CLIENTE_NIT_INVALIDO` (no es
            de ningún cliente ni prospecto), `NOMBRE_DEMASIADO_LARGO`, `ENCABEZADOS_REQUERIDOS`, `DEMASIADAS_COLUMNAS`,
            `ENCABEZADO_DEMASIADO_LARGO`, `COLUMNA_FUERA_DE_RANGO`, `COLUMNA_INVALIDA`, `CAMPO_INVALIDO`, `CAMPO_DUPLICADO`,
            `TRANSFORMACION_INVALIDA`, `TRANSFORMACION_NO_APLICA`...; `COSTEO_NEXO_RECHAZADA` para otro 4xx de NEXO.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorWeb'
                  - $ref: '#/components/schemas/ErrorNegocio'
