# =============================================================================
# Excepciones TEMPORALES del escaneo de vulnerabilidades (Trivy) de la imagen del backend (#86).
#
# Lo usan, con el mismo efecto, el paso "Escaneo de vulnerabilidades (Trivy)" del job imagen-docker de
# .github/workflows/backend-dotnet.yml y scripts/publicar-imagen.sh / publicar-imagen.ps1 (--ignorefile).
#
# Reglas (docs/03-infraestructura.md §3.1 y docs/10-operacion.md §10.6):
#   - Una entrada por CVE, nunca comodines ni severidades completas: cualquier otro HIGH/CRITICAL con parche sigue fallando.
#   - Cada entrada lleva purls con la versión exacta instalada (si la imagen base cambia de versión, la excepción deja de
#     aplicar sola), un expired_at (Trivy la ignora desde esa fecha y el escaneo vuelve a fallar) y su justificación.
#   - Agregar o prorrogar una excepción exige la aprobación explícita en el PR de un revisor humano distinto del autor
#     (líder técnico o seguridad), con dueño y fecha en docs/10-operacion.md. Hoy no hay CODEOWNERS que lo obligue; se
#     sugiere agregar este archivo a uno (por ejemplo "/backend-dotnet/.trivyignore.yaml @<lider-tecnico> @<seguridad>").
#   - expired_at vence a las 00:00 UTC de esa fecha (19:00 del día anterior en Colombia, UTC-5). Mientras está vigente,
#     la excepción aplica en todas las ramas, también en main y en los tags de release.
#   - .github/workflows/vigilancia-imagen-base.yml revisa cada lunes si ya se puede quitar (digest nuevo, parche siguiente,
#     Trivy sin excepciones) y falla si una excepción vence en 7 días o menos.
