# Base de datos local de Cotifly: SQL Server 2019 y la instalación del esquema dbo_cotifly.
#
# Solo levanta la base (servicios `sqlserver` y `db-init`); no levanta el backend. El entorno local
# completo del backend .NET (SQL Server, esquema y API) es backend-dotnet/scripts/levantar-local.*
# (ADR-007). Ver db/README.md.
#
# HU-022.1 (#146): se quitaron los servicios del bot en Python (mcp, orquestador) y MinIO. El stack
# Python completo quedó en el tag `python-final`.
#
# Es un contenedor LOCAL propio (usuario `sa`, credenciales locales): no tiene relación con la
# instancia corporativa `tbsdatacenter`/`dbTarifario_Nexo_Pruebas`.
# La base `bd_cotifly` la crea e inicializa el servicio `db-init`, que corre db/ejecutores/ejecutar-bd.sh
# una vez que SQL Server está sano: crea la base, el esquema dbo_cotifly (db/esquema/) y los seeders. Es
# seguro correrlo en cada `docker compose up`: si el esquema ya existe, solo corre los ajustes de
# db/scripts/ y repasa los seeders (todos idempotentes).
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Bot_Cotizador_2019!}
    ports:
      # 1434 en el host para no chocar con otros SQL Server locales (interno sigue 1433).
      - "1434:1433"
    volumes:
      - mssqldata:/var/opt/mssql
    healthcheck:
      # Ruta de sqlcmd dentro de la imagen: probamos la variante nueva
      # (mssql-tools18, driver 18, requiere -C) y si no existe, la vieja
      # (mssql-tools, driver 17) -- no verificado contra el tag real todavía,
      # confirmar cuál trae la imagen al levantarla la primera vez.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Corre una vez y termina (restart: "no"): crea la base bd_cotifly, el esquema y los seeders.
  # La clave de `sa` la lee sqlcmd de SQLCMDPASSWORD. La carpeta db/ va montada de solo lectura.
  # Opciones: -c crea la base si falta, -y no pregunta. El ejecutador salta solo el esquema si ya existe (así no falla al
  # reiniciar); -a se conserva por compatibilidad.
  db-init:
    image: mcr.microsoft.com/mssql/server:2019-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:-Bot_Cotizador_2019!}
    volumes:
      - ./db:/db:ro
    entrypoint: ["/bin/bash", "/db/ejecutores/ejecutar-bd.sh", "-s", "sqlserver", "-d", "bd_cotifly", "-u", "sa", "-c", "-a", "-y"]
    restart: "no"

volumes:
  mssqldata:
