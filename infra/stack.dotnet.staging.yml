# =============================================================================
# Stack de STAGING para Dokploy (Docker Swarm) — backend .NET 10 de Cotifly (HU-006.6, #30).
#
# Equivale, para el backend .NET, al antiguo infra/stack.staging.yml (Python, nunca desplegado). Todo el Python, incluido
# el manifiesto del stack que corre hoy en Dokploy, se borró del repositorio en HU-022.1 (#146) y vive en el tag
# python-final. Decisiones: ADR-013.
# Runbook: DEPLOY.md §5. NO desplegar sin aprobación: la prueba en staging está pendiente (HU-006.6).
#
# Topología:
#   Internet/red corporativa ──> Traefik (dokploy-network) ──> cotifly-api:8080 ──> tbsdatacenter:1433 (SQL Server 2019)
#                                  (TLS: HU-006.2)                      │         ──> LLM, Nexo, SAP TM, relay SMTP
#                                                                       └── volumen cotifly_staging_pdfs (/data/pdfs)
#   - Un solo servicio (ADR-002): no hay MCP, ni base de datos, ni MinIO en el stack.
#   - SQL Server es la instancia corporativa EXTERNA (HU-002.4, ADR-008): se llega por la cadena de conexión, no por
#     un servicio del stack.
#
# Redes (equivalentes a bot-edge / bot-back del Python):
#   - edge    = dokploy-network (externa, la de Traefik). Solo entrada desde Traefik; ningún otro servicio del stack.
#   - salida  = overlay propia NO interna: salida a internet y a la red corporativa (SQL Server, LLM, Nexo, TRM en
#               www.datos.gov.co, SAP, relay). Equivale a bot-edge.
#   - bot-back (interna, sin salida) no hace falta: no hay servicios internos. Si vuelve alguno (p. ej. MinIO,
#     ADR-012), va en una overlay con internal: true y sin labels de Traefik.
#
# ANCLADO AL WORKER mientras el overlay VXLAN entre nodos esté caído (HU-006.1): la tarea corre en TBSNODO1-DKP
# (10.10.40.31), donde hay disco y donde vive el volumen local de PDFs. Por la misma causa, Traefik (manager) no
# alcanza hoy a la tarea del worker por la overlay: mientras HU-006.2 no lo resuelva, staging se prueba por el puerto
# publicado en modo host (abajo, HTTP sin TLS, solo red corporativa). Al resolverse: quitar "ports", usar
# COTIFLY_ORDEN_UPDATE=start-first y, si se quiere, quitar la restricción de nodo (con un volumen compartido).
#
# Variables: todas llegan del entorno del stack en Dokploy (DEPLOY.md §2); ninguna tiene valor real aquí. Endurecimiento A (#199):
# se declaran TODAS las opciones que el backend valida al arrancar, con el valor por defecto del código (lo verifica la prueba
# clsManifiestosDespliegueTests contra las clases de opciones). Las
# obligatorias usan ${VAR:?}: sin ellas "docker stack deploy" falla antes de tocar el servicio. Una variable que no
# aparece en este archivo NO llega al contenedor aunque esté en Dokploy (p. ej. un tercer respaldo IA__Fallbacks__2__*: agregarlo aquí).
#
# Validar sin desplegar:
#   docker stack config -c infra/stack.dotnet.staging.yml      (con las variables obligatorias en el entorno)
# =============================================================================

networks:
  edge:
    external: true
    name: dokploy-network
  salida:
    driver: overlay
    # internal: false (por defecto): la API necesita salida.

volumes:
  pdfs:
    name: cotifly_staging_pdfs

services:
  cotifly-api:
    image: ghcr.io/innovacionia-proyectos/cotifly-backend:${COTIFLY_TAG:?falta COTIFLY_TAG}
    networks: [edge, salida]
    volumes:
      - pdfs:/data/pdfs
    # Acceso temporal mientras el overlay esté caído (HU-006.1/HU-006.2): bind directo en el worker, HTTP sin TLS.
    # 8092 para no chocar con el Python (8091). Quitar cuando Traefik llegue a la tarea.
    ports:
      - target: 8080
        published: ${COTIFLY_PUERTO_HOST:-8092}
        protocol: tcp
        mode: host
    environment:
      # Staging corre como Production a propósito y fijo (no se lee del entorno): mismas validaciones de arranque
      # que producción (secretos, CORS, JWT de Chat).
      ASPNETCORE_ENVIRONMENT: Production
      Zona__ZonaHoraria: America/Bogota

      # Persistencia (ADR-008): SQL login cotifly_app contra tbsdatacenter. Secretos.
      ConnectionStrings__Cotifly: ${ConnectionStrings__Cotifly:?falta ConnectionStrings__Cotifly}
      ConnectionStrings__Identidad: ${ConnectionStrings__Identidad:?falta ConnectionStrings__Identidad}
      Identidad__Esquema: ${Identidad__Esquema:-dbo}
      Identidad__TablaUsuarios: ${Identidad__TablaUsuarios:-tblSAPUsuariosApp}
      Identidad__TablaUsuarioRoles: ${Identidad__TablaUsuarioRoles:-tblSAPUsuarioRoles}
      Identidad__TablaRoles: ${Identidad__TablaRoles:-tblSAPRoles}
      # HU-023 (#176): script 07 del motivo BUSQUEDA_AGOTADA. auto (detecta; exige VIEW DEFINITION), habilitado o deshabilitado.
      BaseDatos__MotivoBusquedaAgotada: ${BaseDatos__MotivoBusquedaAgotada:-auto}
      # Candado del folio en SQL Server (sp_getapplock, #125): esperas, reintentos y límite de los comandos.
      CandadoSql__EsperaMilisegundos: ${CandadoSql__EsperaMilisegundos:-5000}
      CandadoSql__MargenRespuestaMilisegundos: ${CandadoSql__MargenRespuestaMilisegundos:-15000}
      CandadoSql__GraciaCancelacionMilisegundos: ${CandadoSql__GraciaCancelacionMilisegundos:-5000}
      CandadoSql__ComandoSegundos: ${CandadoSql__ComandoSegundos:-120}
      CandadoSql__Intentos: ${CandadoSql__Intentos:-3}
      CandadoSql__PausaBaseMilisegundos: ${CandadoSql__PausaBaseMilisegundos:-200}

      # Regional del comercial (ADR-016, ADR-008): OPCIONAL, solo lectura de DWCubosEBSSAP (dbo.DimEjecutivo). El login la
      # llena y la refresca en UsuariosWeb.regional (#81) y el tablero del gerente la lee en vivo (#45).
      # Vacía = no configurada: se usa lo que ya haya en UsuariosWeb.regional. Con valor es SECRETO (se valida en Production)
      # y exige salida desde el worker a 10.10.40.24:1433 y un usuario SQL de solo lectura con SELECT únicamente sobre
      # dbo.DimEjecutivo (pendiente con el DBA).
      ConnectionStrings__Regional: ${ConnectionStrings__Regional:-}
      # Obligatorias con valor (identificadores SQL): los defaults son los de clsOpcionesRegional; no dejarlas vacías.
      Regional__Esquema: ${Regional__Esquema:-dbo}
      Regional__Tabla: ${Regional__Tabla:-DimEjecutivo}
      # USUARIO guarda "boterosoto\usuario" (dominio\usuario); el código quita el dominio antes de comparar con UsuariosWeb.nombreUsuario (#81).
      Regional__ColumnaUsuario: ${Regional__ColumnaUsuario:-USUARIO}
      Regional__ColumnaRegional: ${Regional__ColumnaRegional:-REGIONAL}
      Regional__TiempoEsperaSegundos: ${Regional__TiempoEsperaSegundos:-10}
      # Espera máxima del login por DimEjecutivo (1 a 10 s): pasado ese tiempo el login sigue sin bloquearse (#81).
      Regional__TiempoEsperaLoginSegundos: ${Regional__TiempoEsperaLoginSegundos:-3}
      # Dominio aceptado en USUARIO (vacío = cualquiera); una fila de otro dominio no cuenta y deja un warning (#81).
      Regional__Dominio: ${Regional__Dominio:-boterosoto}

      # Autenticación (ADR-009). Jwt__SigningKey: secreto, >= 32 bytes, distinto al de producción.
      Jwt__Issuer: ${Jwt__Issuer:-cotifly-api}
      Jwt__Audience: ${Jwt__Audience:-clientepro}
      Jwt__SigningKey: ${Jwt__SigningKey:?falta Jwt__SigningKey}
      Jwt__AccessMinutes: ${Jwt__AccessMinutes:-60}
      Jwt__RefreshDays: ${Jwt__RefreshDays:-30}
      LimiteAuth__PeticionesPorVentana: ${LimiteAuth__PeticionesPorVentana:-30}
      LimiteAuth__VentanaSegundos: ${LimiteAuth__VentanaSegundos:-60}

      # Seguridad HTTP. CORS: dominio del frontend de ClientePro. Encabezados reenviados: solo desde la subred de
      # dokploy-network (docker network inspect dokploy-network --format '{{(index .IPAM.Config 0).Subnet}}').
      Cors__OrigenesPermitidos__0: ${Cors__OrigenesPermitidos__0:?falta Cors__OrigenesPermitidos__0}
      ForwardedHeaders__Habilitado: "true"
      ForwardedHeaders__RedesConocidas__0: ${ForwardedHeaders__RedesConocidas__0:?falta ForwardedHeaders__RedesConocidas__0}
      ForwardedHeaders__LimiteSaltos: ${ForwardedHeaders__LimiteSaltos:-1}
      SeguridadHttp__LimiteCuerpoWebBytes: ${SeguridadHttp__LimiteCuerpoWebBytes:-65536}
      # HU-011: Excel de licitación (10 MB) + JSON. ForwardedHeaders__ProxiesConocidos__N no se declara: vacía no arranca y basta la red.
      SeguridadHttp__LimiteCuerpoLicitacionBytes: ${SeguridadHttp__LimiteCuerpoLicitacionBytes:-12582912}

      # SAP TM (HU-009). Vacío = política de la línea. SapTm__Pass: secreto, solo con odata.
      SapTm__SalesOrgDefault: ${SapTm__SalesOrgDefault:-50000005}
      SapTm__Modo: ${SapTm__Modo:-}
      SapTm__ExportPath: ${SapTm__ExportPath:-}
      SapTm__Url: ${SapTm__Url:-}
      SapTm__User: ${SapTm__User:-}
      SapTm__SapClient: ${SapTm__SapClient:-}
      SapTm__Pass: ${SapTm__Pass:-}

      # Nexo (HU-005): sin token; URL del ambiente de pruebas de Nexo en staging.
      # Nexo__UrlBase es la RAÍZ del servicio (https://<host-nexo>), sin "/api": el cliente agrega las rutas /api/...
      Nexo__UrlBase: ${Nexo__UrlBase:-}
      Nexo__MinutosCacheMunicipios: ${Nexo__MinutosCacheMunicipios:-60}
      # HU-013.10: caché de los catálogos maestros de Nexo y horas que la última copia sirve de respaldo con Nexo caído.
      Nexo__MinutosCacheCatalogos: ${Nexo__MinutosCacheCatalogos:-30}
      Nexo__HorasCatalogosVencidos: ${Nexo__HorasCatalogosVencidos:-24}
      # HU-014 (#188): banderas de Nexo y de la captura con valor EXPLÍCITO, para que un cambio del valor por defecto del código no
      # cambie el ambiente sin querer. HU-031.1 (#194, decisión del 2026-10-20): EnviarCodigosCubicador en siempre (Nexo ya tiene la
      # bandeja de normalización, NEXO #322): el código del cubicador se resuelve con el catálogo y el diccionario de alias de Nexo y
      # viaja oficial; el que ninguno conoce viaja tal cual y Nexo lo normaliza. siempre | solo_conocidos | nunca; true = siempre (un
      # true que quede en Dokploy ya no es un riesgo), false = solo_conocidos. AceptarVehiculoCliente en true (el vehículo digitado solo
      # va en el camión del respaldo y debe ser un código de Nexo o un alias que resuelve a uno). Ver DEPLOY.md.
      Nexo__EnviarGrupoRutaId: ${Nexo__EnviarGrupoRutaId:-true}
      Nexo__EnviarDatosCubicador: ${Nexo__EnviarDatosCubicador:-true}
      Nexo__EnviarCodigosCubicador: ${Nexo__EnviarCodigosCubicador:-siempre}
      Captura__AceptarVehiculoCliente: ${Captura__AceptarVehiculoCliente:-true}
      # HU-032 (#197): clases de viaje que no exigen el vehículo elegido (la lista REEMPLAZA a la de por defecto, solo Contenedor; los
      # vacíos no cuentan). Para eximir también Carga Suelta: __0=Contenedor y __1=Carga Suelta. Un valor desconocido no arranca.
      Captura__ClasesSinVehiculoObligatorio__0: ${Captura__ClasesSinVehiculoObligatorio__0:-Contenedor}
      Captura__ClasesSinVehiculoObligatorio__1: ${Captura__ClasesSinVehiculoObligatorio__1:-}
      # HU-018.1 (#155): motivos de pérdida (GET /web/motivos-perdida). Vacíos = la lista de Nexo (Valor muy alto, Flete fuera de rango de
      # plaza, Cliente desistió del servicio, Tiempo de respuesta vencido, Otro); la lista configurada la REEMPLAZA. Máximo 100 caracteres por
      # motivo. MotivoConComentario (vacío = Otro) exige comentario y debe estar en la lista; si no, la API no arranca.
      Resultado__MotivosPerdida__0: ${Resultado__MotivosPerdida__0:-}
      Resultado__MotivosPerdida__1: ${Resultado__MotivosPerdida__1:-}
      Resultado__MotivosPerdida__2: ${Resultado__MotivosPerdida__2:-}
      Resultado__MotivosPerdida__3: ${Resultado__MotivosPerdida__3:-}
      Resultado__MotivosPerdida__4: ${Resultado__MotivosPerdida__4:-}
      Resultado__MotivosPerdida__5: ${Resultado__MotivosPerdida__5:-}
      Resultado__MotivoConComentario: ${Resultado__MotivoConComentario:-}
      # Polling del costeo en Nexo (HU-005.6/005.8, clsOpcionesCosteoNexo). APAGADO por defecto en staging hasta que el
      # DBA confirme que staging y producción NO comparten dbo_cotifly: si la comparten, los workers de los dos stacks
      # consultarían y actualizarían las mismas cotizaciones contra instancias distintas de Nexo (pruebas y producción).
      CosteoNexo__Habilitado: ${CosteoNexo__Habilitado:-false}
      CosteoNexo__IntervaloInicialSegundos: ${CosteoNexo__IntervaloInicialSegundos:-5}
      CosteoNexo__IntervaloMaximoMinutos: ${CosteoNexo__IntervaloMaximoMinutos:-15}
      CosteoNexo__FactorEdad: ${CosteoNexo__FactorEdad:-0.25}
      CosteoNexo__EdadMaximaHoras: ${CosteoNexo__EdadMaximaHoras:-72}
      CosteoNexo__IntervaloTickSegundos: ${CosteoNexo__IntervaloTickSegundos:-5}
      CosteoNexo__Lote: ${CosteoNexo__Lote:-20}
      CosteoNexo__ReclamoSegundos: ${CosteoNexo__ReclamoSegundos:-120}
      CosteoNexo__LecturaInmediataSegundos: ${CosteoNexo__LecturaInmediataSegundos:-6}
      CosteoNexo__MaximoFallosRelectura: ${CosteoNexo__MaximoFallosRelectura:-10}
      # HU-021.9: envío diferido de los conexos a Nexo (intentos, espera entre reintentos y horas esperando el catálogo).
      CosteoNexo__MaximoReintentosConexos: ${CosteoNexo__MaximoReintentosConexos:-5}
      CosteoNexo__IntervaloReintentoConexosMinutos: ${CosteoNexo__IntervaloReintentoConexosMinutos:-5}
      CosteoNexo__EsperaMaximaCatalogoConexosHoras: ${CosteoNexo__EsperaMaximaCatalogoConexosHoras:-24}
      # HU-033: sincronización diferida del resultado con Nexo.
      CosteoNexo__MaximoFallosSincronizacionResultado: ${CosteoNexo__MaximoFallosSincronizacionResultado:-10}
      CosteoNexo__EdadMaximaSincronizacionResultadoDias: ${CosteoNexo__EdadMaximaSincronizacionResultadoDias:-30}

      # Cubicador (HU-021.5, HU-023; opciones C y D del E2E 2026-10-16). Sin UrlBase el cubicador queda sin configurar: cada ruta va al
      # camión del respaldo y los catálogos del cubicador responden 503. UrlBase y ApiKey solo en Dokploy; ApiKey es SECRETO, obligatoria
      # con UrlBase y de al menos 16 caracteres en Production (una por ambiente). RespaldoSiFalla: el valor del código (true); DEPLOY.md
      # recomienda false en producción con URL. Al arrancar se valida la coherencia de los tiempos (DEPLOY.md §2.2).
      Cubicador__UrlBase: ${Cubicador__UrlBase:-}
      Cubicador__ApiKey: ${Cubicador__ApiKey:-}
      Cubicador__RutaSalud: ${Cubicador__RutaSalud:-}
      Cubicador__RespaldoSiFalla: ${Cubicador__RespaldoSiFalla:-true}
      Cubicador__TiempoEsperaSegundos: ${Cubicador__TiempoEsperaSegundos:-15}
      Cubicador__TiempoEsperaRecomendacionSegundos: ${Cubicador__TiempoEsperaRecomendacionSegundos:-90}
      Cubicador__EsperaAntesReconsultaSegundos: ${Cubicador__EsperaAntesReconsultaSegundos:-5}
      Cubicador__TiempoEsperaReconsultaSegundos: ${Cubicador__TiempoEsperaReconsultaSegundos:-60}
      Cubicador__MaximoConcurrente: ${Cubicador__MaximoConcurrente:-1}
      Cubicador__EsperaMaximaCupoSegundos: ${Cubicador__EsperaMaximaCupoSegundos:-60}
      Cubicador__EsperaSincronaCubicacionSegundos: ${Cubicador__EsperaSincronaCubicacionSegundos:-8}
      Cubicador__RetencionCubicacionMinutos: ${Cubicador__RetencionCubicacionMinutos:-15}
      Cubicador__MaximoCubicacionesEnMemoria: ${Cubicador__MaximoCubicacionesEnMemoria:-500}
      Cubicador__MinutosCacheCatalogos: ${Cubicador__MinutosCacheCatalogos:-30}
      Cubicador__PresupuestoCapturaSegundos: ${Cubicador__PresupuestoCapturaSegundos:-180}
      Cubicador__TiempoMaximoCatalogoSegundos: ${Cubicador__TiempoMaximoCatalogoSegundos:-10}
      # Licitación cubicada en segundo plano (HU-023.5, #160; exige db/scripts/pendientes/04). MaximoParalelo <= MaximoConcurrente.
      Cubicador__LicitacionEnSegundoPlano: ${Cubicador__LicitacionEnSegundoPlano:-true}
      Cubicador__ProcesadorHabilitado: ${Cubicador__ProcesadorHabilitado:-true}
      Cubicador__MaximoParalelo: ${Cubicador__MaximoParalelo:-1}
      Cubicador__IntervaloTickSegundos: ${Cubicador__IntervaloTickSegundos:-5}
      Cubicador__LoteRutas: ${Cubicador__LoteRutas:-50}
      Cubicador__ReclamoSegundos: ${Cubicador__ReclamoSegundos:-300}
      Cubicador__MaximoIntentos: ${Cubicador__MaximoIntentos:-3}
      Cubicador__EsperaReintentoSegundos: ${Cubicador__EsperaReintentoSegundos:-30}
      # "Calcular cubicaje" (HU-023.2, #157): parecido de la descripción con el catálogo y el plan B de la sugerencia legada.
      Cubicacion__ParecidoMinimoMercancia: ${Cubicacion__ParecidoMinimoMercancia:-0.7}
      Cubicacion__MargenAmbiguedadMercancia: ${Cubicacion__MargenAmbiguedadMercancia:-0.05}
      Cubicacion__IncluirSugerenciaLegada: ${Cubicacion__IncluirSugerenciaLegada:-false}

      # TRM del día (frente C, ADR-014): DolarApi con respaldo en los datos abiertos de la Superintendencia Financiera.
      # Salida a co.dolarapi.com:443 y www.datos.gov.co:443. Las URL vacías impiden arrancar: por eso llevan valor por defecto.
      Trm__Proveedor: ${Trm__Proveedor:-dolarapi_con_respaldo}
      Trm__UrlDolarApi: ${Trm__UrlDolarApi:-https://co.dolarapi.com/v1/trm}
      Trm__Url: ${Trm__Url:-https://www.datos.gov.co/resource/32sa-8pi3.json}
      Trm__TiempoEsperaSegundos: ${Trm__TiempoEsperaSegundos:-10}
      Trm__TiempoEsperaDolarApiSegundos: ${Trm__TiempoEsperaDolarApiSegundos:-4}

      # PDF (ADR-006, ADR-012): volumen.
      Pdf__StorageModo: volumen
      Pdf__StorageDir: /data/pdfs
      Pdf__BaseUrl: ${Pdf__BaseUrl:-}
      Pdf__TiempoEsperaRenderSegundos: ${Pdf__TiempoEsperaRenderSegundos:-30}
      # Fijo (no se lee del entorno): la cotización legada del chat está retirada (HU-021.6); solo las pruebas la encienden.
      Pdf__PermitirCotizacionChat: "false"

      # Correo (HU-033, #199, ADR-023): deshabilitado por defecto; sale por el microservicio interno MailSender (URL solo en Dokploy).
      Correo__Habilitado: ${Correo__Habilitado:-false}
      Correo__Modo: mailsender
      Correo__MailSender__UrlBase: ${Correo__MailSender__UrlBase:-}
      Correo__MailSender__TimeoutSegundos: ${Correo__MailSender__TimeoutSegundos:-15}
      Correo__MailSender__Remitente: ${Correo__MailSender__Remitente:-notificaciones@boterosoto.com.co}
      Correo__MailSender__ModoRemitente: ${Correo__MailSender__ModoRemitente:-comercial}
      Correo__MailSender__DominiosRemitente: ${Correo__MailSender__DominiosRemitente:-boterosoto.com.co}
      # Low, Normal o High (cabeceras Priority/Importance/X-Priority).
      Correo__MailSender__Prioridad: ${Correo__MailSender__Prioridad:-Normal}
      # Staging corre como Production: la protección se FIJA aquí (no se lee del entorno). Todo correo va al buzón de pruebas; el envío
      # real necesitaría además PermitirEnvioReal=true, que aquí queda fijo en false.
      Correo__Proteccion__Modo: redirigir
      Correo__Proteccion__PermitirEnvioReal: "false"
      Correo__Proteccion__BuzonPruebas: ${Correo__Proteccion__BuzonPruebas:-}
      # #228: tope de destinatarios entre para y cc (la copia oculta al comercial no cuenta). 1 a 100; fuera de rango no arranca.
      Correo__MaximoDestinatarios: ${Correo__MaximoDestinatarios:-10}
      # #262: logo del encabezado del correo. URL http(s) PÚBLICA: el correo del cliente la descarga desde internet (una URL interna sale
      # rota). Vacía, el encabezado lleva el texto "Botero Soto".
      Correo__LogoUrl: ${Correo__LogoUrl:-https://www.boterosoto.com.co/wp-content/uploads/Logo-Botero-Soto-Soluciones-Logisticas-2022.png}
      # Worker que consulta el estado en MailSender: tick, espera entre consultas del mismo correo, horas sin confirmación antes de
      # fallido, correos por vuelta y reserva de una réplica (rangos 1-3600, 1-3600, 1-720, 1-1000, 1-3600).
      Correo__Seguimiento__IntervaloTickSegundos: ${Correo__Seguimiento__IntervaloTickSegundos:-15}
      Correo__Seguimiento__IntervaloConsultaSegundos: ${Correo__Seguimiento__IntervaloConsultaSegundos:-30}
      Correo__Seguimiento__EdadMaximaHoras: ${Correo__Seguimiento__EdadMaximaHoras:-24}
      Correo__Seguimiento__Lote: ${Correo__Seguimiento__Lote:-50}
      Correo__Seguimiento__ReclamoSegundos: ${Correo__Seguimiento__ReclamoSegundos:-60}

      # Agente de IA (ADR-003). Sin proveedor el agente no responde. IA__ApiKey: secreto.
      # Con OmniRoute (#84; docs/03 "OmniRoute"): IA__Proveedor=openai_compatible,
      # IA__Endpoint=http://llm-services-omniroute.10-10-40-17.sslip.io/v1 (HTTP interno: ver el riesgo en DEPLOY.md §2.2),
      # IA__Modelo=gemini/gemini-3.5-flash-lite, IA__SoportaJsonSchema=false e IA__MaxTokens=1500 (con 4096 OpenRouter da 402).
      # Nunca un gateway web no oficial (duckduckgo-web, theoldllm, veoaifree-web, chipotle): riesgo de confidencialidad.
      IA__Proveedor: ${IA__Proveedor:-}
      IA__Modelo: ${IA__Modelo:-}
      IA__ApiKey: ${IA__ApiKey:-}
      IA__Endpoint: ${IA__Endpoint:-}
      IA__MaxTokens: ${IA__MaxTokens:-4096}
      IA__MaxIteraciones: ${IA__MaxIteraciones:-12}
      IA__SoportaJsonSchema: ${IA__SoportaJsonSchema:-true}
      IA__MinutosSinJsonSchema: ${IA__MinutosSinJsonSchema:-30}
      IA__JsonSchemaEstricto: ${IA__JsonSchemaEstricto:-false}
      IA__Rpm: ${IA__Rpm:-8}
      IA__TimeoutSeg: ${IA__TimeoutSeg:-60}
      IA__TiempoRedaccionSegundos: ${IA__TiempoRedaccionSegundos:-15}
      IA__EsperaMaximaRpmSegundos: ${IA__EsperaMaximaRpmSegundos:-20}
      IA__PropuestaDirecta: ${IA__PropuestaDirecta:-true}
      IA__RespuestaFinalEnLoop: ${IA__RespuestaFinalEnLoop:-true}
      # Respaldos (ante 429, 5xx, red caída o el 400 "No credentials for provider" de OmniRoute). Vacíos = sin respaldo.
      # Con OmniRoute: 0 = gemini/gemini-3.5-flash, 1 = gemini/gemini-3-flash-preview (mismo endpoint y clave). ApiKey: secreto.
      IA__Fallbacks__0__Proveedor: ${IA__Fallbacks__0__Proveedor:-}
      IA__Fallbacks__0__Modelo: ${IA__Fallbacks__0__Modelo:-}
      IA__Fallbacks__0__Endpoint: ${IA__Fallbacks__0__Endpoint:-}
      IA__Fallbacks__0__ApiKey: ${IA__Fallbacks__0__ApiKey:-}
      IA__Fallbacks__1__Proveedor: ${IA__Fallbacks__1__Proveedor:-}
      IA__Fallbacks__1__Modelo: ${IA__Fallbacks__1__Modelo:-}
      IA__Fallbacks__1__Endpoint: ${IA__Fallbacks__1__Endpoint:-}
      IA__Fallbacks__1__ApiKey: ${IA__Fallbacks__1__ApiKey:-}
      LimiteChat__PeticionesPorVentana: ${LimiteChat__PeticionesPorVentana:-20}
      LimiteChat__VentanaSegundos: ${LimiteChat__VentanaSegundos:-60}
      Sesiones__LimiteTokens: ${Sesiones__LimiteTokens:-6000}
      Sesiones__TtlHoras: ${Sesiones__TtlHoras:-24}
      Sesiones__BarridoMinutos: ${Sesiones__BarridoMinutos:-60}
      Sesiones__EsperaTurnoSegundos: ${Sesiones__EsperaTurnoSegundos:-3}

    # Igual al HEALTHCHECK de la imagen (vida, /health), en forma exec: la imagen no tiene shell. La disponibilidad
    # (/health/ready, base de datos) la mira Traefik, así una base caída no reinicia la tarea.
    healthcheck:
      test: ["CMD", "dotnet", "/app/Cotifly.Api.dll", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      # Una réplica: barrido de sesiones en proceso; volumen local de PDFs (ADR-012).
      replicas: 1
      placement:
        # Overlay entre nodos caído (HU-006.1): anclado al worker.
        constraints: [node.hostname == TBSNODO1-DKP]
      update_config:
        parallelism: 1
        # Con el puerto en modo host la tarea nueva no puede arrancar junto a la vieja en el mismo nodo: stop-first.
        # Sin "ports" (Traefik por overlay, HU-006.2): start-first, sin corte.
        order: ${COTIFLY_ORDEN_UPDATE:-stop-first}
        delay: 10s
        monitor: 60s
        failure_action: rollback
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        order: ${COTIFLY_ORDEN_UPDATE:-stop-first}
        monitor: 30s
      restart_policy:
        condition: any
        delay: 5s
        window: 60s
      resources:
        # Cada sonda de salud levanta otro proceso dotnet (~40-70 MB cada 30 s): incluido en el límite.
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 384M
      labels:
        # Traefik (Dokploy). Escritas para cuando la overlay funcione; TLS real depende de HU-006.2.
        # traefik.docker.network es la etiqueta de Traefik v2. En Traefik v3 el proveedor Swarm usa traefik.swarm.network:
        # confirmar la versión de Traefik de Dokploy (docker service inspect dokploy-traefik) y ajustar si es v3.
        - traefik.enable=true
        - traefik.docker.network=dokploy-network
        - traefik.http.routers.cotifly-api-staging.rule=Host(`${PUBLIC_HOST:?falta PUBLIC_HOST}`)
        - traefik.http.routers.cotifly-api-staging.entrypoints=websecure
        - traefik.http.routers.cotifly-api-staging.tls=true
        - traefik.http.routers.cotifly-api-staging.tls.certresolver=letsencrypt
        - traefik.http.routers.cotifly-api-staging.middlewares=cotifly-api-staging-hsts
        - traefik.http.middlewares.cotifly-api-staging-hsts.headers.stsSeconds=31536000
        - traefik.http.middlewares.cotifly-api-staging-hsts.headers.stsIncludeSubdomains=true
        - traefik.http.services.cotifly-api-staging.loadbalancer.server.port=8080
        # Readiness: saca la tarea del balanceo mientras /health/ready no responda 200 (sin reiniciarla).
        - traefik.http.services.cotifly-api-staging.loadbalancer.healthcheck.path=/health/ready
        - traefik.http.services.cotifly-api-staging.loadbalancer.healthcheck.interval=10s
        - traefik.http.services.cotifly-api-staging.loadbalancer.healthcheck.timeout=3s
